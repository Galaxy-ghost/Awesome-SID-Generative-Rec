id: sprint
name: SPRINT
title: 'SPRINT: Single-Step Generative Recommendation via Average Probability Velocity'
authors: Cai et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2609.34306
  code: https://github.com/iamZhuoCai/SPRINT
problem: V
stage: Backbone
representation: Text
tokenization: Par. OPQ
backbone: Non-AR
tokenizer: Fixed
objective: Dual-level Flow Ctr.
inference: Scoring
poi: false
summary: 用 OPQ SID 并行概率生成并对有效完整 SID 融合评分，是广义 SID 混合生成而非 token-only 大目录召回。
setup:
  datasets: 'Amazon Reviews 2014 Sports, Beauty and Toys; Amazon Reviews 2023 Instruments, Scientific, Games and Arts; Yelp.
    Filtering thresholds: not reported.'
  split: 'Per-user timestamp-ordered leave-one-out: last interaction test, penultimate validation, remainder training; history
    cap 20.'
  candidates: 'Full catalog: score valid SIDs with the sum of separately normalized token-probability and joint-SID similarity
    scores, returning top K. History-item exclusion: not reported. The 100/1000 sampled negative SIDs are training settings.'
  visibility: 'warm; no unseen-item protocol is defined. Tokenizer exposure to test items: not reported.'
  sid: 'OPQ on sentence-t5-base content embeddings; four parallel codebooks x 256 codewords, four tokens/item. Collision handling:
    not reported.'
  inference_budget: 'One encoder-decoder pass from four masks, followed by all-valid-SID scoring with precomputed item-side
    vectors; beam n/a for SPRINT. Test batch 256/history20; efficiency baselines use beam10 where applicable, embedding256.
    Recall/NDCG@5/10; additional K=20/50/100/1000. Whole-test-set seconds on Sports/Beauty/Toys/Scientific/Instruments/Games:
    2.65/1.52/1.28/4.08/4.62/7.55. Hardware, per-request latency, and inclusion of precomputation/data loading/metric computation
    in timing: not reported.'
  results_from: 'Paper''s comparisons/ablations, averaged over five random-seed runs (seed values not reported). Tables2/8
    main accuracy, Table12 Yelp/Arts, Tables3/10 whole-test inference time, Table9 per-epoch training time. Efficiency configurations
    are shared; accuracy settings follow original papers and are tuned per dataset. Table10 accelerators use TIGER backbones.
    Explicit borrowed-versus-rerun score attribution: not reported.'
setup_where:
  datasets: 'Sec.4.1 and Appendix D.1: https://arxiv.org/html/2609.34306v1#S4.SS1.p1 and https://arxiv.org/html/2609.34306v1#A4.SS1.p1'
  split: 'Appendix D.1 and D.3: https://arxiv.org/html/2609.34306v1#A4.SS1.p1 and https://arxiv.org/html/2609.34306v1#A4.SS3.p1'
  candidates: 'Sec.4.1 and Sec.3.4 inference; sampled SIDs in Eq.9 are training negatives: https://arxiv.org/html/2609.34306v1#S4.SS1.p1
    and https://arxiv.org/html/2609.34306v1#S3.SS4.p3 and https://arxiv.org/html/2609.34306v1#S3.SS3.p6 and https://arxiv.org/html/2609.34306v1#S4.SS1.p3'
  visibility: 'Sec.4.1 and Appendix D.1/D.3 define standard evaluation without unseen-item experiments: https://arxiv.org/html/2609.34306v1#S4.SS1
    and https://arxiv.org/html/2609.34306v1#A4.SS1.p1 and https://arxiv.org/html/2609.34306v1#A4.SS3.p1'
  sid: 'Sec.3.1 and Appendix D.3: https://arxiv.org/html/2609.34306v1#S3.SS1.p2 and https://arxiv.org/html/2609.34306v1#A4.SS3.p1'
  inference_budget: 'Sec.3.4, Sec.4.1, Table3, Appendix D.3/D.11 and Algorithm2: https://arxiv.org/html/2609.34306v1#S3.SS4.p2
    and https://arxiv.org/html/2609.34306v1#S3.SS4.p3 and https://arxiv.org/html/2609.34306v1#S4.SS1.p1 and https://arxiv.org/html/2609.34306v1#S4.T3
    and https://arxiv.org/html/2609.34306v1#A4.SS3.p2 and https://arxiv.org/html/2609.34306v1#A4.SS11.p1 and https://arxiv.org/html/2609.34306v1#alg2'
  results_from: 'Sec.4.1, Tables2/3/4 and Appendix D.3/D.6/D.8: https://arxiv.org/html/2609.34306v1#S4.SS1.p3 and https://arxiv.org/html/2609.34306v1#S4.T2
    and https://arxiv.org/html/2609.34306v1#S4.T3 and https://arxiv.org/html/2609.34306v1#S4.T4 and https://arxiv.org/html/2609.34306v1#A4.SS3.p2
    and https://arxiv.org/html/2609.34306v1#A4.SS6.p2 and https://arxiv.org/html/2609.34306v1#A4.SS8.p1'
