id: intent-driven-news
name: Intent-Driven-News
title: Intent-Driven Semantic ID Generation for Grounded Conversational News Recommendation
authors: Su et al.
year: 2026
venue: ACL’26 Industry
links:
  arxiv: https://arxiv.org/abs/2605.07613
  code: null
problem: III
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: CoT+Fuzzy Match
poi: false
tldr: Intent-Driven-News trains an LLM to map implicit conversational intents to hierarchical Semantic ID prefixes and fuzzy-matches
  them to the current news pool, instead of retrieving articles first.
tldr_zh: Intent-Driven-News 训练 LLM 将对话中的隐含意图映射为层级 SID 前缀，再与当前新闻池做模糊匹配，替代先检索文章的流程。
setup:
  datasets: 'Industrial Chinese news: 163560 articles, 50000 profiles, 9982 test samples across six tasks. Filtering not reported.'
  split: 'Temporal: training articles before cutoff, test articles after; zero item overlap. Matching tolerance selected on
    1000 validation samples without test temporal overlap; cutoff date not reported.'
  candidates: 'Open generation (76%): full 152K SID space, grounded to current news pool. Selection (24%): sampled: 5 including
    target; Rand has 4 random negatives, Align has 2 same-category + 2 random negatives. Historical-item exclusion not reported.'
  visibility: 'Items unseen by generator; whether unseen by tokenizer too: not reported. Cold users have zero recent clicks
    but may retain pre-cutoff behavioral profile summaries.'
  sid: RQ-VAE codebooks [32,64,128,1024]; generate first 3 layers only. Exact L1/L2, L3 tolerance 5; full-SID collision handling
    not reported.
  inference_budget: 'Caches 10 SID prefixes; beam width, inference hardware and batch size not reported. Warm cached response:
    mean 85ms, P95 150ms; cold initial delay 3.7s.'
  results_from: 'Original Tables 3/5/6: overall, task/user-cold-start and generative-baseline comparisons; Figure 2: latency.'
setup_where:
  datasets: 'Section 4.1 and Table 2: https://arxiv.org/html/2605.07613v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2605.07613v1#S4.T2'
  split: 'Section 4.1 and Appendix A.2: https://arxiv.org/html/2605.07613v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2605.07613v1#A1.SS2.SSS0.Px1.p1'
  candidates: 'Section 4.1 and Appendix I: https://arxiv.org/html/2605.07613v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2605.07613v1#S4.SS1.SSS0.Px3.p1
    and https://arxiv.org/html/2605.07613v1#A9.p1'
  visibility: 'Section 4.1 and Appendices L/T: https://arxiv.org/html/2605.07613v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2605.07613v1#A12.SS0.SSS0.Px1.p1
    and https://arxiv.org/html/2605.07613v1#A20.p2'
  sid: 'Section 3.2 and Appendix A.1: https://arxiv.org/html/2605.07613v1#S3.SS2.SSS0.Px2.p1 and https://arxiv.org/html/2605.07613v1#S3.SS2.SSS0.Px3.p1
    and https://arxiv.org/html/2605.07613v1#A1.SS1.p3'
  inference_budget: 'Section 4.3 and Appendix C.4: https://arxiv.org/html/2605.07613v1#S4.SS3.SSS0.Px1.p1 and https://arxiv.org/html/2605.07613v1#A3.SS4.p1'
  results_from: 'Tables 3/5/6 and Figure 2: https://arxiv.org/html/2605.07613v1#S4.T3 and https://arxiv.org/html/2605.07613v1#S4.T5
    and https://arxiv.org/html/2605.07613v1#S4.T6 and https://arxiv.org/html/2605.07613v1#S4.F2'
related:
