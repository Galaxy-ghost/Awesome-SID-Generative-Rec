id: spar
name: SPAR
title: 'SPAR: Enhancing Industrial-Scale Generative POI Recommendation via Real-World Spatial Perception'
authors: Wang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2609.02062
  code: null
problem: I
stage: Representation
representation: Text+Geo
tokenization: R-KM
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: –
poi: true
tldr: SPAR fuses sinusoidal coordinate embeddings into Semantic ID construction, continually pre-trains the LLM on geospatial
  data, and anchors that knowledge as a frozen task vector during behavioral fine-tuning.
tldr_zh: SPAR 将正弦坐标嵌入融入 SID 构建，在地理空间数据上持续预训练 LLM，并在行为微调期间将该知识固定为冻结任务向量。
setup:
  datasets: Public NYC/TKY; one month of AMAP logs from Beijing, Shanghai, Tianjin and Zhejiang. MG-CPT adds 25 geospatial
    datasets per city. Cleaning details not reported.
  split: 'Public: chronological 80%/10%/10% train/validation/test. Industrial: last day test, earlier interactions train;
    industrial validation allocation not reported. Each interaction uses its preceding history.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Cold/warm users have <8/>=16 historical interactions; queries and
    real-time location remain available. Quantizer fits training POIs; test-POI exclusion not detailed.
  sid: 'SI-SID: 3 residual K-Means codebooks x 32 codes for NYC/TKY or x 512 for AMAP, plus a fourth disambiguation index
    guaranteeing unique POI IDs.'
  inference_budget: 'Default Qwen3-4B; Recall/NDCG/MRR@5/10/20. Experiment environment: 64 A100 GPUs; beam width, inference
    batch size and latency not reported. Reported batch 32 is training.'
  results_from: 'Original Tables 2/3: public/industrial recommendation comparisons; Table 5: sparse-history users. Generative
    baselines are standardized to four-level SIDs with final disambiguation indices.'
setup_where:
  datasets: 'Section 5.1, Table 1 and Appendix B: https://arxiv.org/html/2609.02062v2#S5.SS1.p1 and https://arxiv.org/html/2609.02062v2#S5.T1
