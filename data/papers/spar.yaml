  sid: 'Sections 4.1.2/5.1: https://arxiv.org/html/2609.02062v2#S4.SS1.SSS2.p2 and https://arxiv.org/html/2609.02062v2#S5.SS1.p4'
  inference_budget: 'Section 5.1: https://arxiv.org/html/2609.02062v2#S5.SS1.p2 and https://arxiv.org/html/2609.02062v2#S5.SS1.p4'
