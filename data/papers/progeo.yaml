id: progeo
name: ProGEO
title: 'Birds of a Feather Cluster Nearby: A Proximity-Aware Geo-Codebook for Local Service Recommendation'
authors: He et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.23156
  code: null
problem: I
stage: Tokenization
representation: Text+Geo
tokenization: R-KM+Geo-CB
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Beam+Geo-Filter
poi: true
summary: 'Abstract: "existing semantic codebooks neglect geographic constraints, often resulting in recommendations that are
  semantically relevant yet geographically unreachable". Geographically unreachable is not II (a generated SID that names
  no real item).'
tldr: ProGEO builds a proximity-aware geo-codebook with a geo-centroid local coordinate system and geo-rotary position encoding,
  so Semantic IDs model semantics and geography jointly.
evidence:
- field: problem
  where: 'ProGEO v1, Abstract: https://arxiv.org/html/2604.23156v1#abstract1'
  quote: However, existing semantic codebooks neglect geographic constraints, often resulting in recommendations that are
    semantically relevant yet geographically unreachable.
  reason: 'Organizer interpretation: geographic unreachability is a feasibility mismatch, rather than problem II''s generation
    of an identifier naming no real item.'
- field: stage
  where: 'ProGEO v1, Section 3.2 and Section 3.3: https://arxiv.org/html/2604.23156v1#S3.SS2 ; https://arxiv.org/html/2604.23156v1#S3.SS3.p2
    ; https://arxiv.org/html/2604.23156v1#S3.SS3.p11 ; https://arxiv.org/html/2604.23156v1#S3.SS3.p12'
  reason: 'Organizer stage judgment centers on tokenization: geo-centroid local coordinates and Geo-RoPE construct the third-layer
    geographic codebook.'
- field: tokenizer
  where: 'ProGEO v1, Appendix B.2.1: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS1.p1'
  reason: 'Organizer inference: separately described item-tokenization/codebook training and Qwen2.5-1.5B recommender training
    support the fixed-tokenizer reading. This paragraph does not explicitly declare that the tokenizer is frozen.'
setup:
  datasets: 'Industrial: two months of transaction records from a Chinese local-life service platform (search query, user
    location, merchant exposure sequence, interactions); size and filtering not reported. Public: Foursquare NYC (1,083 users
    / 5,135 POIs) and TKY (2,293 / 7,873), filtered as in GNPR-SID (POIs with fewer than 10 interactions, users with fewer
    than 10 check-ins removed), and Yelp (150,346 POIs; clustering analysis only).'
  split: 'Industrial: two months of records for training and additional daily data reserved for validation; the test construction
    is not reported. Public: preprocessing follows GNPR-SID; the split is not restated.'
  candidates: 'Industrial inference: for each generated semantic ID, the 10 POIs closest to the user''s location form the
    candidate set, with beam width 20. Evaluation reports Hit@1, Hit@50, Hit@100 and NDCG@50, @100; full catalog versus sampled
    not otherwise stated.'
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Residual quantization with geographic rotary encoding (Geo-RoPE) at the third layer over 128-dimensional Qwen3-Embedding-8B
    text embeddings. Codebooks: [512, 512, 512] industrial; [32, 32, 32] NYC/TKY; [64, 64, 64] Yelp. Conflicts: industrial
    uses closest-location matching among POIs sharing a SID (best in Table 3); public datasets use a TIGER-style fourth-layer
    code because user location is unavailable.'
  inference_budget: 'Beam search with width 20 on Qwen2.5-1.5B; all experiments on 8 GPUs with 80GB memory. Inference batch
    size and latency: not reported.'
  results_from: Table 1 (industrial quantization and recommendation metrics versus RQ-VAE, RQ-Kmeans, HyMiRec-style RQ-Kmeans,
    RQ-OPQ); Table 2 (geographic attributes); Table 3 (conflict-resolution strategies); Table 6 (public datasets versus RQ-Kmeans);
    Figures 7-10 (sensitivity and case studies).
setup_where:
  datasets: 'Industrial and public data: https://arxiv.org/html/2604.23156v1#A2.SS1.p1; public statistics: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS2.p1.'
  split: 'Two-month training with extra daily validation data: https://arxiv.org/html/2604.23156v1#A2.SS1.p1; public split
    follows GNPR-SID but is not restated.'
  candidates: 'Ten location-nearest POIs per semantic ID as candidates, then beam search: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS1.p1;
    metrics: https://arxiv.org/html/2604.23156v1#A2.SS3.p3.'
  visibility: 'No unseen-item protocol: https://arxiv.org/html/2604.23156v1#A2.SS1.p1.'
  sid: 'Codebooks [512,512,512] industrial, [32,32,32] NYC/TKY, [64,64,64] Yelp, Geo-RoPE at layer 3: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS1.p1
    and https://arxiv.org/html/2604.23156v1#A2.SS2.SSS2.p1; conflict strategies: https://arxiv.org/html/2604.23156v1#S4.T3.'
  inference_budget: 'Beam width 20 and hardware: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS1.p1 and https://arxiv.org/html/2604.23156v1#A2.SS2.SSS2.p1.'
  results_from: 'Main: https://arxiv.org/html/2604.23156v1#S4.T1; geographic attributes: https://arxiv.org/html/2604.23156v1#S4.T2;
    conflicts: https://arxiv.org/html/2604.23156v1#S4.T3; public: https://arxiv.org/html/2604.23156v1#A2.T6; sensitivity:
    https://arxiv.org/html/2604.23156v1#S4.F7.'
related:
- id: onerec
  relation: competitor
  note: OneRec's RQ-Kmeans is the second-best tokenizer in Table 1; Pro-GEO injects geographic rotary encoding at the third
    quantization layer and resolves SID conflicts by user distance.
  where: 'Pro-GEO v1, baseline RQ-Kmeans (Deng et al., 2025): https://arxiv.org/html/2604.23156v1#A2.SS4.p1; Table 1 and public
    Table 6: https://arxiv.org/html/2604.23156v1#S4.T1 and https://arxiv.org/html/2604.23156v1#A2.T6.'
- id: tiger
  relation: competitor
  note: TIGER's RQ-VAE is a tokenizer baseline; Pro-GEO also borrows TIGER's fourth-layer code for conflicts on public data
    where user location is missing.
  where: 'Pro-GEO v1, baseline RQ-VAE: https://arxiv.org/html/2604.23156v1#A2.SS4.p1; Table 1: https://arxiv.org/html/2604.23156v1#S4.T1;
    Layer-4 coding follows TIGER: https://arxiv.org/html/2604.23156v1#A2.SS2.SSS2.p1.'
- id: gnpr-sid
  relation: predecessor
  note: Pro-GEO follows GNPR-SID's POI preprocessing for NYC and TKY; GNPR-SID's SIDs carry no explicit geographic encoding.
  where: 'Pro-GEO v1, Appendix B.1 and B.2.2 follow Wang et al. (2025a): https://arxiv.org/html/2604.23156v1#A2.SS1.p1 and
    https://arxiv.org/html/2604.23156v1#A2.SS2.SSS2.p1.'
- id: oneloc
  relation: alternative
  note: OneLoc adds location context to the SID input embedding for local-life video; Pro-GEO rotates residuals by geography
    inside the quantizer.
  where: 'Pro-GEO v1, Sections 1 and 2.1 cite Wei et al. (2025): https://arxiv.org/html/2604.23156v1#S1.p2 and https://arxiv.org/html/2604.23156v1#S2.SS1.p2.'
- id: lgsid
  relation: alternative
  note: LGSID aligns LLM embeddings with geographic rewards before quantization; Pro-GEO encodes geography within the quantization
    layers.
  where: 'Pro-GEO v1, Section 2.1 cites LGSID: https://arxiv.org/html/2604.23156v1#S2.SS1.p2.'
