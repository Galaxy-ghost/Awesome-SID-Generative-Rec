id: discrec
name: DiscRec
title: 'DiscRec: Disentangled Semantic-Collaborative Modeling for Generative Recommendation'
authors: Liu et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2506.15576
  code: https://github.com/Ten-Mao/DiscRec
problem: I
stage: Backbone
representation: Text+CF
tokenization: RQ-VAE / Learn. RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
tldr: DiscRec adds item-level position embeddings and splits semantic and collaborative signals into two gated branches, one
  with attention inside each item, instead of fusing them in one embedding space.
tldr_zh: DiscRec 加入物品级位置嵌入，并将语义与协同信号拆分为两个门控分支（其一在物品内部做注意力计算），而非在单一嵌入空间直接混合。
evidence:
- field: problem
  where: https://arxiv.org/html/2506.15576v2#abstract1
  quote: token-item misalignment … semantic–collaborative signal entanglement
  reason: 'Candidates: I / III (rule: tie broken by the title).'
- field: tokenization
  where: §I, p2; §IV-A, p7
  reason: Settings A/B take the TIGER and LETTER rows of Table 1.
setup:
  datasets: Amazon Review subsets Beauty, Musical Instruments, Arts, Toys; remove users/items with fewer than 5 interactions;
    keep latest 20 history items, padding shorter histories.
  split: 'Main per-user chronological leave-one-out: most recent item test, second-most-recent validation, remaining interactions
    training. Additional Beauty user-level random split: train/validation/test 8:1:1, with all models retrained from scratch.'
  candidates: full catalog; reported full-ranking evaluation over the entire item set, with prefix-tree-constrained generation;
    history exclusion not reported.
  visibility: warm; no unseen-item protocol is defined. Beauty additionally evaluates held-out users and low-popularity targets;
    LETTER uses pretrained SASRec embeddings, whose test-item exposure is not reported.
  sid: 4 RQ-VAE codebooks, 256 entries/level, 32 dimensions/entry, from LLaMA2-7B title/description representations. DiscRec-T
    uses TIGER tokenization; DiscRec-L uses LETTER collaborative/diversity regularization with pretrained SASRec embeddings.
    Tokenizer trained before recommender; collision handling not reported.
  inference_budget: Prefix-tree-constrained autoregressive decoding, beam 20; Recall/NDCG@5/10; inference hardware, batch
    size and measured latency not reported. The paper gives theoretical complexity rather than serving measurements.
  results_from: Own DiscRec-T/DiscRec-L comparisons, ablations and Beauty generalization studies. Baselines follow referenced
    implementations under a unified generative configuration; EAGER is resized to dimension 128 and its histories are correctly
    sorted chronologically. No copied baseline result scores stated; run counts/variance not reported.
