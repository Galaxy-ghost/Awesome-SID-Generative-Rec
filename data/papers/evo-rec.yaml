id: evo-rec
name: Evo-Rec
title: Learning Better Reasoning for Generative Recommendation with Semantic IDs
authors: Zhu et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2609.29973
  code: https://github.com/mengdanzhu/evo-rec
problem: III
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: CoT+C-Beam
poi: false
tldr: Evo-Rec aligns Semantic IDs with text and behavior, fine-tunes on sampled reasoning traces that improve target prediction,
  and then refines reasoning with catalog-constrained reinforcement learning.
tldr_zh: Evo-Rec 将 SID 与文本和行为对齐，在能提升目标预测的采样推理轨迹上微调，再用受物品库约束的强化学习修正推理过程。
setup:
  datasets: Amazon Video Games, Office Products, Industrial and Scientific; 5-core filtering.
  split: Per-user chronological 80%/10%/10% training/validation/test; sliding histories capped at 10.
  candidates: full catalog
  visibility: 'warm; no unseen-item protocol is defined. Item-level visibility to RQ-VAE and SID-language alignment: not reported.'
  sid: Three RQ-VAE semantic tokens; codebook sizes and collision handling not reported.
  inference_budget: Reasoning followed by catalog-trie beam search, beam 10; inference hardware, batch size, reasoning cap,
    and latency not reported.
  results_from: Original Table 2; baseline numbers quoted from SIDReasoner, with Evo-Rec evaluated on the same split/protocol.
setup_where:
  datasets: 'Section 4.1.1: https://arxiv.org/html/2609.29973v1#S4.SS1.SSS1.p1'
  split: 'Section 4.1.1: https://arxiv.org/html/2609.29973v1#S4.SS1.SSS1.p1'
  candidates: 'Section 4.1.1 explicitly ranks against the entire item catalog: https://arxiv.org/html/2609.29973v1#S4.SS1.SSS1.p2'
  visibility: 'Sections 3.2 and 4.1: https://arxiv.org/html/2609.29973v1#S3.SS2 and https://arxiv.org/html/2609.29973v1#S4.SS1.SSS1.p1'
  sid: 'Sections 3.2 and 4.1.3: https://arxiv.org/html/2609.29973v1#S3.SS2.p1 and https://arxiv.org/html/2609.29973v1#S4.SS1.SSS3.p1'
  inference_budget: 'Section 4.1.3 separates training rollout settings from inference: https://arxiv.org/html/2609.29973v1#S4.SS1.SSS3.p1'
  results_from: 'Section 4.1.2 and Table 2: https://arxiv.org/html/2609.29973v1#S4.SS1.SSS2.p1 and https://arxiv.org/html/2609.29973v1#S4.T2'
related:
- id: sidreasoner
  relation: competitor
  note: Evo-Rec compares against SIDReasoner and adds utility-selected reasoning plus ranking-aware RL.
  where: 'Evo-Rec v1, Sections 2.2/4.1.2 and Table 2: https://arxiv.org/html/2609.29973v1#S2.SS2.p1; https://arxiv.org/html/2609.29973v1#S4.SS1.SSS2.p1;
    https://arxiv.org/html/2609.29973v1#S4.T2.'
- id: lc-rec
  relation: predecessor
  note: The SID-language alignment stage explicitly follows LC-Rec before adding reasoning optimization.
  where: 'Evo-Rec v1, Section 3.2: https://arxiv.org/html/2609.29973v1#S3.SS2.p1.'
- id: tiger
  relation: competitor
  note: TIGER directly generates SIDs; Evo-Rec generates and optimizes an intermediate reasoning sequence.
  where: 'Evo-Rec v1, Sections 2.1/3.1 and Table 2: https://arxiv.org/html/2609.29973v1#S2.SS1; https://arxiv.org/html/2609.29973v1#S3.SS1.p1;
    https://arxiv.org/html/2609.29973v1#S4.T2.'
