id: sprig
name: SPRIG
title: 'SPRIG: Semantic-ID-enhanced Paths for Knowledge Graph-based Generative Recommendation'
authors: Hangoebl et al.
year: 2026
venue: CIKM’26 Short
links:
  arxiv: https://arxiv.org/abs/2610.06590
  code: https://github.com/justinhangoebl/semantic-id-knowledge-graph-recommender
problem: I
stage: Tokenization
representation: Text / Audio
tokenization: R-KM
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Div. Beam
poi: false
tldr: SPRIG trains a generator on knowledge-graph paths that end in content-derived Semantic IDs, combining relational grounding
  with shared item tokens instead of opaque tokens tied to embedding tables.
tldr_zh: SPRIG 在以内容派生 SID 结尾的知识图谱路径上训练生成器，将关系结构锚定与共享物品 token 结合起来，替代绑定嵌入表的不透明 token。
setup:
  datasets: 'KG-enriched MovieLens-1M from RecBole (2984 items); Onion (18415 tracks): LFM-2B March-May 2018 interactions
    plus music content and artist/genre/album/tag KG, iteratively filtered to 20-core. Additional ML-1M filtering: not reported.'
  split: 'Per-user chronological 60/20/20 train/validation/test; identical preprocessing and splits across models. History
    cap: not reported.'
  candidates: 'Full catalog evaluation against held-out interactions; SPRIG/KGGLM rank terminal items from up to 50 generated
    paths per user, deduplicating by highest path log-likelihood. SASRec scores the catalog directly. History-item exclusion:
    not reported.'
  visibility: 'warm; no unseen-item protocol is defined. Generic KG pretraining excludes user-item edges; fine-tuning uses
    user-to-item paths. KG/quantizer exposure to test items or held-out interactions: not reported.'
  sid: 'Offline residual K-means, 3 levels x 256 codes (768 shared tokens), on T5 movie embeddings/musicnn track embeddings.
    Item entities in KG paths are expanded into SIDs; inverse lookup maps terminal SIDs to items. Collision handling: not
    reported.'
  inference_budget: 'Deterministic diverse beam search: 60 beams, 5 groups, diversity penalty 0.4, length penalty 0; 3-hop
    paths, up to 50 paths/user. Rank by terminal path log-likelihood; nDCG/MRR/HR@10. Experiments use NVIDIA A40. Inference
    batch, numerical latency/throughput and runtime timing scope: not reported; reported FLOPs are per-step compute, not latency.'
  results_from: This paper's Table2 experiments and quantizer/audio-feature ablations. Baselines run under original-publication
    best configurations and verified on shared splits; TIGER uses a GRID variant. SPRIG/KGGLM share DistilGPT-2 and decoding;
    SASRec is a full-catalog scoring reference. No quoted-score provenance is claimed.
