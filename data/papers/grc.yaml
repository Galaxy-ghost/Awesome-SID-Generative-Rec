id: grc
name: GRC
title: 'Learning to Reflect and Correct: Towards Better Decoding Trajectories for Large-Scale Generative Recommendation'
authors: Xing et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2602.23639
  code: null
problem: III
stage: Inference
representation: –
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP → RL
inference: GRC+Beam
poi: false
tldr: GRC extends single-pass decoding into generation, reflection, and correction in the semantic token space, trains the
  trajectory with GRPO, and allocates correction budget by entropy during beam search.
tldr_zh: GRC 将单遍解码扩展为语义 token 空间中的“生成-反思-修正”流程，用 GRPO 训练轨迹，并在束搜索中按熵分配修正预算。
setup:
  datasets: Amazon Arts and Musical Instruments; industrial e-commerce advertising logs spanning March-August 2025 (over 1B
    interactions, 19M users, 25M advertisements). Filtering rules not reported.
  split: 'Amazon: per-user last interaction test, penultimate validation, remaining interactions training. Industrial offline
    split not reported. Online A/B: January 2-12, 2026, with control/treatment each containing 15% randomly sampled users.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer exposure to test items not reported; all GR models share
    a frozen dataset-specific RQ-VAE codebook.
  sid: 'RQ-VAE: 4 levels x 300 codes, fitted to Qwen3-8B item embeddings and then frozen. Deterministic SID-to-item lookup
    defined; collision disambiguation not reported.'
  inference_budget: Beam 200 offline/online; reflection and correction use entropy-guided pruning with alpha_e=0.2; paths
    judged correct skip regeneration. K=5/10, plus Recall@100/200 ablations. Online P99 latency 31 ms versus TIGER 27 ms,
    both using FlashAttention. Inference hardware and batch size not reported.
  results_from: 'Original Table 1: offline comparisons; Table 2: reflection accuracy; Table 3: ablations; Section 6: online
    A/B against in-house TIGER.'
setup_where:
  datasets: 'Section 5.1: https://arxiv.org/html/2602.23639v1#S5.SS1.p1'
  split: 'Sections 5.1 and 6: https://arxiv.org/html/2602.23639v1#S5.SS1.p1 and https://arxiv.org/html/2602.23639v1#S6.p1'
  candidates: 'Sections 5.1 and 3.2 specify metrics and beam search, not evaluation negatives: https://arxiv.org/html/2602.23639v1#S5.SS1.p3
    and https://arxiv.org/html/2602.23639v1#S3.SS2.p3'
  visibility: 'Section 5.1 defines no item holdout: https://arxiv.org/html/2602.23639v1#S5.SS1.p1 and https://arxiv.org/html/2602.23639v1#S5.SS1.p4'
  sid: 'Sections 3.1 and 5.1: https://arxiv.org/html/2602.23639v1#S3.SS1.p1 and https://arxiv.org/html/2602.23639v1#S5.SS1.p4'
  inference_budget: 'Sections 4.3, 5.1 and 6: https://arxiv.org/html/2602.23639v1#S4.SS3.p2 and https://arxiv.org/html/2602.23639v1#S4.SS3.p4
    and https://arxiv.org/html/2602.23639v1#S5.SS1.p4 and https://arxiv.org/html/2602.23639v1#S6.p1'
  results_from: 'Section 5 Tables 1-3 and Section 6: https://arxiv.org/html/2602.23639v1#S5.T1 and https://arxiv.org/html/2602.23639v1#S5.T2
    and https://arxiv.org/html/2602.23639v1#S5.T3 and https://arxiv.org/html/2602.23639v1#S6.p1'
