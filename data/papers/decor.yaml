id: decor
name: DECOR
title: Learning Decomposed Contextual Token Representations from Pretrained and Collaborative Signals for Generative Recommendation
authors: Liu et al.
year: 2026
venue: SIGIR’26
links:
  arxiv: https://arxiv.org/abs/2509.10468
  code: https://github.com/yliuaa/DECOR.git
problem: III
stage: Backbone
representation: Text+CF
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Beam
poi: false
tldr: DECOR refines Semantic ID token embeddings by interaction context and fuses pretrained codebook embeddings with learned
  collaborative embeddings, instead of static token assignments that overwrite pretrained semantics.
tldr_zh: DECOR 按交互上下文修正 SID token 嵌入，并融合预训练码本嵌入与可学习协同嵌入，避免静态 token 分配覆盖预训练语义。
evidence:
- field: problem
  where: https://arxiv.org/html/2509.10468v2#abstract1
  quote: suboptimal static tokenization … discarded pretrained semantics
  reason: 'Candidates: I / III (rule: tie broken by the first new design).'
- field: inference
  where: §4.8, p9; Table 5, p10
  reason: No prefix constraint reported.
setup:
  datasets: Amazon Scientific, Instrument and Game (paper labels); user/item 5-core filtering; chronological histories capped
    at 20 items.
  split: 'Per-user chronological leave-one-out: last interaction test, penultimate validation, remaining interactions training.'
  candidates: full catalog; full-ranking evaluation without sampling.
  visibility: warm; no unseen-item protocol is defined. RQ-VAE/text-encoder exposure to test items not reported; collaborative
    embeddings are learned from recommendation sequences.
  sid: 'Sentence-T5 embeddings; frozen RQ-VAE with 3 levels x 256 entries, plus an incremental index token resolving identical
    3-token prefixes: 4-token IDs. Token assignments remain fixed while embeddings are contextually composed and fused with
    learned collaborative embeddings.'
  inference_budget: 'Beam 50; Recall/NDCG@5/10; experiments on one Tesla A40. Table 5 batches 8/16/32/64/128: DECOR 4.49-4.70
    ms/sample, 213-223 samples/s; batch 128 adds 0.85 ms over TIGER. Prefix constraints not reported.'
  results_from: Original Table 2 test results use seed 2025; significance tested across five seeds. Generative baselines rerun
    from official code; other baselines adapted or quoted when protocols match. Table 5 measures inference cost; Figure 5
    measures convergence, excluding ETEGRec tokenizer-update epochs.
