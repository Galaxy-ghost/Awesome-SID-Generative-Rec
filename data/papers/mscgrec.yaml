id: mscgrec
name: MSCGRec
title: Multimodal Generative Recommendation for Fusing Semantic and Collaborative Signals
authors: Vandenhirtz et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2602.03713
  code: null
problem: I
stage: Tokenization
representation: Text+Img+CF
tokenization: RQ-VAE+DINO
backbone: Enc-Dec
tokenizer: Fixed†
objective: NTP
inference: Trie/C-Beam
poi: false
tldr: MSCGRec quantizes images with self-supervised DINO-based learning, adds collaborative features as a separate modality,
  and restricts training outputs to permissible tokens, to scale generative recommendation to large catalogs.
tldr_zh: MSCGRec 用基于 DINO 的自监督学习量化图像，把协同特征作为独立模态引入，并将训练输出限制在合法 token 集合内，以扩展到大物品库。
evidence:
- field: problem
  where: 'Abstract, large-item-set limitation (fragment) and proposed semantic/collaborative quantization, arXiv v1: https://arxiv.org/html/2602.03713v1#abstract1.1'
  quote: these methods have yet to surpass traditional sequential recommenders on large item sets
  reason: The organizer considered I versus no matching category. The retained I judgment follows multimodal quantization
    and collaborative fusion rather than the abstract's scale complaint.
- field: tokenizer
  where: 'Sections 3.2 and 3.3, RQ-DINO learning and constrained sequence training, arXiv v1: https://arxiv.org/html/2602.03713v1#S3.SS2.p2
    and https://arxiv.org/html/2602.03713v1#S3.SS3.p2'
  reason: 'Fixed remains an organizer inference: the paper separately defines RQ-DINO learning and constrained sequence training
    without explicitly stating their training order.'
setup:
  datasets: Amazon 2023 Beauty and Personal Care (724,796 users / 203,843 items), Sports and Outdoors (408,287 / 151,632),
    and PixelRec (8,886,078 / 407,082). 5-core filtering of users and items; for Amazon, samples with empty or placeholder
    images are removed and items with identical images are merged into one ID; sequences capped at 20 items.
  split: Chronological leave-one-out into training, validation, and test; for Amazon every item in a training sequence is
    a separate target, for PixelRec only the last item.
  candidates: not reported (full catalog versus sampled evaluation candidates); top-K lists from constrained beam search.
  visibility: warm; no unseen-item protocol is defined. The collaborative modality uses SASRec item embeddings trained on
    the interaction data.
  sid: Per-modality residual quantizers (image via DINO self-supervised quantization, LLAMA text, SASRec collaborative) with
    3 levels x 256 entries each, applied directly in embedding space; an extra collision level per modality makes each item's
    code unique (TIGER style). The collaborative codes serve as generation targets.
  inference_budget: 'Constrained beam search with 20 beams; T5 encoder-decoder; training and evaluation on four NVIDIA A100
    GPUs. Inference batch size and latency: not reported.'
  results_from: Table 2 (Beauty, Sports, PixelRec versus sequential and generative baselines); Table 3 (component ablations,
    modality Shapley values, image-only).
setup_where:
  datasets: 'Datasets and preprocessing: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px1.p1; statistics: https://arxiv.org/html/2602.03713v1#S4.T1.'
  split: 'Chronological leave-one-out and target construction: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px1.p1.'
  candidates: 'Metrics only: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px1.p1.'
  visibility: 'Standard split with no unseen-item protocol; SASRec embeddings as the collaborative modality: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px1.p1
    and https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p1.'
  sid: '3 levels x 256 per modality plus a collision level: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p2 and https://arxiv.org/html/2602.03713v1#S3.SS1.p2;
    DINO-based image quantization: https://arxiv.org/html/2602.03713v1#S3.SS2.p2.'
  inference_budget: 'Constrained beam search with 20 beams and hardware: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p3;
    constrained training softmax: https://arxiv.org/html/2602.03713v1#S3.SS3.p2.'
  results_from: 'Main: https://arxiv.org/html/2602.03713v1#S4.T2; ablations and Shapley values: https://arxiv.org/html/2602.03713v1#S4.T3.'
related:
- id: tiger
  relation: competitor
  note: TIGER quantizes one modality; MSCGRec concatenates codes from image, text, and collaborative modalities and trains
    with a softmax restricted to permissible next codes, keeping TIGER's collision level.
  where: 'MSCGRec v1, baselines TIGER_i and TIGER_t: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px2.p1; Table 2: https://arxiv.org/html/2602.03713v1#S4.T2;
    collision level follows TIGER: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p2.'
- id: mql4grec
  relation: competitor
  note: MQL4GRec uses separate text and image quantitative languages with collision reassignment; MSCGRec adds a collaborative
    modality, DINO-based image codes, and constrained training, and found MQL4GRec's reassignment gave no gain under constrained
    training.
  where: 'MSCGRec v1, follows MQL4GRec''s text embeddings and tests its reassignment: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p1
    and https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px3.p2; Table 2: https://arxiv.org/html/2602.03713v1#S4.T2.'
- id: letter
  relation: competitor
  note: LETTER aligns quantized codes with a sequential recommender inside one tokenizer; MSCGRec keeps collaborative information
    as its own code modality.
  where: 'MSCGRec v1, LETTER-TIGER baseline: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px2.p1; Table 2: https://arxiv.org/html/2602.03713v1#S4.T2.'
- id: cost
  relation: competitor
  note: CoST aligns embeddings before and after quantization contrastively; MSCGRec changes the modalities and the training
    softmax instead.
  where: 'MSCGRec v1, baselines: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px2.p1; Table 2: https://arxiv.org/html/2602.03713v1#S4.T2.'
- id: etegrec
  relation: competitor
  note: ETEGRec trains tokenizer and generator end to end; MSCGRec quantizes frozen pretrained embeddings per modality.
  where: 'MSCGRec v1, baselines: https://arxiv.org/html/2602.03713v1#S4.SS1.SSS0.Px2.p1; Table 2: https://arxiv.org/html/2602.03713v1#S4.T2.'
