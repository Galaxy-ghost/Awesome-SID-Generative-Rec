id: fedcgr
name: FedCGR
title: 'FedCGR: Federated Cross-Domain Generative Recommendation'
authors: Liu et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2608.10929
  code: https://github.com/ZhuodLiu/FedCGR
problem: VI
stage: Backbone
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Aux.
inference: C-Beam
poi: false
tldr: FedCGR performs federated cross-domain recommendation over shared Semantic IDs from public metadata, injects local collaborative
  evidence, and aggregates parameters by domain relatedness, without exchanging private interactions.
tldr_zh: FedCGR 在基于公开元数据构建的共享 SID 上做联邦跨域推荐，注入本地协同证据并按域相关性聚合参数，无需交换私有交互数据。
setup:
  datasets: 'Amazon Review: Grocery, Beauty, Sports, Food, Kitchen; six cross-domain scenarios FK/GB/GS/FKB/GBS/GKBS; per-domain
    5-core filtering.'
  split: 'Per-user leave-one-out: last item test, second-to-last validation, remaining interactions training.'
  candidates: 'full catalog; additionally sampled: 999 random negatives per user, fixed once and shared across methods (seed42).
    Negative-sampling distribution beyond random and history-item exclusion: not reported.'
  visibility: 'warm; no unseen-item protocol is defined. Cold-start analysis groups users by training-history length (<=7,
    8-15, >=16), not unseen items. SID metadata pretraining excludes private interactions; local CF uses client interaction
    sequences. Item-level generator/tokenizer/CF exposure: not reported.'
  sid: 'Frozen metadata RQ-VAE: 3 levels x 256 codes; colliding items share SID scores, ties broken by validation-set item
    popularity.'
  inference_budget: 'Target-domain trie-constrained beam 50; H/NDCG@10; experiments on RTX 4090 GPUs. Inference batch size
    and latency: not reported.'
  results_from: 'Original Tables 3/4: full-ranking/sampled comparisons; Table 5: ablation; Table 6: diagnostics; Figures 3-5:
    user activity, sensitivity, communication efficiency.'
setup_where:
  datasets: 'Section 4.1.1: https://arxiv.org/html/2608.10929v1#S4.SS1.SSS1.p1 and https://arxiv.org/html/2608.10929v1#S4.SS1.SSS1.p3'
  split: 'Section 4.1.3: https://arxiv.org/html/2608.10929v1#S4.SS1.SSS3.p1'
  candidates: 'Section 4.1.3: https://arxiv.org/html/2608.10929v1#S4.SS1.SSS3.p1'
  visibility: 'Sections 3.1 and 4.4: https://arxiv.org/html/2608.10929v1#S3.SS1.p1 and https://arxiv.org/html/2608.10929v1#S4.SS4.p1'
  sid: 'Sections 3.2 and 4.1.4: https://arxiv.org/html/2608.10929v1#S3.SS2.p2 and https://arxiv.org/html/2608.10929v1#S4.SS1.SSS4.p1'
  inference_budget: 'Sections 3.4 and 4.1.4: https://arxiv.org/html/2608.10929v1#S3.SS4.p2 and https://arxiv.org/html/2608.10929v1#S4.SS1.SSS4.p1'
  results_from: 'Tables 3-6 and Figures 3-5: https://arxiv.org/html/2608.10929v1#S4.T3 and https://arxiv.org/html/2608.10929v1#S4.T4
    and https://arxiv.org/html/2608.10929v1#S4.T5 and https://arxiv.org/html/2608.10929v1#S4.T6 and https://arxiv.org/html/2608.10929v1#S4.F3
    and https://arxiv.org/html/2608.10929v1#S4.F4 and https://arxiv.org/html/2608.10929v1#S4.F5'
related:
- id: tiger
  relation: competitor
  note: TIGER and its FedAvg/FedProx variants are full-ranking baselines.
  where: 'FedCGR v1, Section 4.1.2 and Table 3: https://arxiv.org/html/2608.10929v1#S4.SS1.SSS2.p2; https://arxiv.org/html/2608.10929v1#S4.T3.'
- id: gencdr
  relation: alternative
  note: GenCDR uses centralized semantic CDR; FedCGR keeps interactions local.
  where: 'FedCGR v1, Section 5: https://arxiv.org/html/2608.10929v1#S5.p1; https://arxiv.org/html/2608.10929v1#S5.p2.'
- id: vq-rec
  relation: predecessor
  note: Related work identifies VQ-Rec as an earlier transferable quantized-item representation method.
  where: 'FedCGR v1, Section 5: https://arxiv.org/html/2608.10929v1#S5.p2.'
changes:
  representation: none
  tokenization: none
  backbone: primary
  tokenizer: none
  objective:
    value: other
    quote: 'The auxiliary loss is a confidence-weighted local InfoNCE (Information Noise-Contrastive Estimation) objective:
      (12) $\mathcal{L}_{\mathrm{dense}}=-\frac{1}{|\mathcal{B}|}\sum_{n\in\mathcal{B}}\rho_{v_{n}^{+},i}\log\frac{\exp(\hat{\mathbf{z}}_{n}^{\top}\operatorname{sg}(\mathbf{z}_{n}^{+})/\tau)}{\sum_{m\in\mathcal{B}}\exp(\hat{\mathbf{z}}_{n}^{\top}\operatorname{sg}(\mathbf{z}_{m}^{+})/\tau)},$
      where $\operatorname{sg}(\cdot)$ denotes stop-gradient and $\tau$ is the InfoNCE temperature.'
    where: arXiv:2608.10929v1 https://arxiv.org/html/2608.10929v1#S3.SS2.p6
  inference: none
modality:
- Text
domain:
- E-commerce
settings:
- value: cross-domain
  quote: We select five product domains—Grocery, Beauty, Sports, Food, and Kitchen—and compose six scenarios that span different
    domain counts and relatedness levels.
  where: arXiv:2608.10929v1 https://arxiv.org/html/2608.10929v1#S4.SS1.SSS1.p1
