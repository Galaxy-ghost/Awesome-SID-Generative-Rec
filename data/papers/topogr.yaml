id: topogr
name: TopoGR
title: 'TopoGR: Revealing and Preserving Latent Structure of Semantic ID in Generative Recommendation'
authors: Zheng et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2607.25216
  code: null
problem: III
stage: Tokenization
representation: Text
tokenization: BDQ
backbone: Non-AR
tokenizer: Fixed
objective: MTP + Aux.
inference: Scoring+Rerank
poi: false
summary: 提出 Binary SID 与拓扑感知生成推荐组件，既非单纯分析亦非连续标识。
tldr: TopoGR learns bit-decomposable binary Semantic IDs and uses their Hamming geometry in input features, soft training
  targets, and reranking, instead of treating Semantic ID tokens as independent symbols.
tldr_zh: TopoGR 学习可按位分解的二值 SID，并在输入特征、软训练目标与重排中利用其汉明几何结构，不再将 SID token 视作彼此独立的符号。
setup:
  datasets: Amazon Review Sports & Outdoors, Beauty, Toys & Games, CDs & Vinyl; reviews treated as chronological interactions.
    Filtering and maximum history length not reported.
  split: Leave-one-out with checkpoint selection by validation performance; exact train/validation/test holdout allocation
    not reported.
  candidates: full catalog scored through vectorized SID-probability gathering, followed by top-1000 reranking; consumed-item
    exclusion not reported.
  visibility: warm; no unseen-item protocol is defined. Tokenizer fitting exposure to test items not reported.
  sid: 'BDQ/LFQ: 64 positions x 8 bits, each position mapping to 256 integer codes; implicit fixed binary vertices, not learned
    centroid codebooks. Reported full-SID collapse ratio <0.003; collision disambiguation not reported.'
  inference_budget: Parallel prediction of all 64 SID positions, full-corpus gather scoring and Hamming reranking of 1000
    items; no beam search; Recall/NDCG@5/10. One H20 96GB is used for experiments; Figure 8 plots approximately 9 ms inference
    time on Beauty. Inference batch size and timing aggregation not reported.
  results_from: 'Table 1: four-dataset comparison; some baseline numbers adopted from Rajput et al. (2023), remaining datasets/models
    reproduced with official implementations or RecBole; exact reused rows not specified. Table 6: ablations; Figure 8: inference
    efficiency.'
