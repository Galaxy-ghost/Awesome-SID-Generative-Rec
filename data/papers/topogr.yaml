related:
- id: tiger
  relation: competitor
  note: TIGER decodes residual SIDs autoregressively; TopoGR exposes binary SID geometry and predicts all positions in parallel
    before full-corpus scoring.
  where: 'TopoGR v1, Section 5.1 and Appendix A.4: https://arxiv.org/html/2607.25216v1#S5.SS1.p2; https://arxiv.org/html/2607.25216v1#A1.SS4.p4.'
- id: rpg
  relation: competitor
  note: RPG uses parallel SID prediction with graph-constrained decoding; TopoGR instead uses vectorized full-corpus scoring
    and Hamming-consistent reranking.
  where: 'TopoGR v1, Section 5.1 and Appendix A.4: https://arxiv.org/html/2607.25216v1#S5.SS1.p2; https://arxiv.org/html/2607.25216v1#A1.SS4.p5.'
- id: llada-rec
  relation: alternative
  note: LLaDA-Rec uses discrete diffusion for bidirectional SID generation; TopoGR predicts SID positions simultaneously and
    adds binary-topology supervision and reranking.
  where: 'TopoGR v1, Related Work and Section 4.3; cited alternative rather than a listed baseline: https://arxiv.org/html/2607.25216v1#S2.p2;
    https://arxiv.org/html/2607.25216v1#S4.SS3.p1.'
