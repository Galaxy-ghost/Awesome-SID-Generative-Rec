id: digr
name: DiGR
title: 'From Token Generation to Item Ranking: Direct Generative Recommendation with Semantic IDs'
authors: Zhao et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2602.07847
  code: https://anonymous.4open.science/r/SimGR-C408/
problem: IV
stage: Backbone
representation: –
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Discrim.
inference: Scoring
poi: false
tldr: DiGR uses Semantic ID tokens as item representations and scores items with one item-level function, instead of generating
  tokens, after showing that token decoding adds no ranking expressiveness.
tldr_zh: DiGR 论证逐 token 解码不增加排序表达力后，将 SID token 作为物品表示并用单一物品级函数直接打分，不再逐位生成 token。
setup:
  datasets: 'Amazon Reviews 2018: Musical Instruments, Arts/Crafts/Sewing, Video Games; user/item 5-core; chronological histories
    capped at 20.'
  split: 'Per-user leave-one-out: last interaction test, penultimate validation, all earlier interactions training; learning
    rate and training epochs selected by validation grid search.'
  candidates: full catalog for DiGR and other scoring-based methods; autoregressive baselines use prefix-constrained beam
    20; history exclusion not reported.
  visibility: warm; no unseen-item protocol is defined. Tokenizer exposure to test items is not reported.
  sid: RQ-VAE SIDs composed by mean-pooling shared position-specific SID-token embeddings; SID length, codebook sizes, tokenizer
    input encoder and collision handling not reported. Appendix D additionally compares R-KMeans and OPQ on Instruments.
  inference_budget: 'Precomputed item vectors and direct item-level scoring; no SID decoding. HR@1/5/10 and NDCG@5/10. Instruments
    timing: 0.074 s/user on one NVIDIA A100; inference batch size not reported. Beam 20 belongs to main autoregressive baselines,
    with 50/100 in the separate timing study.'
  results_from: Own recommendation comparison and controlled ranking/efficiency studies; ID baselines use RecBole, generative
    baselines follow official designs, LC-Rec shares Qwen3-4B/LoRA settings. Ranking-overlap reference is exhaustive LC-Rec
    scoring, not observed ground-truth preference order. Appendix D uses GPT-2 controls; no imported baseline scores stated;
    run counts/variance not reported.
