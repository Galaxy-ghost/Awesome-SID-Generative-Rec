id: gem-rec
name: GEM-Rec
title: 'One Model, Two Markets: Bid-Aware Generative Recommendation'
authors: Jiang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2603.22231
  code: null
problem: IV
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Bid-Aware Beam
poi: false
summary: 'Abstract: "do not address concerns such as monetization via ad revenue and incorporation of bids".'
tldr: GEM-Rec adds control tokens that decide whether to show an ad and bid-aware decoding that injects real-time bids, so
  one generator serves both semantic relevance and ad revenue.
tldr_zh: GEM-Rec 加入决定是否展示广告的控制 token，以及在解码时注入实时出价的出价感知解码机制，用单一生成器兼顾语义相关性与广告收益。
evidence:
- field: problem
  where: https://arxiv.org/html/2603.22231v1#abstract1
  quote: do not address concerns such as monetization via ad revenue and incorporation of bids
setup:
  datasets: 'Synthetic marketplaces built on Steam and Amazon Beauty, Sports, and Toys, each with 5-core filtering. A random
    20% of items is designated sponsored and given log-normal bids (mu=0, sigma=0.2, clipped and normalized to [0.1, 1.0]);
    ads are injected into organic histories by a prefix-match relevance filter (depth 2, relaxed to 1), softmax bid selection
    (tau=0.1), and frequency capping (p=0.4, r=0.05; high-density ablation p=1.0, r=0.5). Main ad density about 3-6%; ablation
    about 10-20%. Retained corpus sizes: not reported.'
  split: not reported (the model is evaluated on test-set trajectories generated by the simulated policy; the train/validation/test
    construction is not described).
  candidates: not reported (full catalog versus sampled evaluation candidates); ads are generated by beam search under a sampled
    slot flag.
  visibility: warm; no unseen-item protocol is defined.
  sid: '3-level RQ-VAE x 256 codewords over Sentence-T5 item embeddings, plus a leading organic/sponsored flag token. Collision
    handling: not reported; the theoretical analysis assumes a one-to-one item-SID mapping.'
  inference_budget: 'Hierarchical decoding: the organic/ad flag is sampled from modulated logits, then beam search of width
    K generates the SID; numerical K not reported. Bid modulation strength swept over lambda in [0, 10]. One NVIDIA A100 for
    all experiments; inference batch size and latency: not reported. Generated ad sequences are 100% valid (Table 4).'
  results_from: Table 1 (marketplace performance versus TIGER; full version in Appendix G, Table 3); Table 2 and Appendix
    H, Tables 5-8 (bid-shock response); Figures 2-7 (Pareto frontiers, steerability, organic integrity, high-ad-rate ablations);
    Table 4 (generative validity).
setup_where:
  datasets: 'Base datasets and sponsored subset: https://arxiv.org/html/2603.22231v1#S5.SS1.p3; 5-core filtering: https://arxiv.org/html/2603.22231v1#A2.SS1.p1;
    bids and ad-injection policy: https://arxiv.org/html/2603.22231v1#A4.SS1.p1, https://arxiv.org/html/2603.22231v1#A4.SS2.p2,
    https://arxiv.org/html/2603.22231v1#A4.SS2.p3, https://arxiv.org/html/2603.22231v1#A4.SS2.p4.'
  split: 'Evaluation protocols name only test-set trajectories, not the split rule: https://arxiv.org/html/2603.22231v1#S5.SS2.p1
    and https://arxiv.org/html/2603.22231v1#S5.I2.i1.p1.'
  candidates: 'Metrics only: https://arxiv.org/html/2603.22231v1#S5.I2.i1.p1 and https://arxiv.org/html/2603.22231v1#S5.I2.i2.p1.'
  visibility: 'No unseen-item protocol; synthetic logs from the same item universe: https://arxiv.org/html/2603.22231v1#S5.SS1.p3.'
  sid: 'RQ-VAE depth 3 x 256 on Sentence-T5 embeddings: https://arxiv.org/html/2603.22231v1#A2.SS2.p1 and https://arxiv.org/html/2603.22231v1#A6.p2;
    one-to-one item-SID mapping is an assumption of the proofs: https://arxiv.org/html/2603.22231v1#A3.p2.'
  inference_budget: 'Flag sampling then width-K content beam search: https://arxiv.org/html/2603.22231v1#S4.I2.i1.p1 and https://arxiv.org/html/2603.22231v1#S4.I2.i2.p1;
    hardware: https://arxiv.org/html/2603.22231v1#A2.SS2.p1 and https://arxiv.org/html/2603.22231v1#A6.p3; validity: https://arxiv.org/html/2603.22231v1#A7.T4.'
  results_from: 'Main: https://arxiv.org/html/2603.22231v1#S5.T1; full results: https://arxiv.org/html/2603.22231v1#A7.T3;
    volatility: https://arxiv.org/html/2603.22231v1#S5.T2, https://arxiv.org/html/2603.22231v1#A8.T5, https://arxiv.org/html/2603.22231v1#A8.T6,
    https://arxiv.org/html/2603.22231v1#A8.T7, https://arxiv.org/html/2603.22231v1#A8.T8.'
related:
- id: tiger
  relation: competitor
  note: TIGER is the pure-utility generative baseline without sponsored slots; GEM-Rec adds an organic/ad flag token and inference-time
    bid modulation of the logits.
  where: 'GEM-Rec v1, Section 5.3: https://arxiv.org/html/2603.22231v1#S5.SS3.p1; Table 1 and Appendix Table 3: https://arxiv.org/html/2603.22231v1#S5.T1
    and https://arxiv.org/html/2603.22231v1#A7.T3.'
- id: liger
  relation: predecessor
  note: GEM-Rec builds on LIGER's reproduction of the TIGER architecture and 5-core preprocessing, without LIGER's own training
    objectives.
  where: 'GEM-Rec v1, Section 5.4 adopts the codebase of Yang et al. (2024): https://arxiv.org/html/2603.22231v1#S5.SS4.p1;
    Appendix B.1 follows its 5-core filtering: https://arxiv.org/html/2603.22231v1#A2.SS1.p1; Appendix F matches its model
    scale: https://arxiv.org/html/2603.22231v1#A6.p1.'
