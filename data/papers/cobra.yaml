id: cobra
name: COBRA
title: 'Sparse Meets Dense: Unified Generative Recommendations with Cascaded Sparse-Dense Representations'
authors: Yang et al.
year: 2025
venue: NeurIPS’25
links:
  arxiv: https://arxiv.org/abs/2503.02453
  code: null
problem: I
stage: Backbone
representation: Text+SID
tokenization: Casc. RQ
backbone: Dec-Only
tokenizer: Fixed
objective: NTP + Dense
inference: BeamFusion
poi: false
summary: 'Abstract: "significant information loss due to the separation of stages such as quantization and sequence modeling".'
tldr: COBRA generates a sparse Semantic ID and then a dense vector conditioned on it, trains both end to end, and decodes
  with BeamFusion, which combines beam search with nearest-neighbor scores.
tldr_zh: COBRA 先生成稀疏 SID 再以它为条件生成稠密向量，端到端联合训练二者，并在解码时用 BeamFusion 融合束搜索分数与最近邻相似度。
evidence:
- field: problem
  where: https://arxiv.org/html/2503.02453v1#abstract1
  quote: significant information loss due to the separation of stages such as quantization and sequence modeling
setup:
  datasets: 'Amazon Product Reviews (May 1996-September 2014): Beauty, Sports and Outdoors, Toys and Games, with 5-core filtering
    of users and items (users / items: 22,363 / 12,101; 35,598 / 18,357; 19,412 / 11,924). Industrial: Baidu advertising logs
    across list-page, dual-column, and short-video scenarios, about 5 million users and 2 million ads; filtering not reported.'
  split: 'Public datasets: train/validation/test allocation not reported. Industrial: first 60 days of logs for training and
    the following day for testing. Online: A/B test in January 2025 with 10% of user traffic.'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-K lists are formed by ANN retrieval among
    items under the top-M generated sparse IDs, fused by BeamFusion. Public K=5 and 10; industrial K=50 to 800.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Public: 3-level semantic IDs with codebook size 32 per level, generated from T5 embeddings following TIGER''s method.
    Industrial: 2-level 32 x 32 sparse IDs (the w/o Dense variant uses 3 levels of 256). Items under the same sparse ID are
    distinguished by a generated dense vector and ANN search within that ID''s candidate set; a collision-resolution rule
    for the sparse IDs is not reported.'
  inference_budget: 'Beam search returns the top M sparse IDs, then ANN retrieves the top N items per ID and BeamFusion combines
    beam and cosine scores; numerical M and N are not reported. The recall-diversity analysis selects tau=0.9 with the second
    coefficient fixed at 16. Public model: 1-layer encoder and 2-layer decoder. Hardware, inference batch size, and latency:
    not reported.'
  results_from: 'Table 2 (Beauty, Sports, Toys); Table 3 (Baidu industrial Recall@50-800 with ablated variants); Section 4.4
    (online A/B: +3.60% conversion, +4.15% ARPU); Figures 4-6 (embedding analysis and recall-diversity curves).'
setup_where:
  datasets: 'Public categories, date range, 5-core filtering: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS1.p1; statistics:
    https://arxiv.org/html/2503.02453v1#S4.T1; industrial data: https://arxiv.org/html/2503.02453v1#S4.SS2.SSS1.p1.'
  split: 'Public split not stated: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS1.p1; industrial 60-day train and next-day
    test: https://arxiv.org/html/2503.02453v1#S4.SS2.SSS1.p1; online A/B: https://arxiv.org/html/2503.02453v1#S4.SS4.p1.'
  candidates: 'Retrieval combines beam search over sparse IDs with ANN over items under each ID: https://arxiv.org/html/2503.02453v1#S3.SS4.p2
    and https://arxiv.org/html/2503.02453v1#S3.SS4.p5; evaluation metrics: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS1.p1.'
  visibility: 'Standard public protocol and next-day industrial test, with no cold-start experiment: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS1.p1
    and https://arxiv.org/html/2503.02453v1#S4.SS2.SSS1.p1.'
  sid: 'Public SID: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS3.p1; industrial SID and the w/o Dense variant: https://arxiv.org/html/2503.02453v1#S4.SS2.SSS3.p1;
    items sharing a sparse ID are separated by the dense vector: https://arxiv.org/html/2503.02453v1#S3.SS4.p5.'
  inference_budget: 'Beam search top-M, ANN top-N, BeamFusion coefficients: https://arxiv.org/html/2503.02453v1#S3.SS4.p2,
    https://arxiv.org/html/2503.02453v1#S3.SS4.p5, https://arxiv.org/html/2503.02453v1#S3.SS4.p6; tau setting: https://arxiv.org/html/2503.02453v1#S4.SS3.SSS2.p1;
    architecture: https://arxiv.org/html/2503.02453v1#S4.SS1.SSS3.p1.'
  results_from: 'Public table: https://arxiv.org/html/2503.02453v1#S4.T2; industrial variants: https://arxiv.org/html/2503.02453v1#S4.T3;
    online: https://arxiv.org/html/2503.02453v1#S4.SS4.p1; diversity curves: https://arxiv.org/html/2503.02453v1#S4.F6.'
related:
- id: tiger
  relation: competitor
  note: TIGER retrieves items from sparse semantic IDs alone; COBRA follows TIGER's SID construction but generates a dense
    vector after each sparse ID and fuses beam and ANN scores.
  where: 'COBRA v1, baselines and SID setting: https://arxiv.org/html/2503.02453v1#S4.I1.i9.p1 and https://arxiv.org/html/2503.02453v1#S4.SS1.SSS3.p1;
    Table 2: https://arxiv.org/html/2503.02453v1#S4.T2; the w/o Dense variant mirrors TIGER: https://arxiv.org/html/2503.02453v1#S4.I2.i2.p1.'
- id: liger
  relation: alternative
  note: LIGER (Yang et al., 2024) unifies generative and dense retrieval as a hybrid, while COBRA cascades sparse-ID generation
    and dense-vector generation inside one decoder.
  where: 'COBRA v1, Section 1 cites Yang et al. (2024), Unifying Generative and Dense Retrieval, for the fine-grained similarity
    gap of generative methods: https://arxiv.org/html/2503.02453v1#S1.p3; not a baseline in Table 2.'
- id: capsid
  relation: alternative
  note: CapsID removes the dense patch and instead makes the SID soft-routed and variable-length, reporting about half of
    COBRA's per-query latency at similar Recall@100.
  where: 'Evidence is from the later CapsID paper: COBRA is a patch-route baseline in Tables 3, 4, and 6: https://arxiv.org/html/2605.05096v1#S4.T3,
    https://arxiv.org/html/2605.05096v1#S4.T4, https://arxiv.org/html/2605.05096v1#S4.T6; latency comparison: https://arxiv.org/html/2605.05096v1#S4.SS5.SSS0.Px5.p2.'
