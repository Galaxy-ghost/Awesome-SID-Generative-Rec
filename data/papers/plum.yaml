  quote: a framework designed to adapt pre-trained LLMs for industry-scale recommendation tasks
setup:
  datasets: 'Internal YouTube LFV/Shorts engagement and video metadata; reward-based SFT downsampling. Scaling input: 1536
    tokens, roughly 100 recent watches; other filtering rules not reported.'
  split: 'Scaling: shuffle seven consecutive July 2025 days for training; evaluate Day 8. CPT ablation also uses held-out
    next-day evaluation; main production validation/test allocation not reported.'
