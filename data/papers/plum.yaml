  where: 'PLUM v1, Sections 1.1.2/2.1.2: https://arxiv.org/html/2510.07784v1#S1.SS1.SSS2.p1; https://arxiv.org/html/2510.07784v1#S2.SS1.SSS2.p2.'
- id: mmq
  relation: alternative
  note: MMQ generates modality-specific tokens; PLUM fuses embeddings before quantization.
  where: 'PLUM v1, Section 1.1.2: https://arxiv.org/html/2510.07784v1#S1.SS1.SSS2.p2.'
- id: liger
  relation: alternative
  note: LIGER mixes generated IDs with dense retrieval; PLUM emphasizes SID-LLM adaptation.
  where: 'PLUM v1, Section 1.1.3 (Yang et al., 2024): https://arxiv.org/html/2510.07784v1#S1.SS1.SSS3.p1.'
