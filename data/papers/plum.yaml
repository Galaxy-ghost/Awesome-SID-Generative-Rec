  visibility: warm; no unseen-item protocol is defined. Tokenizer/CPT item exposure relative to next-day tests not reported.
  sid: 'SID-v2 RQ-VAE: level-l codebook size 2048/2^(l-1); number of levels not reported. If a SID maps to multiple videos,
    randomly sample one for recall evaluation.'
  inference_budget: Beam decoding, width not reported; Recall@10 in scaling/ablations; production model 900M activated parameters.
    Serving hardware/batch size and latency not reported; 1024 v6e TPUs (four 256-TPU trainers) describe scaling training.
