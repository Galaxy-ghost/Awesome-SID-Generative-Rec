id: plum
name: PLUM
title: 'PLUM: Adapting Pre-trained Language Models for Industrial-scale Generative Recommendations'
authors: He et al.
year: 2026
venue: WWW’26
links:
  arxiv: https://arxiv.org/abs/2510.07784
  code: null
problem: psb
stage: n/a
representation: Text+Img+CF
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: Beam
poi: false
tldr: PLUM adapts a pre-trained LLM to industrial recommendation through Semantic ID tokenization, continued pre-training
  on domain data, and fine-tuning for generative retrieval, instead of large embedding tables.
tldr_zh: PLUM 通过 SID 编号、领域数据持续预训练与生成式检索微调将预训练 LLM 适配到工业推荐系统，替代大规模嵌入表。
evidence:
