related:
- id: tiger
  relation: predecessor
  note: The single-head arm follows TIGER-style autoregressive SID generation with constrained beam search in a multitask
    streaming-media LLM.
  where: 'Netflix comparison v1, Introduction and Section 3.2.1: https://arxiv.org/html/2610.15864v1#S1.p3; https://arxiv.org/html/2610.15864v1#S3.SS2.SSS1.p1.'
- id: rpg
  relation: alternative
  note: RPG pairs parallel SID prediction with graph-constrained decoding; this study strengthens its MTP arm with an auxiliary
    item-ranking loss and tests moderate four-token SIDs.
  where: 'Netflix comparison v1, Sections 2/3.2.2/4.2: https://arxiv.org/html/2610.15864v1#S2.SS0.SSS0.Px2.p1; https://arxiv.org/html/2610.15864v1#S3.SS2.SSS2.Px1.p1;
    https://arxiv.org/html/2610.15864v1#S4.SS2.SSS0.Px3.p1.'
- id: stamp
  relation: alternative
  note: STAMP uses auxiliary multi-token prediction to densify training supervision; this study compares MTP and autoregressive
    decoding as generation paradigms.
  where: 'Netflix comparison v1, Section 2: https://arxiv.org/html/2610.15864v1#S2.SS0.SSS0.Px2.p1.'
- id: nezha
  relation: alternative
  note: NEZHA accelerates SID beam search using self-drafting and hash-set verification; this study addresses generation quality
    and cost rather than only decoding acceleration.
  where: 'Netflix comparison v1, Section 2: https://arxiv.org/html/2610.15864v1#S2.SS0.SSS0.Px3.p1.'
