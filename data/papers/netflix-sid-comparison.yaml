id: netflix-sid-comparison
name: Netflix-SID-Comparison
title: 'Personalized LLM Recommendation with Semantic IDs: Autoregressive Beam Search vs. Multi-Token Prediction'
authors: Oh et al.
year: 2026
venue: NeurIPS’26 PALM Workshop
links:
  arxiv: https://arxiv.org/abs/2610.15864
  code: null
problem: psb
stage: n/a
representation: –
tokenization: RQ-VAE
backbone: Dec-Only / Non-AR
tokenizer: Fixed
objective: Multi-task NTP / (Text NTP + MTP + Rank); Lang. RL after SFT
inference: C-Beam / Scoring
poi: false
tldr: Netflix-SID-Comparison evaluates single-head autoregressive beam search against multi-token prediction for LLM Semantic
  ID generation on ranking quality and serving cost.
tldr_zh: Netflix-SID-Comparison 在流媒体工业场景中对比 LLM 生成 SID 时的单头自回归束搜索与多 token 预测在推荐质量与推理成本上的权衡。
setup:
  datasets: Proprietary streaming-media member histories, synthetic content QA, and open instruction-following data; >=10M
    examples/task. Catalog size, exact corpus sizes and filtering not reported.
  split: Histories snapshotted at a fixed date-hour; internal ranking test averages future-interaction offsets +1 through
    +7 days. Exact cutoff and train/validation/test sizes not reported; content QA uses a stratified test set.
  candidates: not reported; trie/request-eligible catalog constraints define serving validity, but the ranking test universe
    and evaluation negative sampling are not specified.
  visibility: 'Cold-start cohort: titles launched after training cutoff, without training engagement. Generator exposure through
    content QA and tokenizer fitting exposure not reported; unseen by generator only versus unseen by tokenizer too is not
    established.'
  sid: 'Frozen snapshot of RQ-VAE identifiers: 4 x 1024. For collisions (<=1% example rate), return the first entity in the
    SID bucket.'
  inference_budget: 'Single-head: vLLM constrained beam search with prefix caching; MTP: one-pass per-code distributions and
    eligible-entity scoring. Beam width, output K, inference batch size and latency not reported. Shared training/inference
    pool: up to 256 H200/A100-80GB GPUs; inference allocation not reported. MTP throughput is 75% higher on 8B.'
  results_from: 'Original Tables 1-2: controlled single-head versus MTP quality/system comparison. Tables 3-4: SID recipe
    versus previous non-SID auxiliary-head baseline; Tables 5-7: ablations. Proprietary scores/costs reported relatively;
    no imported baseline result table identified.'
