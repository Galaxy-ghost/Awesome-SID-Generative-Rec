id: tracer
name: TRACER
title: 'TRACER: Token ReAssignment for Concept ERasure in Generative Recommendation'
authors: Chen et al.
year: 2026
venue: NeurIPS’26
links:
  arxiv: https://arxiv.org/abs/2606.07688
  code: null
problem: IV
stage: Tokenization
representation: Text
tokenization: Soft Reassign. RQ
backbone: Dec-Only / Enc-Dec
tokenizer: Joint
objective: NTP + Aux.
inference: Beam
poi: false
tldr: TRACER removes sensitive concepts from a generative recommender by reassigning concept-related items to alternative
  Semantic ID tokens with a coherence regularizer, instead of suppressing tokens shared with retained items.
tldr_zh: TRACER 通过带连贯性正则的重分配机制将敏感概念相关物品映射到替代 SID token，实现概念级遗忘，避免直接压制与保留物品共享的 token。
setup:
  datasets: 'Amazon Industrial & Scientific, Sports & Outdoors and Toys & Games; remove users/items with fewer than five interactions.
    Amazon release year: not reported. Randomly select 5% of brands for forgetting, covering approximately 10% of interactions.'
  split: 'Chronological 80/10/10 train/validation/test. Per-user versus global allocation and history cap: not reported.'
  candidates: not reported; full-catalog versus sampled ranking and history-item exclusion are unspecified.
  visibility: 'warm; no unseen-item protocol is defined. Forgetting targets training-data influence; tokenizer exposure to
    held-out items/interactions: not reported.'
  sid: 'All backbones use three RQ-VAE levels x 256 codes, embedding dimension 64. TRACER learns soft-assignment perturbations
    for target-concept items while preserving other items'' original SIDs. Collision handling: not reported.'
  inference_budget: 'Beam search width 10; retain/forget HR and NDCG@5/10, MRR, and description-based semantic similarity.
    Experiments use 4x A100 GPUs. Inference batch, latency and throughput: not reported. Batch128 and 19-27 minutes concern
    unlearning training, not inference.'
  results_from: 'This paper''s unlearning comparisons: main MOR/MiniOneRec and LETTER results on Scientific/Sports; Appendix
    D Tables1-3 cover five backbones x three datasets, Table4 unlearning time, Table5 item-level forgetting. ELM/RMU/RepNoise/FLAT/BLUR/PISCES
    baselines start from the same SFT checkpoint with tuned learning rates; five-run averages. No borrowed baseline-score
    source is identified.'
setup_where:
  datasets: 'Sec.4 datasets/preprocessing and concept setup: https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px1.p1 and https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px2.p1'
  split: 'Sec.4 datasets/preprocessing: https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px1.p1'
  candidates: 'Evaluation metrics and Appendix D.1 do not specify catalog/sampling protocol: https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px6.p1
    and https://arxiv.org/html/2606.07688v1#A4.SS1.p1'
  visibility: 'Forget set comprises previously trained interactions, not an unseen-item evaluation: https://arxiv.org/html/2606.07688v1#S2.SS2.p1
    and https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px2.p1'
  sid: 'Appendix D.1 and Sec.3.1: https://arxiv.org/html/2606.07688v1#A4.SS1.p1 and https://arxiv.org/html/2606.07688v1#S3.SS1.p2'
  inference_budget: 'Appendix D.1-D.3: https://arxiv.org/html/2606.07688v1#A4.SS1.p1 and https://arxiv.org/html/2606.07688v1#A4.SS2.p1
    and https://arxiv.org/html/2606.07688v1#A4.SS3.p1'
  results_from: 'Sec.4 models/baselines and Appendix D.1/D.2/D.4: https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px3.p1 and
    https://arxiv.org/html/2606.07688v1#S4.SS0.SSS0.Px5.p1 and https://arxiv.org/html/2606.07688v1#A4.SS1.p1 and https://arxiv.org/html/2606.07688v1#A4.SS2.p1
