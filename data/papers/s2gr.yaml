related:
- id: tiger
  relation: competitor
  note: TIGER predicts SID codes directly; S2GR inserts thinking tokens aligned with coarse code semantics before each SID
    level and balances the codebook with behavior-aligned embeddings.
  where: 'S2GR v3, baselines: https://arxiv.org/html/2601.18664v3#S5.I1.i6.p1; Table 2: https://arxiv.org/html/2601.18664v3#S5.T2;
    online control group: https://arxiv.org/html/2601.18664v3#S5.SS4.p1.'
- id: onerec-think
  relation: alternative
  note: OneRec-Think reasons explicitly in text with an LLM; S2GR reasons implicitly through latent thinking tokens inside
    a small seq2seq model to meet latency limits.
  where: 'S2GR v3, Section 2.2 places OneRec-Think in the explicit-reasoning line: https://arxiv.org/html/2601.18664v3#S2.SS2.p2.'
- id: plum
  relation: alternative
  note: PLUM feeds ID tokens to a pretrained LLM for explicit reasoning, whereas S2GR adds lightweight implicit reasoning
    steps.
  where: 'S2GR v3, Section 2.2: https://arxiv.org/html/2601.18664v3#S2.SS2.p2.'
