id: sidreasoner
name: SIDReasoner
title: Reasoning over Semantic IDs Enhances Generative Recommendation
authors: He et al.
year: 2026
venue: KDD’26
links:
  arxiv: https://arxiv.org/abs/2603.23183
  code: https://github.com/HappyPointer/SIDReasoner
problem: III
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: C-Beam
poi: false
tldr: SIDReasoner strengthens Semantic ID-language alignment with multi-task training on a teacher-synthesized corpus, then
  improves reasoning through outcome-driven reinforcement learning, without annotated recommendation reasoning traces.
tldr_zh: SIDReasoner 在教师合成语料上用多任务训练加强 SID 与自然语言的对齐，再通过结果驱动的强化学习改进推理，不依赖人工标注的推荐推理轨迹。
evidence:
- field: problem
  where: https://arxiv.org/html/2603.23183v2#abstract1 (Abstract; clause)
  quote: Itemic tokens are not natively meaningful to LLMs
- field: inference
  where: 'Original code basis: HappyPointer/SIDReasoner evaluate_Qwen3_think.py (commit 2575927, read statically); paper scope:
    https://arxiv.org/html/2603.23183v2#S4.SS1.SSS3'
  reason: The inference configuration is not stated in the paper. The existing C-Beam annotation rests on the original static
    code inspection at commit 2575927, rather than on an author quotation.
setup:
  datasets: 'Amazon Reviews 2023: Video Games (3,858 items / 61,417 interactions), Office Products (3,459 / 48,656), Industrial
    and Scientific (3,686 / 45,325); 5-core filtering of users and items; histories truncated by a sliding window of length
    10.'
  split: Per user, interactions sorted chronologically and split 8:1:1 into training, validation, and test, with the most
    recent interactions for validation and test.
  candidates: full catalog (ranking metrics over the entire item set rather than sampled negatives).
  visibility: warm; no unseen-item protocol is defined.
  sid: 'RQ-VAE semantic IDs with L codebooks of K codes over text-encoder embeddings, added to the Qwen3-1.7B vocabulary as
    new tokens; numerical L and K and collision handling: not reported.'
  inference_budget: 'Reason-then-recommend generation: the model writes a reasoning sequence and then the target SID; evaluation
    decoding method and width: not reported (GRPO training uses 16 rollouts). Hardware, inference batch size, and latency:
    not reported.'
  results_from: Table 2 (Games, Office, Industrial versus discriminative, generative, and reasoning baselines); Table 3 (alignment
    strategies before and after RL); Table 4 (general-ability benchmarks); Table 5 (teacher models for corpus enrichment).
setup_where:
  datasets: 'Datasets, 5-core, sliding window 10: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS1.p1; statistics: https://arxiv.org/html/2603.23183v2#S3.T1.'
  split: 'Temporal 8:1:1 per user: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS1.p1.'
  candidates: 'Full-item ranking: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS1.p2.'
  visibility: 'Temporal split with no unseen-item protocol: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS1.p1.'
  sid: 'RQ-VAE with L codebooks of K codes over text embeddings: https://arxiv.org/html/2603.23183v2#S3.SS2.SSS1.p1; numerical
    L, K not found.'
  inference_budget: 'Rollout and training settings: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS3.p1 and https://arxiv.org/html/2603.23183v2#S4.SS1.SSS3.p3;
    decoding for evaluation not found.'
  results_from: 'Main: https://arxiv.org/html/2603.23183v2#S4.T2; alignment ablation: https://arxiv.org/html/2603.23183v2#S4.T3;
    general abilities: https://arxiv.org/html/2603.23183v2#S4.T4; teachers: https://arxiv.org/html/2603.23183v2#S4.T5.'
related:
- id: lc-rec
  relation: competitor
  note: LC-Rec aligns an LLM to SIDs with multi-task tuning; SIDReasoner enriches SID-language alignment with teacher-written
    corpora and adds reasoning activation and GRPO.
  where: 'SIDReasoner v2, generative baselines: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS2.p1; Table 2: https://arxiv.org/html/2603.23183v2#S4.T2;
    multi-task alignment is ablation S1 in Table 3: https://arxiv.org/html/2603.23183v2#S4.T3.'
- id: letter
  relation: competitor
  note: LETTER improves the tokenizer; SIDReasoner keeps RQ-VAE IDs and changes how the LLM reasons over them.
  where: 'SIDReasoner v2, generative baselines: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS2.p1; Table 2: https://arxiv.org/html/2603.23183v2#S4.T2.'
- id: tiger
  relation: competitor
  note: TIGER predicts SIDs directly with a small generator; SIDReasoner reasons in language before predicting SIDs.
  where: 'SIDReasoner v2, generative baselines: https://arxiv.org/html/2603.23183v2#S4.SS1.SSS2.p1; Table 2: https://arxiv.org/html/2603.23183v2#S4.T2.'
- id: onerec-think
  relation: alternative
  note: OneRec-Think also interleaves reasoning with itemic tokens; SIDReasoner relies on enriched SID-language alignment
    and outcome-reward GRPO.
  where: 'SIDReasoner v2, Sections 1 and 2.2 cite OneRec-Think: https://arxiv.org/html/2603.23183v2#S1.p2 and https://arxiv.org/html/2603.23183v2#S2.SS2.p2;
    not a baseline in Table 2.'
