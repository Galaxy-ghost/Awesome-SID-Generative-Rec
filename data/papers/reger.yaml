summary: Personalized recommendation depends on learning semantic and collaborative relations among items from online content
  and user interactions. Generative recommendation (GR) offers a promising paradigm by autoregressively generating discrete
  semantic IDs (SIDs) of items. However, randomly initialized SID token embeddings and GR models trained from scratch do not
  directly inherit the semantic relations inherent in items, while inter-item collaborative relations are learned largely
  implicitly through token-level attention and next-token supervision. To address this limitation, we propose REGER, a unified
  framework that explicitly incorporates inter-item relations into semantic pretraining, history encoding, and SID generation.
  We pretrain the GR model through generative semantic retrieval, enabling it to inherit inter-item semantic similarity by
  learning to generate semantic neighbors' SIDs. We combine global attention with local attention aligned with SID boundaries
  to capture historical context and directed transitions between adjacent items. We further develop a theoretical framework
  for hierarchical preference decomposition over the SID prefix tree, proving an exact factorization of collaborative preference
  distributions and a weighted decomposition of item-level KL divergence into prefix-conditional KL divergences. Building
  on this analysis, we distill a discriminative teacher's full conditional distributions over all legal next tokens at ground-truth
  prefixes along the target SID path, jointly optimizing this objective with cross-entropy. Extensive experiments on real-world
  datasets demonstrate consistent improvements over existing GR baselines and support the effectiveness of the proposed preference
  distillation.
setup:
  datasets: Amazon Reviews 2014 Beauty/Sports/Toys and 2023 Instruments/Scientific/Games; 5-core filtering and maximum history
    20 items.
  split: 'Per-user chronological leave-one-out: latest interaction test, second latest validation, all earlier interactions
    training.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. GSR semantic neighbors are drawn from the item catalog; tokenizer
    and frozen DuoRec teacher exposure to test items/interactions not explicitly separated.
  sid: RQ-VAE on Sentence-T5 embeddings reduced to 128 dimensions by PCA/whitening; semantic level count and codebook sizes
    not reported in paper. Extra token distinguishes identical semantic codes; suffix vocabulary size/assignment not reported.
    Dataset-specific SID mapping shared across recommender seeds.
  inference_budget: 'Unconstrained beam 20 for validation/test, without teacher; teacher ablation uses beam 50. Recall/NDCG@5/10.
    Table 4 efficiency probe on TIGER+HCPD: one L40, FP32, test batch 256, KV cache off, 16 s for full Beauty test set. REGER-specific
    absolute inference time and general inference batch/hardware not reported.'
  results_from: 'Table 1: 2014 comparisons with reproduced baselines, three seeds 2024/2025/2026; Table 2: training objectives
    on TIGER; Table 3: REGER ablations. Table 6: 2023 results, with published baseline rows from Latte, OMEGA, DECOR and TopoTok
    papers.'
