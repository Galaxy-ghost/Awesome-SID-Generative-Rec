objective: NTP
inference: Beam
poi: false
summary: 'Abstract: "training instability, stemming from insufficient gradient propagation"; "inefficient SID quality assessment,
  where industrial practice still depends on costly GR training and A/B testing". Candidates: II / V (rule: tie broken by
  the majority of new designs).'
tldr: R3-VAE stabilizes residual quantization with a reference vector as semantic anchor and a dot-product rating mechanism,
  and uses two Semantic ID quality metrics as training regularizers.
tldr_zh: R3-VAE 用作为语义锚点的参考向量与点积评分机制稳定残差量化，并将两项 SID 质量指标作为训练正则项。
evidence:
- field: problem
  where: https://arxiv.org/html/2604.11440v3#abstract1 (Abstract)
  quote: training instability, stemming from insufficient gradient propagation
  reason: 'The organizer retains II over candidate V by the majority-of-new-designs rule: reference anchoring and rating-based
    stabilization address quantization, while the evaluation metrics also address assessment cost.'
- field: problem
  where: https://arxiv.org/html/2604.11440v3#abstract1 (Abstract)
  quote: inefficient SID quality assessment, where industrial practice still depends on costly GR training and A/B testing
setup:
  datasets: 'Public: Amazon Beauty, Sports, Toys, Clothing, plus LastFM and ML1M. Industrial: Toutiao interaction logs. Filtering
    rules and corpus sizes: not reported in the body.'
  split: 'not reported for the public datasets. Industrial: offline MRR plus online A/B tests for both the generative (OneRec
    framework) and CTR settings; test periods and traffic not reported.'
  candidates: not reported (full catalog versus sampled); Recall and NDCG at 10, 20, 30 on the generated top-K sequence; industrial
    generative MRR and CTR UAUC.
  visibility: warm; no unseen-item protocol is defined. The online CTR test reports cold-start click volume for existing and
    new users without defining item visibility.
  sid: 'Reference-vector-guided residual quantization VAE: inputs are projected on a learned reference vector, each layer
    assigns soft top-K weights over codewords, and the SID takes the top-weighted index per layer; a metric loss maximizes
    semantic cohesion and preference discrimination. Industrial: 3 levels x 8,192. Public: the Beauty sensitivity study fixes
    L=3 and K=256; codebook sizes for the other public runs: not reported. Collision handling: not reported (collision rates
    are measured, e.g. Table 6).'
  inference_budget: 'Industrial generative setting follows OneRec: beam search generating 512 responses for DPO, on 64 NVIDIA
    A100 GPUs. CTR setting: SIDs replace item-ID embeddings in DIN, SIM, RankMixer (batch 2,048). Public decoding settings,
    inference batch size, and latency: not reported.'
  results_from: Table 1 (Beauty, Sports, Toys) and Table 2 (LastFM, ML1M, Clothing) with SC/PD metrics; Table 3 (industrial
    generative MRR and online A/B); Tables 4-5 (CTR UAUC and online A/B); Table 6 (Beauty SID quality including collision
    rate and Gini).
