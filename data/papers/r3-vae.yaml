id: r3-vae
name: R3-VAE
title: 'R3-VAE: Reference Vector-Guided Rating Residual Quantization VAE for Generative Recommendation'
authors: Wan et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.11440
  code: https://github.com/wwqq/R3-VAE
problem: II
