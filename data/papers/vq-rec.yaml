id: vq-rec
name: VQ-Rec
title: Learning Vector-Quantized Item Representation for Transferable Sequential Recommenders
authors: Hou et al.
year: 2023
venue: WWW’23
links:
  arxiv: https://arxiv.org/abs/2210.12316
  code: https://github.com/RUCAIBox/VQ-Rec
problem: VI
stage: Tokenization
representation: Multi-Dom
tokenization: OPQ
backbone: Encoder
tokenizer: Fixed
objective: Discrim.
inference: Scoring
poi: false
tldr: VQ-Rec maps item text to discrete codes and looks up code embeddings as item representations, with contrastive pre-training
  and cross-domain fine-tuning, to loosen the binding between text and representation.
tldr_zh: VQ-Rec 将物品文本映射为离散码并查表组合码嵌入作为物品表示，配合对比预训练与跨域微调，解除文本与物品表示之间的强绑定。
evidence:
- field: problem
  where: 'https://arxiv.org/html/2210.12316v2#S1.p3 (Introduction: text representations and domain gap)'
  quote: The tight binding between text encodings and item representations might exaggerate the negative impact of the domain
    gap.
setup:
  datasets: Pre-training on five Amazon domains (Food, Home, CDs, Kindle, Movies; 1,361,408 users / 446,975 items); downstream
    on Amazon Scientific, Pantry, Instruments, Arts, Office and the cross-platform Online Retail dataset. Users and items
    with fewer than 5 interactions are filtered (following UniSRec); item text truncated to 512 tokens.
  split: 'Leave-one-out: latest item for test, the one before for validation, the rest for training; pre-train on source domains,
    then fine-tune per downstream dataset.'
  candidates: full catalog (the ground-truth item is ranked among all other items).
  visibility: warm; no unseen-item protocol is defined. Figure 4 groups test items by popularity (e.g. [0, 5) interactions
    on Office), which are low-frequency rather than strictly unseen; the inductive no-retraining claim is not separately tested.
  sid: 'OPQ codes over item text embeddings, written as (M=32) x (D=256) PQ indices in the implementation; the method section
    uses D for the number of code sets and M for the centroids per set, so the two notations do not state the same split unambiguously.
    The paper argues that K-means-trained OPQ tends to give near-uniform code distributions, which keeps collisions low; a
    rule for items sharing a code: not reported. Downstream domains re-train PQ centroids with a permutation-based code-embedding
    alignment.'
  inference_budget: 'n/a for generation (a Transformer sequence encoder scores items through pooled code embeddings; implemented
    with Faiss and RecBole). Hardware, inference batch size, and latency: not reported.'
  results_from: Table 2 (cross-domain and cross-platform comparison with ID, text, and transferable baselines); Table 3 (ablations);
    Figure 4 (popularity groups).
setup_where:
  datasets: 'Pre-training and downstream domains: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS1.p1; filtering: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS1.p2;
    statistics: https://arxiv.org/html/2210.12316v2#S2.T1.'
  split: 'Leave-one-out allocation: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS3.p1.'
  candidates: 'Ranked among all other items: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS3.p1.'
  visibility: 'Cold-start groups by popularity, inductive capability without a dedicated unseen-item test: https://arxiv.org/html/2210.12316v2#S3.SS4.SSS3.p1
    and https://arxiv.org/html/2210.12316v2#S3.SS2.p3.'
  sid: '(M=32) x (D=256) PQ indices: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS4.p1; D sets of M centroids in the method:
    https://arxiv.org/html/2210.12316v2#S2.SS2.SSS1.p3; uniform code distribution argument: https://arxiv.org/html/2210.12316v2#S2.SS2.SSS3.p1;
    domain re-training of centroids: https://arxiv.org/html/2210.12316v2#S2.SS4.SSS1.p2.'
  inference_budget: 'Discriminative ranking with Faiss and RecBole: https://arxiv.org/html/2210.12316v2#S3.SS1.SSS4.p1.'
  results_from: 'Main: https://arxiv.org/html/2210.12316v2#S3.T2; ablation: https://arxiv.org/html/2210.12316v2#S3.T3; cold-start
    groups: https://arxiv.org/html/2210.12316v2#S3.F4.'
related:
- id: actionpiece
  relation: successor
  note: ActionPiece later follows VQ-Rec in quantizing sentence embeddings with OPQ into unordered codes and merges them into
    context-dependent tokens for generation.
  where: 'Evidence is from the later ActionPiece paper, Appendix F: https://arxiv.org/html/2502.13581v3#A6.I1.i3.p1; VQ-Rec
    is a Table 4 baseline: https://arxiv.org/html/2502.13581v3#S3.T4.'
- id: lc-rec
  relation: successor
  note: LC-Rec later borrows VQ-Rec's idea of learned discrete indices for items and builds RQ indices for LLM tuning.
  where: 'Evidence is from the later LC-Rec paper, Section 3.2.1: https://arxiv.org/html/2311.09049v4#S3.SS2.SSS1.p1 and https://arxiv.org/html/2311.09049v4#S3.SS2.SSS1.p4.'
- id: utgrec
  relation: alternative
  note: UTGRec later compares against VQ-Rec for cross-domain transfer and replaces PQ codes with a universal tree tokenizer
    for generative recommendation.
  where: 'Evidence is from the later UTGRec paper: content-based baselines and Table 2: https://arxiv.org/html/2504.04405v3#S3.SS1.SSS2.p11
    and https://arxiv.org/html/2504.04405v3#S3.T2.'
