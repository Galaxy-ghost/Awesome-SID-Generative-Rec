id: gmc
name: GMC
title: Generative Multi-Target Cross-Domain Recommendation
authors: Jin et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2507.12871
  code: null
problem: VI
stage: Tokenization
representation: Cross-Dom
tokenization: Unified RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
tldr: GMC assigns domain-shared Semantic IDs with a domain-aware contrastive loss and trains one sequence-to-sequence generator
  across domains, instead of relying on users or items shared between domains.
tldr_zh: GMC 用域感知对比损失分配跨域共享 SID，并在多个域上训练单一序列到序列生成器，不依赖域间重叠的用户或物品。
evidence:
- field: problem
  where: https://arxiv.org/html/2507.12871v3#abstract1
  quote: may be unavailable in non-overlapped recommendation scenarios
setup:
  datasets: 'Multi-target cross-domain task on five Amazon 2018 Reviews subsets: Scientific, Pantry, Instruments, Arts, Office.
    Items without titles are removed and 5-core filtering is applied to users and items; sequences capped at 20 items. Sizes
    (users / items): 8,317 / 4,344; 13,073 / 4,897; 24,772 / 9,922; 45,141 / 20,956; 86,554 / 25,847.'
  split: 'Per-user leave-one-out: last item for test, second latest for validation, the rest for training; results reported
    per domain and as a user-weighted average.'
  candidates: full catalog (the target item is ranked over the entire item set).
  visibility: warm; no unseen-item protocol is defined.
  sid: '4-level RQ-VAE x 256 codewords (dimension 32) over LLaMA-3.1-8B text embeddings (D=4,096), with a codebook shared
    across domains and a domain-aware contrastive loss; first-level codes separate domains and deeper levels are shared. Collision
    handling: not reported.'
  inference_budget: 'Beam size 20 for item generation; T5-small backbone with domain-specific LoRA. Recall and NDCG at K=5
    and 10. Hardware, inference batch size, and latency: not reported.'
  results_from: Table 3 (five domains and user-weighted average versus ID, ID-text, pre-training, and generative baselines);
    Table 4 (ablations); Figures 3-5 (code sharing, code similarity, multi-domain settings).
setup_where:
  datasets: 'Five Amazon subsets, title filter, 5-core, length 20: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS1.p1; statistics:
    https://arxiv.org/html/2507.12871v3#S5.T2.'
  split: 'Leave-one-out allocation: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS3.p1.'
  candidates: 'Ranking over the entire item set: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS3.p1.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS3.p1.'
  sid: 'L=4 x N=256, d=32, LLaMA-3.1 4,096-dimensional embeddings, shared codebook across domains: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS4.p1
    and https://arxiv.org/html/2507.12871v3#S5.SS4.SSS1.p2; no collision rule found.'
  inference_budget: 'Beam size 20: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS4.p2; T5-small backbone: https://arxiv.org/html/2507.12871v3#S5.SS1.SSS4.p2.'
  results_from: 'Main: https://arxiv.org/html/2507.12871v3#S5.T3; ablation: https://arxiv.org/html/2507.12871v3#S5.T4; code
    analysis: https://arxiv.org/html/2507.12871v3#S5.F3 and https://arxiv.org/html/2507.12871v3#S5.F4; domain settings: https://arxiv.org/html/2507.12871v3#S5.F5.'
related:
- id: tiger
  relation: competitor
  note: TIGER learns one-domain RQ-VAE identifiers; GMC learns a domain-shared codebook with a domain-aware contrastive loss
    and adds domain-specific LoRA tuning to a unified generator.
  where: 'GMC v3, generative baselines: https://arxiv.org/html/2507.12871v3#S5.I1.i4.I1.i2.p1; Table 1 comparison: https://arxiv.org/html/2507.12871v3#S3.T1;
    Table 3: https://arxiv.org/html/2507.12871v3#S5.T3.'
- id: vq-rec
  relation: competitor
  note: VQ-Rec transfers across domains through vector-quantized codes for a discriminative model, pre-trained here on the
    five target domains; GMC generates shared semantic identifiers.
  where: 'GMC v3, pre-training baselines with the adapted setting: https://arxiv.org/html/2507.12871v3#S5.I1.i3.p1 and https://arxiv.org/html/2507.12871v3#S5.I1.i3.I1.i2.p1;
    Table 3: https://arxiv.org/html/2507.12871v3#S5.T3.'
- id: cid
  relation: competitor
  note: P5-CID builds collaborative identifiers by spectral clustering within a domain; GMC builds semantic identifiers shared
    across domains.
  where: 'GMC v3, generative baselines: https://arxiv.org/html/2507.12871v3#S5.I1.i4.I1.i1.p1; Table 3: https://arxiv.org/html/2507.12871v3#S5.T3.'
- id: idgenrec
  relation: competitor
  note: IDGenRec learns textual IDs with an ID generator; GMC quantizes LLM embeddings into codebook IDs shared across domains.
  where: 'GMC v3, generative baselines: https://arxiv.org/html/2507.12871v3#S5.I1.i4.I1.i3.p1; Table 3: https://arxiv.org/html/2507.12871v3#S5.T3.'
