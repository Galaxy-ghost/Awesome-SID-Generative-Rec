id: spacetime-gr
name: Spacetime-GR
title: 'Spacetime-GR: A Spacetime-Aware Generative Model for Large Scale Online POI Recommendation'
authors: Lin et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2508.16126
  code: null
problem: I
stage: Backbone
representation: Geo
tokenization: Geo-Idx
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → DPO
inference: Beam
poi: true
summary: 工业版本以二元地理标识生成完整POI，映射原文明确一一对应；表值限生成推荐分支。
tldr: Spacetime-GR indexes POIs with a geographic hierarchy, encodes spatiotemporal context into action sequences, adds multimodal
  POI embeddings, and post-trains for embeddings, ranking scores, and candidates.
setup:
  datasets: One year of sampled Amap actions; predict interest-based actions, discard sequences with distinct-POI/action ratio
    <0.3. Public Foursquare-NYC/TKY and Gowalla-CA follow STHGCN preprocessing, not detailed here.
  split: 'Industrial train/validation/test counts: pretraining 578M/19794/19837; SFT-alignment 31M/611K/553K. Partition construction
    and public splits not reported. Alignment probe uses last 5 POI actions as targets, earlier actions as context.'
  candidates: Generation evaluation universe not reported. SFT/alignment test requests average 10.6 provided POIs; candidate
    selection and historical-item exclusion not reported.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Industrial: two tokens, 5km x 5km block plus within-block POI index; one-to-one mapping, total vocabulary reduced
    from 100M to 400K. Public experiments use a single-level index; codebooks n/a.'
  inference_budget: Generate 10 blocks x 10 inner IDs, rank 100 POIs. Generation hardware, batch size and latency not reported.
    T4 latency 10-20ms applies to SFT representation/ranking services.
  results_from: 'Tables 5/9: aligned industrial generation; Table 7: pretraining ablation; Table 6: public next-POI accuracy.
    Table 5 judges 800 requests with LLMs and seven volunteers; public-baseline score provenance not reported.'
setup_where:
  datasets: 'Sections 3.2.1/4.2.1: https://arxiv.org/html/2508.16126v1#S3.SS2.SSS1.p1 and https://arxiv.org/html/2508.16126v1#S3.SS2.SSS1.Px1.SPx1.p1
    and https://arxiv.org/html/2508.16126v1#S3.SS2.SSS1.Px1.SPx2.p3 and https://arxiv.org/html/2508.16126v1#S4.SS2.SSS1.p1'
  split: 'Table 3 and Section 5.1.3: https://arxiv.org/html/2508.16126v1#S4.T3 and https://arxiv.org/html/2508.16126v1#S5.SS1.SSS3.p1'
