  results_from: 'Public: https://arxiv.org/html/2602.10411v2#S5.T2; industrial: https://arxiv.org/html/2602.10411v2#S5.T3;
    ablation: https://arxiv.org/html/2602.10411v2#S5.T4; SID evaluation: https://arxiv.org/html/2602.10411v2#S5.T5; CPT: https://arxiv.org/html/2602.10411v2#S5.T6;
    scaling: https://arxiv.org/html/2602.10411v2#S5.SS6.p2; online: https://arxiv.org/html/2602.10411v2#S5.SS9.p2.'
related:
- id: oneloc
  relation: competitor
  note: OneLoc injects geography into the SID input embedding and adds geographic rewards; GeoGR builds geo-aware SIDs from
    geographically constrained co-visitation and refines them with an EM loop tied to the LLM.
  where: 'GeoGR v2, Table 2 (POI baseline) and Table 3 (strongest industrial baseline): https://arxiv.org/html/2602.10411v2#S5.T2
    and https://arxiv.org/html/2602.10411v2#S5.T3; discussion in Section 5.2.2: https://arxiv.org/html/2602.10411v2#S5.SS2.SSS2.p3.'
- id: gnpr-sid
  relation: competitor
  note: GNPR-SID builds POI semantic IDs for next-POI generation; GeoGR follows its preprocessing and adds co-visitation alignment,
    EM-style SID refinement, and CPT plus SFT.
  where: 'GeoGR v2, follows the GNPR-SID preprocessing: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p2; Tables 2, 3, 5,
    and 6: https://arxiv.org/html/2602.10411v2#S5.T2, https://arxiv.org/html/2602.10411v2#S5.T3, https://arxiv.org/html/2602.10411v2#S5.T5,
    https://arxiv.org/html/2602.10411v2#S5.T6.'
- id: tiger
  relation: competitor
  note: TIGER uses content RQ-VAE SIDs with a small Transformer; GeoGR uses geo-aware RQ-Kmeans SIDs with an LLM aligned through
    continued pre-training.
  where: 'GeoGR v2, Tables 2 and 3: https://arxiv.org/html/2602.10411v2#S5.T2 and https://arxiv.org/html/2602.10411v2#S5.T3.'
- id: onerec
  relation: predecessor
  note: GeoGR adopts OneRec's RQ-Kmeans tokenization and adds geographic co-visitation signals and EM-style refinement.
  where: 'GeoGR v2, Section 4.1 adopts the RQ-Kmeans strategy of Deng et al. (2025): https://arxiv.org/html/2602.10411v2#S4.SS1.p1.'
