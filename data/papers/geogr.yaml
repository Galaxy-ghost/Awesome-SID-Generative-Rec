id: geogr
name: GeoGR
title: 'GeoGR: Enabling Spatio-Temporal Aware Industrial-Scale Generative POI Recommendations'
authors: Wang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2602.10411
  code: null
problem: I
stage: Representation
representation: Text+Geo+CF
tokenization: R-KM+EM
backbone: Dec-Only
tokenizer: Altern.†
objective: Multi-task NTP
inference: Beam
poi: true
summary: 'Abstract: "inadequate modeling of high-quality SIDs that capture cross-category spatio-temporal collaborative relationships";
  "poor alignment between large language models (LLMs) and the POI recommendation task". I and III tie, and so do the new
  designs; the title ("Enabling Spatio-Temporal Aware ...") names I.'
evidence:
- field: problem
  where: arXiv:2602.10411v2, title and abstract
  quote: inadequate modeling of high-quality SIDs that capture cross-category spatio-temporal collaborative relationships
    … poor alignment between large language models (LLMs) and the POI recommendation task … Enabling Spatio-Temporal Aware
    ...
  reason: I and III tie, and so do the new designs; the title ("Enabling Spatio-Temporal Aware ...") names I.
- field: stage
  where: Eq. (4), p4
  reason: The fix for I is contrastive representation learning on geo-constrained co-visit pairs (L_P2P); the EM-style SID
    refinement and CPT lean to III.
- field: tokenizer
  where: §4.1.3, Algorithm 1, p5; §4.2.1, p5
  quote: mutual alignment between the LLM and the SIDs
  reason: The EM algorithm updates the LLM and the SIDs in turns for "mutual alignment between the LLM and the SIDs"; the
    final recommender is retrained from the base LLM on the fixed SIDs, hence inferred.
setup:
  datasets: 'Foursquare NYC and TKY (11 months of check-ins; POIs with fewer than 10 interactions and users with fewer than
    10 check-ins removed, following GNPR-SID; 2,083 users / 5,135 POIs and 2,293 / 7,873), and AMAP industrial data: AMAP
    (one day of platform-wide traffic with users'' traced histories; 7,536K users / 34,119K POIs) and AMAP-SH (one month in
    Shanghai; 4,820K users / 910K POIs). Industrial filtering rules: not reported.'
  split: 'NYC and TKY: records sorted by time and split 80% / 10% / 10% into training, validation, and test. AMAP: one day
    for training and 1 million records randomly sampled from the following day for testing. AMAP-SH: last day held out for
    testing. Online: three-month A/B test against the legacy multi-stage retrieval.'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-k SIDs come from beam search.
  visibility: warm; no unseen-item protocol is defined.
  sid: 3 RQ-Kmeans layers over Qwen-4B POI embeddings with geographic co-visitation alignment; codebook size stated as 32
    and 64 for NYC and TKY, respectively, and 4,096 for AMAP and AMAP-SH. SIDs are refined by an EM-style loop with the LLM,
    using a 20-candidate dynamic beam to prevent SID collisions; a final collision-resolution rule is not reported.
  inference_budget: 'Offline: beam search for the top-k SIDs; numerical beam width not reported. Online: dynamic beam search
    generating 50 candidate SIDs per request; GeoGR-0.6B averages 50 ms per request on NVIDIA H20 GPUs versus 90 ms for GeoGR-4B;
    inference batch size not reported. Training on 16 H20 GPUs with per-GPU batch 16.'
  results_from: Table 2 (NYC, TKY versus traditional, POI, and generative baselines); Table 3 (AMAP, AMAP-SH); Table 4 (ablation);
    Table 5 (SID quality); Table 6 (CPT effect); Section 5.6 (model scaling); Table 7 and Section 5.9 (three-month online
    A/B test).
setup_where:
  datasets: 'Datasets and filtering: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p1 and https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p2;
    statistics: https://arxiv.org/html/2602.10411v2#S5.T1.'
  split: 'Splits: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p2; online test: https://arxiv.org/html/2602.10411v2#S5.SS9.p2.'
  candidates: 'Metrics only: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS2.p1.'
  visibility: 'Temporal splits with no unseen-POI protocol: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p2.'
  sid: 'Three RQ-Kmeans layers and codebook sizes: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS4.p1 and https://arxiv.org/html/2602.10411v2#S4.SS1.SSS2.p2;
    RQ-Kmeans following OneRec: https://arxiv.org/html/2602.10411v2#S4.SS1.p1; EM refinement with 20-candidate beam to avoid
