tldr: GRID provides an open-source modular framework with swappable Semantic ID tokenizers, backbones, and decoding rules
  to ablate design choices on public benchmarks.
tldr_zh: GRID 提供开源模块化框架，支持自由替换 SID 编号器、生成骨干与解码策略，并在公开基准上系统消融各组件的设计选择。
evidence:
- field: problem
  where: https://arxiv.org/html/2507.22224v1#abstract1
  quote: the absence of an open-source, unified framework hinders systematic benchmarking and extension
- field: tokenization
  where: §4.1, p3
  reason: R-KM is the paper's RK-Means, (L, W) = (3, 256).
setup:
  datasets: '5-core filtered Amazon Beauty, Sports, and Toys; item text from Title, Categories, Description, and Price. Retained
    corpus sizes: not reported in the body.'
  split: 'Per-user leave-last-out: last item for test, second-to-last for validation, the rest for training; sliding-window
    training samples; averages over 5 seeds.'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-K lists from beam search.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Benchmark default: RK-Means with 3 levels x 256 tokens over mean-pooled Flan-T5-XL embeddings; also R-VQ and RQ-VAE,
    and L x W variants (e.g. 3 x 128, 3 x 512, 2 x 256). Collisions: Table 7 compares TIGER-style appended-digit de-duplication
    with randomly selecting one item when SIDs conflict; which one is the default setting is not stated.'
  inference_budget: 'Beam search with KV cache; constrained and unconstrained beam compared (Table 8), with unconstrained
    stated to be cheaper; numerical beam width not reported. Tokenizers trained on 8 GPUs (per-device batch 2,048); generator
    training batch 256; inference hardware, batch size, and latency: not reported.'
  results_from: Tables 1-3 (tokenizer algorithm, encoder size, codebook dimensions); Tables 4-8 (user tokens, encoder-decoder
    versus decoder-only, augmentation, SID de-duplication, constrained versus free-form beam). Tables 3 and 4 cover Beauty
    only; the other tables cover Beauty, Sports, and Toys; results average 5 seeds.
setup_where:
  datasets: '5-core Amazon datasets and text features: https://arxiv.org/html/2507.22224v1#S4.p2.'
  split: 'Leave-last-out allocation and 5 seeds: https://arxiv.org/html/2507.22224v1#S4.p2.'
  candidates: 'Metrics only: https://arxiv.org/html/2507.22224v1#S4.p2.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2507.22224v1#S4.p2.'
  sid: 'Default RK-Means (3, 256) with Flan-T5-XL: https://arxiv.org/html/2507.22224v1#S4.SS1.p1; dimension study: https://arxiv.org/html/2507.22224v1#S3.T3;
    de-duplication strategies: https://arxiv.org/html/2507.22224v1#S4.SS2.p5 and https://arxiv.org/html/2507.22224v1#S4.T7.'
  inference_budget: 'Beam search with KV cache: https://arxiv.org/html/2507.22224v1#S3.SS1.p3; constrained versus free-form
    beam: https://arxiv.org/html/2507.22224v1#S4.SS2.p6 and https://arxiv.org/html/2507.22224v1#S4.T8; tokenizer GPUs: https://arxiv.org/html/2507.22224v1#S4.p2.'
  results_from: 'Tables 1-8: https://arxiv.org/html/2507.22224v1#S3.T1, https://arxiv.org/html/2507.22224v1#S3.T2, https://arxiv.org/html/2507.22224v1#S3.T3,
    https://arxiv.org/html/2507.22224v1#S4.T4, https://arxiv.org/html/2507.22224v1#S4.T5, https://arxiv.org/html/2507.22224v1#S4.T6,
    https://arxiv.org/html/2507.22224v1#S4.T7, https://arxiv.org/html/2507.22224v1#S4.T8.'
