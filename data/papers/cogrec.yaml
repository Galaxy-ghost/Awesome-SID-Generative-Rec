id: cogrec
name: CogRec
title: 'CogRec: Structure-Cognitive Fast-and-Slow Reasoning for Generative Recommendation'
authors: Liu et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2607.24402
  code: https://github.com/caskcsg/CogRec
problem: III
stage: Tokenization
representation: Text
tokenization: R-KM+Graph
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: CoT+C-Beam
poi: false
summary: 用SID拓扑生成结构化推理轨迹，解决自然语言推理与标识空间脱节。
setup:
  datasets: 'Amazon Reviews 2014: Beauty, Sports, Toys; user/item filtering not reported.'
  split: 'Chronological per-user leave-one-out: last interaction test, penultimate validation, remainder training. Direct
    evaluation uses the complete test set; default CoT uses a predefined subset, with separate full-test CoT evaluation.'
  candidates: not reported; all generative variants share a trie containing the complete valid four-layer candidate-item SID
    set, but evaluation catalog size/sampling and history exclusion are not specified.
  visibility: warm; no unseen-item protocol is defined. The SID mapping and topology are shared across training stages.
  sid: BGE-base-en-v1.5 metadata embeddings (title/description/category), 768 dimensions and L2 normalization; residual K-means,
    4 layers x 256 codes, 30 iterations/layer; 1,024 layer-specific tokens plus 2 boundary tokens. Intra-layer top-16 centroid
    graphs retain cosine >=0.15 edges; the mapping/topology is fixed across later stages. Collision handling not reported.
  inference_budget: Qwen3-1.7B; trie-constrained SID beam 10, temperature 0.6, top-p 1.0, max 8 new SID tokens. Reasoning
    samples 5 traces (temperature 1.5, top-p 0.95), up to 50 trace-conditioned SID hypotheses. Full-test CoT alone tail-truncates
    histories to Beauty/Sports/Toys 21/20/18 items. Reasoning-token cap, inference hardware/batch size and latency not reported;
    A800 GPUs are specified for training.
  results_from: Own CogRec experiments and controlled OneRec-Think Direct/CoT reproductions (Table 4/Figure 3); Table 3 mostly
    imports cited baseline scores, including standalone LETTER from RAGR and OneRec-Think from its original paper. Cross-source
    baselines do not share a guaranteed identical implementation/protocol.
setup_where:
  datasets: https://arxiv.org/html/2607.24402v1#S4.SS1.SSS1.p1
  split: 'https://arxiv.org/html/2607.24402v1#S4.SS1.SSS1.p1 ; #S4.SS1.SSS3.p3'
  candidates: 'https://arxiv.org/html/2607.24402v1#S4.SS1.SSS2.p1 ; #S4.SS1.SSS3.p1'
  visibility: 'https://arxiv.org/html/2607.24402v1#S4.SS1.SSS1.p1 ; #S3.SS5.p2'
  sid: 'https://arxiv.org/html/2607.24402v1#S4.SS1.SSS4.p1 ; #S4.SS1.SSS4.p2 ; #S3.SS5.p2'
  inference_budget: 'https://arxiv.org/html/2607.24402v1#S3.T1 ; #S4.SS1.SSS3.p2 ; #S4.SS1.SSS3.p3'
  results_from: 'https://arxiv.org/html/2607.24402v1#S4.SS3.p2 ; #S4.SS2.p4 ; #S4.SS5.p1'
