related:
- id: tiger
  relation: competitor
  note: TIGER is trained with point-wise next-item prediction; GenRec trains on page-wise target lists with a decoder-only
    LLM and aligns it with GRPO-SR.
  where: 'GenRec v1, Section 3.1 baselines: https://arxiv.org/html/2604.14878v1#S3.SS1.p1; Table 1: https://arxiv.org/html/2604.14878v1#S3.T1.'
- id: lc-rec
  relation: competitor
  note: LC-Rec also fine-tunes an LLM on SIDs but with point-wise NTP; GenRec adds page-wise supervision, a token merger,
