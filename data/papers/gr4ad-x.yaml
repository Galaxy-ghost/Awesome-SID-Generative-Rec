id: gr4ad-x
name: GR4AD-X
title: Towards Reliable, Scalable, and Value-Aligned Generative Recommendation for Large-Scale Advertising
authors: Xiao et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.38378
  code: null
problem: III
stage: Tokenization
representation: –
tokenization: Multi-Path R-KM+Hash
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + PV-RSPO + Rank + Aux.
inference: PV-Beam+Rerank
poi: false
tldr: GR4AD-X extends GR4AD for advertising with multi-path Semantic ID assignment, capacity scaling beyond wider or deeper
  backbones, and value-guided generation with beam pruning and discriminative reranking.
tldr_zh: GR4AD-X 面向广告场景扩展 GR4AD，结合多路径 SID 分配、不单纯加宽加深骨干的容量扩展，以及带束剪枝和判别式重排的价值引导生成。
setup:
  datasets: Kuaishou production advertising; 7.556M advertisement embeddings in the SID analysis. Dates and filtering rules
    not reported.
  split: Offline train/validation/test split not reported; each online variant receives a random 5% traffic share for seven
    days.
  candidates: not reported; value-alignment analysis uses final-ranking candidates from sampled online requests, without a
    full-catalog or sampled-negative protocol.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Two paths per advertisement, each with three levels: first-level RQ-KMeans 16384 centroids, second-level RQ-KMeans
    size not reported, final non-semantic feature hash size not reported. Collision disambiguation not reported; repeated
    retrieved advertisements are deduplicated by their highest-scoring path.'
  inference_budget: Beam 512; PV-BeamSearch expands to 1024 before pruning at SID levels >=2, followed by advertisement deduplication
    and reranking. Serving exceeds 500 QPS per NVIDIA L20 GPU with end-to-end latency below 100 ms; inference batch size not
    reported.
  results_from: 'Original Table 1: cumulative online revenue versus deployed GR4AD; Table 2: scaling/QPS; Table 3: value alignment;
    Figure 3: SID analysis.'
setup_where:
  datasets: 'Section 4.2 and Appendix A: https://arxiv.org/html/2610.38378v1#S4.SS2.p2 and https://arxiv.org/html/2610.38378v1#A1.SS0.SSS0.Px1.p1'
  split: 'Appendix A: https://arxiv.org/html/2610.38378v1#A1.SS0.SSS0.Px2.p1'
