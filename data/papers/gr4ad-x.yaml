summary: 'Generative recommendation (GR) reformulates item retrieval as autoregressive generation of discrete semantic identifiers
  (SIDs), offering a unified paradigm for personalized recommendation. GR4AD, as an industrial generative recommendation framework,
  has greatly improved advertising revenue while enabling efficient real-time serving in Kuaishou.However, continued deployment
  has exposed three limitations: deterministic SID assignment remains sensitive to semantic boundaries; conventional backbone
  scaling provides diminishing revenue gains under strict serving constraints; and sequence-level value optimization provides
  limited credit assignment to intermediate SID decisions, causing likelihood-based beam search to prematurely prune potentially
  high-value candidates. We present GR4AD-X, which addresses these limitations through reliable SID construction, serving-efficient
  capacity scaling, and unified value alignment. Specifically, GR4AD-X improves SID reliability through Multi-Path assignment.
  It expands model capacity along multiple complementary dimensions rather than relying solely on wider or deeper backbones,
  achieving a better effectiveness-efficiency trade-off under strict serving constraints. Finally, Unified Value-Guided Generation
  and Discrimination (UniVGD) aligns generation with commercial value through prefix-level reward optimization, value-guided
  beam pruning, and discriminative reranking within a unified model. Large-scale online A/B tests on the Kuaishou advertising
  platform demonstrate that GR4AD-X achieves a cumulative revenue improvement of 3.07% over the deployed GR4AD baseline while
  satisfying strict latency and throughput constraints.'
