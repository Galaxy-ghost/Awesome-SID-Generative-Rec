id: tlow
name: Tlow
title: 'Tlow: Flow-based Item Tokenizer for Recommendation'
authors: Li et al.
year: 2026
venue: CIKM’26 Applied
links:
  arxiv: https://arxiv.org/abs/2608.24176
  code: https://github.com/wjjln/Tlow
problem: I
stage: Tokenization
representation: Text
tokenization: Flow+PQ
backbone: Non-AR
tokenizer: Fixed
objective: MTP + Rel.MSE
inference: Scoring
poi: false
tldr: Tlow maps semantic embeddings with a normalizing flow into a standard normal latent space before independent quantization,
  and aligns codebook and token embedding spaces, unlike RQ-VAE or OPQ.
tldr_zh: Tlow 在独立量化前用归一化流将语义嵌入映射到标准正态隐空间，并对齐码本与 token 嵌入空间，区别于 RQ-VAE 和 OPQ。
setup:
  datasets: Amazon Reviews Sports/Beauty/Toys/CDs; processed Cloth-Sports cross-domain data. WeChat picture/article logs for
    online multimodal retrieval. Filtering not reported.
  split: 'Public: chronological last item test, penultimate validation, earlier interactions train. Online holdout protocol
    and A/B duration not reported; two weeks refers to model training.'
  candidates: full catalog for offline ranking; historical-item exclusion not reported
  visibility: 'Offline: warm; no unseen-item protocol is defined. Cold analysis bins targets by training frequency. Online
    cold pictures are exposed on publication day; generator/tokenizer exclusion not reported. Tokenizer fits about 1M items,
    then encodes additional unseen items.'
  sid: 'Flow plus independent PQ: C in {16,32,64,96,128}, 256 codes each; selected C per offline dataset not reported. Online:
    16 x 256. Collision handling not reported.'
  inference_budget: Single-forward parallel token scoring, Recall/NDCG@5/10; temperature searched over 0.03/0.05/0.07. Recommendation
    hardware, batch size and latency not reported. Online tokenization of tens of millions of new items takes minutes on one
    unspecified GPU, not per-request serving time.
  results_from: 'Tables 2/4/5/6: general/cross-domain/multimodal/online results. General comparison reuses RPG-paper baseline
    scores and reruns RPG; main semantic embeddings are sentence-t5-base.'
setup_where:
  datasets: 'Sections 3.1.1/3.6.1: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS1.p1 and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS1.p1'
  split: 'Sections 3.1.1/3.6.2: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS1.p2 and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS2.p1'
  candidates: 'Section 3.1.3: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS3.p1'
  visibility: 'Sections 3.5/3.6.2/3.6.3: https://arxiv.org/html/2608.24176v1#S3.SS5.p1 and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS2.p1
    and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS3.p1'
  sid: 'Sections 3.1.4/3.6.2: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS4.p1 and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS2.p1'
  inference_budget: 'Sections 3.1.4/3.6.1/3.6.2: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS4.p1 and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS1.p1
    and https://arxiv.org/html/2608.24176v1#S3.SS6.SSS2.p1'
  results_from: 'Section 3.1.4 and Tables 2/4/5/6: https://arxiv.org/html/2608.24176v1#S3.SS1.SSS4.p1 and https://arxiv.org/html/2608.24176v1#S3.T2
