summary: 新增可区分的 FP8 PTQ 与执行栈/算子设计，适合单独 V × Inference 条目，而非只重复 OneRec-V2。
tldr: OneRec-V2-Quantized applies low-precision floating-point post-training quantization and an optimized inference stack
  to OneRec-V2, whose weight and activation statistics resemble LLMs more than traditional recommenders.
tldr_zh: OneRec-V2-Quantized 针对 OneRec-V2 权重与激活分布更接近 LLM 而非传统推荐模型的特点，引入低精度浮点后训练量化与优化的推理栈。
setup:
  datasets: Production single-column short-video recommendation; online evaluation on Kuaishou and Kuaishou Lite. Dataset
    dates, sizes and filtering not reported.
  split: Offline split not reported; online A/B runs one week, traffic allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: not reported
  inference_budget: '4B fat-MoE, 0.5B active/token, batch 32. FP16 baseline versus FP8 Linear/MoE (Linear accumulation FP32):
    139ms to 70ms mean latency; throughput 205 to 394, units not reported. GPU model, beam width and output K not reported.'
  results_from: 'Original Section 5.2/Figure 3: FP16 versus combined infrastructure/FP8/operator optimization; Table 1: online
    quality. The full 49% latency reduction and 92% throughput gain include all three changes.'
