id: hf-sid
name: HF-SID
title: 'HF-SID: High-Fidelity Semantic IDs for Generative Retrieval in Location-Based Services'
authors: Lin et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2608.30479
  code: null
problem: I
stage: Representation
representation: Text+Attr+Geo
tokenization: R-KM
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: true
tldr: HF-SID restores geographic, numerical, and structural detail in POI representations before quantization, through Cartesian
  coordinates, unit-encoded numbers, and residual contrastive learning, instead of lengthening the Semantic ID.
tldr_zh: HF-SID 在量化前通过笛卡尔坐标、带单位数值编码与残差对比学习恢复 POI 表示中的地理、数值与结构细节，无需加长 SID。
setup:
  datasets: 'AMap-L (one day), AMap-S; remove POIs without interaction sequences and sessions without authenticated users.
    Foursquare NYC/TKY use Geo-CPT only; public-data filtering: not reported.'
  split: not reported; methods share identical splits.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer fits representations of the entire POI corpus.
  sid: '3-level RQ-KMeans with last-residual contrastive refinement: 4096 codes/level on AMap-L, 512 on AMap-S. Public-data
    codebook sizes and collision materialization: not reported.'
  inference_budget: 'Valid-SID trie-constrained beam 300; Hit@200/300 on AMap, @5 on NYC/TKY. General experiments: 64 A100
    GPUs; inference allocation, batch size, latency: not reported.'
  results_from: 'Original Tables 2/3/4/5/6: AMap comparison, ablation, numerical fidelity, public datasets, one-week online
    A/B.'
setup_where:
  datasets: 'Sections 4.1 and 4.5: https://arxiv.org/html/2608.30479v1#S4.SS1.p1 and https://arxiv.org/html/2608.30479v1#S4.SS5.p1'
  split: 'Section 4.1 mentions identical baseline splits without specifying allocation: https://arxiv.org/html/2608.30479v1#S4.SS1.p2'
  candidates: 'Sections 3.4 and 4.1 describe valid-SID generation but no full-catalog/sampled evaluation declaration: https://arxiv.org/html/2608.30479v1#S3.SS4.p4
    and https://arxiv.org/html/2608.30479v1#S4.SS1.p3'
  visibility: 'Sections 3.4 and 4.1: https://arxiv.org/html/2608.30479v1#S3.SS4.p1 and https://arxiv.org/html/2608.30479v1#S4.SS1'
  sid: 'Sections 3.4 and 4.1: https://arxiv.org/html/2608.30479v1#S3.SS4.p3 and https://arxiv.org/html/2608.30479v1#S4.SS1.p2'
  inference_budget: 'Sections 3.4, 4.1 and Table 5: https://arxiv.org/html/2608.30479v1#S3.SS4.p4 and https://arxiv.org/html/2608.30479v1#S4.SS1.p4
    and https://arxiv.org/html/2608.30479v1#S4.T5'
  results_from: 'Tables 2-6: https://arxiv.org/html/2608.30479v1#S4.T2 and https://arxiv.org/html/2608.30479v1#S4.T3 and https://arxiv.org/html/2608.30479v1#S4.T4
