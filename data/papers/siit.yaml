id: siit
name: SIIT
title: Enhancing item tokenization for generative recommendation through self-improvement
authors: Chen et al.
year: 2024
venue: arXiv’24
links:
  arxiv: https://arxiv.org/abs/2412.17171
  code: null
problem: III
stage: Tokenization
representation: Text
tokenization: Self-Imp.
backbone: Enc-Dec
tokenizer: Altern.
objective: Multi-task NTP
inference: C-Beam
poi: false
tldr: SIIT starts from item tokenizations of any external model and periodically adjusts them to the LLM's learned patterns
  during training, so tokenization matches the LLM's internal item understanding.
tldr_zh: SIIT 从任意外部模型给出的物品编号出发，在训练过程中周期性地按 LLM 学到的模式调整编号，使物品编号匹配 LLM 内部的物品理解。
evidence:
- field: problem
  where: https://arxiv.org/html/2412.17171v1#abstract1 (Abstract; excerpt)
  quote: may not align with the LLM’s internal pretrained tokenization schema
setup:
  datasets: Amazon Instruments (24,772 users / 9,922 items), Amazon Beauty (22,363 / 12,101), and Yelp (30,431 / 20,033),
    as introduced by LETTER; users and items with fewer than 5 interactions removed.
  split: Per-user leave-one-out (most recent item for test, second-to-last for validation, the rest for training); histories
    capped at the 10 most recent items.
  candidates: full catalog (rank list generated from the entire item set without predefined candidate sets).
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Identifiers are initialized with CID, TIGER, or LETTER codes and then regenerated by the LLM itself over 2-5 iterations.
    Collisions: each item takes the first unused identifier among its top-20 beam candidates; any remaining duplicates get
    an appended token.'
  inference_budget: 'Constrained beam search over a prefix tree of all item identifiers, outputs ranked by perplexity; numerical
    beam width for recommendation: not reported. Flan-T5-Small backbone; experiments on 8 NVIDIA A100-40GB GPUs; inference
    batch size and latency: not reported.'
  results_from: Table 2 (Instruments, Beauty, Yelp versus traditional and LLM-based baselines with simple and advanced tokenization);
    Table 3 (diverse generation and collision avoidance ablation on Yelp); Table 4 (identifier similarity before and after
    refinement).
setup_where:
  datasets: 'Datasets and preprocessing following LETTER and LC-Rec: https://arxiv.org/html/2412.17171v1#S4.SS1.SSS1.p1; statistics:
    https://arxiv.org/html/2412.17171v1#S4.T1.'
  split: 'Leave-one-out allocation and 10-item cap: https://arxiv.org/html/2412.17171v1#S4.SS1.SSS1.p2.'
  candidates: 'Rank list from the entire item set: https://arxiv.org/html/2412.17171v1#S4.SS1.SSS2.p1.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2412.17171v1#S4.SS1.SSS1.p2.'
  sid: 'Self-improving identifiers initialized from CID, TIGER, or LETTER; diverse beam assignment k=20 and suffix fallback:
    https://arxiv.org/html/2412.17171v1#S3.SS3.p3, https://arxiv.org/html/2412.17171v1#S3.SS3.p4, https://arxiv.org/html/2412.17171v1#S4.I3.i3.p1.'
  inference_budget: 'Constrained beam search and perplexity ranking: https://arxiv.org/html/2412.17171v1#S3.SS4.p1; hardware:
    https://arxiv.org/html/2412.17171v1#S4.SS1.SSS4.p1.'
  results_from: 'Main: https://arxiv.org/html/2412.17171v1#S4.T2; ablation: https://arxiv.org/html/2412.17171v1#S4.T3; identifier
    similarity: https://arxiv.org/html/2412.17171v1#S4.T4.'
related:
- id: letter
  relation: competitor
  note: LETTER fixes its regularized RQ-VAE identifiers before generator training; SIIT starts from such identifiers and lets
    the LLM regenerate them iteratively with alignment tasks.
  where: 'SIIT v1, advanced-tokenization baselines and initializer: https://arxiv.org/html/2412.17171v1#S4.I3.i3.p1; data
    from LETTER: https://arxiv.org/html/2412.17171v1#S4.SS1.SSS1.p1; Table 2: https://arxiv.org/html/2412.17171v1#S4.T2.'
- id: tiger
  relation: competitor
  note: TIGER's RQ-VAE codes are both a baseline and one of SIIT's initializations, which SIIT then refines.
  where: 'SIIT v1, https://arxiv.org/html/2412.17171v1#S4.I3.i3.p1; Tables 2 and 4: https://arxiv.org/html/2412.17171v1#S4.T2
    and https://arxiv.org/html/2412.17171v1#S4.T4.'
- id: cid
  relation: competitor
  note: CID's spectral-clustering IDs (and the simple TID/SID variants) are baselines and an initializer; SIIT replaces fixed
    IDs with model-generated ones.
  where: 'SIIT v1, baselines: https://arxiv.org/html/2412.17171v1#S4.I3.i2.p1 and https://arxiv.org/html/2412.17171v1#S4.I3.i3.p1;
    Table 2: https://arxiv.org/html/2412.17171v1#S4.T2.'
- id: lc-rec
  relation: predecessor
  note: SIIT follows LC-Rec's preprocessing and its idea of aligning LLMs to item identifiers through auxiliary tasks.
  where: 'SIIT v1, Section 4.1.1 follows Zheng et al. (2024): https://arxiv.org/html/2412.17171v1#S4.SS1.SSS1.p1; Section
    5.2 related work: https://arxiv.org/html/2412.17171v1#S5.SS2.p1.'
