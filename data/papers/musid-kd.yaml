poi: false
summary: 'Generative recommendation with semantic IDs (SIDs) represents each item as a sequence of discrete tokens and autoregressively
  predicts the next item''s SID. Despite strong recommendation performance, repeated decoding over multiple SID positions
  incurs substantial inference cost. Knowledge distillation transfers knowledge from a powerful generative teacher to a lightweight
  student, yet conventional objectives do not fully account for multi-token SID generation. We identify two limitations: item-level
  distribution alignment may not adequately preserve the teacher''s ranking of candidate groups sharing SID prefixes, while
  uniform alignment across SID positions may affect final item ranking differently. We propose MuSID-KD, which combines Hierarchical
  Candidate Distribution Alignment (HCDA) and Ranking Impact Guided Levelwise Distillation (RIGD). HCDA aggregates item probabilities
  according to shared SID prefixes and aligns candidate distributions at successive levels, from candidate groups to individual
  items. RIGD evaluates the reduction in pairwise ranking surrogate loss when one student score contribution is replaced with
  the teacher''s contribution, and allocates supervision accordingly. Experiments on real-world recommendation datasets using
  three lightweight student architectures demonstrate improved recommendation accuracy and better alignment of prefix marginal
  distributions and pairwise item rankings, without modifying the student''s online inference architecture. Code is available
  at https://anonymous.4open.science/r/m7k2-review-83f9/.'
tldr: MuSID-KD distills a generative teacher into lightweight students by aligning candidate distributions at successive Semantic
  ID prefix levels and weighting supervision by ranking impact, instead of uniform alignment.
setup:
  datasets: Amazon Reviews 2014 Beauty/Toys, Amazon Reviews 2023 Video Games, and Steam-100K; histories capped at 20. Filtering
    rules not reported.
  split: Chronological leave-one-out; exact validation/test allocation not reported. Checkpoints selected by validation NDCG@10.
  candidates: 'Evaluation: not reported. The 64 teacher candidates per request are training support, not sampled evaluation
    negatives.'
  visibility: warm; no unseen-item protocol is defined. Frozen teacher encoder/token embeddings/mapping shared with students;
    additional distillation caches use training requests only. Teacher/tokenizer exposure to test items not reported.
  sid: 'Main RQ-VAE: 4 positions x 256 codes; frozen and shared teacher/student mapping. R-KMeans additionally tested. Unique
    SIDs assumed; collision handling not reported.'
  inference_budget: 'Constrained beam 50; K=5/10; student batch 32 (teacher throughput batch 64). MuSID-KD MLP/GRU/CNN: 3036/3423/3024
    requests/s; GRU/CNN serving totals 0.292/0.331 ms/request. Hardware not reported.'
  results_from: 'Original Table 1: Amazon, mean over seeds 42-44; Table S1: Steam; Figure 6: R-KMeans. KD baselines adapted
    to shared teacher/students/decoding; TIGER is a teacher reference, excluded from student comparisons.'
