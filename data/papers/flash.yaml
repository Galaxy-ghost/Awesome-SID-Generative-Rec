id: flash
name: FLASH
title: 'Rethinking Semantic ID Construction for Generative Recommendation: SimHash with Parallel Decoding and Semantic Alignment'
authors: Liu et al.
year: 2026
venue: NeurIPS’26
links:
  arxiv: https://arxiv.org/abs/2610.07402
  code: https://github.com/KevinC2015/Flash
problem: III
stage: Backbone
representation: Text
tokenization: SimHash
backbone: Non-AR
tokenizer: Fixed
objective: MTP + Aux.
inference: Scoring
poi: false
summary: 提出离散 SimHash SID 的完整生成推荐新设计。
tldr: FLASH pairs training-free SimHash Semantic IDs with parallel decoding and explicit semantic alignment, attributing the
  weakness of hashing to autoregressive decoding and rigid discretization rather than hashing itself.
setup:
  datasets: Amazon Beauty, Toys and Games, Sports and Outdoors, CDs and Vinyl; users/items with fewer than 5 interactions
    removed.
  split: 'Per-user chronological leave-last-out: last item test, penultimate validation, earlier interactions training.'
  candidates: not reported
  visibility: 'Warm main protocol; cold-start targets unseen by generator only: randomly select 5% of test-target items and
    remove all their training interactions. Tokenizer fitting n/a: fixed SimHash on precomputed text embeddings.'
  sid: 'SimHash: Beauty 32x256, Toys/Sports 64x256, CDs 64x512; collision counts analyzed, collision disambiguation not reported.'
  inference_budget: Parallel per-position probabilities cached, then candidate scores gathered/summed; K=5/10; beam n/a. Single
    NVIDIA A100 80GB for experiments; inference batch size and latency not reported.
  results_from: Original Table 1 overall results; Figure 6 cold-start. Most baseline results copied from TIGER/RPG; remaining
    baselines implemented from public code.
setup_where:
  datasets: 'Sections 3.1 and A.1: https://arxiv.org/html/2610.07402v1#S3.SS1.p1 and https://arxiv.org/html/2610.07402v1#A1.SS1.p1'
  split: 'Appendix A.1: https://arxiv.org/html/2610.07402v1#A1.SS1.p1'
  candidates: 'Section 2.3 ranks all candidate items but evaluation sampling is unspecified: https://arxiv.org/html/2610.07402v1#S2.SS3.p1
    and https://arxiv.org/html/2610.07402v1#S3.SS1.p3'
  visibility: 'Sections 2.1, 3.5 and A.4: https://arxiv.org/html/2610.07402v1#S2.SS1.p1 and https://arxiv.org/html/2610.07402v1#S3.SS5.p1
    and https://arxiv.org/html/2610.07402v1#A1.SS4.p1'
  sid: 'Section 2.1, Table 4 and collision analysis: https://arxiv.org/html/2610.07402v1#S2.SS1.p2 and https://arxiv.org/html/2610.07402v1#A1.T4
    and https://arxiv.org/html/2610.07402v1#S3.SS3.SSS1.p3'
  inference_budget: 'Sections 2.3, 3.1 and A.3: https://arxiv.org/html/2610.07402v1#S2.SS3.p2 and https://arxiv.org/html/2610.07402v1#S3.SS1.p3
    and https://arxiv.org/html/2610.07402v1#A1.SS3.p4'
  results_from: 'Sections 3.1/3.2 and Figure 6: https://arxiv.org/html/2610.07402v1#S3.SS1.p4 and https://arxiv.org/html/2610.07402v1#S3.T1
    and https://arxiv.org/html/2610.07402v1#S3.F6'
related:
- id: tiger
  relation: predecessor
  note: FLASH revisits TIGER's SimHash ablation with parallel decoding and semantic alignment.
  where: 'FLASH v1, Introduction and Table 1: https://arxiv.org/html/2610.07402v1#S1.p2; https://arxiv.org/html/2610.07402v1#S1.p3;
    https://arxiv.org/html/2610.07402v1#S3.T1.'
- id: rpg
  relation: predecessor
  note: FLASH follows RPG's cached-logit scoring, replacing learned OPQ codes with training-free SimHash.
  where: 'FLASH v1, Sections 2.3 and A.2: https://arxiv.org/html/2610.07402v1#S2.SS3.p2; https://arxiv.org/html/2610.07402v1#A1.SS2.p4.'
- id: letter
  relation: competitor
  note: LETTER learns regularized residual codes; FLASH uses fixed hashing with parallel prediction and alignment.
  where: 'FLASH v1, Section A.2 and Table 1: https://arxiv.org/html/2610.07402v1#A1.SS2.p3; https://arxiv.org/html/2610.07402v1#S3.T1.'
- id: diger
  relation: competitor
  note: DIGER jointly learns residual quantization and recommendation; FLASH uses a fixed tokenizer.
  where: 'FLASH v1, Section A.2 and Table 1: https://arxiv.org/html/2610.07402v1#A1.SS2.p3; https://arxiv.org/html/2610.07402v1#S3.T1.'
