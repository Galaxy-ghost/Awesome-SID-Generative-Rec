id: token-weighted
name: Token-Weighted
title: 'Beyond Uniform Token Training: A Multi-Target Framework for Learning Token-Weighted Objectives in Generative Recommenders'
authors: Chiu et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2601.17787
  code: https://github.com/CHIUWEINING/Token-Weighted-Multi-Target-Learning-for-Generative-Recommenders-with-Curriculum-Learning
problem: IV
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
tldr: Token-Weighted weights Semantic ID tokens by prefix ambiguity reduction and by token frequency, combining both with
  the standard likelihood under curriculum learning, instead of uniform token training.
tldr_zh: Token-Weighted 按前缀歧义消减量与 token 频率为 SID token 加权，在课程学习下与标准似然结合，替代对所有位置均匀加权的训练。
setup:
  datasets: Amazon Musical Instruments and Industrial & Scientific, Yelp, MovieLens 1M; 5-core users/items. Maximum history
    length not reported.
  split: 'Per-user leave-one-out: last interaction test, penultimate validation, others training. Additional head/tail analysis
    divides test items equally by interaction frequency; it does not redefine the training split.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer fitting exposure to test items not reported.
  sid: 'RQ-VAE: 4 x 256 using LLaMA2-7B item embeddings; duplicate IDs resolved by random reassignment of the final token.
    PQ extension uses four independently quantized embedding segments; PQ codebook sizes not reported.'
  inference_budget: 'Constrained beam search; Hit/NDCG@5/10. Main backbone TIGER/T5; LLaMA3.2-3B extension uses 8-bit LoRA
    at training and inference. Beam width, inference batch size and latency not reported. General experiment pool: two RTX
    3090s and one RTX A6000; inference allocation not reported.'
  results_from: 'Original Table 3: main comparison, five-run means; token-level baselines implemented on TIGER. Table 4: ablations;
    Table 5: PQ IDs; Table 6: larger backbone. Baseline-result reuse not stated.'
setup_where:
  datasets: 'https://arxiv.org/html/2601.17787v2#S5.SS1.SSS1.p1 ; #S5.SS1.SSS1.p2'
  split: 'https://arxiv.org/html/2601.17787v2#S5.SS1.SSS1.p2 ; #S5.SS2.SSS5.p1'
