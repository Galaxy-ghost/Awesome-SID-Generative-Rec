  inference_budget: 'https://arxiv.org/html/2601.17787v2#S3.SS2.p2 ; #S5.SS1.SSS3.p1 ; #S5.SS2.SSS3.p2'
  results_from: 'https://arxiv.org/html/2601.17787v2#S4.T3 ; #S5.T4 ; #S5.T5 ; #S5.T6 ; #S5.SS1.SSS2.p1 ; #S5.SS1.SSS3.p1'
related:
- id: tiger
  relation: predecessor
  note: The proposed curriculum combines token-weighted objectives with standard likelihood on the TIGER architecture.
  where: 'Token-Weighted v2, Section 5.1.2 and Table 3: https://arxiv.org/html/2601.17787v2#S5.SS1.SSS2.p1; https://arxiv.org/html/2601.17787v2#S4.T3.'
- id: letter
  relation: competitor
  note: The Rank baseline adapts LETTER ranking-guided loss to TIGER; the proposed method instead combines prefix-dispersion
    and token-frequency weights through a curriculum.
  where: 'Token-Weighted v2, Sections 4.1/5.1.2 and Table 3; comparison is to the adapted Rank objective, not the full LETTER
    system: https://arxiv.org/html/2601.17787v2#S4.SS1.p2; https://arxiv.org/html/2601.17787v2#S5.SS1.SSS2.p2; https://arxiv.org/html/2601.17787v2#S4.T3.'
