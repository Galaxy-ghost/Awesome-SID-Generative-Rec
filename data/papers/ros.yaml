id: ros
name: ROS
title: 'Reasoning Over Space: Enabling Geographic Reasoning for LLM-Based Generative Next POI Recommendation'
authors: Lv et al.
year: 2026
venue: ACL’26
links:
  arxiv: https://arxiv.org/abs/2601.04562
  code: https://github.com/amap-cvlab/Reasoning-Over-Space
problem: I
stage: Tokenization
representation: Text+Geo
tokenization: Geo-Prefix+RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: CoT+C-Beam
poi: true
tldr: ROS adds hierarchical spatial Semantic IDs, a mobility chain-of-thought with locality-informed pruning, and spatial-guided
  reinforcement learning to LLM-based next-POI generation.
tldr_zh: ROS 为基于 LLM 的下一 POI 生成加入层级空间 SID、带局部性剪枝的移动思维链以及空间引导强化学习。
evidence:
- field: problem
  where: https://arxiv.org/html/2601.04562v2#abstract1 (Abstract); https://arxiv.org/html/2601.04562v2#S1.p3 (§1)
  quote: existing LLM-based recommenders remain limited in leveraging geographic signals
  reason: The organizer retains I from the abstract complaint, with III as an alternative because the introduction narrows
    the limitation to reasoning over geography.
- field: stage
  where: https://arxiv.org/html/2601.04562v2#S1.p4 (§1, numbered design list)
  reason: Hierarchical Spatial SID, Mobility CoT training, and spatial-guided RL address the same geographic limitation. The
    organizer assigns Tokenization by the first listed contribution, while the other two designs concern Training.
- field: tokenizer
  where: https://arxiv.org/html/2601.04562v2#S2.SS2.SSS2 (§2.2.2)
  reason: The pipeline constructs the SID representation before SID grounding pretraining; Fixed is an organizer inference
    from this ordering.
setup:
  datasets: 'Foursquare NYC and TKY, Gowalla CA, prepared with the LLM4POI pipeline: users and POIs with fewer than 10 check-ins
    removed, trajectories segmented by a 24-hour time-gap threshold, and street-level addresses added by reverse geocoding.
    Sizes after preprocessing (users / POIs / check-ins): NYC 1,048 / 4,981 / 103,941; TKY 2,282 / 7,833 / 405,000; CA 3,957
    / 9,690 / 238,369.'
  split: 'Temporal 80% / 10% / 10% train/validation/test split. Separate cross-city test: train on one city and evaluate on
    others.'
  candidates: 'n/a for candidate ranking: the model outputs exactly one POI per request and is scored by HR@1.'
  visibility: warm; validation and test users and POIs are kept only if observed in training. The cross-city test (Table 6)
    uses POIs of another city; their tokenizer exposure is not reported.
  sid: 'Hierarchical spatial SID [g; s; u]: two S2-cell locality tokens (after removing the dataset-wide common prefix), two
    semantic tokens from a 2-level residual quantizer with 28 codes per level over Qwen-0.6B category embeddings, and a sequential
    suffix token within each (g, s) pair that makes IDs unique (at most 8 suffix values observed).'
  inference_budget: 'Generates a mobility chain-of-thought and then one POI SID per request (three inference runs averaged);
    decoding settings not reported. Qwen3-4B student on 8 NVIDIA H20 GPUs; inference batch size and latency: not reported.'
  results_from: Table 1 (HR@1 on NYC, TKY, CA versus traditional, neural, and LLM-based baselines); Tables 2-5 and Figure
    3 (SID design, CoT stages, geographic cues, reward weights); Table 6 (cross-city generalization).
setup_where:
  datasets: 'Datasets and LLM4POI pipeline: https://arxiv.org/html/2601.04562v2#S3.SS1.p1; 24-hour gap and sizes: https://arxiv.org/html/2601.04562v2#A1.T10.'
  split: 'Temporal 80/10/10 split keeping test users and POIs observed: https://arxiv.org/html/2601.04562v2#S3.SS1.p1; cross-city:
    https://arxiv.org/html/2601.04562v2#S3.T6.'
  candidates: 'One recommendation per request, HR@1: https://arxiv.org/html/2601.04562v2#S3.SS1.SSS0.Px2.p1.'
  visibility: 'Test users and POIs observed in training: https://arxiv.org/html/2601.04562v2#S3.SS1.p1.'
  sid: 'HS-SID construction: https://arxiv.org/html/2601.04562v2#A1.SS3.SSS0.Px1.p1.'
  inference_budget: 'One output per request, hardware: https://arxiv.org/html/2601.04562v2#S3.SS1.SSS0.Px2.p1 and https://arxiv.org/html/2601.04562v2#S3.SS1.SSS0.Px3.p1.'
  results_from: 'Main: https://arxiv.org/html/2601.04562v2#S3.T1; ablations: https://arxiv.org/html/2601.04562v2#S3.T2, https://arxiv.org/html/2601.04562v2#S3.T3,
    https://arxiv.org/html/2601.04562v2#S3.T4, https://arxiv.org/html/2601.04562v2#S3.T5; RL weights: https://arxiv.org/html/2601.04562v2#S3.F3;
    cross-city: https://arxiv.org/html/2601.04562v2#S3.T6.'
related:
- id: gnpr-sid
  relation: competitor
  note: GNPR-SID quantizes POI embeddings without explicit spatial structure; ROS builds S2-cell locality tokens plus semantic
    codes and adds mobility chain-of-thought and spatial RL.
  where: 'ROS v2, LLM-based baselines: https://arxiv.org/html/2601.04562v2#S3.SS1.SSS0.Px1.p1; Table 1: https://arxiv.org/html/2601.04562v2#S3.T1.'
- id: spacetime-gr
  relation: competitor
  note: SpaceTime-GR also generates next POIs with an LLM; ROS adds hierarchical spatial SIDs and explicit reasoning before
    the recommendation.
  where: 'ROS v2, LLM-based baselines (ST-GR): https://arxiv.org/html/2601.04562v2#S3.SS1.SSS0.Px1.p1; Table 1: https://arxiv.org/html/2601.04562v2#S3.T1.'
- id: oneloc
  relation: alternative
  note: OneLoc injects geography into the SID input and rewards; ROS encodes geography directly as S2-cell prefix tokens.
  where: 'ROS v2, Section 1 cites OneLoc: https://arxiv.org/html/2601.04562v2#S1.p3.'
- id: lgsid
  relation: alternative
  note: LGSID aligns embeddings with geographic rewards before quantization; ROS separates geographic and semantic tokens
    inside the SID.
  where: 'ROS v2, Section 1 cites LGSID: https://arxiv.org/html/2601.04562v2#S1.p3.'
