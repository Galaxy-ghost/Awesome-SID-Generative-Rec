related:
- id: tiger
  relation: competitor
  note: TIGER retrieves only by beam search over semantic IDs and almost never generates cold-start items; LIGER reranks TIGER-style
    beam candidates plus cold-start items with a dense head trained jointly.
  where: 'LIGER v2, faithful TIGER implementation: https://arxiv.org/html/2411.18814v2#S1.p5; Table 2: https://arxiv.org/html/2411.18814v2#S4.T2;
    cold-start analysis of TIGER''s epsilon quota: https://arxiv.org/html/2411.18814v2#S2.SS4.p3; LIGER builds on TIGER: https://arxiv.org/html/2411.18814v2#S4.SS2.p2.'
- id: vq-rec
  relation: alternative
  note: VQ-Rec uses vector-quantized codes inside a dense retriever; LIGER keeps generative beam search and adds dense ranking
    only over a small candidate set.
  where: 'LIGER v2, Appendix A related work: https://arxiv.org/html/2411.18814v2#A1.p2.'
- id: cobra
  relation: alternative
  note: COBRA later cascades sparse-ID generation with a generated dense vector inside one decoder and cites LIGER for the
    fine-grained similarity gap of generative methods.
  where: 'Evidence is from the later COBRA paper, Section 1: https://arxiv.org/html/2503.02453v1#S1.p3.'
- id: gem-rec
  relation: successor
  note: GEM-Rec later builds on LIGER's reproduction of the TIGER architecture and its 5-core preprocessing.
  where: 'Evidence is from the later GEM-Rec paper, Section 5.4 and Appendix B.1: https://arxiv.org/html/2603.22231v1#S5.SS4.p1
    and https://arxiv.org/html/2603.22231v1#A2.SS1.p1.'
