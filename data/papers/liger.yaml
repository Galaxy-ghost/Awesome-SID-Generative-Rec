tldr: LIGER integrates sequential dense retrieval into a Semantic ID generative retriever, after a controlled comparison of
  both approaches, to narrow their performance gap and improve cold-start recommendation.
tldr_zh: LIGER 在受控对比序列稠密检索与 SID 生成式检索后，将稠密检索融入生成式检索器，缩小二者性能差距并改善冷启动推荐。
evidence:
- field: problem
  where: https://arxiv.org/html/2411.18814v2#abstract1
  quote: mitigating performance differences and enhancing cold-start item recommendation
  reason: 'Candidates: VI / none (rule: complaint fits none of the six classes; judged by the new design).'
setup:
  datasets: 'Amazon Beauty, Sports and Outdoors, Toys and Games, and Steam with 5-core filtering of users and items; sequences
    truncated to the 20 most recent items. Sizes (users / items / cold-start items): Beauty 22,363 / 12,101 / 43; Toys 19,412
    / 11,924 / 56; Sports 35,598 / 18,357 / 81; Steam 47,761 / 12,012 / 400.'
  split: 'Per-user leave-one-out: last item for test, preceding item for validation, the rest for training; early stopping
    on in-set NDCG@10; mean and standard deviation over three seeds. Test targets are reported separately for in-set and cold-start
    items.'
  candidates: 'Hybrid: generative retrieval returns K=20 candidates by beam search, which are ranked together with the cold-start
    items by dense retrieval (K swept from 20 to 100 and K=N in Table 4). Dense baselines score the full catalog.'
  visibility: 'In-set targets: warm. Cold-start targets: unseen by tokenizer too; cold-start items are excluded from RQ-VAE
    training (the paper says to avoid contamination), and the generators fail to produce them. Exact criterion for selecting
    cold-start items beyond the counts in Table 3: not reported.'
  sid: 3-level RQ-VAE x 256 codewords (dimension 128) over sentence-T5-XXL text embeddings; following TIGER, an extra token
    is appended to make IDs unique.
  inference_budget: 'Beam search retrieves K candidates (K=20 for the main result) from a T5 encoder-decoder (6 layers each),
    then a dense head ranks them with cold-start items. Complexity is stated as O(tK) versus O(N) for dense retrieval (Table
    1); hardware, inference batch size, and latency: not reported.'
  results_from: Table 2 (Beauty, Sports, Toys, Steam; in-set and cold-start Recall@10 and NDCG@10; three seeds); Table 4 (number
    of retrieved candidates K); Figures 1, 3, 4 (dense versus generative retrieval and cold-start generation probabilities);
    Appendix D (ablations).
