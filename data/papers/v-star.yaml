related:
- id: minionerec
  relation: competitor
  note: MiniOneRec samples RL candidates by beam search and applies GRPO; V-STAR replaces candidate construction with value-guided
    prefix expansion and uses sibling-group advantages, while keeping MiniOneRec's preprocessing.
  where: 'V-STAR v2, preprocessing follows Kong et al. (2025b): https://arxiv.org/html/2602.10699v2#S5.SS1.p1; strongest RL
    baseline: https://arxiv.org/html/2602.10699v2#S5.SS2.p1; Table 1: https://arxiv.org/html/2602.10699v2#S4.T1.'
- id: tiger
  relation: competitor
  note: TIGER's SIDs and beam search are the base; V-STAR targets the pruning of high-reward low-probability prefixes during
    RL sampling.
  where: 'V-STAR v2, SID-based baselines: https://arxiv.org/html/2602.10699v2#S5.SS2.p1; Table 1: https://arxiv.org/html/2602.10699v2#S4.T1.'
- id: lc-rec
  relation: competitor
  note: LC-Rec is an SID-based LLM recommender without RL; V-STAR adds value-guided RL on top of SFT.
  where: 'V-STAR v2, baselines: https://arxiv.org/html/2602.10699v2#S5.SS2.p1; Table 1: https://arxiv.org/html/2602.10699v2#S4.T1.'
- id: onerec
  relation: alternative
  note: OneRec applies preference alignment with beam-sampled responses; V-STAR argues that probability-based beam sampling
    under-explores high-reward items.
  where: 'V-STAR v2, Sections 1 and 2.3 cite OneRec: https://arxiv.org/html/2602.10699v2#S1.p1 and https://arxiv.org/html/2602.10699v2#S2.SS3.p1.'
