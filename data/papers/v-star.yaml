summary: 'Abstract: "fine-tuning these models with Reinforcement Learning (RL) often suffers from a fundamental probability-reward
  mismatch".'
tldr: V-STAR deepens high-value prefixes with value-guided decoding during reinforcement learning sampling and computes sibling-relative
  advantages with Sibling-GRPO, instead of likelihood-driven beam search.
evidence:
- field: problem
  where: https://arxiv.org/html/2602.10699v2#abstract1 (Abstract)
  quote: However, fine-tuning these models with Reinforcement Learning (RL) often suffers from a fundamental probability-reward
    mismatch.
- field: representation
  where: https://arxiv.org/html/2602.10699v2#S5.SS1.p1 (V-STAR data preprocessing and SID construction); https://arxiv.org/html/2510.24431v1#S4.p1
    (MiniOneRec text embeddings); https://arxiv.org/html/2602.10699v2#S4.SS1.p2 (V-STAR text encoder for reward supervision)
  reason: The Text representation label is inferred from V-STAR's reuse of MiniOneRec preprocessing, whose tokenizer embeds
    item titles and descriptions. V-STAR does not explicitly identify its SID-construction embeddings; its separately reported
    frozen text encoder supplies dense reward supervision.
setup:
  datasets: 'Amazon Reviews 2023 Industrial and Scientific and Office Products, preprocessed following MiniOneRec (Kong et
    al., 2025b); online: WeChat Channels advertising traffic. Filtering and sizes: not restated.'
  split: 'Chronological next-item prediction following MiniOneRec''s preprocessing (allocation not restated). Online: 5-day
    A/B test on 5% of live requests, against beam search plus GRPO.'
  candidates: not reported (full catalog versus sampled); generation is restricted to valid catalog SIDs, with HR and NDCG
    at 3, 5, 10.
  visibility: warm; no unseen-item protocol is defined.
  sid: '3-level RQ-VAE semantic IDs (citing TIGER); the paper states each item is represented by a unique fixed-length SID.
    Codebook size and the mechanism that ensures uniqueness: not reported.'
  inference_budget: 'Training rollouts use value-guided decoding (VED) with 16 candidates per query and an 8-wide beam to
    initialize the prefix tree; at inference, standard beam search is the default decoder (width not reported). Qwen2.5-1.5B
    on 8 GPUs; inference batch size and latency: not reported.'
  results_from: Table 1 (Industrial and Office versus sequential, generative, and RL baselines including MiniOneRec); Tables
    2-4 (decoding, expansion rules, training objective); Table 6 (candidate diversity and max reward); Section 5.3 (online
    GMV +1.23%).
