id: gris-recdmon-rq-gae
name: GrIS (RecDMoN / RQ-GAE)
title: Graph-Informed Semantic IDs (RecDMoN / RQ-GAE) for Generative Recommendation
authors: Medvedev et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2610.01533
  code: https://github.com/hirc-airecs/graph-informed-sids
problem: I
stage: Tokenization
representation: Text+CF
tokenization: RecDMoN / RQ-GAE
backbone: Enc-Dec
tokenizer: Fixed
objective: –
inference: –
poi: false
tldr: GrIS (RecDMoN / RQ-GAE) treats Semantic ID construction as hierarchical partition of an item graph with collaborative
  edges, recovering RQ-VAE and RQ-KMeans as the empty-graph case.
tldr_zh: GrIS (RecDMoN / RQ-GAE) 将 SID 构建视为带协同边的物品图层级划分；当图为空集时，RQ-VAE 与 RQ-KMeans 是它的退化特例。
setup:
  datasets: Amazon Reviews 2014 Beauty, Toys, Sports, Books; MIND-Small; Yelp 2018. Iterative 5-core filtering on all datasets.
  split: 'Per-user leave-one-out: last interaction test, second-to-last validation; maximum sequence length 20.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. RQ-GAE item-graph edges use adjacent co-occurrences from training
    sequences.
  sid: 'RQ-GAE: 4 x 256 codebooks; collision handling not reported. RecDMoN: four recursive levels with branching factor 6
    in Table 6, plus a fifth deduplication codebook; Appendix A reports five levels. Deduplication assignment rule not reported.'
  inference_budget: Hit/NDCG@5/10; decoding beam, hardware, inference batch size, latency not reported.
  results_from: 'Original Table 3: six-dataset comparison, averages over three seeds. RecDMoN Books unavailable due to GPU
    memory limits.'
setup_where:
  datasets: 'Section 5.1: https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p1'
  split: 'Section 5.1: https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p1'
  candidates: 'Evaluation protocol in Section 5.1 does not specify candidate enumeration or negative sampling: https://arxiv.org/html/2610.01533v1#S5.SS1'
  visibility: 'Section 5.1: https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p1 and https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p3'
  sid: 'Section 5.1, Section 5.2.4, Table 6, and Appendix A Table 8: https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p2
    and https://arxiv.org/html/2610.01533v1#S5.SS2.SSS4.p1 and https://arxiv.org/html/2610.01533v1#S5.T6 and https://arxiv.org/html/2610.01533v1#A1.T8'
  inference_budget: 'Section 5.1: https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p1 and https://arxiv.org/html/2610.01533v1#S5.SS1.SSS0.Px3.p2'
  results_from: 'Table 3 and Section 5.2.1: https://arxiv.org/html/2610.01533v1#S5.T3 and https://arxiv.org/html/2610.01533v1#S5.SS2.SSS1.p1
    and https://arxiv.org/html/2610.01533v1#S5.SS2.SSS1.p2'
related:
