id: nau
name: NAU
title: Neighborhood-Aware Unlearning for Generative Recommendation
authors: Lubitzsch et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.27232
  code: https://github.com/pierre-lubitzsch/neighborhood-aware-unlearning
problem: IV
stage: Training
representation: –
tokenization: R-KM
backbone: Enc-Dec†
tokenizer: Fixed
objective: NTP + Aux.
inference: –
poi: false
tldr: NAU adds explicit control over the probability mass on forgotten items' Semantic ID neighborhoods to interaction-level
  unlearning, because shared tokens let unlearning degrade neighboring items.
tldr_zh: NAU 针对共享 token 导致遗忘操作波及邻近物品的问题，在交互级机器遗忘中显式控制被遗忘物品 SID 邻域上的概率质量。
setup:
  datasets: Amazon Beauty, Sports, Toys using released five-core preprocessing. Table 24 additionally lists Food k5 SID diagnostics;
    its source and preprocessing details not reported.
  split: Chronological train/validation/test; allocation sizes not reported. Training histories capped at 20 items; all unlearning
    methods start from the same original model.
  candidates: not reported; no items are filtered from generated candidates during unlearning evaluation.
  visibility: warm; no unseen-item protocol is defined. Users, items and SIDs remain fixed during NAU.
  sid: 'RQ-KMeans/RQ-VAE diagnostics: 3 semantic levels plus fourth deduplication level. Codebook sizes not reported; Table
    24 shows 256 occupied first-level RQ-KMeans codes. LETTER and TRACER-compatible tokenizers also evaluated; their sizes
    not reported.'
  inference_budget: Top-10 utility/exposure metrics; beam width, inference hardware, inference batch size and recommendation
    latency not reported. One H200 and NAU's 3.9s measure unlearning per request, not recommendation inference.
  results_from: 'Original Tables 1/3/4: spam/unwanted-item removal; Appendices D/F: extended results. Five data seeds. RQ-KMeans
    selection uses validation; other-tokenizer operating-point selection uses test results.'
setup_where:
  datasets: 'Section 4 and Appendix H Table 24: https://arxiv.org/html/2610.27232v1#S4.p2 and https://arxiv.org/html/2610.27232v1#A8.T24'
