summary: 'Generative recommendation predicts items by autoregressively generating semantic identifiers (SIDs), whose tokens
  are shared across semantically related items. With this paradigm gaining adoption, the question of how to support unlearning
  in it has become pressing. If training interactions must later be removed, such as injected spam or interactions with items
  a user no longer wants, this sharing lets an unlearning update unintentionally affect the predictions for the interactions''
  neighbors. We show that this effect is locally structured and hidden by global metrics: unlearning can leave recommendation
  utility on the whole test set nearly unchanged while substantially degrading it on neighborhoods of the forgotten interactions''
  SIDs. We propose Neighborhood-Aware Unlearning (NAU), which augments interaction-level unlearning with explicit control
  over the probability mass assigned to the forgotten items'' neighborhoods. Across three datasets and four SID tokenizers,
  NAU restores spam-induced exposure toward the retrained reference while retaining more than 95% of retrained utility, and
  recovers the neighborhood utility that forget-and-repair unlearning loses at no global cost. We identify local probability
  redistribution as an important failure mode of unlearning in SID-based generative recommenders and show that explicitly
  controlling this redistribution can mitigate its effects.'
setup:
  datasets: Amazon Beauty, Sports, Toys using released five-core preprocessing. Table 24 additionally lists Food k5 SID diagnostics;
    its source and preprocessing details not reported.
  split: Chronological train/validation/test; allocation sizes not reported. Training histories capped at 20 items; all unlearning
    methods start from the same original model.
  candidates: not reported; no items are filtered from generated candidates during unlearning evaluation.
  visibility: warm; no unseen-item protocol is defined. Users, items and SIDs remain fixed during NAU.
  sid: 'RQ-KMeans/RQ-VAE diagnostics: 3 semantic levels plus fourth deduplication level. Codebook sizes not reported; Table
    24 shows 256 occupied first-level RQ-KMeans codes. LETTER and TRACER-compatible tokenizers also evaluated; their sizes
    not reported.'
  inference_budget: Top-10 utility/exposure metrics; beam width, inference hardware, inference batch size and recommendation
    latency not reported. One H200 and NAU's 3.9s measure unlearning per request, not recommendation inference.
  results_from: 'Original Tables 1/3/4: spam/unwanted-item removal; Appendices D/F: extended results. Five data seeds. RQ-KMeans
    selection uses validation; other-tokenizer operating-point selection uses test results.'
