  candidates: 'Section 4 and Appendix A: https://arxiv.org/html/2610.27232v1#S4.p6 and https://arxiv.org/html/2610.27232v1#A1.p1'
  visibility: 'Sections 2/4 study interaction deletion with existing items, without an unseen-item protocol: https://arxiv.org/html/2610.27232v1#S2
    and https://arxiv.org/html/2610.27232v1#S4'
  sid: 'Section 4 and Appendix H Table 24: https://arxiv.org/html/2610.27232v1#S4.p2 and https://arxiv.org/html/2610.27232v1#A8.T24'
  inference_budget: 'Section 4 and Appendix D Table 9: https://arxiv.org/html/2610.27232v1#S4.p6 and https://arxiv.org/html/2610.27232v1#A4.T9'
