id: hid-vae
name: HiD-VAE
title: 'HiD-VAE: Interpretable Generative Recommendation via Hierarchical and Disentangled Semantic IDs'
authors: Fang et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2508.04618
  code: https://anonymous.4open.science/r/HiD-VAE-84B2
problem: II
stage: Tokenization
representation: Text
tokenization: Hier. RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'Abstract: "semantically flat and uninterpretable, lacking a coherent hierarchy"; "prone to representation entanglement
  (i.e., ``ID collisions'''')". Candidates: I / II (rule: tie broken by the majority of new designs).'
tldr: HiD-VAE aligns each Semantic ID level with multi-level item tags through hierarchically supervised quantization and
  adds a uniqueness loss against ID collisions, instead of flat unsupervised tokenization.
evidence:
- field: problem
  where: arXiv:2508.04618v2, abstract
  quote: semantically flat and uninterpretable, lacking a coherent hierarchy … prone to representation entanglement (i.e.,
    ``ID collisions'')
  reason: 'Candidates: I / II (rule: tie broken by the majority of new designs).'
setup:
  datasets: 'Amazon Beauty, Sports and Outdoors, and KuaiRand-1K, with 5-core filtering of users and items. Sizes (users /
    items / interactions): Beauty 22,363 / 12,101 / 198,360; Sports 35,598 / 18,357 / 296,175; KuaiRand 983 / 29,983 / 953,166.
    KuaiRand category hierarchies are generated by an LLM from titles and raw categories.'
  split: 'Per-user leave-one-out: last item for test, second-to-last for validation, the rest for training.'
  candidates: not reported (full catalog versus sampled evaluation candidates); generation is constrained to valid ID prefixes.
  visibility: warm; no unseen-item protocol is defined.
  sid: '3-level hierarchically supervised RQ-VAE x 256 codewords (K-means initialized) over 768-dimensional SentenceTransformer
    embeddings; each level is aligned with a category-tag level, and a uniqueness loss pushes items apart. Measured collision
    rate 2.1% (Beauty), 2.8% (Sports), 1.9% (KuaiRand) versus 18.7%, 19.5%, and 17.8% for RQ-VAE. How the remaining collisions
    are resolved in the full model: not reported; the w/o-uniqueness variant uses TIGER''s appended integer.'
  inference_budget: 'Autoregressive generation with constrained decoding against a corpus cache; beam width not reported.
    6-layer encoder-decoder (8 heads, hidden 512). Training on NVIDIA 4060 GPUs with FP16; inference batch size and latency:
    not reported.'
  results_from: Table 1 (Beauty, Sports, KuaiRand versus traditional, Transformer, and generative baselines); Table 2 (ablations
    of tag alignment, tag prediction, uniqueness loss); Table 3 (ID collision rates).
setup_where:
  datasets: 'Datasets and 5-core: https://arxiv.org/html/2508.04618v2#S4.SS1.p1 and https://arxiv.org/html/2508.04618v2#S4.I2.i2.p1;
    LLM-built hierarchies: https://arxiv.org/html/2508.04618v2#S4.SS1.p3; statistics: https://arxiv.org/html/2508.04618v2#A4.T4.'
  split: 'Leave-one-out allocation: https://arxiv.org/html/2508.04618v2#S4.SS1.p5.'
  candidates: 'Metrics only: https://arxiv.org/html/2508.04618v2#S4.SS1.p5.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2508.04618v2#S4.SS1.p5.'
  sid: 'L=3 x K=256, K-means initialization, SentenceTransformer input: https://arxiv.org/html/2508.04618v2#S4.SS1.p6; uniqueness
    loss: https://arxiv.org/html/2508.04618v2#S3.SS6.p1; collision rates: https://arxiv.org/html/2508.04618v2#S4.T3; TIGER
    suffix only in the w/o DUL variant: https://arxiv.org/html/2508.04618v2#S4.I4.i4.p1.'
  inference_budget: 'Constrained decoding: https://arxiv.org/html/2508.04618v2#S4.SS1.p6; hardware: https://arxiv.org/html/2508.04618v2#S4.SS1.p6.'
  results_from: 'Main: https://arxiv.org/html/2508.04618v2#S4.T1; ablation: https://arxiv.org/html/2508.04618v2#S4.T2; collisions:
    https://arxiv.org/html/2508.04618v2#S4.T3.'
related:
- id: tiger
  relation: competitor
  note: TIGER resolves collisions by appending an integer after unsupervised RQ-VAE; HiD-VAE supervises each level with category
    tags and adds a uniqueness loss so that fewer items collide.
  where: 'HiD-VAE v2, baselines and Table 1: https://arxiv.org/html/2508.04618v2#S4.SS1.p4 and https://arxiv.org/html/2508.04618v2#S4.T1;
    TIGER-style suffix in the ablation: https://arxiv.org/html/2508.04618v2#S4.I4.i4.p1 and https://arxiv.org/html/2508.04618v2#S4.I5.i2.p1.'
- id: lc-rec
  relation: competitor
  note: LC-Rec aligns an LLM to RQ-VAE codes; HiD-VAE changes the tokenizer and keeps a small encoder-decoder; LC-Rec is run
    with a T5-base backbone for scale parity.
  where: 'HiD-VAE v2, baselines: https://arxiv.org/html/2508.04618v2#S4.SS1.p4 and https://arxiv.org/html/2508.04618v2#S4.SS1.p7;
    Table 1: https://arxiv.org/html/2508.04618v2#S4.T1.'
- id: vq-rec
  relation: competitor
  note: VQ-Rec's product-quantized codes are adapted to generation here and collide more often (21.2% on Beauty) than HiD-VAE's
    hierarchical codes.
  where: 'HiD-VAE v2, baselines and adaptation: https://arxiv.org/html/2508.04618v2#S4.SS1.p4 and https://arxiv.org/html/2508.04618v2#S4.I3.i2.p1;
    Tables 1 and 3: https://arxiv.org/html/2508.04618v2#S4.T1 and https://arxiv.org/html/2508.04618v2#S4.T3.'
- id: adasid
  relation: alternative
  note: AdaSID later argues that HiD-VAE's overlap-aware objective treats collisions under a fixed standard, and makes the
    repulsion adaptive.
  where: 'Evidence is from the later AdaSID paper, Sections 1 and 2.2: https://arxiv.org/html/2604.23522v1#S1.p3 and https://arxiv.org/html/2604.23522v1#S2.SS2.p1.'
