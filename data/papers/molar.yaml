tldr: Molar builds item representations from text and images with a multimodal LLM and aligns its user representations with
  an ID-based model, to add collaborative signals that LLM recommenders lack.
tldr_zh: Molar 用多模态 LLM 从文本与图像构建物品表示，并将用户表示与基于 ID 的协同过滤模型对齐，补足 LLM 推荐器缺失的协同信号。
evidence:
- field: problem
  where: 'Abstract, CF and modality limitations (fragment), arXiv v2: https://arxiv.org/html/2412.18176v2#abstract1.1'
  quote: inherently lack collaborative filtering information, relying primarily on textual content data neglecting other modalities
setup:
  datasets: 'Amazon clothing (993,087 users / 301,312 items / 8,813,442 interactions), PixelRec (50,000 / 82,864 / 989,476),
    MovieLens (6,040 / 3,706 / 1,000,209). Filtering rules: not reported.'
  split: Sequential leave-one-out into training, validation, and test; the exact position allocation is not reported beyond
    the label.
  candidates: full catalog (the paper states metrics are evaluated on the full amount of data); training uses 1:1 negative
    sampling with BCE.
  visibility: warm; no unseen-item protocol is defined.
  sid: n/a (items are represented by continuous embeddings from a fine-tuned multimodal LLM; no discrete SIDs are built).
  inference_budget: 'Scoring with item embeddings from Qwen2-VL-2B (MIRM) and a user model (DUEG); hardware, inference batch
    size, and latency: not reported.'
  results_from: Table 2 (Amazon, PixelRec, MovieLens versus traditional, content, and LLM-based baselines); Tables 3-5 (modalities,
    post-alignment model, ablations); Appendix Table 6 (MLLM backbones).
