tldr: FlexCode splits a fixed token budget between a collaborative codebook and a semantic codebook according to item popularity
  through a lightweight MoE, instead of one uniform codebook for all items.
tldr_zh: FlexCode 通过轻量 MoE 按物品流行度在协同码本与语义码本之间分配固定 token 预算，替代所有物品共用单一码本的做法。
setup:
  datasets: Amazon-Beauty, Amazon-Sports and Outdoors, KuaiRand-1K; 5-core filtering; proprietary industrial interactions.
  split: 'Public: chronological last item test, penultimate validation; industrial: last logged day evaluation, validation
    not reported.'
  candidates: not reported
  visibility: 'warm; no unseen-item protocol is defined. Head/tail evaluation concerns popularity; tokenizer and collaborative-encoder
    item exposure: not reported.'
  sid: Dual RQ-VAE; total token budgets 3/4/5/6, popularity-dependent allocation; base K=512. Main-experiment depth and collision
    handling not reported.
  inference_budget: Recall/NDCG@5/10; beam width, hardware, inference batch size, latency not reported.
  results_from: 'Original Table 1: public benchmarks; Figure 2: industrial overall and head/tail results.'
