id: dact
name: DACT
title: Drift-Aware Continual Tokenization for Generative Recommendation
authors: Feng et al.
year: 2026
venue: SIGIR’26
links:
  arxiv: https://arxiv.org/abs/2603.29705
  code: https://github.com/HomesAmaranta/DACT
problem: VI
stage: Tokenization
representation: Text+CF
tokenization: RQ-VAE
backbone: Enc-Dec / Dec-Only
tokenizer: Fixed
objective: NTP
inference: –
poi: false
summary: 给完整 SID 生成模型提供持续更新编号器的新设计，在 TIGER 与 LC-Rec 验证。
tldr: DACT fine-tunes a collaborative tokenizer as interactions drift, with an item-level drift detector and relaxed-to-strict
  code reassignment, to update Semantic IDs without full retraining or mass ID changes.
tldr_zh: DACT 在交互分布漂移时利用物品级漂移检测器与由松到紧的码重分配机制微调协同编号器，在不完全重训或大规模变动 ID 的前提下更新 SID。
setup:
  datasets: Amazon Beauty, Tools, Toys; users/items with <5 interactions removed. Amazon release year not reported.
  split: 'Chronological interaction stream: P0 is the first 60% for pretraining; P1-P4 equally divide the remaining 40%. Sliding-window
    sequences and leave-one-out train/validation/test; exact window and held-out positions not reported. Fine-tuning uses
    the current period from the previous checkpoint; retraining uses all accumulated periods.'
  candidates: not reported; only HR/NDCG@5,10 are specified, without evaluation catalog size, negative sampling or history
    exclusion.
  visibility: Continual arrivals; warm items occur in P0 tokenizer training, cold items first appear after P0 (unseen by tokenizer
    too at initialization). TIGER/Toys warm-cold analysis evaluates P1 after current-period tokenizer/GRM updates; evaluation-time
    zero exposure is not established. CF is fine-tuned on current-period data; its validation/test-item exposure is not separately
    reported.
  sid: Title/description semantic embeddings plus LETTER-style CF regularization; RQ-VAE, 3 layers x 256 codes, 32-dimensional
    code embeddings. DACT fine-tunes with drift/stability constraints, reassigns layer 1, and updates deeper codes only when
    layer 1 changes. Content-encoder/CF-model identity and collision handling not reported.
  inference_budget: Autoregressive TIGER (T5 encoder-decoder; size not reported) or LCRec (Qwen2.5-1.5B-Instruct decoder).
    CDIM is training-only. Beam, decoding constraints, token cap, inference hardware/batch size and latency not reported;
    Figure 8 measures relative training time.
  results_from: 'Own P1-P4 continual-update experiments: TIGER on Beauty/Tools/Toys and LCRec on Beauty/Tools, comparing frozen/fine-tuned/retrained
    components and Reformer; LCRec additionally compares LSAT/PESO. Baseline scores are presented as experiments in this study;
    no imported-score source is identified.'
