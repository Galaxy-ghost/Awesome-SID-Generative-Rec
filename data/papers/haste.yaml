summary: Generative recommendation models have shown promising results by representing items as semantic IDs and generating
  these IDs autoregressively. We introduce an approach showing that explicitly incorporating hierarchical and attribute-level
  supervision into generative recommendation can simultaneously improve training efficiency and long-tail recommendation performance.
  Existing approaches typically optimize semantic ID prediction with a standard causal cross-entropy objective, which does
  not explicitly exploit the hierarchical structure of semantic IDs and can require substantial training to learn effective
  item representations. Moreover, data-sparse tail items often suffer from poor representations due to limited supervision,
  resulting in weaker long-tail recommendation performance. We address these challenges with HASTE (Hierarchical and Attribute-aware
  Supervision for generaTive rEcommendation), a unified training framework that introduces hierarchical and attribute-specific
  supervision. HASTE's Hierarchical Loss explicitly exploits the multi-level structure of semantic IDs, providing supervision
  at each level of the item hierarchy and substantially accelerating training convergence. Its Attribute-Specific Losses encourage
  the model to preserve fine-grained item attributes, leveraging the language model's inherent semantic knowledge to improve
  representations and recommendations for tail items. We extensively evaluate HASTE on a fashion recommendation benchmark
  and across multiple domains of the Amazon dataset. HASTE improves recommendation performance across datasets and item-frequency
  regimes. Notably, the Hierarchical Loss achieves approximately 2x faster convergence than the standard causal cross-entropy
  objective, substantially improving training efficiency while maintaining strong recommendation quality.
setup:
  datasets: 'Amazon-2014 Sports/Beauty/Toys: P5 5-core; Fashion-140k: 5-core, minimum sequence length 3, cap 100; internal-fashion:
    six deliberate engagement types, deduplication, length 3-100, resolved location, single profile; consecutive events with
    gaps of at least 30 days are discarded.'
  split: 'Public sequences: last test, penultimate validation. Amazon conversational examples: shuffled 92/5/3%. Internal-fashion:
    Section 9.1.3 reports 6255087/339950/203971 train/validation/test conversations; Section 9.1.5 separately reports 368482/19482
    training/validation conversations for the attribute-loss SFT corpus. The relationship between these internal corpus counts
    is not explained.'
  candidates: not reported; catalog-valid prefix constraints do not establish full-catalog evaluation.
  visibility: warm; no unseen-item protocol is defined. Fashion-140k tokenizer uses the full 799953-item Fashion pool.
  sid: 'TIGER-style RQ-VAE: 3 x 256 plus a fourth collision-disambiguation token. Sports/Beauty/Toys use 1024-d text representations;
    Internal-fashion uses 1024-d multimodal Qwen3-VL embeddings. Section 6 also describes four 256-entry codebooks, inconsistently.'
  inference_budget: 'K=5/10; prefix tree from up to 100K training sequences, per-position fallback. Experiments: RTX6000 96GB;
    beam, inference batch/latency not reported.'
  results_from: 'Original Tables 1-2: sequential/attribute results; Table 3: convergence; Tables 4-5: ablations.'
