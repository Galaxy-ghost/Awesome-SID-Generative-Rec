id: haste
name: HASTE
title: 'HASTE: Hierarchical and Attribute-aware Supervision for Generative Recommendation'
authors: Shukla et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.17368
  code: null
problem: IV
stage: Training
representation: Text / MM
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP + Aux.
inference: –
poi: false
tldr: HASTE adds a loss at each Semantic ID level and attribute-specific losses to generator training, to speed convergence
  and improve tail items beyond a standard causal cross-entropy objective.
tldr_zh: HASTE 在生成器训练中加入各 SID 层级损失与属性特定损失，加快收敛并改善长尾物品表现，优于标准自回归交叉熵目标。
setup:
  datasets: 'Amazon-2014 Sports/Beauty/Toys: P5 5-core; Fashion-140k: 5-core, minimum sequence length 3, cap 100; internal-fashion:
    six deliberate engagement types, deduplication, length 3-100, resolved location, single profile; consecutive events with
    gaps of at least 30 days are discarded.'
  split: 'Public sequences: last test, penultimate validation. Amazon conversational examples: shuffled 92/5/3%. Internal-fashion:
    Section 9.1.3 reports 6255087/339950/203971 train/validation/test conversations; Section 9.1.5 separately reports 368482/19482
    training/validation conversations for the attribute-loss SFT corpus. The relationship between these internal corpus counts
    is not explained.'
  candidates: not reported; catalog-valid prefix constraints do not establish full-catalog evaluation.
  visibility: warm; no unseen-item protocol is defined. Fashion-140k tokenizer uses the full 799953-item Fashion pool.
  sid: 'TIGER-style RQ-VAE: 3 x 256 plus a fourth collision-disambiguation token. Sports/Beauty/Toys use 1024-d text representations;
    Internal-fashion uses 1024-d multimodal Qwen3-VL embeddings. Section 6 also describes four 256-entry codebooks, inconsistently.'
  inference_budget: 'K=5/10; prefix tree from up to 100K training sequences, per-position fallback. Experiments: RTX6000 96GB;
    beam, inference batch/latency not reported.'
  results_from: 'Original Tables 1-2: sequential/attribute results; Table 3: convergence; Tables 4-5: ablations.'
