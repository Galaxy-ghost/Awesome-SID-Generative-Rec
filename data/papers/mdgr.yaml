id: mdgr
name: MDGR
title: Masked Diffusion Generative Recommendation
authors: Mu et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2601.19501
  code: null
problem: III
stage: Backbone
representation: –
tokenization: Par. OPQ
backbone: Non-AR
tokenizer: Fixed
objective: Masked
inference: Diff.+Beam
poi: false
summary: OPQ 离散 SID + 双向掩码扩散 + 完整 SID 候选映射构成新方法。
tldr: MDGR uses a parallel codebook, adaptive masking along time and samples, and warm-up two-stage parallel decoding for
  masked diffusion recommendation, instead of fixed-order autoregressive Semantic ID decoding.
setup:
  datasets: 'Amazon Electronics/Books: remove users with fewer than five interactions, maximum history 20. Industrial Southeast
    Asian e-commerce logs: May-December 2025, >1B interactions, 18M users, 25M items, mean history 128; industrial filtering
    not reported.'
  split: 'Sliding-window next-item training; chronological leave-one-out: latest interaction test, penultimate validation,
    remainder training. Online A/B: January 5-12, 2026, control/treatment each 20% uniformly sampled users.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer fitting exposure to test items not reported.
  sid: 'OPQ-based parallel codebooks: 8 x 300, 256-dimensional code vectors, using Qwen3-8B content embeddings. Complete SIDs
    map to item sets through an offline index; collision disambiguation not reported.'
  inference_budget: Beam 50; four single-position warm-up steps, then two positions/step. Table 3 reports six total steps
    and 2.527 QPS versus 2.212 for eight serial steps; implementation text inconsistently says four subsequent parallel steps.
    Recall/NDCG@5/10; inference-specific hardware, batch size and latency not reported.
  results_from: 'Original Table 2: offline three-dataset comparison; baseline-result reuse not stated. Table 3: industrial
    efficiency; Table 4: industrial ablations; Section 5.6: online A/B against production TIGER.'
setup_where:
  datasets: https://arxiv.org/html/2601.19501v1#S5.SS1.SSS1.p1
  split: 'https://arxiv.org/html/2601.19501v1#S5.SS1.SSS1.p1 ; #S5.SS6.p1'
  candidates: 'Section 5.1 gives metrics but no evaluation universe or negative-sampling protocol: https://arxiv.org/html/2601.19501v1#S5.SS1'
  visibility: 'https://arxiv.org/html/2601.19501v1#S5.SS1.SSS1.p1 ; #S5.SS1.SSS3.p1'
  sid: 'https://arxiv.org/html/2601.19501v1#S4.SS2 ; #S5.SS1.SSS3.p1'
  inference_budget: 'https://arxiv.org/html/2601.19501v1#S5.SS1.SSS3.p1 ; #S5.T3 ; #S5.SS3.SSS2.p2'
  results_from: 'https://arxiv.org/html/2601.19501v1#S4.T2 ; #S5.T3 ; #S5.T4 ; #S5.SS6.p1'
related:
- id: tiger
  relation: competitor
  note: TIGER generates residual-quantized IDs autoregressively; MDGR denoises parallel-codebook IDs and is also tested against
    production TIGER online.
  where: 'MDGR v1, Sections 5.1.2/5.6 and Table 2: https://arxiv.org/html/2601.19501v1#S5.SS1.SSS2.p1; https://arxiv.org/html/2601.19501v1#S5.SS6.p1;
    https://arxiv.org/html/2601.19501v1#S4.T2.'
- id: rpg
  relation: competitor
  note: RPG uses multi-token prediction and graph-constrained parallel decoding; MDGR uses masked denoising with confidence-guided
    position scheduling.
  where: 'MDGR v1, Sections 4.4/5.1.2 and Table 2: https://arxiv.org/html/2601.19501v1#S4.SS4; https://arxiv.org/html/2601.19501v1#S5.SS1.SSS2.p1;
    https://arxiv.org/html/2601.19501v1#S4.T2.'
- id: cobra
  relation: competitor
  note: COBRA supplements sparse IDs with dense vectors; MDGR instead changes discrete-ID supervision and decoding through
    masked diffusion.
  where: 'MDGR v1, Sections 2.1/5.1.2 and Table 2: https://arxiv.org/html/2601.19501v1#S2.SS1.p1; https://arxiv.org/html/2601.19501v1#S5.SS1.SSS2.p1;
    https://arxiv.org/html/2601.19501v1#S4.T2.'
