id: rerankid
name: ReRankID
title: Reasoning Reranking with Semantic IDs as the Sole Item Representation
authors: Tang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.22797
  code: https://github.com/lilv98/ReRankID
problem: psb
stage: n/a
representation: Text
tokenization: R-KM†
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: CoT+Greedy
poi: false
summary: End-to-end paradigm or benchmark using R-KM† tokenization and Dec-Only backbone.
tldr: 'ReRankID is a controlled testbed, not a new recommender: models reason over and rerank slates shown only as Semantic
  IDs, and the paper compares post-training methods for this task.'
tldr_zh: ReRankID 是受控评测基准而非新推荐模型：让模型仅根据 SID 推理并重排候选列表，对比面向该任务的不同后训练方法。
setup:
  datasets: Kuaishou OpenOneRec-RecIF short-video release, 162074 source users; evaluation requires a renderable positive
    and >=256 items with both SID/caption histories.
  split: User-disjoint SFT/post-training/development/test partitions; 400 development and 400 test users, each balanced 200
    explicit-engagement/200 long-view positives; histories precede targets.
  candidates: 'sampled: 29 negatives plus one positive at anchor; slate sizes 10/20/30/50/100. Exposure-hard negatives plus
    uniform catalog fill; user-engaged items excluded. Exclusion of other historical exposures: not reported.'
  visibility: warm; evaluation release users/items were exposed during backbone pretraining, while post-training users are
    disjoint. Reranking supplied slates is a new task.
  sid: 'Released OpenOneRec three-code SIDs from quantized item-text embeddings; quantizer algorithm, codebook sizes and collision
    handling: not reported.'
  inference_budget: 'SID: greedy reasoning 2048 tokens, fallback structured extraction 256 tokens from <=1200 reasoning characters;
    top-10 indices; A100/BF16. Text APIs: 8192-32768 output-token caps. Inference batch and latency: not reported.'
  results_from: 'This testbed''s paired evaluations: Table 1 initial models/references, Table 2 post-training, Table D.1 full
    metrics. Each post-training method compares its own initializer; invalid outputs score zero.'
setup_where:
  datasets: 'Section 3 and Appendix A.2: https://arxiv.org/html/2610.22797v1#S3.SS0.SSS0.Px2.p1 and https://arxiv.org/html/2610.22797v1#A1.SS2.p1
    and https://arxiv.org/html/2610.22797v1#A5.p1'
  split: 'Appendix A.2: https://arxiv.org/html/2610.22797v1#A1.SS2.p1'
  candidates: 'Appendix A.2-A.3: https://arxiv.org/html/2610.22797v1#A1.SS2.p2 and https://arxiv.org/html/2610.22797v1#A1.SS3.p1'
  visibility: 'Appendix A.4: https://arxiv.org/html/2610.22797v1#A1.SS4.p1 and https://arxiv.org/html/2610.22797v1#A1.SS4.p3'
  sid: 'Section 3 and Appendix A.1: https://arxiv.org/html/2610.22797v1#S3.SS0.SSS0.Px2.p1 and https://arxiv.org/html/2610.22797v1#A1.SS1.p1'
  inference_budget: 'Appendix B.1, Table B.2 and Appendix E: https://arxiv.org/html/2610.22797v1#A2.SS1.p2 and https://arxiv.org/html/2610.22797v1#A2.T2
