id: actionpiece
name: ActionPiece
title: 'ActionPiece: Contextually Tokenizing Action Sequences for Generative Recommendation'
authors: Hou et al.
year: 2025
venue: ICML’25
links:
  arxiv: https://arxiv.org/abs/2502.13581
  code: https://github.com/google-deepmind/action_piece
problem: I
stage: Tokenization
representation: Text
tokenization: OPQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Ensemble
poi: false
tldr: ActionPiece represents each action as a set of item features and merges co-occurring feature patterns into new tokens,
  so identical actions get context-dependent tokens instead of fixed independent ones.
tldr_zh: ActionPiece 将每次交互表示为物品特征集合，把共现特征模式合并为新 token，使相同动作获得随上下文变化的 token，而非固定独立的 token。
evidence:
- field: problem
  where: https://arxiv.org/html/2502.13581v3#abstract1
  quote: without considering contextual relationships
setup:
  datasets: 'Amazon Reviews: Sports and Outdoors, Beauty, and CDs and Vinyl. Users with fewer than 5 reviews are filtered;
    an item-frequency filter is not reported. Processed sizes (users / items / actions): Sports 35,598 / 18,357 / 260,739;
    Beauty 22,363 / 12,101 / 176,139; CDs 75,258 / 64,443 / 1,022,334.'
  split: 'Per-user chronological leave-last-out: last item for test, second-to-last for validation, earlier items for training.
    Histories are truncated to 20 items for generative methods and 50 items for ID-based and feature-enhanced baselines.'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-K lists are produced by beam search.
  visibility: warm; no unseen-item protocol is defined.
  sid: Each item is an unordered set of 4 OPQ codes x 256 codewords (sentence-t5-base text embeddings) plus 1 extra identification
    code to prevent conflicts. ActionPiece then merges co-occurring feature sets into a context-dependent vocabulary of 40,000
    tokens (tuned over 5k-40k), so the same item can map to different tokens in different sequences.
  inference_budget: 'Beam search with beam size 50; inference-time ensemble over q=5 set-permutation segmentations, with item
    scores averaged across the 5 ranking lists. Recall and NDCG at K=5 and 10. Inference hardware, inference batch size, and
    measured latency: not reported (each model is trained on one 40GB NVIDIA A100; the paper states only that latency stays
    comparable when segments run in parallel).'
  results_from: Table 4 (main comparison on Sports, Beauty, and CDs; averages over five seeds); Table 5 (ablations, including
    TIGER with varied vocabulary sizes); Figures 4-6 (vocabulary size, token utilization, and ensemble size). BERT4Rec, SASRec,
    FDSA, S3-Rec, TIGER, and LMIndexer numbers on Sports and Beauty are copied from earlier papers; other results are the
    authors' reimplementations.
setup_where:
  datasets: 'Dataset categories: https://arxiv.org/html/2502.13581v3#S4.SS1.p1; user filter and truncation: https://arxiv.org/html/2502.13581v3#A6.p2;
    processed sizes: https://arxiv.org/html/2502.13581v3#S3.T3.'
  split: 'Leave-last-out allocation: https://arxiv.org/html/2502.13581v3#S4.SS1.p1; history truncation: https://arxiv.org/html/2502.13581v3#A6.p2.'
  candidates: 'Evaluation settings name metrics only: https://arxiv.org/html/2502.13581v3#S4.SS1.p3; top-K lists come from
    beam search: https://arxiv.org/html/2502.13581v3#A8.p4.'
  visibility: 'Standard leave-last-out protocol with no cold-start experiment: https://arxiv.org/html/2502.13581v3#S4.SS1.p1.'
  sid: 'OPQ features, 256 codewords per digit, extra identification code: https://arxiv.org/html/2502.13581v3#A6.I1.i3.p1;
    vocabulary size 40,000 and tuning range: https://arxiv.org/html/2502.13581v3#A7.T7 and https://arxiv.org/html/2502.13581v3#A8.p2.'
  inference_budget: 'Beam size 50 and q=5 segmentations: https://arxiv.org/html/2502.13581v3#A8.p2 and https://arxiv.org/html/2502.13581v3#A7.T7;
    score averaging: https://arxiv.org/html/2502.13581v3#S3.SS3.SSS2.p1; GPU statement is for training: https://arxiv.org/html/2502.13581v3#A8.p3;
    qualitative latency statement: https://arxiv.org/html/2502.13581v3#S3.SS4.p3.'
  results_from: 'Main table: https://arxiv.org/html/2502.13581v3#S3.T4 and https://arxiv.org/html/2502.13581v3#S4.SS2.p1;
    ablation: https://arxiv.org/html/2502.13581v3#S4.T5; five seeds: https://arxiv.org/html/2502.13581v3#S4.SS1.p3; copied
    baseline numbers: https://arxiv.org/html/2502.13581v3#A8.p1.'
related:
- id: tiger
  relation: competitor
  note: TIGER tokenizes each item independently into ordered RQ-VAE codes, whereas ActionPiece merges unordered feature sets
    into context-dependent tokens; both use the same encoder-decoder and beam search.
  where: 'ActionPiece v3, Section 4.1 baselines: https://arxiv.org/html/2502.13581v3#S4.SS1.p2; Table 4: https://arxiv.org/html/2502.13581v3#S3.T4;
    same architecture statement: https://arxiv.org/html/2502.13581v3#A8.p2.'
- id: vq-rec
  relation: predecessor
  note: ActionPiece follows VQ-Rec in quantizing sentence embeddings with OPQ into unordered codes, then builds a merged contextual
    vocabulary over those codes for generation.
  where: 'ActionPiece v3, Appendix F follows Hou et al. (2023) for OPQ features: https://arxiv.org/html/2502.13581v3#A6.I1.i3.p1;
    VQ-Rec is a Table 4 baseline: https://arxiv.org/html/2502.13581v3#S3.T4.'
- id: lmindexer
  relation: competitor
  note: LMIndexer learns text-based semantic indexes item by item, while ActionPiece tokenizes whole action sequences with
    context-aware merges.
  where: 'ActionPiece v3, Table 1 and Section 4.1 baselines: https://arxiv.org/html/2502.13581v3#S1.T1 and https://arxiv.org/html/2502.13581v3#S4.SS1.p2;
    Table 4: https://arxiv.org/html/2502.13581v3#S3.T4.'
- id: cid
  relation: competitor
  note: P5-CID builds item IDs by hierarchical clustering, independent of sequence context; ActionPiece's tokens depend on
    neighboring actions.
  where: 'ActionPiece v3, Table 1 and Section 4.1 baselines: https://arxiv.org/html/2502.13581v3#S1.T1 and https://arxiv.org/html/2502.13581v3#S4.SS1.p2;
    Table 4: https://arxiv.org/html/2502.13581v3#S3.T4.'
