id: daso
name: DASO
title: Difficulty-Aware Semantic-ID Optimization for Generative Recommendation
authors: Yu et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2608.20611
  code: https://github.com/LucasXinYu/DASO
problem: IV
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: C-Beam
poi: false
summary: 提出完整 tree-aware GRPO 新训练方法，在固定 MiniOneRec SID 与工业 SID 上验证。
tldr: DASO reallocates part of each GRPO rollout group to prefix-guided completions at Semantic ID levels where candidates
  leave the target path and adds a graded prefix reward, unlike vanilla GRPO.
setup:
  datasets: 'Amazon Reviews 2018 Industrial & Scientific and Office Products, 5-core; proprietary user-to-item task with 1.36M
    recommendation examples and 319K users. Internal filtering rules: not reported.'
  split: 'Public: fixed chronological next-item prediction, earlier interactions as history and a held-out next item. Train/validation/test
    sequences: Office Products 38924/4866/4866; Industrial and Scientific 36259/4532/4533. Split assignment rule and history-item
    cap: not reported. Internal: SFT train/eval 1139832/60168, GRPO training prompts 100326, and about 36K disjoint constrained-generation
    evaluation prompts; allocation rules not reported.'
  candidates: 'Valid-catalog SID trie and 50-beam generated ranking for public evaluation. Full-catalog versus sampled-negative
    evaluation and history-item exclusion: not reported.'
  visibility: 'warm; no unseen-item protocol is defined. Easy/Medium/Hard diagnostics measure frozen-SFT prefix/target recovery,
    not item holdouts. Item-level exposure to the pretrained tokenizer: not reported.'
  sid: 'Public: official frozen MiniOneRec RQ-VAE assignments from Qwen text embeddings, 3 levels x256 codes. Internal: 4
    levels x2048 codes; SID construction details not reported. Collision handling: not reported for either setting.'
  inference_budget: 'Public: trie-constrained beam50, HR@5/10 and NDCG@5. Internal: level-wise Top1/20 recall; internal beam
    width not reported. Primary training/evaluation setup uses 8x A100 80GB; inference batch and latency not reported. G=16
    rollouts, Bmax=9 guided replacements and batch128 are training settings.'
  results_from: Paper's Table2 public and Table3 internal experiments plus appendix ablations/diagnostics. SFT-only, MiniOneRec-style
    GRPO, uniform GT injection, Sibling-GRPO and DASO share SFT initialization and fixed SID/trie per setting. One algorithm
    run per dataset/backbone/method; no multi-seed significance tests. No borrowed baseline scores are identified.
