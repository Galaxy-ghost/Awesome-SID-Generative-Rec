id: slide
name: SLIDE
title: 'SLIDE: Search-to-List Item Distillation for Single-Rollout Generative Retrieval'
authors: Zhan et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.34764
  code: null
problem: IV
stage: Training
representation: –
tokenization: –
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Greedy
poi: false
tldr: SLIDE concatenates a teacher's offline beam-search candidates into list-wise Semantic ID targets, so a student generates
  the whole top-K list in one greedy pass instead of item-level beam search.
tldr_zh: SLIDE 将教师模型离线束搜索得到的候选拼接为列表级 SID 目标，使学生模型通过单次贪心解码生成完整 top-K 列表，替代逐物品束搜索。
setup:
  datasets: FORGE Stage S3; industrial Taobao Search requests with about 12 training labels/request. Additional filtering
    rules not reported.
  split: 'FORGE: retain provided S3 train/evaluation sets. Taobao: 10 consecutive training days, immediately following day
    test. Validation allocation not reported.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: Three tokens/item. FORGE uses provided SID vocabulary, sizes not restated; Taobao codebooks [32768,8192,8192]. Tokenizer
    algorithm and collision handling not reported.
  inference_budget: Qwen2.5-0.5B student; single greedy rollout to EOS or 1024 tokens; HR@1/5/10/20. Beam reference [20,20,200];
    offline teacher distillation uses [20,20,20], 20-item targets. Serving hardware/batch/latency not reported; 32 H20 GPUs
    and global batch 8192 describe training.
  results_from: 'Original Table 2: direct-training greedy/beam references versus distilled greedy students; teacher sizes
    0.5B/3B/7B. Tables 3-6 analyze training, target construction, and supplementary RL.'
setup_where:
  datasets: 'Section 5.1: https://arxiv.org/html/2610.34764v1#S5.SS1.SSS0.Px1.p1'
  split: 'Section 5.1: https://arxiv.org/html/2610.34764v1#S5.SS1.SSS0.Px1.p1'
  candidates: 'Section 5.1 describes valid unique generated candidates, without evaluation negative-sampling details: https://arxiv.org/html/2610.34764v1#S5.SS1.SSS0.Px3.p1'
  visibility: 'Section 5.1 defines no unseen-item holdout: https://arxiv.org/html/2610.34764v1#S5.SS1'
  sid: 'Section 5.1/Appendix A.2: https://arxiv.org/html/2610.34764v1#S5.SS1.SSS0.Px4.p1 and https://arxiv.org/html/2610.34764v1#A1.SS2.p1'
  inference_budget: 'Section 5.1: https://arxiv.org/html/2610.34764v1#S5.SS1.SSS0.Px4.p1'
  results_from: 'Section 5.2 and Table 2: https://arxiv.org/html/2610.34764v1#S5.SS2.p1 and https://arxiv.org/html/2610.34764v1#S5.T2
    and https://arxiv.org/html/2610.34764v1#S5.T3 and https://arxiv.org/html/2610.34764v1#S5.T4 and https://arxiv.org/html/2610.34764v1#S5.T5
    and https://arxiv.org/html/2610.34764v1#S5.T6'
