summary: 'Generative retrieval (GR) typically relies on item-level beam search to retrieve candidates, leaving cross-item
  dependencies unmodeled and limiting direct optimization of list-level objectives. A natural alternative is to generate the
  entire list within a single autoregressive trajectory. However, greedy decoding with directly trained list-wise models substantially
  underperforms beam search. We identify two contributing factors: the broader search space explored by beam search and the
  positional bias of scarce positive signals, which deprives later positions of adequate supervision. To address these challenges,
  we propose $\textbf{SLIDE}$, a search-to-list item distillation framework that decouples offline search from online list
  generation. A teacher model retrieves high-quality candidates through offline item-level beam search, providing additional
  conversion-relevant supervision beyond sparse behavioral labels. Their Semantic IDs (SIDs) are then concatenated in beam-score
  order to form list-wise distillation targets. This search-to-list conversion transforms candidates retrieved along separate
  search paths into sequential item-generation targets within a single trajectory. Trained on these targets, the student generates
  the Top-$K$ list in a single greedy pass, also decoupling teacher scaling from online deployment. Experiments on FORGE and
  Taobao Search show that SLIDE substantially improves retrieval quality under single greedy decoding and, with stronger offline
  teachers, surpasses the beam-search reference. Supplementary RL experiments support the effectiveness of list-level generation.'
setup:
  datasets: FORGE Stage S3; industrial Taobao Search requests with about 12 training labels/request. Additional filtering
    rules not reported.
  split: 'FORGE: retain provided S3 train/evaluation sets. Taobao: 10 consecutive training days, immediately following day
    test. Validation allocation not reported.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: Three tokens/item. FORGE uses provided SID vocabulary, sizes not restated; Taobao codebooks [32768,8192,8192]. Tokenizer
    algorithm and collision handling not reported.
  inference_budget: Qwen2.5-0.5B student; single greedy rollout to EOS or 1024 tokens; HR@1/5/10/20. Beam reference [20,20,200];
    offline teacher distillation uses [20,20,20], 20-item targets. Serving hardware/batch/latency not reported; 32 H20 GPUs
    and global batch 8192 describe training.
  results_from: 'Original Table 2: direct-training greedy/beam references versus distilled greedy students; teacher sizes
    0.5B/3B/7B. Tables 3-6 analyze training, target construction, and supplementary RL.'
