id: minionerec
name: MiniOneRec
title: 'MiniOneRec: An Open-Source Framework for Scaling Generative Recommendation'
authors: Kong et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2510.24431
  code: https://github.com/AkaliKong/MiniOneRec
problem: psb
stage: n/a
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
