  datasets: 'Datasets: https://arxiv.org/html/2607.27944v1#S4.SS1.p1 and https://arxiv.org/html/2607.27944v1#A1.SS1.p1; statistics:
    https://arxiv.org/html/2607.27944v1#A1.T8; curated SID-construction subset: https://arxiv.org/html/2607.27944v1#A1.SS2.p1.'
  split: 'Shared split statement without allocation: https://arxiv.org/html/2607.27944v1#A1.SS3.p1.'
  candidates: 'Kuaishou distance-thresholded candidates and Foursquare full ranking: https://arxiv.org/html/2607.27944v1#A1.SS3.p2
