related:
- id: lgsid
  relation: competitor
  note: LGSID injects geography into one fused representation before quantization; LGRID disentangles geographic and semantic
    slots and quantizes them in two streams, cutting full-SID collisions from 97.0% to 39.9%.
  where: 'LGRID v1, baselines and Table 1: https://arxiv.org/html/2607.27944v1#S4.SS1.p2 and https://arxiv.org/html/2607.27944v1#S3.T1;
    collisions in Table 5: https://arxiv.org/html/2607.27944v1#S4.SS3.p4 and https://arxiv.org/html/2607.27944v1#S4.T5; candidate
    protocol follows LGSID: https://arxiv.org/html/2607.27944v1#A1.SS3.p2.'
- id: tiger
  relation: competitor
  note: TIGER's RQ-VAE on a single representation is the base SID baseline; LGRID keeps residual quantization but applies
    it per disentangled stream.
  where: 'LGRID v1, RQVAE baseline attributed to Rajput et al. (2023): https://arxiv.org/html/2607.27944v1#S4.SS1.p2; Table
    1 and Table 5: https://arxiv.org/html/2607.27944v1#S3.T1 and https://arxiv.org/html/2607.27944v1#S4.T5.'
- id: oneloc
  relation: alternative
  note: OneLoc adds geographic signals to SID generation through a shared representation; LGRID argues such geo-aware variants
    still entangle attributes.
  where: 'LGRID v1, Section 1 and Section 2.1: https://arxiv.org/html/2607.27944v1#S1.p3 and https://arxiv.org/html/2607.27944v1#S2.SS1.p1;
    not a baseline in Table 1.'
- id: gnpr-sid
  relation: alternative
  note: GNPR-SID builds POI SIDs from one fused embedding for next-POI generation; LGRID targets ranking features with disentangled
    geographic codes.
  where: 'LGRID v1, Section 1 and Section 2.1: https://arxiv.org/html/2607.27944v1#S1.p3 and https://arxiv.org/html/2607.27944v1#S2.SS1.p1;
    not a baseline in Table 1.'
