id: lgrid
name: LGRID
title: Interpretable Representation via LLM-Driven Generative Disentanglement for Local-Life Service Recommendation
authors: Zhang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2607.27944
  code: null
problem: I
stage: Representation
representation: Text+Geo
tokenization: DSRQ
backbone: Disc.
tokenizer: Fixed
objective: Discrim.
inference: Scoring
poi: true
tldr: LGRID encodes item fields jointly with an LLM, routes hidden states into geographic and semantic slots, and quantizes
  the two streams separately, instead of quantizing one entangled representation.
tldr_zh: LGRID 用 LLM 联合编码物品各字段，将隐状态路由到地理与语义槽位并分别量化两路表示，替代对混杂表示做单一量化。
evidence:
- field: problem
  where: https://arxiv.org/html/2607.27944v1#abstract1
  quote: semantic entanglement ... causing key attributes to be insufficiently preserved during quantization, degrading SID
    quality, and leading to severe SID collisions
  reason: Collisions are the consequence; the cause is lost key attributes (I). The interpretability complaint fits none of
    the six problems.
- field: stage
  where: §3, Fig. 2, p3
  reason: SD-Block and Synergistic Alignment act on the LLM hidden states before quantization.
- field: backbone
  where: Table 1, p6; p8
  reason: SIDs only serve as features for discriminative models (DIN, DIEN, SIM, HSTU).
setup:
  datasets: 'Kuaishou local-life industrial data (10,000,000 interactions, 6,673,350 users, 2,251,418 items, 1,000 categories)
    and public Foursquare (244,896 interactions, 1,084 users, 38,334 POIs, 401 categories; coarse location text derived from
    coordinates). SID-construction fine-tuning uses a curated, category-balanced subset of 120,000 training and 5,000 validation
    POIs with incomplete descriptions excluded. Interaction filtering rules: not reported.'
  split: All methods share the same train/validation/test split, but the split rule is not reported.
  candidates: 'Kuaishou: a spatially constrained candidate set within a fixed 15 km offline distance threshold (following
    LGSID), shared by all methods. Foursquare: full catalog (standard full-ranking protocol).'
  visibility: warm; no unseen-item protocol is defined. SID construction uses item text only and no interaction labels.
  sid: '4-token SID from dual-stream residual quantization of Qwen3-8B slot representations: 2 geographic codes + 2 semantic
    codes; per-level codebook size: not reported. For non-SID backbones, the SID embedding is concatenated with the original
    item-ID embedding; a collision-resolution rule is not reported. Full-SID collision rate is 39.9% on Kuaishou (RQ-VAE 98.0%,
    LGSID 97.0%).'
  inference_budget: n/a for generation (SIDs feed discriminative and sequential rankers that are scored by AUC). Offline SID
    construction 21.80 ms per item versus 13.97 ms for RQ-VAE; online input preparation 0.50 versus 0.48 ms per request (Table
    10); hardware for timing not stated in the main text. SID-construction fine-tuning uses 4 GPUs (effective batch 192);
    recommender batch 10,240.
  results_from: Table 1 (AUC across ten recommendation backbones with SID baselines on Kuaishou and Foursquare); Tables 2-4
    (full-corpus POI self-retrieval, attribute decoding, joint versus field-wise encoding); Table 5 (utilization and collision
    rate); Tables 6-7 (ablations); Section 4.5 and Table 10 (efficiency).
