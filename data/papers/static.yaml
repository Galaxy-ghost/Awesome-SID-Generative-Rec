id: static
name: STATIC
title: 'Vectorizing the Trie: Efficient Constrained Decoding for LLM-based Generative Retrieval on Accelerators'
authors: Su et al.
year: 2026
venue: KDD’26 ADS
links:
  arxiv: https://arxiv.org/abs/2602.22647
  code: https://github.com/youtube/static-constraint-decoding
problem: V
stage: Inference
representation: –
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Vec. C-Beam
poi: false
tldr: STATIC flattens the prefix tree of valid Semantic IDs into a sparse CSR matrix, turning trie traversal into vectorized
  operations for constrained decoding on TPUs and GPUs.
tldr_zh: STATIC 将合法 SID 前缀树展平为稀疏 CSR 矩阵，把前缀树遍历转化为可在 TPU 和 GPU 上向量化执行的受约束解码运算。
evidence:
- field: problem
  where: https://arxiv.org/html/2602.22647v3#abstract1 (Abstract; excerpt)
  quote: incur severe latency penalties on hardware accelerators (TPUs/GPUs)
setup:
  datasets: YouTube corpus (100M-1B items); Amazon Beauty, Sports and Outdoors, Toys and Games (10K-20K items/domain). Filtering
    rules not reported.
  split: 'Amazon cold targets: newest 2% or 5% of items by oldest-review date. Training-sequence exclusion wording is internally
    contradictory; exact temporal/validation split not reported. YouTube training split not reported.'
  candidates: 'Restricted catalog: YouTube about 20M high-quality videos uploaded within 7 days; Amazon only the selected
    cold-item set. Unconstrained baselines can access the full catalog.'
  visibility: Amazon generator exclusion is ambiguous; tokenizer cold-item exposure is not reported. Section 6.2 calls training
    sequences no-cold-start but says to remove sequences without cold items. Unseen by generator only versus unseen by tokenizer
    too cannot be established.
  sid: 'YouTube: 8 levels x 2048 codes; Amazon: separate RQ-VAE per domain, 4 levels x 256. Collision handling not reported.'
  inference_budget: 'TPU v6e. YouTube: Gemini-based dense 3B, batch 2/chip, beam 70; added constraint overhead 0.033 ms/step,
    0.25% of inference time. Amazon: Gemma-based dense 1B, batch 16, beam 20, Recall@1.'
  results_from: 'Original Table 1: constraint-enforcement latency (100 trials); Table 2: STATIC-enabled PLUM deployment A/B;
    Table 3: Amazon cold-start Recall@1, reported as peak over 70 training epochs.'
setup_where:
  datasets: 'Sections 5.1/6.1 and Table 3: https://arxiv.org/html/2602.22647v3#S5.SS1.p1 and https://arxiv.org/html/2602.22647v3#S6.SS1.p1
    and https://arxiv.org/html/2602.22647v3#S6.T3'
  split: 'Section 6.2 and Appendix F: https://arxiv.org/html/2602.22647v3#S6.SS2.p1 and https://arxiv.org/html/2602.22647v3#A6.p2'
  candidates: 'Sections 5.2/6.2: https://arxiv.org/html/2602.22647v3#S5.SS2.p1 and https://arxiv.org/html/2602.22647v3#S6.SS2.p1'
  visibility: 'Sections 6.1/6.2: https://arxiv.org/html/2602.22647v3#S6.SS1.p1 and https://arxiv.org/html/2602.22647v3#S6.SS2.p1'
  sid: 'Sections 5.1/6.1: https://arxiv.org/html/2602.22647v3#S5.SS1.p1 and https://arxiv.org/html/2602.22647v3#S6.SS1.p1'
  inference_budget: 'Sections 5.1/5.2/6.1: https://arxiv.org/html/2602.22647v3#S5.SS1.p2 and https://arxiv.org/html/2602.22647v3#S5.SS2.p3
    and https://arxiv.org/html/2602.22647v3#S6.SS1.p2'
  results_from: 'Tables 1-3 and Appendix F: https://arxiv.org/html/2602.22647v3#S5.T1 and https://arxiv.org/html/2602.22647v3#S5.T2
    and https://arxiv.org/html/2602.22647v3#S6.T3 and https://arxiv.org/html/2602.22647v3#A6.p2'
related:
- id: plum
  relation: predecessor
  note: STATIC adds production decoding constraints to a PLUM-based YouTube retriever.
  where: 'STATIC v3, Sections 5.1/5.4: https://arxiv.org/html/2602.22647v3#S5.SS1.p2; https://arxiv.org/html/2602.22647v3#S5.SS4.p1.'
- id: tiger
  relation: predecessor
  note: STATIC retains hierarchical SID retrieval and accelerates validity masking.
  where: 'STATIC v3, Sections 2.1/6.1: https://arxiv.org/html/2602.22647v3#S2.SS1.p2; https://arxiv.org/html/2602.22647v3#S6.SS1.p1.'
- id: liger
  relation: alternative
  note: LIGER motivates the cold-start limitation; STATIC restricts decoding to cold items.
  where: 'STATIC v3, Section 2.1 (Yang et al., 2024) and Section 6: https://arxiv.org/html/2602.22647v3#S2.SS1.p3; https://arxiv.org/html/2602.22647v3#S6.SS2.p1.'
