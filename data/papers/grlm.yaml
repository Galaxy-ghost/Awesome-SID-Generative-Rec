setup:
  datasets: 'In-domain: Amazon Beauty, Sports, Toys (5-core, following TIGER and OneRec-Think; 22,363 / 12,101, 35,598 / 18,357,
    19,412 / 11,924 users / items). Cross-domain pairs Sports-Clothing and Phones-Electronics, built per GenCDR by merging
    overlapping users'' interactions chronologically. Appendix: ten Amazon 2014 categories merged.'
  split: Leave-one-out (allocation not restated beyond the label); in the cross-domain setting the last interaction in each
    domain of the pair is predicted separately.
  candidates: not reported (full catalog versus sampled evaluation candidates); validity of generated Term IDs is measured
    separately (Table 5).
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Term IDs: 5 natural-language terms per item from Qwen3-4B''s native vocabulary, produced by context-aware term generation
    (7 and 10 terms tested). Collision handling: not reported beyond relying on a large term space; an optional K-means compression
    maps 54,255 raw terms to K core terms (3,000-8,000).'
  inference_budget: 'Beam search with generation max length 30 tokens; beam width not reported. Qwen3-4B backbone; hardware,
    inference batch size, and latency: not reported. Valid rate at 10 is 0.989-0.998 (Table 5).'
  results_from: Table 2 (in-domain), Table 3 (cross-domain), Table 4 (ablations), Table 5 (Term ID validity), Appendix Tables
    7-9 (ten-dataset results, Term ID length, vocabulary compression).
