id: card
name: CARD
title: 'CARD: Non-Uniform Quantization of Visual Semantic Unit for Generative Recommendation'
authors: Wei et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.26427
  code: https://github.com/HAI-UESTC/CARD
problem: II
stage: Tokenization
representation: Text+Img+CF
tokenization: NU-RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'Abstract: "provides insufficient supervision for heterogeneous fusion"; "non-uniform embeddings lead to codeword
  imbalance and generation bias". Candidates: I / II (rule: tie broken by the title).'
tldr: CARD fuses text, image, and collaborative signals into a visual semantic unit before encoding and quantizes it with
  NU-RQ-VAE, whose learnable non-uniform transformation balances skewed embeddings.
evidence:
- field: problem
  where: https://arxiv.org/html/2604.26427v1#abstract1
  quote: provides insufficient supervision for heterogeneous fusion … non-uniform embeddings lead to codeword imbalance and
    generation bias
  reason: 'Candidates: I / II (rule: tie broken by the title).'
setup:
  datasets: 'Amazon Reviews: Grocery and Gourmet Food (Food), Cell Phones and Accessories (Phones), and Clothing, Shoes and
    Jewelry (Clothing), with 5-core filtering of users and items. Sizes (users / items / interactions): Food 14,681 / 8,713
    / 151,254; Phones 27,879 / 10,429 / 194,439; Clothing 39,387 / 23,033 / 278,677.'
  split: 'Per-user leave-one-out: most recent interaction for test, second most recent for validation, the rest for training;
    histories truncated or padded to the 20 most recent items.'
  candidates: full catalog
  visibility: warm; no unseen-item protocol is defined.
  sid: '4 non-uniform RQ-VAE levels x 256 codewords (dimension 32), quantizing a vision-language embedding of a 512 x 512
    rendered card (item image, title, collaborative-neighbor thumbnails). Collision handling: not reported.'
  inference_budget: 'Beam search over the code vocabulary; numerical beam width not reported. T5-style encoder-decoder with
    4 layers each and 6 heads. Recall and NDCG at K=5, 10, and 20. Hardware, inference batch size, and latency: not reported.'
  results_from: Table 2 (Food, Phones, Clothing; paired t-tests against the best baseline); Tables 3-4 (ablations of the two
    CARD variants); Table 5 (non-uniform quantization with different quantizers); Table 6 (text-only encoding).
setup_where:
  datasets: 'Categories, 5-core filtering, truncation: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS1.p1; statistics: https://arxiv.org/html/2604.26427v1#S4.T1.'
  split: 'Leave-one-out allocation and history length: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS1.p1.'
  candidates: 'Full ranking over the entire item set: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS2.p1.'
  visibility: 'Standard leave-one-out with no cold-start experiment: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS1.p1.'
  sid: 'K=4 codebooks x 256 vectors of dimension 32: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS3.p1; non-uniform RQ-VAE
    over a vision-language encoding of a rendered item card: https://arxiv.org/html/2604.26427v1#S3.SS2.SSS1.p1 and https://arxiv.org/html/2604.26427v1#S4.SS1.SSS3.p2;
    no collision rule found in Sections 3-4.'
  inference_budget: 'Beam search with top-B partial sequences, no numerical B: https://arxiv.org/html/2604.26427v1#S3.SS3.p2;
    backbone: https://arxiv.org/html/2604.26427v1#S4.SS1.SSS3.p1.'
  results_from: 'Main table: https://arxiv.org/html/2604.26427v1#S4.T2; ablations: https://arxiv.org/html/2604.26427v1#S4.T3
    and https://arxiv.org/html/2604.26427v1#S4.T4; plug-in quantizers: https://arxiv.org/html/2604.26427v1#S4.T5; text-only
    variants: https://arxiv.org/html/2604.26427v1#S4.T6.'
related:
- id: macrec
  relation: competitor
  note: MACRec reduces codebook conflicts by cross-modal quantization and multi-aspect alignment of separate modalities; CARD
    renders image, title, and neighbors into one card and quantizes it with a non-uniform RQ-VAE.
  where: 'CARD v1, Section 4.1.4 baselines: https://arxiv.org/html/2604.26427v1#S4.I1.i9.p1; Table 2: https://arxiv.org/html/2604.26427v1#S4.T2;
    Section 2.1: https://arxiv.org/html/2604.26427v1#S2.SS1.p1.'
- id: mql4grec
  relation: competitor
  note: MQL4GRec quantizes each modality into its own SIDs with pre-training; CARD uses one unified visual semantic unit,
    and the comparison disables MQL4GRec's extra-category pre-training.
  where: 'CARD v1, Section 4.1.4 baselines: https://arxiv.org/html/2604.26427v1#S4.I1.i8.p1; implementation note on pre-training:
    https://arxiv.org/html/2604.26427v1#S4.SS1.SSS3.p1; Table 2: https://arxiv.org/html/2604.26427v1#S4.T2.'
- id: letter
  relation: competitor
  note: LETTER regularizes a uniform RQ-VAE with collaborative and diversity terms; CARD changes the quantizer to a non-uniform
    one and the input to a rendered multimodal card.
  where: 'CARD v1, Section 4.1.4 baselines: https://arxiv.org/html/2604.26427v1#S4.I1.i7.p1; Table 2: https://arxiv.org/html/2604.26427v1#S4.T2.'
- id: tiger
  relation: competitor
  note: TIGER quantizes text embeddings with a uniform RQ-VAE; CARD keeps the same codebook shape and generator but replaces
    the input and the quantization rule.
  where: 'CARD v1, Section 4.1.4 baselines: https://arxiv.org/html/2604.26427v1#S4.I1.i6.p1; Table 2: https://arxiv.org/html/2604.26427v1#S4.T2;
    Table 6 text-only TIGER variants: https://arxiv.org/html/2604.26427v1#S4.T6.'
- id: vq-rec
  relation: competitor
  note: VQ-Rec pools product-quantized code embeddings in a discriminative model; CARD generates hierarchical non-uniform
    RQ codes autoregressively.
  where: 'CARD v1, Section 4.1.4 baselines: https://arxiv.org/html/2604.26427v1#S4.I1.i5.p1; Table 2: https://arxiv.org/html/2604.26427v1#S4.T2.'
