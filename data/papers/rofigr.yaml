id: rofigr
name: RoFiGR
title: 'RoFiGR: Coarse Routing, Fine Refinement via Level-Adaptive Distillation in Multimodal Generative Recommendation'
authors: Dai et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.39470
  code: null
problem: I
stage: Tokenization
representation: Text+Img+CF
tokenization: CF-Aligned MM RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Aux.
inference: C-Beam
poi: false
tldr: RoFiGR aligns coarse Semantic ID code vectors with collaborative embeddings and distills a sequential teacher over legal
  branches with level-adaptive weights, to reduce early routing errors.
tldr_zh: RoFiGR 将粗粒度 SID 码向量与协同嵌入对齐，并用按层级自适应的权重在合法分支上蒸馏序列推荐教师，减少早期路由错误。
setup:
  datasets: Amazon Instruments, Arts, Games; 5-core filtering, histories capped at 20; catalogs 6250/9416/13839 items, respectively.
  split: Per-user chronological last event test, penultimate validation, earlier events training; teacher fitting and student
    optimization use the training partition.
  candidates: full catalog; no sampled negatives. A target absent from the decoded stream union scores zero.
  visibility: warm; no unseen-item protocol is defined. MISSRec teacher fits training interactions; item embeddings/scores
    are frozen offline. Tokenizer exposure to test items not separately reported.
  sid: Separate text/image residual trees, each [64,256,256,512], code dimension 32. Collisions repaired at L4 or L3-L4, preserving
    L1-L2; complete SIDs uniquely identify items.
  inference_budget: 'Four independent trie beams of 20, item union and equal-weight stream fusion; HR@1/5/10, NDCG@5/10. One
    L20, FP16, batch 1, history 20: four-stream mean latency 56.7/60.9/63.7 ms (Instruments/Arts/Games); two-stream 31.8/33.5/35.1
    ms. Includes encoding through final sorting; no online teacher/reranker.'
  results_from: 'Original Table 3: five-seed main comparison; MACRec/SynGR retain native two-stream inference versus RoFiGR''s
    four. Tables 5/6 separate task exposure, stream fusion, matched beam slots and candidate caps.'
setup_where:
  datasets: 'Section 4.1: https://arxiv.org/html/2610.39470v1#S4.SS1.p1'
  split: 'Section 4.1: https://arxiv.org/html/2610.39470v1#S4.SS1.p1'
  candidates: 'Section 4.1: https://arxiv.org/html/2610.39470v1#S4.SS1.p2'
  visibility: 'Sections 3.1/4.1 define no item holdout: https://arxiv.org/html/2610.39470v1#S3.SS1.p2 and https://arxiv.org/html/2610.39470v1#S4.SS1.p1'
  sid: 'Sections 3.2/3.6: https://arxiv.org/html/2610.39470v1#S3.SS2.p2 and https://arxiv.org/html/2610.39470v1#S3.SS6.p1'
  inference_budget: 'Sections 3.5/4.8: https://arxiv.org/html/2610.39470v1#S3.SS5.p3 and https://arxiv.org/html/2610.39470v1#S4.SS8.p2'
  results_from: 'Section 4.1/4.2 and Tables 3/5/6: https://arxiv.org/html/2610.39470v1#S4.SS1.p2 and https://arxiv.org/html/2610.39470v1#S3.T3
    and https://arxiv.org/html/2610.39470v1#S4.SS2.p1 and https://arxiv.org/html/2610.39470v1#S4.T5 and https://arxiv.org/html/2610.39470v1#S4.T6'
