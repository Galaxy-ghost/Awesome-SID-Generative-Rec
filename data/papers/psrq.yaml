modality_where:
  quote: Specifically, for the modal-joint information, we concatenated X^m as modal-joint embeddings X^o in R^(|I| x 2d)
    to perform PSRQ and generate modal-joint semantic IDs S^o_i for each item, where o represents multimodal joint information.
