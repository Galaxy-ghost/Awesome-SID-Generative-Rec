    https://arxiv.org/html/2508.20359v1#S5.I2.i2.p1, https://arxiv.org/html/2508.20359v1#S5.I2.i3.p1; statistics: https://arxiv.org/html/2508.20359v1#S5.T1.'
  split: 'Timestamp-ordered sequences, no split rule: https://arxiv.org/html/2508.20359v1#S5.I2.i1.p1 and https://arxiv.org/html/2508.20359v1#S5.SS1.SSS2.p1;
    online test: https://arxiv.org/html/2508.20359v1#S5.SS3.p1.'
  candidates: 'Pointwise AUC on labeled samples: https://arxiv.org/html/2508.20359v1#S5.SS1.SSS3.p1.'
  visibility: 'Cold-start = fewer than 30 interactions, not unseen: https://arxiv.org/html/2508.20359v1#S5.SS1.SSS1.p1.'
