id: psrq
name: PSRQ
title: Progressive Semantic Residual Quantization for Multimodal-Joint Interest Modeling in Music Recommendation
authors: Wang et al.
year: 2025
venue: CIKM’25
links:
  arxiv: https://arxiv.org/abs/2508.20359
  code: null
problem: I
stage: Tokenization
representation: Text+Img
tokenization: Prog. RQ
backbone: Encoder
tokenizer: Fixed
objective: Discrim.
inference: Scoring
poi: false
tldr: PSRQ generates modality-specific and modality-joint Semantic IDs that preserve prefix semantic features and models music
  interests with multi-codebook cross-attention, to reduce semantic drift in residual quantization.
tldr_zh: PSRQ 生成保留前缀语义特征的模态特定与模态联合 SID，并用多码本交叉注意力建模音乐兴趣，减轻残差量化中的语义漂移。
evidence:
- field: problem
  where: 'PSRQ v1, Abstract, first limitation, quoted phrase: https://arxiv.org/html/2508.20359v1#abstract1'
  quote: intra-modal semantic degradation
- field: problem
  where: 'PSRQ v1, Abstract, second limitation, quoted phrase: https://arxiv.org/html/2508.20359v1#abstract1'
  quote: inter-modal modeling gaps
setup:
  datasets: 'Amazon Baby (81,423 users / 33,652 items; ratings of 4 or more are positives), an industrial music-streaming
    dataset from one week of logs (4,926,656 users / 1,387,247 songs; collections are positives, played-but-not-collected
    are negatives), and Music4all (14,127 users / 99,596 songs; repeated plays are positives). Items with fewer than 30 interactions
    are marked cold-start. Further filtering: not reported.'
  split: 'not reported (sequences are built by timestamp and trained for one epoch, but the train/test division is not described).
    Online: A/B test in February 2025 on the music platform against a DLRM ranker.'
  candidates: 'n/a for ranking candidates: evaluation is pointwise AUC and Logloss on labeled positive and negative samples;
    how negatives relate to user history is defined by the labels above.'
  visibility: warm; no unseen-item protocol is defined. 'Cold AUC' covers items with fewer than 30 interactions, which are
    low-frequency, not unseen.
  sid: 'Progressive Semantic Residual Quantization (PSRQ): layer-wise K-means over modality embeddings (text, image or audio)
    that preserves the prefix semantic feature, producing modal-specific and modal-joint semantic IDs; clusters per layer
    k = 64 (Amazon Baby), 256 (Industrial), 128 (Music4all), 3 layers. Collision handling: not reported.'
  inference_budget: 'n/a for generation (SIDs feed a DIN-style ranker with cross-attention, MCCA). MLLM feature extractors
    run on NVIDIA A100 GPUs; ranker inference batch size and latency: not reported.'
  results_from: 'Table 2 (All AUC, Cold AUC, Logloss versus multimodal and quantization-based rankers); Table 3 (quantizers
    added to DIN with text only); Table 4 (MCCA ablation); Section 5.3 (online A/B: collect +2.81%, full play +0.95%).'
