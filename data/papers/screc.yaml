related:
- id: rpg
  relation: predecessor
  note: SCRec adopts a decoder-only backbone following RPG but replaces tokenization with collaborative-enhanced RQ-VAE and
    adds semantic/manifold alignment modules.
  where: 'SCRec v1, Sections 3.1/4.1: https://arxiv.org/html/2609.13678v1#S3.SS1.p9; https://arxiv.org/html/2609.13678v1#S4.SS1.p5.'
- id: tiger
  relation: predecessor
  note: SCRec is also added to TIGER as a reusable module, improving collaborative input to tokenization and semantic guidance
    during generation.
  where: 'SCRec v1, Section 4.5 and Table 3: https://arxiv.org/html/2609.13678v1#S4.SS5.p1; https://arxiv.org/html/2609.13678v1#S4.T3.'
- id: liger
  relation: predecessor
  note: SCRec augments the hybrid LIGER backbone with the same reusable cross-stage supplementation module and measures its
    inference overhead.
  where: 'SCRec v1, Section 4.5 and Table 3: https://arxiv.org/html/2609.13678v1#S4.SS5.p1; https://arxiv.org/html/2609.13678v1#S4.SS5.p2;
    https://arxiv.org/html/2609.13678v1#S4.T3.'
