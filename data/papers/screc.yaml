id: screc
name: SCRec
title: Addressing Cross-Stage Decoupling of Semantic and Collaborative Signals in Generative Recommendation
authors: Dan
year: 2026
venue: RecSys’26
links:
  arxiv: https://arxiv.org/abs/2609.13678
  code: https://github.com/DanJiayi/SCRec
problem: I
stage: Representation
representation: Text+CF
tokenization: RQ-VAE
backbone: Non-AR / Enc-Dec
tokenizer: Fixed
objective: MTP + Ctr.
inference: Scoring / Beam†
poi: false
tldr: SCRec injects textualized collaborative signals into semantic tokenization, recalibrates semantic priors with learnable
  code embeddings during generation, and aligns codebook and semantic spaces, to couple the two stages.
tldr_zh: SCRec 将文本化的协同信号注入语义编号，在生成时用可学习码嵌入校准语义先验，并对齐码本与语义空间以耦合两个阶段。
evidence:
- field: problem
  where: https://arxiv.org/html/2609.13678v1#abstract1 (Abstract)
  quote: item tokenization is largely dominated by textual semantics with limited incorporation of collaborative signals
- field: problem
  where: https://arxiv.org/html/2609.13678v1#abstract1 (Abstract)
  quote: the generation stage tends to overlook the original semantic information
setup:
  datasets: Amazon Reviews Beauty, Sports and Outdoors, Toys and Games. Filtering and maximum history length not reported
    directly; preprocessing settings delegated to RPG.
  split: 'Per-user chronological leave-last-out: final interaction test, penultimate validation, remaining interactions training;
    shared across baselines.'
  candidates: not reported; evaluation configurations are delegated to RPG without specifying the candidate universe or negative
    sampling.
  visibility: warm; no unseen-item protocol is defined. SASRec for top-10 collaborative neighbors is pretrained on training
    data; tokenizer fitting exposure to test items not reported.
  sid: RQ-VAE with 256 entries/codebook and latent dimension 256, quantizing fused item-text and textualized-neighbor embeddings.
    Semantic level count and collision handling not reported.
  inference_budget: 'Main decoder-only backbone follows RPG, with TIGER/LIGER module variants. Exact main inference procedure,
    prediction-head structure and beam width not reported; Recall/NDCG@5/10. General experiment GPU: one RTX 4090; inference
    batch size and absolute latency not reported. Beauty module inference-time increases: TIGER 6.19%, LIGER 0.54%, averaged
    over ten runs.'
  results_from: 'Original Table 1: main comparison; baselines including RPG rerun in the same environment, TIGER/LIGER evaluated
    through the same LIGER codebase. Table 2: ablations; Table 3: backbone extensions; Tables 4-5: alternative fusion/alignment.
    No imported baseline results stated.'
