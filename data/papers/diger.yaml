  where: §3, p3; p6
  reason: Decoding not stated; implementation 'followed the settings in [29]' (ETEGRec); inferred from ETEGRec (Beam in Table
    1).
setup:
  datasets: B-Shop (cosmetic products), I-Shop (music-related products), Yelp (restaurants); remove users/items with fewer
    than five interactions. LLaMA-7B-generated item content; review text supplies interactions only. History cap not reported.
  split: Leave-one-out; exact validation/test allocation not reported. All reported results use the test set.
  candidates: full catalog; predicted item ranked against the full item set.
  visibility: warm; no unseen-item protocol is defined. Pretrained RQ-VAE/content-encoder exposure to test items not reported.
  sid: 'Pretrained RQ-VAE initialization, then jointly optimized differentiable IDs: 3 code positions x 256 entries plus one
    conflict code. Conflict-code assignment details not reported. Training uses Gumbel exploration with uncertainty decay;
    validation/inference tokenizer assignments are deterministic.'
  inference_budget: Autoregressive next-SID generation; Recall/NDCG@10. Decoder search/beam, prefix constraints, inference
    batch and latency not reported. Experiments use two H100 GPUs; tokenizer argmax is reported separately from generation.
  results_from: Original Tables 2/3 compare DIGER variants and baselines; main DIGER uses FrqUD. Most baseline results are
    quoted from LETTER (Wang et al., 2024); implemented methods are validation-tuned. Original Tables 4/5 give component and
    capacity/length ablations.
