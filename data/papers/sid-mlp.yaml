id: sid-mlp
name: SID-MLP
title: MLPs are Efficient Distilled Generative Recommenders
authors: Guo et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.12617
  code: https://github.com/ztguo715/SID-MLP.git
problem: V
stage: Backbone
representation: Text
tokenization: RQ-VAE†
backbone: Enc-MLP
tokenizer: Fixed
objective: NTP + Aux.
inference: C-Beam
poi: false
tldr: SID-MLP distills an autoregressive Transformer decoder into position-specific MLP heads over a single user-context computation,
  replacing repeated attention steps in Semantic ID decoding.
tldr_zh: SID-MLP 将自回归 Transformer 解码器蒸馏为建立在单次用户上下文计算之上的按位置 MLP 预测头，替代 SID 解码中重复的注意力计算。
setup:
  datasets: 'Main: Amazon Reviews 2023 Musical Instruments, Industrial & Scientific and Video Games, 5-core. LC-Rec extension:
    Amazon Reviews 2018 Musical Instruments, Arts Crafts and Sewing and Video Games, filtering users/items with fewer than
    five interactions.'
  split: 'Main: chronological leave-last-out, history truncated to 20 items; four rolling next-item training targets per user;
    evaluation leave-one-out. Exact validation allocation: not reported. LC-Rec extension follows its protocol; exact allocation/history
    cap: not reported.'
  candidates: 'Evaluation over valid four-digit SIDs with a fixed item-to-SID prefix mask. Full-catalog versus sampled ranking
    and history-item exclusion: not reported.'
  visibility: 'warm; no unseen-item protocol is defined. Temporal-80/90 diagnostics select targets introduced after global
    80%/90% timestamps while reusing existing TIGER checkpoints, tokenizer and candidates; the paper explicitly excludes a
    strict zero-shot insertion interpretation. Tokenizer exposure to test items: not reported.'
  sid: 'Fixed teacher SID mapping: four digits, three residual-quantization codes with 256-way codebook plus a conflict-avoidance
    digit; main experiments use sentence-T5 SIDs. Tokenizer sensitivity tests RQ-KMeans, RQ-VAE and PSID. LC-Rec retains its
    four SID tokens.'
  inference_budget: 'Constrained beam 50, batch 32, Recall/NDCG@5/10; one context read followed by four sequential MLP heads.
    Main profile: one RTX A6000 48GB; timed forward passes, beam expansion, validity mask, item lookup and metrics, excluding
    initialization/loading/offline extraction. SID-MLP/++: 3706/4347 samples/s, 8.74x/10.25x TIGER-kv; reported 0.27/0.23
    ms/sample is inverse throughput. Peak memory on Instruments: 0.09/0.43GB. LC-Rec extension reports 38.04 samples/s end-to-end
    and 5194 decode-only; Figure4 uses decode-only LC-Rec rates excluding prefill. Extension beam/batch: not separately reported.'
  results_from: This paper's matched-checkpoint evaluations, baseline adaptations and ablations, not quoted baseline scores.
    Table3 main comparisons; Tables5/14 ablations, Table11 profile, Table12 seeds 42/43/44, Table15 temporal diagnostic. AtSpeed/EARN/NEZHA
    are ports to TIGER; NEZHA is also reproduced on LC-Rec. LC-Rec extension uses released Amazon-2018 checkpoints and retrains
    TIGER at three scales; Figure4 LC-Rec throughput excludes prefill.
