id: lessrec
name: LESSRec
title: 'LESSRec: Level-Specific History Modeling for Semantic ID-Based Recommendation'
authors: Yang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.37286
  code: null
problem: III
stage: Backbone
representation: Text / Text+CF
tokenization: RQ-VAE / R-KM / LETTER
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
tldr: LESSRec encodes the history separately at each Semantic ID level and restricts attention to the target token's level,
  adding an item-level semantic sequence, instead of attending to all levels.
tldr_zh: LESSRec 按各 SID 层级分别编码交互历史，将注意力限制在目标 token 所在层级并加入物品级语义序列，替代跨全部层级的全局注意力。
setup:
  datasets: Amazon Reviews 2023 Games/Software and earlier Amazon Beauty; iterative user/item 5-core filtering; histories
    capped at 20 items.
  split: Leave-one-out; exact validation/test allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. LETTER uses SASRec collaborative embeddings; its exposure to test
    items is not reported.
  sid: 'RQ-VAE, RQ-Kmeans, or LETTER: 4 levels x 256 codes, fixed offline; Sentence-T5 text embeddings. RQ-Kmeans uses trainable
    conditional subcodebooks. Collision handling not reported.'
  inference_budget: Trie-constrained beam 10; batch 32; single RTX 4090 24GB; K=5/10. End-to-end latency not reported; Figure
    6 measures encoder CUDA time per sample.
  results_from: 'Original Table 2: three-seed comparisons across tokenizers; baselines implemented using official code or
    RecBole. Table 6 reports training costs, not inference latency.'
setup_where:
  datasets: 'Section 4.1.1: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS1.p1'
  split: 'Section 4.1.3: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS3.p1'
  candidates: 'Section 4.1.3 specifies a shared candidate index but not full-catalog versus sampled evaluation: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS3.p1'
  visibility: 'Sections 4.1.3/4.1.4 define no item holdout: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS3.p1 and https://arxiv.org/html/2610.37286v1#S4.SS1.SSS4.p1'
  sid: 'Section 4.1.4 and Appendix B.2: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS4.p1 and https://arxiv.org/html/2610.37286v1#A2.SS2.p2'
  inference_budget: 'Sections 4.1.5/4.6 and Figure 6: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS5.p1 and https://arxiv.org/html/2610.37286v1#S4.F6'
  results_from: 'Section 4.1.5 and Tables 2/6: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS5.p1 and https://arxiv.org/html/2610.37286v1#S4.T2
    and https://arxiv.org/html/2610.37286v1#S4.T6'
related:
- id: tiger
  relation: predecessor
  note: LESSRec reorganizes TIGER's history encoding by semantic level.
  where: 'LESSRec v1, Section 4.1.2 and Table 2: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS2.p1; https://arxiv.org/html/2610.37286v1#S4.T2.'
- id: letter
  relation: predecessor
  note: LETTER supplies one of the three fixed tokenizers tested with LESSRec.
  where: 'LESSRec v1, Section 4.1.4 and Table 2: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS4.p1; https://arxiv.org/html/2610.37286v1#S4.T2.'
- id: discrec
  relation: competitor
  note: DiscRec models intra-item structure; LESSRec separates same-level histories across items.
  where: 'LESSRec v1, Section 5.3 and Table 2: https://arxiv.org/html/2610.37286v1#S5.SS3.p1; https://arxiv.org/html/2610.37286v1#S4.T2.'
- id: rpg
  relation: competitor
  note: RPG predicts long unordered codes in parallel; LESSRec models hierarchical level-specific histories.
  where: 'LESSRec v1, Section 4.1.2 and Table 2: https://arxiv.org/html/2610.37286v1#S4.SS1.SSS2.p1; https://arxiv.org/html/2610.37286v1#S4.T2.'
