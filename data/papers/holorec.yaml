id: holorec
name: HoloRec
title: 'HoloRec: Holistic Encoding and Interleaved Reasoning for Generative Recommendation'
authors: Zhao et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2606.15331
  code: null
problem: III
stage: Tokenization
representation: –
tokenization: Nested RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Aux.
inference: –
poi: false
summary: 构造多粒度语义码并交错推理，使编号结构支持推荐推理。
tldr: HoloRec builds hierarchical Semantic IDs by nested residual quantization with a reconstruction loss over all granularities
  and generates chain-of-thought steps inside decoding, instead of using external annotated rationales.
tldr_zh: HoloRec 用带全粒度重构损失的嵌套残差量化构建层级 SID，并在解码过程中直接生成思维链步骤，不依赖外部标注的推理文本。
setup:
  datasets: Amazon Beauty and Instruments; user/item five-core filtering.
  split: Leave-one-out; exact validation/test allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: Three nested granularities (8/16/32 dimensions), each with 4 residual levels x 256 codes; codebooks shared across granularities.
    Collision handling not reported.
  inference_budget: K=5/10; non-thinking and interleaved-thinking modes. Beam width, inference hardware/batch size, and measured
    latency not reported; A100 and batch 1024 describe training.
  results_from: 'Original Table 2: overall comparisons; Table 3: ablations.'
