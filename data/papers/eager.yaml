id: eager
name: EAGER
title: 'EAGER: Two-Stream Generative Recommender with Behavior-Semantic Collaboration'
authors: Wang et al.
year: 2024
venue: KDD’24
links:
  arxiv: https://arxiv.org/abs/2406.14017
  code: https://github.com/yewzz/EAGER
problem: I
stage: Backbone
representation: Text+CF
tokenization: Dual H-KM
backbone: Dual Enc-Dec
tokenizer: Fixed
objective: NTP + Ctr.
inference: Fusion
poi: false
summary: 'Abstract: "focus solely on either behavioral or semantic aspects of item information".'
tldr: EAGER decodes behavior tokens and semantic tokens with a shared encoder and two decoders, adding contrastive and semantic-guided
  transfer tasks, instead of using only one type of item information.
evidence:
- field: problem
  where: https://arxiv.org/html/2406.14017v2#abstract1
  quote: focus solely on either behavioral or semantic aspects of item information
setup:
  datasets: 'Amazon Product Reviews (May 1996-July 2018): Beauty, Sports and Outdoors, Toys and Games; Yelp 2019 transactions
    (January-December 2019). 5-core filtering of users and items. Sizes (users / items / interactions): Beauty 22,363 / 12,101
    / 198,360; Sports 35,598 / 18,357 / 296,175; Toys 19,412 / 11,924 / 167,526; Yelp 30,431 / 20,033 / 316,354.'
  split: 'Chronological leave-one-out: last item for test, second-to-last for validation, the rest for training; training
    histories limited to 20 items.'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-k lists come from beam search in two streams.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Two codes per item: behavior codes from DIN embeddings and semantic codes from Sentence-T5 embeddings, each built
    by hierarchical k-means with k=256 branches, splitting until each child cluster contains a single item; code length l
    follows from the item count and k.'
  inference_budget: 'Beam search in each of the behavior and semantic decoders returns top-k codes; the 2k predictions are
    merged by log-probability confidence. Table 6 (Beauty, top-k=5, beam size 100): 0.0325 s per sample for EAGER versus 0.0281
    s for TIGER; hardware and inference batch size not reported. Recall and NDCG at 5, 10, and 20.'
  results_from: Table 2 (Beauty, Sports, Toys, Yelp versus sequential, tree-based, and generative baselines); Table 3 (TSG/GCT/STT
    ablations); Tables 4, 5, 7 and Figures 4-6 (modalities, summary token, contrastive metric, layers, cluster number); Table
    6 (inference speed).
setup_where:
  datasets: '5-core filtering and timestamp ordering: https://arxiv.org/html/2406.14017v2#S4.SS1.p1; Amazon and Yelp scope:
    https://arxiv.org/html/2406.14017v2#S4.I2.i1.p1 and https://arxiv.org/html/2406.14017v2#S4.I2.i2.p1; statistics: https://arxiv.org/html/2406.14017v2#S3.T1.'
  split: 'Leave-one-out allocation and history cap: https://arxiv.org/html/2406.14017v2#S4.SS1.p2.'
  candidates: 'Metrics only: https://arxiv.org/html/2406.14017v2#S4.SS1.p2.'
  visibility: 'Standard leave-one-out with no cold-start experiment: https://arxiv.org/html/2406.14017v2#S4.SS1.p2.'
  sid: 'Dual hierarchical k-means codes until each leaf holds one item: https://arxiv.org/html/2406.14017v2#S3.SS3.p3; k=256:
    https://arxiv.org/html/2406.14017v2#S4.SS1.p3; length varies with k: https://arxiv.org/html/2406.14017v2#S4.SS5.p2.'
  inference_budget: 'Two-stream beam search and confidence ranking: https://arxiv.org/html/2406.14017v2#S3.SS6.p2; speed table:
    https://arxiv.org/html/2406.14017v2#S4.T6.'
  results_from: 'Main: https://arxiv.org/html/2406.14017v2#S3.T2; ablations: https://arxiv.org/html/2406.14017v2#S4.T3; analyses:
    https://arxiv.org/html/2406.14017v2#S4.T4, https://arxiv.org/html/2406.14017v2#S4.T5, https://arxiv.org/html/2406.14017v2#S4.T7;
    speed: https://arxiv.org/html/2406.14017v2#S4.T6.'
related:
- id: tiger
  relation: competitor
  note: TIGER decodes one content-based semantic ID; EAGER decodes behavior and semantic hierarchical k-means codes with two
    decoders and merges them by confidence.
  where: 'EAGER v2, baselines: https://arxiv.org/html/2406.14017v2#S4.I6.i1.p1; Table 2: https://arxiv.org/html/2406.14017v2#S3.T2;
    speed comparison in Table 6: https://arxiv.org/html/2406.14017v2#S4.T6.'
- id: seater
  relation: alternative
  note: SEATER also uses tree-structured identifiers for generative retrieval; EAGER builds separate behavior and semantic
    trees and aligns them with contrastive and transfer tasks.
  where: 'EAGER v2, Section 1 cites SEATER among generative recommenders: https://arxiv.org/html/2406.14017v2#S1.p2; not a
    baseline in Table 2.'
- id: lmindexer
  relation: alternative
  note: LMIndexer learns semantic IDs from text with a language model; EAGER keeps fixed k-means codes from pre-trained behavior
    and semantic encoders.
  where: 'EAGER v2, Section 2 cites LMIndexer among semantic indexing methods: https://arxiv.org/html/2406.14017v2#S2.p2;
    not a baseline in Table 2.'
- id: cost
  relation: alternative
  note: CoST learns RQ codes with a contrastive objective, whereas EAGER clusters frozen embeddings and adds contrastive learning
    on the generator side.
  where: 'EAGER v2, Section 2 cites CoST: https://arxiv.org/html/2406.14017v2#S2.p2. CoST v2, Section 2 in turn cites EAGER
    as a hierarchical k-means tokenizer: https://arxiv.org/html/2404.14774v2#S2.p2.'
