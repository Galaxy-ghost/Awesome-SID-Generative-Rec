id: q-bert4rec
name: Q-BERT4Rec
title: 'Q-BERT4Rec: Quantized Semantic-ID Representation Learning for Multimodal Recommendation'
authors: Huang and Gai
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2512.02474
  code: null
problem: I
stage: Representation
representation: Text+Img+CF
tokenization: RQ-VAE
backbone: Encoder (Non-AR)
tokenizer: Fixed
objective: Masked
inference: Non-AR
poi: false
tldr: Q-BERT4Rec fuses text, image, and structural features into item embeddings, quantizes them into Semantic ID tokens by
  residual vector quantization, and pre-trains a bidirectional encoder with several masking strategies.
tldr_zh: Q-BERT4Rec 将文本、图像与结构化特征融合为物品嵌入，经残差向量量化转为 SID token，并用多种掩码策略预训练双向编码器。
evidence:
- field: problem
  where: https://arxiv.org/html/2512.02474v2#abstract1 (Abstract)
  quote: rely on discrete item IDs that lack semantic meaning and ignore rich multimodal information
setup:
  datasets: 'Amazon Reviews 2018: pre-training on six source domains (Pet, Cell, Automotive, Tools, Toys, Sports) and fine-tuning
    on Musical Instruments, Arts Crafts and Sewing, Video Games (same statistics table as MQL4GRec). Filtering rules: not
    restated.'
  split: 'Leave-one-out: most recent interaction for test, second most recent for validation, the rest for training.'
  candidates: not reported explicitly; at inference the masked last position is filled with the most probable semantic ID
    over the item set (HR and NDCG at 1, 5, 10).
  visibility: warm; no unseen-item protocol is defined.
  sid: 4-level RQ-VAE x 256 codewords (dimension 32) over LLaMA text and CLIP-ViT image features fused by a cross-modal semantic
    injection module. Collisions are resolved by MQL4GRec's distance-based token reallocation.
  inference_budget: Bidirectional masked prediction of the last position (no beam search); 4-layer Transformer encoder. NVIDIA
    RTX 4090 GPUs (four for pre-training, one for fine-tuning). Table 6 reports per-sample inference latency of about 2.66-2.67
    ms with under 6M parameters.
  results_from: Table 2 (Instruments, Arts, Games versus traditional, Transformer, multimodal, prompt-LLM, and semantic-ID
    baselines); Tables 3-4 (modalities and pre-training strategies); Figures 3-5 (layers, mask ratio, dropout); Table 6 (complexity
    and latency).
setup_where:
  datasets: 'Source and target domains: https://arxiv.org/html/2512.02474v2#S4.SS1.p1, https://arxiv.org/html/2512.02474v2#S4.SS1.p2,
    https://arxiv.org/html/2512.02474v2#S4.SS1.p3; statistics: https://arxiv.org/html/2512.02474v2#S3.T1.'
  split: 'Leave-one-out allocation: https://arxiv.org/html/2512.02474v2#S4.SS1.p4.'
  candidates: 'Argmax over item semantic IDs: https://arxiv.org/html/2512.02474v2#S3.SS6.p2; metrics: https://arxiv.org/html/2512.02474v2#S4.SS1.p4.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2512.02474v2#S4.SS1.p4.'
  sid: '4 levels x 256 x 32, MQL4GRec reallocation for collisions: https://arxiv.org/html/2512.02474v2#S4.SS1.p6 and https://arxiv.org/html/2512.02474v2#S3.SS4.p7.'
  inference_budget: 'Masked prediction at inference: https://arxiv.org/html/2512.02474v2#S3.SS6.p2; hardware: https://arxiv.org/html/2512.02474v2#S4.SS1.p8;
    latency: https://arxiv.org/html/2512.02474v2#A2.T6.'
  results_from: 'Main: https://arxiv.org/html/2512.02474v2#S3.T2; ablations: https://arxiv.org/html/2512.02474v2#S3.T3 and
    https://arxiv.org/html/2512.02474v2#S4.T4; sensitivity: https://arxiv.org/html/2512.02474v2#S4.SS4.p1; complexity: https://arxiv.org/html/2512.02474v2#A2.T6.'
related:
- id: mql4grec
  relation: competitor
  note: MQL4GRec generates multimodal quantitative language autoregressively; Q-BERT4Rec reuses its collision reallocation
    but fuses modalities before quantization and predicts masked SIDs bidirectionally.
  where: 'Q-BERT4Rec v2, collision handling follows Zhai et al. (2025): https://arxiv.org/html/2512.02474v2#S3.SS4.p7; Table
    2 baseline: https://arxiv.org/html/2512.02474v2#S3.T2.'
- id: tiger
  relation: competitor
  note: TIGER decodes SIDs left to right with an encoder-decoder; Q-BERT4Rec uses a BERT-style encoder with multi-mask pre-training.
  where: 'Q-BERT4Rec v2, Table 2 semantic-ID baseline: https://arxiv.org/html/2512.02474v2#S3.T2; Appendix A baselines: https://arxiv.org/html/2512.02474v2#A1.I5.i1.p1.'
- id: vq-rec
  relation: competitor
  note: VQ-Rec uses product-quantized text codes for transfer; Q-BERT4Rec quantizes fused text-image features with RQ-VAE
    and pre-trains on six source domains.
  where: 'Q-BERT4Rec v2, Table 2 VQ/multimodal baseline: https://arxiv.org/html/2512.02474v2#S3.T2.'
- id: cid
  relation: competitor
  note: P5-CID uses collaborative IDs in a prompt-based LLM; Q-BERT4Rec uses multimodal semantic IDs in a small masked Transformer.
  where: 'Q-BERT4Rec v2, Table 2 prompt-LLM baseline: https://arxiv.org/html/2512.02474v2#S3.T2; Appendix A: https://arxiv.org/html/2512.02474v2#A1.I4.i1.p1.'
