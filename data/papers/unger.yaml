id: unger
name: UNGER
title: 'UNGER: Generative Recommendation with A Unified Code via Semantic and Collaborative Integration'
authors: Xiao et al.
year: 2025
venue: TOIS’25
links:
  arxiv: https://arxiv.org/abs/2502.06269
  code: null
problem: I
stage: Representation
representation: Text+CF
tokenization: R-KM
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Ctr.
inference: Beam
poi: false
summary: 提出统一表示、离散编码及完整 Unicode 生成查表流程。
tldr: UNGER learns one integrated semantic-collaborative embedding through cross-modality alignment and next-item prediction,
  quantizes it into a unified code, and adds intra-modality distillation, instead of separate codes per modality.
tldr_zh: UNGER 通过跨模态对齐与下一物品预测学习统一的语义-协同嵌入并量化为单一码，同时加入模态内蒸馏，替代各模态分别编码的做法。
setup:
  datasets: 'Amazon Reviews 2014: Beauty, Sports and Outdoors, Toys and Games; user/item 5-core.'
  split: 'Per-user chronological leave-one-out: last item test, penultimate validation, earlier items training; training history
    capped at 20 items.'
  candidates: not reported; full-catalog versus sampled evaluation and history exclusion are unspecified.
  visibility: warm; no unseen-item protocol is defined.
  sid: DIN collaborative and Llama2-7b textual representations are integrated before fixed hierarchical k-means residual quantization;
    4 levels, 256 clusters per level; item-code lookup table; main-tokenizer collision handling not reported.
  inference_budget: Autoregressive beam search, width 100; lookup and confidence ranking for top-k. Beauty speed comparison
    separately uses top-5 and beam 100; inference hardware and batch size not reported.
  results_from: UNGER experiments averaged over 5 runs (seeds 2020–2024), with standard errors in Table 3; unstarred baseline
    scores copied from Zhou et al. (2020) and Wang et al. (2024c), starred TIGER and ColaRec scores reimplemented for missing
    statistics.
