  where: '2506.01673v1 #S1.p12.1；层次 ID 由物品文本嵌入递归 k-means 得到（#S3.SS2.SSS1）'
note: Table 1 记 Text+CF；协同信号只作文本属性进生成器输入（#S3.SS2.SSS2），不进构码。
