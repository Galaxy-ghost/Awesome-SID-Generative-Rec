id: gram
name: GRAM
title: 'Gram: Generative recommendation via semantic-aware multi-granular late fusion'
authors: Lee et al.
year: 2025
venue: ACL’25
links:
  arxiv: https://arxiv.org/abs/2506.01673
  code: https://github.com/skleee/GRAM
problem: I
stage: Tokenization
representation: Text+CF
tokenization: H-KM
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
tldr: GRAM translates hierarchical and collaborative item relationships into LLM vocabulary words and encodes multi-granular
  prompts separately, fusing them only at decoding, to use lengthy item text efficiently.
tldr_zh: GRAM 将层级与协同物品关系转化为 LLM 词表中的词，分别编码多粒度提示并仅在解码时融合，以利用长物品文本。
evidence:
- field: problem
  where: https://arxiv.org/html/2506.01673v1#abstract1
  quote: (i) incorporating implicit item relationships and (ii) utilizing rich yet lengthy item information
setup:
  datasets: 'Amazon Beauty, Toys and Games, Sports and Outdoors, and Yelp, with 5-core filtering of users and items (following
    Hua et al. 2023). Sizes (users / items / interactions): Beauty 22,363 / 12,101 / 198,502; Toys 19,412 / 11,924 / 167,597;
    Sports 35,598 / 18,357 / 296,337; Yelp 30,431 / 20,033 / 316,354.'
  split: 'Per-user leave-one-out: last item for test, second last for validation, the rest for training; sequences capped
    at 20 items. Three seeds.'
  candidates: full catalog (full-ranking evaluation on all items rather than sampled items).
  visibility: warm; no unseen-item protocol is defined. A head/tail analysis splits test users by target-item popularity (top
    20% versus bottom 80%).
  sid: 'Hierarchical textual IDs: recursive k-means over item text embeddings, stopping when a cluster has fewer than c items
    or depth reaches l; each cluster index is mapped to an existing LLM vocabulary token chosen by TF-IDF. Final (l, k, c):
    Beauty (7, 128, 128); Toys (5, 32, 32); Sports and Yelp (7 or 9, 32, 32). Duplicate IDs receive an appended digit for
    uniqueness.'
  inference_budget: 'Constrained beam search with beam size 50 and a Trie over valid IDs; T5-small on OpenP5. Table 7: average
    inference time per user sequence with all user sequences in a single batch on one NVIDIA A6000 GPU (Beauty 0.2008 s, Toys
    0.1605 s; LC-Rec 1.8312 s and 1.8125 s).'
  results_from: Table 2 (four datasets versus six sequential and eight generative baselines; three seeds); Table 3 (ablations);
    Table 4 (ID types); Figures 6-8 (head/tail, ID length, similar items); Tables 6-7 (preprocessing and inference time);
    Tables 8-9 (baseline reproduction fixes for ELMRec and IDGenRec).
setup_where:
  datasets: 'Datasets and 5-core: https://arxiv.org/html/2506.01673v1#S4.p1; statistics: https://arxiv.org/html/2506.01673v1#A7.T10.'
  split: 'Leave-one-out allocation and history cap: https://arxiv.org/html/2506.01673v1#S4.p2 and https://arxiv.org/html/2506.01673v1#S4.p4.'
  candidates: 'Full ranking on all items: https://arxiv.org/html/2506.01673v1#S4.p2.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2506.01673v1#S4.p2; head/tail by target
    popularity: https://arxiv.org/html/2506.01673v1#S5.SS3.p2.'
  sid: 'Hierarchical k-means textual IDs: https://arxiv.org/html/2506.01673v1#S3.SS2.SSS1.p2 and https://arxiv.org/html/2506.01673v1#S3.SS2.SSS1.p3;
    final settings: https://arxiv.org/html/2506.01673v1#A7.T12; duplicate-ID digit: https://arxiv.org/html/2506.01673v1#S3.SS2.SSS1.p3.'
  inference_budget: 'Constrained beam 50 with Trie: https://arxiv.org/html/2506.01673v1#S4.p4 and https://arxiv.org/html/2506.01673v1#S3.SS4.p2;
    timing: https://arxiv.org/html/2506.01673v1#A3.T7.'
  results_from: 'Main: https://arxiv.org/html/2506.01673v1#S4.T2; ablation: https://arxiv.org/html/2506.01673v1#S5.T3; ID
    types: https://arxiv.org/html/2506.01673v1#S5.T4; reproducibility: https://arxiv.org/html/2506.01673v1#A3.T8 and https://arxiv.org/html/2506.01673v1#A4.T9.'
related:
- id: lc-rec
  relation: competitor
  note: LC-Rec maps RQ-VAE codes to new out-of-vocabulary tokens; GRAM builds hierarchical IDs from existing vocabulary tokens
    and verbalizes collaborative signals in item prompts.
  where: 'GRAM v1, Section 3.2.1 contrasts the token choice: https://arxiv.org/html/2506.01673v1#S3.SS2.SSS1.p3; baselines
    and Table 2: https://arxiv.org/html/2506.01673v1#S4.p3 and https://arxiv.org/html/2506.01673v1#S4.T2; inference time in
    Table 7: https://arxiv.org/html/2506.01673v1#A3.T7.'
- id: idgenrec
  relation: competitor
  note: IDGenRec generates textual IDs with a learned ID generator; GRAM derives hierarchical textual IDs by clustering, and
    the authors rerun IDGenRec without user IDs that leak test items.
  where: 'GRAM v1, baselines and Table 2: https://arxiv.org/html/2506.01673v1#S4.p3 and https://arxiv.org/html/2506.01673v1#S4.T2;
    reproduction in Table 9 and Appendix E: https://arxiv.org/html/2506.01673v1#A4.T9 and https://arxiv.org/html/2506.01673v1#A5.p3.'
- id: tiger
  relation: competitor
  note: TIGER uses RQ-VAE codes as new tokens; GRAM's ID-type study also tests RQ-VAE IDs inside GRAM against hierarchical
    textual IDs.
  where: 'GRAM v1, baselines and Table 2: https://arxiv.org/html/2506.01673v1#S4.p3 and https://arxiv.org/html/2506.01673v1#S4.T2;
    Table 4 ID types: https://arxiv.org/html/2506.01673v1#S5.T4 and https://arxiv.org/html/2506.01673v1#S5.SS3.p1.'
- id: cid
  relation: competitor
  note: P5-CID, P5-SID, and P5-SemID are fixed indexing schemes for P5; GRAM adds hierarchical semantic text IDs and collaborative
    prompts.
  where: 'GRAM v1, baselines and Table 2: https://arxiv.org/html/2506.01673v1#S4.p3 and https://arxiv.org/html/2506.01673v1#S4.T2;
    5-core setting follows Hua et al. (2023): https://arxiv.org/html/2506.01673v1#S4.p1.'
- id: letter
  relation: competitor
  note: LETTER learns a regularized RQ-VAE tokenizer; GRAM avoids learned codebooks and uses text clustering mapped to vocabulary
    tokens.
  where: 'GRAM v1, baselines and Table 2: https://arxiv.org/html/2506.01673v1#S4.p3 and https://arxiv.org/html/2506.01673v1#S4.T2.'
changes:
  representation:
    value: other
    quote: To bridge collaborative semantics to LLMs, we extract collaborative signals and convert them as an additional item
      attribute.
    where: '2506.01673v1 #S3.SS2.SSS2.p1.1；用 SASRec 取相似物品，再用层次 ID 写成文本属性（#S3.SS2.SSS2.p3.1），给生成器用，不进构码'
  tokenization: primary
  backbone:
    value: other
    quote: 'To effectively handle rich yet lengthy item metadata, we process user history as multiple prompts with different
      granularities: coarse-grained user prompts for holistic user preferences and fine-grained item prompts for detailed
      item attributes.'
    where: '2506.01673v1 #S1.p10.1；设计在 #S3.SS3（多粒度编码、在解码器里晚融合）'
  tokenizer: none
  objective: none
  inference: none
