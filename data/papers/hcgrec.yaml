id: hcgrec
name: HCGRec
title: 'Learning from Unreachable Rewards: Hint-Conditioned Reinforcement Learning for Generative Recommendation'
authors: Zhang et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2608.11980
  code: https://github.com/WncFht/GRec
problem: IV
stage: Training
representation: –
tokenization: RQ
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: Beam
poi: false
tldr: HCGRec gives a minimal target-prefix hint when GRPO rollouts miss the correct item, training hinted tokens with supervised
  loss and sampled suffixes with GRPO, to recover signal from zero-reward groups.
tldr_zh: HCGRec 在 GRPO 采样全部偏离正确物品时提供最小目标前缀提示，对提示 token 用监督损失、对采样后缀用 GRPO，从零奖励组中恢复训练信号。
setup:
  datasets: 'Amazon Musical Instruments, Arts/Crafts/Sewing, Video Games; maximum history 50. Filtering: not reported.'
  split: 'Per-user chronological leave-one-out: last item test, penultimate validation, remaining interactions training.'
  candidates: full catalog
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Four-token residual-quantization SIDs, shared across variants; codebook sizes and collision handling: not reported.'
  inference_budget: 'Beam 50; HR/NDCG@5/10/50; no target-prefix hints at inference. Inference hardware, batch size, latency:
    not reported.'
  results_from: 'Original Table 2: main comparison; Figures 2-6 and Sections 4.3-4.5: reachability, hint policy, task/loss
    ablations, credit weight.'
setup_where:
  datasets: 'Section 4.1.1: https://arxiv.org/html/2608.11980v2#S4.SS1.SSS1.p1'
  split: 'Section 4.1.2: https://arxiv.org/html/2608.11980v2#S4.SS1.SSS2.p1'
  candidates: 'Section 4.1.2: https://arxiv.org/html/2608.11980v2#S4.SS1.SSS2.p1'
  visibility: 'Section 4.1 defines no unseen-item evaluation: https://arxiv.org/html/2608.11980v2#S4.SS1'
  sid: 'Sections 3.1 and 4.1.1: https://arxiv.org/html/2608.11980v2#S3.SS1.p1 and https://arxiv.org/html/2608.11980v2#S4.SS1.SSS1.p1'
  inference_budget: 'Sections 3.5 and 4.1.2: https://arxiv.org/html/2608.11980v2#S3.SS5.p1 and https://arxiv.org/html/2608.11980v2#S4.SS1.SSS2.p1'
  results_from: 'Table 2 and Figures 2-6: https://arxiv.org/html/2608.11980v2#S4.T2 and https://arxiv.org/html/2608.11980v2#S4.F2
    and https://arxiv.org/html/2608.11980v2#S4.F6'
