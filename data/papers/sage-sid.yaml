id: sage-sid
name: SAGE-SID
title: 'SAGE: Sequence-level Adaptive Gradient Evolution for Generative Recommendation'
authors: Xie et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2601.21452
  code: null
problem: IV
stage: Training
representation: Text+Img†
tokenization: R-KM†
backbone: Dec-Only†
tokenizer: Fixed†
objective: NTP → RL
inference: –
poi: false
summary: 明确将 SAGE 应用于 OneRec-SAGE 的 SID 分支，并与原 GBPO 比较；文本分支不能代填 SID 配置。
tldr: SAGE-SID optimizes list-wise generators with a geometric-mean sequence ratio, decoupled multi-objective advantages,
  asymmetric adaptive bounds, and an entropy-aware penalty, replacing the symmetric bounds of GBPO.
setup:
  datasets: 'Amazon Reviews 2014 Sports/Beauty/Toys; RecIF-Bench: about 120M interactions, 200K users, Short Video/Ad/Product.
    Filtering not reported.'
  split: 'RecIF: 20% users held out, per-user histories separated temporally from future targets. Amazon split and validation
    allocation not reported.'
  candidates: not reported for the SID branch
  visibility: warm; no unseen-item protocol is defined. Amazon cold items are bottom 5% by training interaction frequency;
    RecIF holds out users, not explicitly items.
  sid: OneRec-SAGE uses Semantic IDs and OpenOneRec checkpoints/settings; SID length, codebook sizes and collision handling
    not reported here.
  inference_budget: Reported slate length 10; Amazon Recall/NDCG@5/10; RecIF Pass/Recall@1/32 and label AUC. SID beam width,
    inference hardware, batch size and latency not reported.
  results_from: OneRec-SAGE rows in Tables 1/2 (Amazon) and 3/4 (RecIF). RecIF task-specific sequential and TIGER baseline
    numbers are reused from the benchmark; OneRec variants use public checkpoints/settings.
