summary: 明确生成Res-Kmeans三位SID；首次2026-10-22在补搜窗口，提出新的latent对齐训练与高效推荐方法。
tldr: OneLatent compresses explicit chain-of-thought into learnable latent tokens through multi-view teacher traces, staged
  alignment, and curriculum post-training, instead of generating long reasoning traces at inference.
setup:
  datasets: Kuaishou LLM-Rec advertising and seven-day industrial local-services logs. Deduplicate user-item interactions
    by strongest feedback; remove samples lacking profile/target SID and history items lacking SIDs.
  split: 'Allocation rule: not reported. SFT/CoT/test counts: industrial 100063/59113/20393; public 60000/30000/10000. Conversion
    targets use at most 50 preceding interactions.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Multimodal Res-Kmeans, 3 levels x 1024 codes; collision handling: not reported.'
  inference_budget: 'vLLM beam search; SID/ID Hit@1/16/32/64; three fixed latent tokens, no rationale decoding. 872-instance
    test: total 3.17 s, 274.29 QPS. Beam width, hardware, inference batch size: not reported.'
  results_from: 'Reported Tables 2/3/7/9: main, matched-size scaling, efficiency, online A/B. Table 2''s final gains compare
    matched Think-OR, not strongest baseline; baseline borrowed/rerun provenance not reported.'
