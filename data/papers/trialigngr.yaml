related:
- id: sidreasoner
  relation: competitor
  note: SIDReasoner is the strongest baseline, aligning SIDs and language through enriched corpora and RL; TriAlignGR adds
    visual captions and mined interests before quantization and eight alignment tasks.
  where: 'TriAlignGR v3, Section 4.1: https://arxiv.org/html/2605.05249v3#S4.SS1.p1; Table 2: https://arxiv.org/html/2605.05249v3#S4.T2.'
- id: minionerec
  relation: predecessor
  note: TriAlignGR shares MiniOneRec's backbone, training protocol, and RQ-VAE configuration and isolates the effect of its
    SID enrichment against it.
  where: 'TriAlignGR v3, Section 4.1 comparison: https://arxiv.org/html/2605.05249v3#S4.SS1.p3; Appendix Table 8: https://arxiv.org/html/2605.05249v3#A5.T8.'
- id: letter
  relation: competitor
  note: LETTER regularizes a text tokenizer; TriAlignGR changes the tokenizer input to multimodal, interest-enriched embeddings.
  where: 'TriAlignGR v3, Table 2 baseline: https://arxiv.org/html/2605.05249v3#S4.T2.'
- id: etegrec
  relation: competitor
  note: ETEGRec trains tokenizer and generator jointly; TriAlignGR keeps a fixed tokenizer and adds multitask alignment.
  where: 'TriAlignGR v3, Table 2 baseline: https://arxiv.org/html/2605.05249v3#S4.T2.'
- id: lc-rec
  relation: competitor
  note: LC-Rec uses text-only SIDs with alignment tasks; TriAlignGR extends the task set with visual-semantic tasks.
  where: 'TriAlignGR v3, Table 2 baseline: https://arxiv.org/html/2605.05249v3#S4.T2.'
