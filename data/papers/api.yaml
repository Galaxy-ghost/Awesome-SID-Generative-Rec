poi: false
summary: Generative recommendation (GR) predicts the next item through its semantic ID (SID). Existing methods commonly fit
  SID vocabularies to pretrained language model (PLM) representations of item descriptions, incurring additional training
  costs and making vocabulary coverage dependent on the fitting domains. We observe that pretrained sparse autoencoders expose
  PLM features with human-interpretable semantic annotations, allowing feature indices to serve as a reusable SID vocabulary.
  However, reusing this vocabulary requires preserving item distinctions under compact token budgets and learning to favor
  target items over candidates with shared dominant features. It also requires extending feature interpretability from item
  content to retrieval decisions. To address these challenges, we propose API, a framework that Adapts the Pretrained Interpretable
  vocabulary for effective and explainable GR without additional vocabulary learning. Within API, Pretrained Interpretable
  IDs (PIDs) retain selected feature indices and relative activation strengths for item discrimination. With PIDs as supervision,
  the Semantic Prediction Adapter (SPA) learns user preferences from interaction histories through joint feature-index and
  strength prediction. SPA combines both predictions to score candidate items, with item-level supervision encouraging the
  observed next item to outrank its alternatives. API further explains candidate score differences through feature contributions
  paired with their pretrained semantic annotations. Extensive experiments show that API achieves competitive performance
  across backbones and decoding schemes, while preserving item distinctions under compact token budgets and enabling explainable
  retrieval.
tldr: API reuses feature indices of a pretrained sparse autoencoder as an interpretable Semantic ID vocabulary and trains
  an adapter to predict indices and strengths, instead of fitting a new vocabulary.
tldr_zh: API 直接复用预训练稀疏自编码器的特征下标作为可解释 SID 词表，并训练适配器预测下标与激活强度，无需重新拟合词表。
setup:
  datasets: 'Amazon Beauty, Sports, and Toys as preprocessed in prior work (P5, GRID), keeping their splits; item text from
    title, brand, category, and price. Sizes: Appendix A (not restated here).'
  split: The prior-work (P5 / GRID) splits and evaluation protocol are retained (allocation not restated); checkpoints selected
    by validation Recall@5.
  candidates: full catalog (complete test split, full catalog without sampled negatives).
  visibility: warm; no unseen-item protocol is defined. PID selection statistics and activation calibration are estimated
    from training-item contents.
  sid: 'Pretrained Interpretable IDs: K in {4, 8, 16} feature indices selected by a priority rule from the 32 strongest of
    24,576 labeled sparse-autoencoder features of a frozen GPT-2-small, plus their relative activation strengths, which separate
    items whose index sequences coincide. Collision-affected items at K=4: 15.16% on Beauty (77.37% with native SAE selection).'
  inference_budget: 'Two decoders: parallel prediction (PR) with exact catalog scoring, and autoregressive (AR) with catalog-constrained
    beam search of width 50; T5- and GPT-2-style backbones trained from scratch. Hardware, inference batch size, and latency:
    not reported.'
  results_from: Table 1 (full API versus sequential and generative recommenders); Table 2 (tokenizers under T5 and GPT-2 backbones
    with AR and PR decoding); Table 3 (collision rates by token budget); Table 4 (content alignment); Table 5 (preference
    and strength ablation); Figure 3 (cross-domain vocabulary reuse).
