summary: Generative recommendation (GR) predicts the next item through its semantic ID (SID). Existing methods commonly fit
  SID vocabularies to pretrained language model (PLM) representations of item descriptions, incurring additional training
  costs and making vocabulary coverage dependent on the fitting domains. We observe that pretrained sparse autoencoders expose
  PLM features with human-interpretable semantic annotations, allowing feature indices to serve as a reusable SID vocabulary.
  However, reusing this vocabulary requires preserving item distinctions under compact token budgets and learning to favor
  target items over candidates with shared dominant features. It also requires extending feature interpretability from item
  content to retrieval decisions. To address these challenges, we propose API, a framework that Adapts the Pretrained Interpretable
  vocabulary for effective and explainable GR without additional vocabulary learning. Within API, Pretrained Interpretable
  IDs (PIDs) retain selected feature indices and relative activation strengths for item discrimination. With PIDs as supervision,
  the Semantic Prediction Adapter (SPA) learns user preferences from interaction histories through joint feature-index and
  strength prediction. SPA combines both predictions to score candidate items, with item-level supervision encouraging the
  observed next item to outrank its alternatives. API further explains candidate score differences through feature contributions
  paired with their pretrained semantic annotations. Extensive experiments show that API achieves competitive performance
  across backbones and decoding schemes, while preserving item distinctions under compact token budgets and enabling explainable
  retrieval.
