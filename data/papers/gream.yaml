id: gream
name: GREAM
title: Generative Reasoning Recommendation via LLMs
authors: Hong et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2510.20815
  code: https://github.com/Indolent-Kawhi/GRRM
problem: III
stage: Training
representation: Text+CF
tokenization: RQ-KM
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: Beam
poi: false
summary: 'Abstract: "the intrinsic modeling gap between textual semantics and collaborative filtering signals".'
tldr: GREAM adapts an LLM into a reasoning recommender with collaborative-semantic item indices, a chain-of-thought curriculum,
  and SRPO post-training, and supports direct and reasoning-first inference modes.
tldr_zh: GREAM 结合协同-语义物品索引、思维链课程学习与 SRPO 后训练将 LLM 改造为推理推荐模型，同时支持直接生成和先推理后生成两种模式。
evidence:
- field: problem
  where: https://arxiv.org/html/2510.20815v1#abstract1
  quote: the intrinsic modeling gap between textual semantics and collaborative filtering signals
setup:
  datasets: 'Amazon Beauty, Sports and Outdoors, Musical Instruments, with 5-core filtering of users and items. Sizes (users
    / items / interactions): 22,363 / 12,101 / 198,360; 35,598 / 18,357 / 296,175; 24,733 / 9,923 / 206,153. Alignment and
    reasoning text is synthesized by Qwen3, GPT-5, Llama-3.1, and Gemini.'
  split: Leave-one-out; the exact validation/test position allocation is not reported beyond the leave-one-out label.
  candidates: not reported (full catalog versus sampled evaluation candidates); direct mode reports Recall and NDCG at 5 and
    10, reasoning mode reports Pass@1, 5, 10.
  visibility: warm; no unseen-item protocol is defined.
  sid: RQ-KMeans indices over LLM last-hidden-state embeddings of GPT-5-enriched item text; fixed length 5 with 256 values
    per layer, where the fifth position is a conflict-resolution slot.
  inference_budget: 'Direct mode: beam size 20 for all generative methods. Reasoning mode: sampling with temperature 0.7 and
    top-p 0.9. Backbone Qwen3-4B-Instruct; experiments on a cluster of 24 NVIDIA A100 GPUs; inference batch size and latency:
    not reported.'
  results_from: Table 2 (direct and reasoning modes on Beauty, Sports, Instruments versus traditional, Transformer, generative,
    and LLM baselines); Table 3 (alignment and RL ablations); Table 4 (data composition); Figure 3 (RL regimes on Instruments).
setup_where:
  datasets: 'Datasets and 5-core: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS1.p1; statistics: https://arxiv.org/html/2510.20815v1#S6.T1.'
  split: 'Leave-one-out named only: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS2.p1.'
  candidates: 'Metrics only: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS2.p1.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS2.p1.'
  sid: 'Length 5 with a conflict-resolution slot, 256 values per layer: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS3.p1;
    RQ-KMeans over LLM embeddings of GPT-5-enriched text: https://arxiv.org/html/2510.20815v1#S3.SS1.SSS2.p1 and https://arxiv.org/html/2510.20815v1#S4.SS1.p1.'
  inference_budget: 'Beam 20 and sampling settings: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS2.p1; hardware: https://arxiv.org/html/2510.20815v1#S6.SS1.SSS3.p1.'
  results_from: 'Main: https://arxiv.org/html/2510.20815v1#S6.T2; ablations: https://arxiv.org/html/2510.20815v1#S6.T3 and
    https://arxiv.org/html/2510.20815v1#S6.T4; RL regimes: https://arxiv.org/html/2510.20815v1#S6.SS5.p2.'
related:
- id: eager-llm
  relation: competitor
  note: EAGER-LLM injects behavioral and semantic signals into a decoder-only LLM recommender; GREAM adds collaborative-semantic
    alignment data, reasoning curricula, and RL with a prefix-based verifiable reward.
  where: 'GREAM v1, LLM-based baselines: https://arxiv.org/html/2510.20815v1#A2.I4.i2.p1; Table 2: https://arxiv.org/html/2510.20815v1#S6.T2.'
- id: lc-rec
  relation: competitor
  note: LC-Rec aligns LLaMA to VQ indices with language tasks; GREAM adds explicit reasoning chains and RL fine-tuning on
    Qwen3.
  where: 'GREAM v1, LLM-based baselines: https://arxiv.org/html/2510.20815v1#A2.I4.i1.p1; Table 2: https://arxiv.org/html/2510.20815v1#S6.T2.'
- id: tiger
  relation: competitor
  note: TIGER generates RQ-VAE identifiers with a small T5; GREAM generates RQ-KMeans indices with an LLM that can reason
    before recommending.
  where: 'GREAM v1, generative baselines: https://arxiv.org/html/2510.20815v1#A2.I3.i2.p1; Table 2: https://arxiv.org/html/2510.20815v1#S6.T2.'
- id: cid
  relation: competitor
  note: P5-CID uses collaborative IDs for a T5 recommender; GREAM uses semantic RQ-KMeans indices with LLM reasoning.
  where: 'GREAM v1, generative baselines: https://arxiv.org/html/2510.20815v1#A2.I3.i1.p1; Table 2: https://arxiv.org/html/2510.20815v1#S6.T2.'
