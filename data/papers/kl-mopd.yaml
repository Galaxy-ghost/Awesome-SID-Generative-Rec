id: kl-mopd
name: KL-MOPD
title: 'KL-MOPD: Discrepancy-Aware Multi-Objective On-Policy Distillation for Generative Recommendation'
authors: Yang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.36973
  code: https://github.com/Yandorn/KL-MOPD
problem: IV
stage: Training
representation: CF
tokenization: R-KM
backbone: Enc-Dec
tokenizer: Fixed†
objective: (NTP† / (NTP + Aux.)†) → KL-weighted OPD
inference: C-Beam
poi: false
tldr: KL-MOPD distills click and conversion teachers into a student generator token by token, weighting each teacher by its
  initial KL divergence from the student, instead of vanilla on-policy distillation.
tldr_zh: KL-MOPD 按教师与学生的初始 KL 散度加权，将点击与转化教师逐 token 蒸馏到学生生成器，改进标准在线策略蒸馏。
setup:
  datasets: 'TencentGR (CTR/CVR), YooChoose (CTR/GMV), Taobao (CTR/CVR), industrial advertising (CTR/eCPM). Filtering: not
    reported.'
  split: 'Public: chronological 70% student pretraining, 20% teacher tuning/student distillation, 10% evaluation. Industry:
    penultimate day tuning, final day evaluation, >11M requests/day; pretraining allocation not reported. Sliding windows;
    history caps 100 public/128 Industry.'
  candidates: not reported
  visibility: 'warm; no unseen-item protocol is defined. Two-tower CF embedding exposure to test items: not reported.'
  sid: 'RQ-KMeans of two-tower CF embeddings: TencentGR 5x64, YooChoose 5x128, Taobao 8x64, Industry 8x310. Collision handling:
    not reported.'
  inference_budget: 'Constrained beam 50, K=10/20 public; beam 200, K=100/200 Industry. Inference hardware, batch size, latency:
    not reported.'
  results_from: 'This study''s adapted/tuned baselines: Table 3 public TIGER/REG4Rec, Table 4 ablations, Table 5 industrial
    TIGER, Table 6 five-day online A/B (10% control, 10% treatment).'
