id: gnpr-sid
name: GNPR-SID
title: Generative Next POI Recommendation with Semantic ID
authors: Wang et al.
year: 2025
venue: KDD’25
links:
  arxiv: https://arxiv.org/abs/2506.01375
  code: https://github.com/wds1996/GNPR-SID
problem: I
stage: Tokenization
representation: Attr+Geo+CF
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: –
poi: true
summary: 'Abstract: "employ random numeric IDs for POIs, limiting the ability to model semantic relationships between similar
  locations". The diversity loss only spreads SIDs evenly; the abstract does not blame prior work for collisions, so not II.'
tldr: GNPR-SID replaces random numeric POI IDs with RQ-VAE Semantic IDs built from semantic and collaborative features under
  a diversity loss, and fine-tunes an LLM to generate the next POI.
evidence:
- field: problem
  where: https://arxiv.org/html/2506.01375v2#abstract1
  quote: employ random numeric IDs for POIs, limiting the ability to model semantic relationships between similar locations
  reason: The diversity loss only spreads SIDs evenly; the abstract does not blame prior work for collisions, so not II.
- field: stage
  where: contribution 2, p2; §4.1, p3–5
  reason: SIDs quantized from semantic and collaborative features replace random IDs.
- field: tokenizer
  where: §4.2, p6; §5, p7
  reason: RQ-VAE is trained first; LLaMA3-8B is then fine-tuned with LoRA.
setup:
  datasets: 'Foursquare NYC and TKY, Gowalla CA. POIs with fewer than 10 interactions and users with fewer than 10 check-ins
    are removed (following Yan et al. 2023). Sizes (users / POIs): NYC 1,083 / 5,135; TKY 2,293 / 7,873; CA 6,592 / 14,027.'
  split: 'Records sorted by time and split 80% / 10% / 10% into training, validation, and test; within each user''s test sequence
    the last visited POI is the target. Separate cross-city test: train on one city and test on the others (Table 5).'
  candidates: not reported (full catalog versus sampled candidates); the metric is top-1 accuracy (Acc@1) of the generated
    POI.
  visibility: warm; users and POIs that do not appear in the training set are removed from the test set. The cross-city test
    in Table 5 uses POIs from another city, but their tokenizer visibility is not reported.
  sid: 3-level RQ-VAE with 32 (NYC) or 64 (TKY, CA) codewords of dimension 64, k-means-initialized, plus diversity and compactness
    losses. Remaining collisions get an appended fourth token that makes each POI's SID unique (e.g. <d_0>, <d_1>). Table
    4 reports unique SIDs and collisions before the suffix (e.g. NYC 590 collisions at lambda=0.25).
  inference_budget: 'LLaMA3-8B with LoRA; decoding method not reported beyond top-1 prediction. Fine-tuning on 4 NVIDIA L40
    GPUs (batch 2 per GPU); inference batch size not reported. Table 6 (NYC): total test time 110.62 s versus 230.36 s for
    LLM4POI.'
  results_from: Table 2 (Acc@1 on NYC, TKY, CA versus traditional, Transformer, GCN, time-aware, and LLM-based baselines);
    Table 3 (ablations); Table 4 (diversity-loss weight and SID collisions); Table 5 (cross-city generalization); Table 6
    (efficiency).
setup_where:
  datasets: 'Datasets, filters, splits: https://arxiv.org/html/2506.01375v2#S5.SS1.p1; statistics: https://arxiv.org/html/2506.01375v2#S5.T1.'
  split: 'Temporal 80/10/10 split and last-visit target: https://arxiv.org/html/2506.01375v2#S5.SS1.p1; out-of-domain transfer:
    https://arxiv.org/html/2506.01375v2#S6.T5.'
  candidates: 'Top-1 accuracy only: https://arxiv.org/html/2506.01375v2#S5.SS3.p1.'
  visibility: 'Test users and POIs absent from training are removed: https://arxiv.org/html/2506.01375v2#S5.SS1.p1.'
  sid: '3 layers x 32 (NYC) or 64 (TKY, CA), dimension 64, k-means initialization: https://arxiv.org/html/2506.01375v2#S5.SS2.p1;
    collision suffix: https://arxiv.org/html/2506.01375v2#S4.SS1.SSS2.p6; diversity loss and collision counts: https://arxiv.org/html/2506.01375v2#S4.SS1.SSS3.Px3.p1
    and https://arxiv.org/html/2506.01375v2#S6.T4.'
  inference_budget: 'Hardware for fine-tuning: https://arxiv.org/html/2506.01375v2#S5.SS2.p1; efficiency table: https://arxiv.org/html/2506.01375v2#S6.T6;
    decoding not specified in Section 5.'
  results_from: 'Main: https://arxiv.org/html/2506.01375v2#S6.T2; ablation: https://arxiv.org/html/2506.01375v2#S6.T3; diversity
    loss: https://arxiv.org/html/2506.01375v2#S6.T4; cross-city: https://arxiv.org/html/2506.01375v2#S6.T5; efficiency: https://arxiv.org/html/2506.01375v2#S6.T6.'
related:
- id: lc-rec
  relation: predecessor
  note: GNPR-SID follows LC-Rec in aligning an LLM to SID tokens through language-task prompts, and adds POI-specific quantization
    with time-aware prompts.
  where: 'GNPR-SID v2, Section 4.2 builds its prompts inspired by Zheng et al. (2024): https://arxiv.org/html/2506.01375v2#S4.SS2.p2.'
- id: tiger
  relation: alternative
  note: TIGER is cited as generative recommendation with semantic IDs for products; GNPR-SID adapts RQ-VAE SIDs to POIs with
    diversity and compactness losses and an LLM generator.
  where: 'GNPR-SID v2, Section 2 cites Rajput et al. (2023): https://arxiv.org/html/2506.01375v2#S2.p2; not a baseline in
    Table 2.'
- id: geogr
  relation: alternative
  note: GeoGR later builds geo-aware SIDs from geographic co-visitation and an EM refinement loop, and reports gains over
    GNPR-SID's SIDs.
  where: 'Evidence is from the later GeoGR paper: it follows GNPR-SID preprocessing and compares against it in Tables 2, 3,
    and 5: https://arxiv.org/html/2602.10411v2#S5.SS1.SSS1.p2, https://arxiv.org/html/2602.10411v2#S5.T2, https://arxiv.org/html/2602.10411v2#S5.T3,
    https://arxiv.org/html/2602.10411v2#S5.T5.'
