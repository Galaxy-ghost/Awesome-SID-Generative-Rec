id: neo
name: NEO
title: A Unified Language Model for Large Scale Search, Recommendation, and Reasoning
authors: De Nadai et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2603.17533
  code: null
problem: psb
stage: n/a
representation: Text / Audio
tokenization: R-KM
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: C-Beam
poi: false
tldr: NEO adapts a decoder-only LLM to interleave natural language and typed item Semantic IDs in one sequence, with constrained
  decoding, to unify search, recommendation, and reasoning without tools.
tldr_zh: NEO 改造仅解码器 LLM，使自然语言与带类型的物品 SID 在同一序列中交错生成，配合受约束解码在不调用外部工具的情况下统一搜索、推荐与推理。
setup:
  datasets: 'Industrial media logs: >10M episodes, shows, audiobooks and artists; about 15M users; 5M grounding examples,
    10M instruction-training examples, 100K test examples. Filtering not reported.'
  split: 'Global temporal protocol: context through t, labels at t+k, evaluation at t+2k; k=1 day for episodes/shows, 7 days
    for audiobooks. Baselines share train/test windows; dates and validation allocation not reported.'
  candidates: not reported; NEO and baselines use the same candidate universe.
  visibility: warm; no unseen-item protocol is defined. User cold-start simulated by removing listening history and retaining
    user metadata.
  sid: 'Separate residual K-Means vocabularies by type: 4 x 256 for audiobooks/episodes/shows, 4 x 1024 for artists. Each
    collision bucket resolves to one popularity-selected item.'
  inference_budget: 'Trie-constrained beam 30; HR/NDCG@10/30. Top-p alternative: temperature 0.6, top-k 20, top-p 0.95. Inference
    hardware, batch size and absolute latency not reported; Table 3 latency@10 decreases 2.92% without constraints and 7.91%
    with sampling.'
  results_from: 'Original Tables 5/8/9: production-baseline comparisons, cold/warm users and search breakdowns. Recommendation
    baseline is GNN/two-tower; search baseline dense retrieval. NEO uses about half the production baseline''s historical
    logs.'
setup_where:
  datasets: 'Section 4.1: https://arxiv.org/html/2603.17533v1#S4.SS1.p1'
  split: 'Section 4.1.5: https://arxiv.org/html/2603.17533v1#S4.SS1.SSS5.p1'
  candidates: 'Section 4.1.5 specifies a common candidate universe but not full-catalog versus sampled evaluation: https://arxiv.org/html/2603.17533v1#S4.SS1.SSS5.p1'
  visibility: 'Section 4.1.5 and its cold-user experiment: https://arxiv.org/html/2603.17533v1#S4.SS1.SSS5.p1 and https://arxiv.org/html/2603.17533v1#S4.SS1.SSS5.Px1.p1'
  sid: 'Section 4.1.2: https://arxiv.org/html/2603.17533v1#S4.SS1.SSS2.p2'
  inference_budget: 'Section 4.2.1 and Table 3: https://arxiv.org/html/2603.17533v1#S4.SS2.SSS1.Px5.p2 and https://arxiv.org/html/2603.17533v1#S4.T3'
  results_from: 'Original Tables 5/8/9 and Sections 4.1.1/4.2.3: https://arxiv.org/html/2603.17533v1#S4.T5 and https://arxiv.org/html/2603.17533v1#A2.T8
    and https://arxiv.org/html/2603.17533v1#A2.T9 and https://arxiv.org/html/2603.17533v1#S4.SS1.SSS1 and https://arxiv.org/html/2603.17533v1#S4.SS2.SSS3.Px1.p1'
related:
- id: plum
  relation: alternative
  note: Concurrent SID-LLM adaptation; NEO emphasizes mixed text-ID outputs and multiple item types.
  where: 'NEO v1, Section 2 and Table 1: https://arxiv.org/html/2603.17533v1#S2.SS0.SSS0.Px3.p2; https://arxiv.org/html/2603.17533v1#S2.T1.'
- id: tiger
  relation: predecessor
  note: Prior SID-based generative retrieval informs NEO's catalog-grounded item representation.
  where: 'NEO v1, Introduction and Section 2, citing Rajput et al. (2024): https://arxiv.org/html/2603.17533v1#S1.p4; https://arxiv.org/html/2603.17533v1#S2.SS0.SSS0.Px3.p1.'
- id: eager-llm
  relation: alternative
  note: Motivates testing collaborative SID signals; NEO favors content-derived SIDs in its experiments.
  where: 'NEO v1, Section 4.2.1, citing Hong et al. (2025): https://arxiv.org/html/2603.17533v1#S4.SS2.SSS1.Px4.p1.'
changes:
  representation:
    value: other
    quote: To mitigate this, we generate richer episode summaries using a pre-trained LLM applied to multiple available metadata
      fields, and embed these summaries using the same text encoder.
    where: '2603.17533v1 #S4.SS1.SSS2.p1.1；构码前用 LLM 补全元数据，原始与补全元数据的对比在 #S4.SS2.SSS1'
  tokenization:
    value: other
    quote: We construct separate SID vocabularies per item type, as early experiments showed that embedding spaces differ
      substantially across types.
    where: '2603.17533v1 #S4.SS1.SSS2.p2.1'
  backbone: none
  tokenizer: none
  objective:
    value: other
    quote: we treat SIDs as a distinct modality and study design choices for integrating discrete entity representations into
      LLMs via staged alignment and instruction tuning
    where: '2603.17533v1 #abstract1.3；损失仍是 NTP（#S3.p2.1），新在分阶段对齐任务（#S3.SS2、#S3.SS3）'
  inference:
    value: other
    quote: trie-based masking only within
    where: '2603.17533v1 #S3.SS4.p1.1；只在 SID 段内做 trie 约束，段外保留自由文本'
modality:
  A:
  - Text
  B:
  - Audio
modality_where:
  quote: For artists, we encode tracks from track spectrograms into audio embeddings and average them by artist to obtain
    artist-level vectors.
  where: '2603.17533v1 #S4.SS1.SSS2.p1.1；A 是节目、单集、有声书（Qwen3 文本嵌入），B 是艺人（音频）；#S4.SS2.SSS1 的 CF 替换是消融，不收'
domain:
- Music
- Podcast
- Book
- Search
settings:
- value: cold-start
  scope: user
  quote: We simulate cold-start users by removing past listening behavior information and rely only on user metadata for predictions
    on recommendations and text-based retrieval.
  where: '2603.17533v1 #S4.SS1.SSS5.Px1.p1.1；删历史模拟'
scenario:
  tasks:
  - value: item
    quote: Given an instruction, lightweight user or context features, and a short interaction history represented as SIDs,
      the model predicts the next consumed item of the specified type as a SID.
    where: 2603.17533v1
  - value: query
    quote: Given a natural-language query (optionally with lightweight user context), the model generates the SID(s) of the
      most relevant item(s).
    where: 2603.17533v1
  deploy: industrial-offline
