id: idgenrec
name: IDGenRec
title: 'Idgenrec: Llm-recsys alignment with textual id learning'
authors: Tan et al.
year: 2024
venue: SIGIR’24
links:
  arxiv: https://arxiv.org/abs/2403.19021
  code: https://github.com/agiresearch/IDGenRec
problem: III
stage: Tokenization
representation: Text
tokenization: LLM-Vocab
backbone: Enc-Dec
tokenizer: Altern.
objective: NTP
inference: C-Beam
poi: false
tldr: IDGenRec trains a textual ID generator alongside an LLM recommender, so each item receives a concise ID made of natural-language
  tokens, and tests zero-shot transfer to unseen platforms.
tldr_zh: IDGenRec 将文本 ID 生成器与 LLM 推荐器协同训练，为每个物品生成由自然语言 token 组成的简短 ID，并测试向未见平台的零样本迁移。
evidence:
- field: problem
  where: https://arxiv.org/html/2403.19021v2#abstract1
  quote: struggles to effectively encode recommendation items within the text-to-text framework
setup:
  datasets: 'Standard: Amazon Sports, Beauty, Toys and Yelp, filtering users and items with fewer than 5 interactions (following
    P5 and Hua et al. 2023). Zero-shot: a Fusion pre-training corpus from 19 other Amazon categories, each downsampled to
    at most 30,000 users (183,918 users / 233,323 items), tested on Sports, Beauty, Toys, Music, Instruments, and Yelp.'
  split: 'Leave-one-out for testing (validation allocation not restated). Zero-shot: train once on Fusion and test directly
    on held-out datasets.'
  candidates: full catalog (no negative sampling; ranking over all items).
  visibility: 'Standard: warm; no unseen-item protocol is defined. Zero-shot: users and items of the test datasets are not
    seen in training; the ID generator is also trained only on the Fusion corpus, so test items are unseen by tokenizer too
    and receive IDs generated from their text.'
  sid: Textual IDs generated from item text by a T5-small ID generator with diverse beam search (k=10 groups, diversity penalty
    raised from 1 to 10), length initially in [1, 10) tokens and extended to [10, 20) when needed; uniqueness is enforced
    at generation time by rejecting duplicates. SentencePiece vocabulary of 32,128.
  inference_budget: 'Constrained decoding over a prefix tree of all generated item IDs; beam width, hardware, inference batch
    size, and latency: not reported. HR and NDCG at 5 and 10.'
  results_from: Table 4 (standard evaluation versus traditional and P5-variant baselines); Table 5 (training strategies);
    Table 6 (user and item IDs); Table 7 (zero-shot intra- and inter-platform).
setup_where:
  datasets: 'Standard datasets and 5-interaction filter: https://arxiv.org/html/2403.19021v2#S3.SS1.p1; zero-shot data rules:
    https://arxiv.org/html/2403.19021v2#S3.SS1.p3 and https://arxiv.org/html/2403.19021v2#S3.SS1.p4; statistics: https://arxiv.org/html/2403.19021v2#S3.T3.'
  split: 'Leave-one-out: https://arxiv.org/html/2403.19021v2#S3.SS3.p1; zero-shot setting: https://arxiv.org/html/2403.19021v2#S3.SS5.p1.'
  candidates: 'Ranking over all items without negative sampling: https://arxiv.org/html/2403.19021v2#S3.SS3.p1.'
  visibility: 'Zero-shot: users and items unseen in training: https://arxiv.org/html/2403.19021v2#S3.SS5.p1; the ID generator
    is trained with the recommender on the training data: https://arxiv.org/html/2403.19021v2#S3.SS2.p3.'
  sid: 'Diverse beam search for unique textual IDs, length ranges: https://arxiv.org/html/2403.19021v2#S2.SS3.p2 and https://arxiv.org/html/2403.19021v2#S3.SS2.p2;
    T5-small ID generator: from Section 2.'
  inference_budget: 'Constrained decoding with a prefix tree over generated IDs: Section 2 inference; no beam width or hardware
    found.'
  results_from: 'Standard: https://arxiv.org/html/2403.19021v2#S3.T4; training strategies: https://arxiv.org/html/2403.19021v2#S3.T5;
    user/item IDs: https://arxiv.org/html/2403.19021v2#S3.T6; zero-shot: https://arxiv.org/html/2403.19021v2#S3.T7.'
related:
- id: cid
  relation: competitor
  note: P5-SID, P5-CID, and P5-SemID assign sequential, collaborative, or category IDs; IDGenRec learns a textual ID generator
    jointly with the recommender.
  where: 'IDGenRec v2, baselines: https://arxiv.org/html/2403.19021v2#S3.I1.i2.p1; Table 4: https://arxiv.org/html/2403.19021v2#S3.T4.'
- id: gram
  relation: alternative
  note: GRAM later builds hierarchical textual IDs by clustering and reports that IDGenRec's user IDs concatenate validation
    and test items; it reruns IDGenRec without user IDs.
  where: 'Evidence is from the later GRAM paper: Table 9 and Appendix E: https://arxiv.org/html/2506.01673v1#A4.T9 and https://arxiv.org/html/2506.01673v1#A5.p3;
    Table 2: https://arxiv.org/html/2506.01673v1#S4.T2.'
- id: grlm
  relation: alternative
  note: GRLM later replaces free textual IDs with a fixed number of standardized vocabulary terms to reduce synonym ambiguity.
  where: 'Evidence is from the later GRLM paper: baselines and Table 2: https://arxiv.org/html/2601.06798v1#S4.I1.i3.p1 and
    https://arxiv.org/html/2601.06798v1#S5.T2; case study: https://arxiv.org/html/2601.06798v1#A3.p1.'
- id: gmc
  relation: alternative
  note: GMC later compares against IDGenRec in a multi-domain setting with codebook IDs shared across domains.
  where: 'Evidence is from the later GMC paper: generative baselines and Table 3: https://arxiv.org/html/2507.12871v3#S5.I1.i4.I1.i3.p1
    and https://arxiv.org/html/2507.12871v3#S5.T3.'
