id: mmgrec
name: MMGRec
title: 'MMGRec: Multimodal Generative Recommendation with Transformer Model'
authors: Liu et al.
year: 2026
venue: TOMM’26
links:
  arxiv: https://arxiv.org/abs/2404.16555
  code: https://github.com/hanliu95/MMGRec
problem: I
stage: Tokenization
representation: Text+Img+CF
tokenization: Graph RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'Abstract: "this paradigm suffers from inference cost, interaction modeling, and false-negative issues". Candidates:
  I / V (rule: complaint fits none of the six classes; judged by the new design).'
tldr: MMGRec assigns each item a Rec-ID with Graph RQ-VAE over multimodal and collaborative features and trains a Transformer
  with relation-aware self-attention to generate it, instead of embed-and-retrieve.
evidence:
- field: problem
  where: 'Abstract, arXiv v4: https://arxiv.org/html/2404.16555v4#abstract1.1'
  quote: However, this paradigm suffers from inference cost, interaction modeling, and false-negative issues.
  reason: 'Organizer judgment: I is selected over V because the broad complaint does not directly fit the six categories;
    the first Graph RQ-VAE design determines the label.'
- field: representation
  where: 'Section 4.2.1, visual/acoustic/textual features plus CF embeddings, arXiv v4: https://arxiv.org/html/2404.16555v4#S4.SS2.SSS1.p1'
  reason: The paper also uses acoustic features; Text+Img+CF is retained under the organizer's restricted modality vocabulary.
setup:
  datasets: 'MovieLens, TikTok, Kwai multimodal recommendation benchmarks; filtering: not reported.'
  split: 'Per-user random interaction split: 80% training, 10% validation, 10% test; non-sequential CF, without temporal labels.'
  candidates: not reported
  visibility: 'warm; no unseen-item protocol is defined. Graph RQ-VAE uses user-item interactions; test-interaction exposure
    in graph construction: not reported.'
  sid: 'Graph RQ-VAE: 3 semantic tokens plus popularity-rank collision suffix. Codebooks tuned over 64/128/256; Kwai analysis
    favors 128; selected per-dataset sizes not reported.'
  inference_budget: 'Constrained beam width K, default K=10. Figure 5 plots approximately 60-125 ms/user across 1/16-to-full
    Kwai. Hardware, inference batch size and timing scope: not reported.'
  results_from: 'This paper''s experiments using public baseline implementations: Table 2 main; Tables 3-5 ablations; Figures
    4-6 hyperparameters, inference efficiency, Rec-ID design. TIGER is explicitly excluded from the benchmark.'
