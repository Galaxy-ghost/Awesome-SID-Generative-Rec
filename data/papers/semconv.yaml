id: semconv
name: SemConv
title: 'Semantic Convergence: Harmonizing Recommender Systems via Two-Stage Alignment and Behavioral Semantic Tokenization'
authors: Li et al.
year: 2025
venue: AAAI’25
links:
  arxiv: https://arxiv.org/abs/2412.13771
  code: null
problem: III
stage: Tokenization
representation: Text+CF
tokenization: Align. RQ
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: Beam
poi: false
tldr: SemConv converts item IDs into token sequences aligned with the LLM space through Alignment Tokenization, adds tasks
  linking collaborative signals and language, and pre-caches top-K results for serving.
tldr_zh: SemConv 通过对齐编号将物品 ID 转化为与 LLM 空间对齐的 token 序列，加入连接协同信号与自然语言的任务，并预缓存 top-K 结果用于线上服务。
evidence:
- field: problem
  where: https://arxiv.org/html/2412.13771v1#abstract1 (Abstract; excerpt)
  quote: a notable discrepancy persists between the sparse collaborative semantics typically found in recommendation systems
    and the dense token representations within LLMs
setup:
  datasets: 'Amazon Games, Arts and Instruments; history cap 20; exclude samples whose concatenated prompt exceeds 2048 tokens.
    Other filtering: not reported.'
  split: 'Evaluation uses each user''s last interaction as target and preceding interactions as context. First S-1 actions
    form training examples; exact validation allocation: not reported.'
  candidates: not reported
  visibility: 'warm; no unseen-item protocol is defined. DCCF embedding exposure to test items/interactions: not reported.'
  sid: 'Aligned residual codebooks: 4 levels x 256 codes; Games reports 0% collisions at four levels. Explicit collision handling:
    not reported.'
  inference_budget: 'Beam-generated valid item codes are cached per user; online serving reads cache. HR/NDCG@1/5/10. Beam
    width, cache K, hardware, inference batch, numerical latency: not reported.'
  results_from: 'Reported Table 1 main comparison and Tables 3-8 Games ablations. P5 uses the cited external implementation;
    other baseline borrowed-versus-rerun provenance: not reported.'
