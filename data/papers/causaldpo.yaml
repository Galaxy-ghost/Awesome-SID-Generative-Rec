id: causaldpo
name: CausalDPO
title: Causal Direct Preference Optimization for Distributionally Robust Generative Recommendation
authors: Zhao et al.
year: 2026
venue: ICML’26
links:
  arxiv: https://arxiv.org/abs/2603.22335
  code: https://github.com/user683/CausalDPO
problem: VI
stage: Training
representation: Text
tokenization: LLM-Vocab
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → DPO
inference: Scoring
poi: false
tldr: CausalDPO extends DPO for LLM-based recommendation with backdoor adjustment, soft clustering of latent environments,
  and invariance constraints, to remove spurious correlations that DPO amplifies under distribution shift.
tldr_zh: CausalDPO 为基于 LLM 的推荐扩展 DPO，加入后门调整、隐环境软聚类与不变性约束，消除分布偏移下被 DPO 放大的虚假相关。
evidence:
- field: problem
  where: arXiv:2603.22335v2, abstract
  quote: significantly undermining the generalization capability of LLM-based generative recommendation methods in out of
    distribution (OOD) scenarios
setup:
  datasets: 'Yelp2018, MovieLens-10M, and Book-Crossing. Users with at least 40 interactions (Yelp2018) or 20 interactions
    (ML-10M, Book-Crossing) are kept; ratings above 4 (ML-10M, Yelp2018) or above 7 (Book-Crossing) are positives. Sizes (sequences
    / items / interactions): ML-10M 71,567 / 10,681 / 10,000,054; Yelp2018 31,668 / 38,048 / 1,561,406; Book-Crossing 278,858
    / 271,379 / 1,149,780.'
  split: 'Distribution-shift splits: popularity shift (Yelp2018) samples 20% of interactions as a popularity-balanced OOD
    test set; temporal shift (ML-10M) takes each user''s latest 20% of interactions; exposure shift (Book-Crossing) takes
    the most recent 20% and imputes a fully exposed test set by matrix factorization; mixed shift (Yelp2018) samples 80% popularity-shift
    and 20% temporal-shift test interactions. The remainder is split 7:1:2 into training, validation, and IID test.'
  candidates: full catalog (generated items are scored and ranked over the entire item space and mapped to dataset items).
  visibility: warm; no unseen-item protocol is defined. The distribution shifts concern popularity, time, and exposure of
    user-item interactions, not unseen items; tokenizer n/a.
  sid: n/a (items are generated as text by the LLM and mapped to dataset items; no semantic IDs).
  inference_budget: 'Llama-3.1-8B; decoding strategy and width: not reported. Experiments run on one node with 8 NVIDIA A800
    80GB GPUs; inference batch size and latency: not reported. Table 6 reports training time per epoch (CausalDPO 2,971 s
    versus DPO 2,482 s). HR and NDCG at K=10 and 20.'
  results_from: Table 1 (popularity, temporal, and exposure shifts on Yelp2018, ML-10M, Book-Crossing); Table 4 (mixed shift);
    Table 3 (IID test sets); Table 5 (causal regularizer added to other DPO variants); Table 8 (ablations); Table 9 (model
    sizes).
setup_where:
  datasets: 'Dataset list: https://arxiv.org/html/2603.22335v2#S3.SS6.p1; user thresholds and positive-rating rules: https://arxiv.org/html/2603.22335v2#A2.SS1.p1;
    statistics: https://arxiv.org/html/2603.22335v2#A2.T2.'
  split: 'Shift constructions: https://arxiv.org/html/2603.22335v2#A2.I2.i1.p1, https://arxiv.org/html/2603.22335v2#A2.I2.i2.p1,
    https://arxiv.org/html/2603.22335v2#A2.I2.i3.p1, and https://arxiv.org/html/2603.22335v2#A2.I2.i4.p1.'
  candidates: 'Scoring and ranking over the entire item space: https://arxiv.org/html/2603.22335v2#S3.SS6.p1.'
  visibility: 'OOD shifts concern popularity, time, and exposure, not unseen items: https://arxiv.org/html/2603.22335v2#S3.SS6.p1
    and https://arxiv.org/html/2603.22335v2#A2.I2.i1.p1.'
  sid: 'Prompts generate items as text: https://arxiv.org/html/2603.22335v2#S3.SS6.p1; the item is represented through text
    in the prompt formulation: https://arxiv.org/html/2603.22335v2#S2.p1.'
  inference_budget: 'Hardware: https://arxiv.org/html/2603.22335v2#A2.SS3.p1; training time per epoch: https://arxiv.org/html/2603.22335v2#A2.T6.'
  results_from: 'OOD table: https://arxiv.org/html/2603.22335v2#S3.T1; IID: https://arxiv.org/html/2603.22335v2#A2.T3; mixed
    shift: https://arxiv.org/html/2603.22335v2#A2.T4; regularizer transfer: https://arxiv.org/html/2603.22335v2#A2.T5; ablation:
    https://arxiv.org/html/2603.22335v2#A2.T8; model sizes: https://arxiv.org/html/2603.22335v2#A2.T9.'
related:
- id: onerec
  relation: alternative
  note: OneRec uses iterative preference alignment for a generative recommender with semantic IDs; CausalDPO adds backdoor
    adjustment over latent environments to DPO for text-generating LLM recommenders under distribution shift.
  where: 'CausalDPO v2, Section 4 cites Deng et al. (2025), OneRec, among DPO adoptions in recommendation: https://arxiv.org/html/2603.22335v2#S4.p2;
    not a baseline in Table 1.'
