changes:
  representation: none
  tokenization: primary
  backbone:
    value: other
    quote: Additionally, a dual-attention fusion mechanism combines ID-based and semantic features to capture user interests,
      especially for long-tail apps.
    where: arXiv:2508.18166v5 https://arxiv.org/html/2508.18166v5#abstract1
  tokenizer:
    value: other
    quote: 'Figure 3 illustrates the overall architecture of PCR-CA, which consists of four components: (1) Parallel Codebook
      Auto-Encoder (PC-AE), which compresses high-dimensional multi-modal embeddings into discrete code vectors and reconstructs
      them, jointly trained with the main CTR model using reconstruction, alignment, and CTR losses; (2) Contrastive Alignment,
      which computes alignment losses on both user and item levels, where user representations are aggregated from behavior
      sequences and item representations include both ID and semantic embeddings; (3) Dual-Attention Fusion, which trains
      two attention networks for ID and semantic embeddings and integrates them by averaging their outputs over user history;
      and (4) the CTR Prediction Network, a standard embedding-plus-MLP architecture with attention, optimized using cross-entropy
      loss.'
    where: arXiv:2508.18166v5 https://arxiv.org/html/2508.18166v5#S3.p1
  objective:
    value: other
    quote: To bridge semantic and collaborative signals, we employ a contrastive alignment loss at both the user and item
      levels, enhancing representation learning for long-tail items.
    where: arXiv:2508.18166v5 https://arxiv.org/html/2508.18166v5#abstract1
  inference: none
