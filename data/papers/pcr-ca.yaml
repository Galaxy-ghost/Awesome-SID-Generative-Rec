id: pcr-ca
name: PCR-CA
title: 'PCR-CA: Parallel Codebook Representations with Contrastive Alignment for Multiple-Category App Recommendation'
authors: Tan et al.
year: 2026
venue: KDD’26
links:
  arxiv: https://arxiv.org/abs/2508.18166
  code: null
problem: I
stage: Tokenization
representation: Text+CF
tokenization: PC-AE
backbone: Disc.
tokenizer: Joint
objective: Discrim.
inference: Scoring
poi: false
summary: 沿VQ-Rec/LGRID先例收录推荐用离散构码新设计；实际任务为CTR，非逐码生成SID。
tldr: PCR-CA learns parallel codebook representations of app text, unlike hierarchical RQ-VAE, and aligns them contrastively
  with collaborative signals for CTR prediction on multiple-category apps.
setup:
  datasets: Microsoft Store impression logs with click/install labels over several months; approximately 80K apps, click rate
    6.148%; histories up to 50 interactions. Filtering rules not reported.
  split: 'Chronological: 340M training interactions and latest 10M validation samples. Table 2 calls evaluation the test set,
    but a separate test allocation is not reported. Online A/B lasts two weeks.'
  candidates: n/a for logged-impression CTR/AUC evaluation; candidate pool for top-10 diversity analysis not reported.
  visibility: 'Cold-start validation naturally includes apps/users unseen in CTR training. Unseen by CTR predictor only: PC-AE
    pretraining iterates over all 80K apps; no generative decoder is used.'
  sid: 'PC-AE: 4 parallel codebooks x 32 entries, 16-dimensional vectors, selecting/summing two nearest codes per book. Codebooks
    train jointly with CTR prediction after pretraining. Unique-ID collision resolution: n/a; codes supply predictive features.'
  inference_budget: 'Discriminative scoring; beam n/a; top-10 lists for diversity. Simulated throughput: 120K candidate items/s
    versus base 150K/s on the same unspecified server. Inference hardware, batch size and request latency not reported; offline
    text embedding costs 22 ms/new app.'
  results_from: 'Original Table 2: AUC by app-popularity bucket; Tables 3-4: ablations; Table 5: online A/B. SaviorRec is
    explicitly reimplemented; no baseline-result reuse stated.'
