id: pfa
name: PFA
title: 'PFA: Attention Can Be Progressively Focused in Long-Sequence Generative Recommendation'
authors: Zhou et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.39273
