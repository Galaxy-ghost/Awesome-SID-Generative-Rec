inference: Beam
poi: false
tldr: PFA keeps full attention at the first decoding step, then reuses a shared importance ranking across beams to shrink
  the attended history at later steps, accelerating long-sequence generative decoding.
tldr_zh: PFA 在首个解码步保留完整注意力，随后在各束之间复用共享的重要性排序以缩减后续步关注的历史长度，加速长序列生成式解码。
setup:
  datasets: Amazon 2023 Kindle Store (rating>=4, users>=128 positives); Tmall IJCAI-15 clicks; industrial advertising clicks.
    Click data retain earliest repeated user-item event; public items require >=5 training-instance occurrences, removing
    invalid users.
  split: Per-user chronological approximately 90%/5%/5% training/validation/test; rolling-history sliding windows use only
    behaviors preceding each target; deterministic public split sampling.
  candidates: not reported
  visibility: warm; retained public items have >=5 training-instance occurrences. Industrial item exposure is not separately
    reported.
  sid: 'Four codebooks: 128 codes/position on Kindle/Tmall, 300 on Industry. Tokenizer construction and collision handling:
    not reported.'
  inference_budget: 'Beam 100; 5 L20 GPUs, BF16, batch 512/GPU; k=256, retention=0.5; Recall/NDCG@5/10. Encoder+decoding latency:
    Kindle18/Industry62 ms/batch/GPU, excluding loading/embedding lookup; online RT11 ms.'
  results_from: 'Reported Tables 3/4/5/6/7: main comparison, ablations, selection timing, token budgets, seven-day online
    A/B. Online control/treatment histories differ (128/512); offline comparisons hold efficient-method token budgets equal.'
setup_where:
  datasets: 'Section 4.1: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px2.p1'
  split: 'Section 4.1: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px2.p1'
  candidates: 'Section 4.1 metrics do not specify full-catalog versus sampled evaluation: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px4.p1'
  visibility: 'Section 4.1 public filtering and split: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px2.p1'
  sid: 'Section 4.1: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px5.p1'
  inference_budget: 'Section 4.1, Section 4.5 and Tables 4/7: https://arxiv.org/html/2610.39273v1#S4.SS1.SSS0.Px6.p1 and https://arxiv.org/html/2610.39273v1#S4.SS5
