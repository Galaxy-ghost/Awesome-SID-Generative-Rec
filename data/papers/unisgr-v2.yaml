summary: Semantic-ID-based generative recommendation unifies retrieval and ranking through autoregressive decoding but differs
  structurally from discriminative models, which can directly access rich target-item side features. The attributes are compressed
  into a finite codebook during quantization, while the target item remains undetermined during decoding and its features
  cannot be looked up. This target-side feature vacuum weakens generation at each semantic-ID level through high conditional
  entropy and cascading errors, and final ranking through missing target-side feature crossing. Existing methods interact
  with candidate representations or generate discrete attribute tokens, but none reconstructs a continuous target-side representation
  inside decoding to support both stepwise generation and ranking. We propose TacGR (Stepwise Target-Side Feature Anticipation
  and Crossing for Generative Recommendation). Before decoding each codeword, TacGR anticipates a continuous target-side feature
  vector and crosses it with the semantic prefix and user behavior sequence inside the decoder. The crossed representation
  conditions current-level generation and is directly used for ranking. Continuous-vector regression risks a learnable target
  collapsing with its prediction and prediction noise propagating into generation through attention. TacGR addresses these
  challenges with a semantic-anchoring auxiliary tower and a unidirectional visibility mask, respectively. For extremely long
  industrial behavior histories, it introduces gated convolutional denoising to suppress noise and adapts the pyramid memory
  funnel to reduce inference cost. Offline experiments on a large-scale Lazada dataset show significant gains over OneRec,
  UniRec, and UniSGR. Online A/B testing improves IPV, Order, and GMV by 0.79%, 5.55%, and 3.09%, respectively.
tldr: UniSGR-V2 anticipates a continuous target-side feature vector before each codeword and crosses it with the semantic
  prefix and user behavior inside the decoder, using it for generation and ranking.
setup:
  datasets: 'Lazada recommendation logs with impression, click, add-to-cart and pay behaviors; training: 2.42 billion samples,
    6.46 million users, 7.53 million items.'
  split: 'Chronological: first 30 days training, following day testing; validation split not reported.'
  candidates: not reported; full-catalog versus sampled retrieval evaluation and history exclusion are unspecified; ranking
    sample construction not reported.
  visibility: warm; no unseen-item protocol is defined.
  sid: 3-level semantic IDs with 2,048 codewords per level; tokenizer inputs, quantization algorithm, training visibility
    and collision handling not reported.
  inference_budget: 'Beam search width not reported; paired prediction/code execution uses 3 sequential decoder calls; maximum
    history 1,024. Full TacGR: 701 QPS, mean latency 75.6 ms, P99 83.8 ms under matched production hardware/load; hardware
    specification, batch size and numerical memory-funnel schedule not reported; anchoring tower is training-only.'
  results_from: 'Own Lazada offline comparison, ablations and serving benchmarks; Table 1 averages 5 seeds. UniRec CoA reproduced
    on the same backbone; other baseline implementation provenance not reported. Own 40-day online A/B test on 10% traffic
    replaces UniSGR in one retrieval channel: IPV +0.79%, Order +5.55%, GMV +3.09%; other channels and downstream ranking
    retained.'
