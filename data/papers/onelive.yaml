id: onelive
name: OneLive
title: 'OneLive: Dynamically Unified Generative Framework for Live-Streaming Recommendation'
authors: Wang et al.
year: 2026
venue: KDD’26 ADS
links:
  arxiv: https://arxiv.org/abs/2602.08612
  code: null
problem: VI
stage: Tokenization
representation: Text+Img+Audio+CF
tokenization: R-KM
backbone: Lazy Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: Beam
poi: false
tldr: OneLive adapts generative recommendation to live streaming with a dynamic residual-quantization tokenizer, time-aware
  gated attention, a decoder-only generator with Sequential MTP, and multi-objective alignment.
tldr_zh: OneLive 结合动态残差量化编号器、时间感知门控注意力、带序列式多 token 预测的仅解码器生成器与多目标对齐，将生成式推荐用于直播场景。
setup:
  datasets: 'Kuaishou live-streaming logs over nearly two months: 400M users, 3M authors, billions of long-view/click interactions.
    Filtering rules not reported.'
  split: Last day test, earlier dates training; validation allocation not reported. Online A/B observed nearly one month on
    Kuaishou/Kuaishou Lite; traffic allocation not reported.
  candidates: not reported; only ongoing live streams are eligible.
  visibility: warm; no unseen-item protocol is defined. Collaborative post-alignment and author SID updates use real-time
    signals; test-author exposure in tokenizer training not reported.
  sid: 'Res-Kmeans: 3 levels x 8192 codes. Collision rates measured; collision disambiguation not reported.'
  inference_budget: 'HR/MRR@64/128; RL beam-top settings 64/256. L20 profiling: MTP graph latency mean/P99 2.25/3.62 ms (3
    layers), 2.97/5.04 ms (6 layers); QPS gains 31.8%/62.0%. Main beam width and inference batch size not reported.'
  results_from: 'Original Table 2: offline long-view/click comparisons on shared industrial logs; Tables 3-5: ablations/serving;
    Table 6: online A/B.'
setup_where:
  datasets: 'Appendix B.1.1: https://arxiv.org/html/2602.08612v1#A2.SS1.SSS1.p1'
  split: 'Appendix B.1.1 and Section 3.2: https://arxiv.org/html/2602.08612v1#A2.SS1.SSS1.p1 and https://arxiv.org/html/2602.08612v1#S3.SS2.p1'
  candidates: 'Introduction and Appendix C.2 specify live eligibility/generated-list metrics, not a sampled-negative protocol:
    https://arxiv.org/html/2602.08612v1#S1.p5 and https://arxiv.org/html/2602.08612v1#A3.SS2.p1'
  visibility: 'Appendix B.1 defines no item holdout: https://arxiv.org/html/2602.08612v1#A2.SS1 and https://arxiv.org/html/2602.08612v1#S2.SS1.SSS1.p3'
  sid: 'Section 2.1.2: https://arxiv.org/html/2602.08612v1#S2.SS1.SSS2.p2'
  inference_budget: 'Section 3.1.2 and Tables 4/5: https://arxiv.org/html/2602.08612v1#S3.SS1.SSS2.p1 and https://arxiv.org/html/2602.08612v1#S3.T4
    and https://arxiv.org/html/2602.08612v1#S3.T5'
  results_from: 'Table 2 and Sections 3.1/3.2: https://arxiv.org/html/2602.08612v1#S2.T2 and https://arxiv.org/html/2602.08612v1#S3.p1
    and https://arxiv.org/html/2602.08612v1#S3.SS2.p1'
related:
