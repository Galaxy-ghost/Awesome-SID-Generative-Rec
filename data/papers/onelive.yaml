  relation: predecessor
  note: OneLive extends SID generation to dynamic live-streaming content.
  where: 'OneLive v1, Appendix A.2 and Table 2: https://arxiv.org/html/2602.08612v1#A1.SS2.p2; https://arxiv.org/html/2602.08612v1#S2.T2.'
- id: onerec
  relation: competitor
  note: OneRec is adapted as the encoder-decoder live-streaming baseline.
  where: 'OneLive v1, Section 3.1.2 and Table 2; cited Deng et al. (2025) is arXiv:2502.18965: https://arxiv.org/html/2602.08612v1#S3.SS1.SSS2.p1;
    https://arxiv.org/html/2602.08612v1#S2.T2.'
- id: mmq
  relation: alternative
  note: MMQ aligns content with behavior; OneLive additionally updates author SIDs in real time.
  where: 'OneLive v1, Appendix A.2 and Section 2.1: https://arxiv.org/html/2602.08612v1#A1.SS2.p2; https://arxiv.org/html/2602.08612v1#S2.SS1.'
