id: lion
name: LION
title: Self-Evolving Memory for Generative Recommendation
authors: Lin et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2609.15598
  code: https://github.com/JazyJiang/Self-Evolving-Memory-for-Generative-Recommendation
problem: VI
stage: Backbone
representation: Text†
tokenization: RQ-VAE†
backbone: Enc-Dec
tokenizer: Fixed†
objective: NTP + Aux.
inference: Beam
poi: false
tldr: LION adds a sparse key-value memory layer that isolates the evolution of different behavior patterns, with a consolidation
  loss, instead of updating all shared parameters on streaming interactions.
tldr_zh: LION 加入稀疏键值记忆层与巩固损失，将不同行为模式的演化隔离开来，避免在流式交互上直接更新全部共享参数。
setup:
  datasets: Amazon Games, CDs, and Toys; next-item samples with at most 10 previous interactions. Filtering rules not reported.
  split: Target timestamps define five equal-count chronological periods P0-P4; adapt through each period and evaluate the
    next (P1-P4). Current-period validation file used; validation fraction not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Item/tokenizer exposure across periods not reported.
  sid: TIGER instantiation; tokenizer construction, SID length, codebook sizes, and collision handling not reported.
  inference_budget: 'Beam 20; K=10/20. Sparse memory defaults: 64 keys per dimension, top-32 activation, decoder layer 5,
    routing history length 2. Hardware, inference batch size, and latency not reported.'
  results_from: 'Original Table 1: sample-weighted micro-average over four periods x five user groups; Table 2: period/group
    results; Table 3: ablations. Baselines adapted to TIGER in this paper.'
setup_where:
  datasets: 'Section 5.1.1: https://arxiv.org/html/2609.15598v1#S5.SS1.SSS1.p1'
  split: 'Sections 2/5.1.1/5.1.4: https://arxiv.org/html/2609.15598v1#S2.p3 and https://arxiv.org/html/2609.15598v1#S5.SS1.SSS1.p2
    and https://arxiv.org/html/2609.15598v1#S5.SS1.SSS4.p1'
  candidates: 'Section 5.1.2 defines generated-list metrics but no evaluation candidate pool: https://arxiv.org/html/2609.15598v1#S5.SS1.SSS2.p1'
  visibility: 'Section 5.1 defines streaming periods without an unseen-item holdout: https://arxiv.org/html/2609.15598v1#S5.SS1'
  sid: 'Sections 2/5.1.4 give generic token identifiers and the TIGER implementation: https://arxiv.org/html/2609.15598v1#S2.p1
    and https://arxiv.org/html/2609.15598v1#S5.SS1.SSS4.p1'
  inference_budget: 'Section 5.1.2 and Appendix A.1: https://arxiv.org/html/2609.15598v1#S5.SS1.SSS2.p1 and https://arxiv.org/html/2609.15598v1#A1.SS1.p1'
  results_from: 'Section 5.1.3 and Tables 1-3: https://arxiv.org/html/2609.15598v1#S5.SS1.SSS3.p1 and https://arxiv.org/html/2609.15598v1#S5.T1
    and https://arxiv.org/html/2609.15598v1#S5.T2 and https://arxiv.org/html/2609.15598v1#S5.T3'
