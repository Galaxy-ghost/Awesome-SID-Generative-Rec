id: transrec
name: TransRec
title: 'Bridging Items and Language: A Transition Paradigm for Large Language Model-Based Recommendation'
authors: Lin et al.
year: 2024
venue: KDD’24
links:
  arxiv: https://arxiv.org/abs/2310.06491
  code: https://github.com/Linxyhaha/TransRec/
problem: II
stage: Tokenization
representation: Text
tokenization: Multi-Facet ID
backbone: Enc-Dec / Dec-Only
tokenizer: Fixed
objective: NTP
inference: FM-Index+Agg.
poi: false
tldr: TransRec indexes items with multi-facet identifiers combining ID, title, and attributes, constrains generation with
  FM-index substring indexing, and aggregates generated identifiers to rank catalog items.
tldr_zh: TransRec 用结合 ID、标题与属性的多面标识索引物品，通过 FM-index 子串索引约束生成，并聚合生成的标识为物品库打分排序。
evidence:
- field: problem
  where: https://arxiv.org/html/2310.06491v2#abstract1 (Abstract; first limitation excerpt)
  quote: either lose semantics or lack adequate distinctiveness
- field: problem
  where: https://arxiv.org/html/2310.06491v2#abstract1 (Abstract; second limitation excerpt)
  quote: might generate invalid identifiers
setup:
  datasets: 'Amazon Beauty and Toys, plus Yelp. Release year and filtering thresholds: not reported. Items use random unique
    numeric IDs, titles and categories.'
  split: 'Per-user leave-one-out: last item test, penultimate validation, remainder training. Full training uses all training
    users; few-shot selects 1024/2048 users. Discard oldest history items until input fits 1024 tokens (BART) or 512 (LLaMA).'
  candidates: 'not reported: full-catalog versus sampled evaluation and history-item exclusion are unspecified. Generated
    facet identifiers are aggregated into scores for in-corpus items.'
  visibility: 'Full-training item-level visibility: not reported. Few-shot tests the N training users plus N unseen users;
    warm requires both user and item warm, otherwise cold. Cold items are unseen by generator training, but the cold subset
    also includes unseen-user cases. Identifier construction reportedly uses only warm items; learned SID tokenizer n/a for
    manual facets. Cold-item exposure through the FM-index is not reported.'
  sid: 'Three separate facets: unique random numeric ID, title and categories. Variable text-token lengths; codebook size
    n/a. Numeric IDs provide uniqueness while titles/attributes can be shared. Training samples five title substrings per
    sequence and uses each category separately; this is not a quantized SID.'
  inference_budget: 'FM-index-constrained beam20 for TransRec and LLM baselines; generate each facet, then aggregate grounding
    scores. Recall/NDCG@5/10. Table3 reports 218.43s grounding per 5000 Beauty users, not end-to-end request latency. Inference
    batch, hardware and generated-length cap: not reported; four RTX A5000 GPUs are explicitly the training setup.'
  results_from: 'This paper''s Table1 full-training BART comparison, Table2 Beauty few-shot warm/cold comparison, Table3 grounding
    ablation, and appendix analyses. P5 is explicitly trained on sequential tasks with randomized IDs; Appendix A.3 implements
    indexing baselines and TransRec with the same T5-small backbone/single prompt. Borrowed-score attribution and run/seed
    counts: not reported.'
