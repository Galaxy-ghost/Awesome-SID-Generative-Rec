summary: Generative recommendation with semantic IDs represents each item as a sequence of discrete codes derived from its
  semantic representation and predicts these codes to generate recommendations. Existing semantic-ID recommenders are typically
  trained with hard labels for the observed next item. Although such supervision identifies the target, it provides no explicit
  distributional information about alternative items conditioned on the same user history. Sequential recommenders can supply
  this item-level predictive knowledge, but transferring it to semantic-ID generation is challenging because the teacher and
  student operate in item and code spaces, respectively. We propose two complementary knowledge-distillation objectives for
  parallel semantic-ID recommenders, which predict all code positions simultaneously without autoregressive prefix conditioning.
  Item Distribution Matching (IDM) reconstructs a catalogue-level item distribution from the student's parallel code predictions
  and aligns it with the teacher's item distribution. Code Marginal Matching (CMM) projects the teacher's item probabilities
  onto each code position using fixed item-to-code assignments, then matches the resulting code marginals to the corresponding
  student heads. Both objectives transfer the teacher's soft distributional knowledge while preserving the student's parallel
  prediction structure. Experiments on benchmark datasets show that both methods consistently outperform existing state-of-the-art
  approaches. On average, IDM improves Recall@10 by 15.39%, while CMM improves NDCG@10 by 8.28%. These results demonstrate
  that distillation in either reconstructed item space or code-marginal space can substantially strengthen hard-label supervision
  for parallel generative recommendation.
tldr: IDM/CMM distills a sequential recommender into a parallel Semantic ID generator by matching a reconstructed item distribution
  or per-position code marginals, instead of training on hard next-item labels alone.
tldr_zh: IDM/CMM 通过匹配重构的物品分布或各位置码的边缘分布，将序列推荐教师蒸馏到并行 SID 生成器，而非仅用单物品硬标签训练。
setup:
  datasets: Amazon Reviews 2014 Beauty, Toys and Games, Sports and Outdoors; existing 5-core data verified without further
    filtering or deduplication.
  split: Per-user chronological last/penultimate interactions are test/validation; earlier events train. Histories capped
    at 50; test histories include validation interaction.
  candidates: full catalog; no historical-item masking
  visibility: warm; no unseen-item protocol is defined.
  sid: 16 subspaces x 3 residual levels x 256 codes; 48 fixed heads. Collisions retained with identical scores; each item
    remains a distinct catalog entry.
  inference_budget: Single parallel student, no teacher; Recall/NDCG@5/10; evaluation batch 32, FP32. Beam n/a; evaluation
    hardware and latency not reported. RTX 5880 Ada is specified for training.
  results_from: 'Table 2: IDM/CMM, AsymRec and RPG reproduced, averaged over three runs; other baseline scores copied from
    RPG Table 2.'
