id: aware
name: AWARE
title: 'Why Users Go There: World Knowledge-Augmented Generative Next POI Recommendation'
authors: Ding et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.11807
  code: null
problem: VI
stage: Training
representation: Text+Geo
tokenization: Geo-Prefix+HClus
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: –
poi: true
tldr: AWARE adds agent-generated narratives about local events, culture, and seasonal trends, grounded in each user's behavior,
  to LLM-based next-POI generation, whose knowledge otherwise stays fixed after training.
tldr_zh: AWARE 将智能体结合用户行为生成的本地活动、文化与时令叙事融入基于 LLM 的下一 POI 生成，弥补模型参数训练后知识固定的局限。
setup:
  datasets: Foursquare-NYC, Foursquare-TKY and Gowalla-CA; filter users/POIs with fewer than 10 check-ins; segment chronological
    trajectories at a 24-hour gap; reverse-geocode street addresses.
  split: 'Temporal 80/10/10 train/validation/test; per-user versus global allocation: not reported. History budget 150 entries,
    reserving 40% for matching day-of-week and filling the remainder with recent entries.'
  candidates: not reported; full-catalog versus sampled evaluation and history-POI exclusion are unspecified.
  visibility: 'warm; main protocol: all validation/test users and POIs are observed during training. Cross-city transfer trains
    on NYC and evaluates TKY/CA without adaptation; pretrained-generator/tokenizer exposure to target-city POIs: not reported.
    Hard cases only exclude the target from the user''s last five visits, not from training.'
  sid: 'ROS Spatial SIDs: hierarchical clustering of Qwen3-0.6B POI text embeddings plus multi-resolution S2-cell geospatial
    prefixes. Numerical SID length, branching/codebook sizes, S2 levels and collision handling: not reported.'
  inference_budget: 'Autoregressive SID prediction; HR@1 and HR/NDCG@5/10/20. Beam width, inference hardware/batch, generated-length
    cap and numerical latency: not reported. Qwen3-max knowledge acquisition is offline, capped at two retrieval rounds and
    80/150-word narratives; no agent calls during serving. Eight MI308X GPUs are the training setup.'
  results_from: 'Paper''s Table1 main comparisons, Tables2-3 NYC ablations/hard cases, Table4 top-K and Figure5 cross-city
    transfer; scores average three inference runs, not three stated training seeds. ROS pretrained backbone is the controlled
    baseline. Other baselines'' quoted-versus-rerun provenance: not reported.'
