  split: 'Appendix A and E: https://arxiv.org/html/2605.11807v1#A1.p1 and https://arxiv.org/html/2605.11807v1#A5.p1'
  candidates: 'Sec.4.1 reports prediction metrics without catalog/negative-sampling details: https://arxiv.org/html/2605.11807v1#S4.SS1.p3'
