id: kgtb
name: KGTB
title: Knowledge Graph Tokenization for Behavior-Aware Generative Next POI Recommendation
authors: Sun et al.
year: 2025
venue: arXiv’25
links:
  arxiv: https://arxiv.org/abs/2509.12350
  code: null
problem: I
stage: Tokenization
representation: Attr+Geo+CF
tokenization: KG-RQ
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: –
poi: true
summary: 完整 POI StruID 是推荐输出，知识图谱编号和多行为监督提供独立设计。
tldr: KGTB organizes POI data as a knowledge graph, quantizes each node into a structural ID under graph supervision, and
  fine-tunes an LLM on POI, category, and region visit tasks.
setup:
  datasets: Foursquare Boston/Paris; Gowalla Austin/San Francisco. No filtering strategies applied.
  split: Per-user chronological 70% training, 10% validation, 20% test.
  candidates: not reported
  visibility: 'warm; no unseen-item protocol is defined. Cold-start means POIs with fewer than five visitors; unseen means
    unvisited by the user. Cross-city transfer is also tested. Item-level generator/tokenizer holdouts and KG exposure to
    test interactions: not reported.'
  sid: '3-level KG residual quantization. Printed sizes at level l=1/2/3: POI/user 8^{4(l-1)}; region/category 8^{2(l-1)}.
    Collision handling: not reported.'
  inference_budget: 'HR/NDCG@1/5/10; FB total test time 0.4h. Decoder, beam, inference hardware/batch, per-request latency:
    not reported; L40 and batch 4 describe fine-tuning.'
  results_from: 'Original Tables 2/3/4/5/6/7: main, ablation, cross-city, compute, backbone, user-unvisited POIs; Figure 4:
    low-visitor subset.'
setup_where:
  datasets: 'Experimental Setup and Main Results: https://arxiv.org/html/2509.12350v1#Sx5.SSx1.SSSx1.p1 and https://arxiv.org/html/2509.12350v1#Sx5.SSx2.p3'
  split: 'Experimental Setup, Datasets and Metrics: https://arxiv.org/html/2509.12350v1#Sx5.SSx1.SSSx1.p1'
  candidates: 'Experimental Setup reports ranking metrics without a candidate protocol: https://arxiv.org/html/2509.12350v1#Sx5.SSx1'
