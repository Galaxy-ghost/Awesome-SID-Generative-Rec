related:
- id: tiger
  relation: competitor
  note: TIGER generates one shared semantic ID space for all items; MBGR makes SIDs business-aware and predicts the next item
    for each business in parallel.
  where: 'MBGR v1, Table 1 baseline Tiger: https://arxiv.org/html/2604.02684v1#S6.T1; related work: https://arxiv.org/html/2604.02684v1#S2.SS1.p1.'
- id: onerec
  relation: alternative
  note: OneRec unifies the whole pipeline in one end-to-end model; MBGR keeps the industrial cascade and adds multi-business
    generation for recall.
  where: 'MBGR v1, Section 6.6 contrasts with OneRec: https://arxiv.org/html/2604.02684v1#S6.SS6.p2; related work: https://arxiv.org/html/2604.02684v1#S2.SS1.p1.'
