summary: 'Abstract: "a seesaw phenomenon in multi-business scenarios"; "a unified SID space causes". Candidates: VI / II (rule:
  judged by the abstract''s complaint first).'
tldr: MBGR adds business-aware Semantic IDs, business-specific prediction, and dynamic label routing to generative recommendation,
  to avoid a seesaw between businesses that share one ID space.
evidence:
- field: problem
  where: 'Abstract, first listed challenge (fragment), arXiv v1: https://arxiv.org/html/2604.02684v1#abstract1.1'
  quote: a seesaw phenomenon in multi-business scenarios
  reason: 'Organizer judgment: VI is selected over II by prioritizing the abstract''s complaint about multi-business behavior
    prediction.'
- field: problem
  where: 'Abstract, second listed challenge (separate fragment), arXiv v1: https://arxiv.org/html/2604.02684v1#abstract1.1'
  quote: a unified SID space causes
- field: tokenizer
  where: 'Section 4.1, BID input tokens and reconstruction, arXiv v1: https://arxiv.org/html/2604.02684v1#S4.SS1.p1 and https://arxiv.org/html/2604.02684v1#S4.SS1.p3'
  reason: The base SID construction and whether it is updated with the generator are not specified; Fixed is retained only
    as an organizer inference.
setup:
  datasets: 'Meituan only. Generative training data: one year of click sequences from 38,258,649 users over 54,875,570 merchants
    in four businesses (A 61.47%, B 9.56%, C 12.31%, D 16.66%). Downstream data: 37,349,276 users and 783,946,360 interactions
    over a rolling 30-day window. Filtering rules: not reported.'
  split: 'Offline: not reported (the paper mentions a validation set for hyperparameter search but not how train, validation,
    and test are formed). Online: one-week A/B test with 30% of Meituan production traffic against the baseline without MBP;
    CTCVR +3.98%.'
  candidates: not reported (full catalog versus sampled candidates for HR@10); downstream ranking uses business-wise GAUC.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Business-aware semantic IDs: each item''s K token embeddings are re-encoded with its business type through a gated
    encoder and decoded per business; number of SID levels, codebook sizes, and collision handling: not reported.'
  inference_budget: 'Decoding method and beam width: not reported. 16-layer Transformer (8 heads, 128-dimensional embeddings),
    sequences up to 1,500 items; trained and deployed on NVIDIA A100-80GB GPUs; inference batch size and latency: not reported.'
  results_from: Table 1 (HR@10 per business versus SASRec, TIGER, HSTU); Table 2 (downstream CTCVR GAUC); Table 3 (ablations);
    Tables 4-7 (time decay, business weights, expert count).
