id: pad-rec
name: PAD-Rec
title: Position-Aware Drafting for Inference Acceleration in LLM-Based Generative List-Wise Recommendation
authors: Chen et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.27747
  code: https://github.com/Jiaju-Chen/PAD-Rec
problem: V
stage: Inference
representation: Text+SID
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP†
inference: Spec. Dec.
poi: false
summary: 'Abstract: "decoding remains sequential and thus latency-prone".'
tldr: PAD-Rec adds gated item-slot and draft-step position embeddings to the draft model of speculative decoding, instead
  of treating all Semantic ID draft tokens uniformly.
evidence:
- field: problem
  where: 'PAD-Rec v1, Abstract, quoted clause: https://arxiv.org/html/2604.27747v1#abstract1'
  quote: decoding remains sequential and thus latency-prone
- field: objective
  where: 'PAD-Rec v1, Section 5.1, target-model construction: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p5 ; https://arxiv.org/html/2604.27747v1#S5.SS1.SSS4.p1
    ; inherited LC-Rec v4, Section III-C: https://arxiv.org/html/2311.09049v4#S3.SS3.p1'
  reason: Multi-task training remains an organizer inference from the LC-Rec-based target and LC-Rec's alignment tasks, not
    a directly reported PAD-Rec objective. PAD-Rec describes adapting that target to list-wise autoregressive training before
    freezing it for draft training.
setup:
  datasets: Amazon Beauty (12,101 items / 22,363 sequences), Instruments (9,922 / 24,772), Games (17,332 / 49,156), and Yelp
    (20,033 / 30,431). Users with fewer than 11 interactions are removed; each remaining user's 10 most recent items form
    the target list.
  split: User-level 8:1:1 split into training, validation, and test, so all interactions of a user fall in one partition;
    targets are each user's 10 most recent items.
  candidates: 'n/a for candidate ranking: the model generates a 10-item list that is compared with the user''s 10 most recent
    items (Recall@10, NDCG@10).'
  visibility: warm; no unseen-item protocol is defined. Test users are held out from training (user-level split), while items
    are shared across splits.
  sid: '4-level RQ-VAE semantic IDs over embeddings that integrate semantic and collaborative signals (following LETTER),
    with separator tokens between items; codebook size and collision handling: not reported.'
  inference_budget: EAGLE-2-style tree speculative decoding with speculation depth 6 and tree width 10, at temperature 0 and
    0.5; target LLM Llama-3.2-1B-Instruct (3B and 8B in scaling). Latency measured on NVIDIA RTX 3090 GPUs in fp16 with batch
    size 1 after three warm-up runs; Table 3 lists naive target-LLM latency (e.g. Beauty 693.55 at temp 0, units as in the
    table).
  results_from: Table 2 (wall-clock speedup, accepted length, Recall@10, NDCG@10 versus EAGLE-2, HASS, FSPAD, GRIFFIN on four
    datasets); Table 3 (naive decoding latency); later tables and figures (ablations, model scaling, hyperparameters).
setup_where:
  datasets: 'Datasets and statistics: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p1 and https://arxiv.org/html/2604.27747v1#S5.T1;
    preprocessing: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p3.'
  split: 'User-level 8:1:1 split: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p4.'
  candidates: 'List-wise recall against the 10-item ground-truth list: https://arxiv.org/html/2604.27747v1#S5.I4.i3.p1 and
    https://arxiv.org/html/2604.27747v1#S5.I4.i4.p1.'
  visibility: 'Test users are disjoint from training users; items are shared: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p4.'
  sid: 'K=4 RQ-VAE codebooks following LETTER, separators between items: https://arxiv.org/html/2604.27747v1#S3.SS1.p3 and
    https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p3.'
  inference_budget: 'Tree-based speculative decoding settings and timing protocol: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS4.p2
    and https://arxiv.org/html/2604.27747v1#S5.SS1.SSS4.p3; baseline latency: https://arxiv.org/html/2604.27747v1#S5.T3.'
  results_from: 'Main: https://arxiv.org/html/2604.27747v1#S5.T2; latency: https://arxiv.org/html/2604.27747v1#S5.T3; ablations
    and hyperparameters in Section 5.'
related:
- id: lc-rec
  relation: predecessor
  note: PAD-Rec accelerates a list-wise LC-Rec target model with speculative decoding, adding item and step position embeddings
    to the draft head.
  where: 'PAD-Rec v1, implementation on LC-Rec: https://arxiv.org/html/2604.27747v1#S5.SS1.SSS4.p1 and https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p5.'
- id: letter
  relation: predecessor
  note: PAD-Rec obtains its semantic IDs following LETTER's semantic-collaborative embeddings and RQ-VAE.
  where: 'PAD-Rec v1, Section 3.1 and Section 5.1 follow reference [40], LETTER: https://arxiv.org/html/2604.27747v1#S3.SS1.p3
    and https://arxiv.org/html/2604.27747v1#S5.SS1.SSS1.p3.'
- id: atspeed
  relation: alternative
  note: AtSpeed also accelerates LLM-based generative recommendation with speculative decoding; PAD-Rec targets list-wise
    generation with position-aware drafts.
  where: 'PAD-Rec v1, Sections 1 and 2.3 cite AtSpeed: https://arxiv.org/html/2604.27747v1#S1.p2 and https://arxiv.org/html/2604.27747v1#S2.SS3.p1;
    not a baseline in Table 2.'
- id: specgr
  relation: alternative
  note: SpecGR uses speculative generation for inductive recommendation, while PAD-Rec speeds up decoding without changing
    the target model's outputs.
  where: 'PAD-Rec v1, Section 2.3: https://arxiv.org/html/2604.27747v1#S2.SS3.p1.'
