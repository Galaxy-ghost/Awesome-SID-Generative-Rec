id: trierec
name: TrieRec
title: Trie-Aware Transformers for Generative Recommendation
authors: Xu et al.
year: 2026
venue: NeurIPS’26
links:
  arxiv: https://arxiv.org/abs/2602.21677
  code: null
problem: III
stage: Backbone
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed†
objective: NTP†
inference: C-Beam
poi: false
summary: 将 SID 的 trie 深度、祖先路径和 token 对关系写入生成器位置编码与注意力，改善其读取和建模层次 SID 的能力。
tldr: TrieRec adds a trie-aware absolute positional encoding and a topology-aware relative positional encoding to Transformer
  generators, so attention reflects the Semantic ID prefix tree instead of a flat token stream.
tldr_zh: TrieRec 为 Transformer 生成器加入前缀树感知绝对位置编码与拓扑感知相对位置编码，使注意力反映 SID 前缀树结构而非扁平 token 流。
setup:
  datasets: Amazon Beauty, Toys, Food; MovieLens-1M. Standard 5-core filtering, histories retain the most recent 20 interactions.
  split: Per-user most recent interaction test, penultimate validation, earlier interactions training.
  candidates: 'Traditional models: full catalog; generative candidate universe not explicitly reported beyond a valid-item
    trie.'
  visibility: warm; no unseen-item protocol is defined. Tokenizer/collaborative encoder exposure to test items not reported.
  sid: 'Sentence-T5-base text features; RQ-VAE: 3 semantic levels x 256 codes, dimension 32, plus a fourth collision token.
    Select lowest-collision tokenizer checkpoint before appending the uniqueness digit; collision-token vocabulary size not
    reported.'
  inference_budget: Constrained beam 10; Recall/NDCG@5/10. Hardware and inference batch size not reported. Figure 3 plots
    inference time on Beauty/Toy, but the inference panel lacks explicit units and numeric bar labels.
  results_from: 'Original Tables 2/4: TrieRec on TIGER, CoST, LETTER and competing positional/structure encodings. Table 3:
    LETTER-based ablations.'
