poi: false
tldr: UniSID optimizes embeddings and Semantic IDs end to end from raw advertising data with multi-granularity contrastive
  learning and summary-based reconstruction, instead of embedding first and quantizing afterwards.
tldr_zh: UniSID 通过多粒度对比学习与基于摘要的重构，从原始广告数据端到端联合优化嵌入与 SID，替代先提取嵌入再后验量化的两步做法。
setup:
  datasets: Tencent Ad-60W and Ad-100W multimodal advertising datasets, plus Amazon Beauty. Filtering rules not reported;
    public preprocessing is described only as standard practice.
  split: 'Table 1 train/test counts: Ad-60W 500K/100K, Ad-100W 1M/1M, Beauty 12101/12101. Split procedure, count granularity
    and validation allocation not reported.'
  candidates: 'Embedding retrieval sampled: 1000 total (one positive plus 999 negatives); negative sampling distribution and
    history exclusion not reported. Next-ad and Beauty recommendation candidate protocols not reported.'
  visibility: warm; no unseen-item protocol is defined. SID-model fitting exposure to test items not reported.
  sid: Three direct categorical SID heads x 2048 entries, using per-layer argmax on Qwen2.5-VL-3B outputs rather than residual
    quantization. Collision handling not reported.
  inference_budget: Beauty replaces the TIGER tokenizer with UniSID; industrial next-ad predictor details not reported. Metrics
    at K=1/5/10/20. Downstream decoding/beam, inference hardware, batch size and latency not reported; tokenizer training
    batch 512 is not an inference setting.
  results_from: 'Original Table 2: SID quality/next-ad prediction; Table 3: embedding retrieval; Table 5: ablations. Table
    4: UniSID in TIGER on Beauty, with baseline results explicitly taken from LETTER.'
