id: mbgen
name: MBGen
title: Multi-Behavior Generative Recommendation
authors: Liu et al.
year: 2024
venue: CIKM’24
links:
  arxiv: https://arxiv.org/abs/2405.16871
  code: https://github.com/anananan116/MBGen
problem: I
stage: Training
representation: CF
tokenization: Bal. VQ+KM
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Beam
poi: false
summary: 'Abstract: "neglecting the value of integrating the target behavior type into the learning objective".'
tldr: MBGen interleaves behavior tokens and item tokens in one sequence, predicts the next behavior type and then the next
  item, and scales with a position-routed sparse architecture.
tldr_zh: MBGen 在同一序列中交错排列行为 token 与物品 token，先预测下一行为类型再预测下一物品，并用按位置路由的稀疏架构扩展规模。
evidence:
- field: problem
  where: 'Abstract, arXiv v1: https://arxiv.org/html/2405.16871v1#abstract1.1'
  quote: Existing approaches focus on the next-item prediction objective, neglecting the value of integrating the target behavior
    type into the learning objective.
setup:
  datasets: Retail (Taobao/Tmall) and IJCAI; purchase/cart/favorite/click behaviors, with purchase as target. Remove items
    occurring fewer than five times in training sequences; maximum history 50 items.
  split: 'Per-user leave-one-out: latest interaction test, penultimate validation; remaining interactions training.'
  candidates: full catalog; target ranked against all other items rather than sampled negatives.
  visibility: warm; retained items have at least five training occurrences. SID features come from pretrained MB-STR embeddings;
    pretraining exposure to test interactions not reported.
  sid: 'Three item tokens with per-position size K=64 Retail/96 IJCAI. Balanced SID: K-entry VQ codebook, K-cluster residual
    K-means per first-token bucket, then random collision-disambiguation token. Balanced CID: random item-number remapping
    and base-K digits, without features. Behavior token precedes each item.'
  inference_budget: Beam 50; top-10 outputs; Recall/NDCG@5/10. Hardware, inference batch size and latency not reported.
  results_from: 'Original Tables 3/4/5: target-behavior, behavior-specific, joint behavior-item prediction. Most baselines
    reproduced in RecBole; MB-GMN excepted, with result provenance not specified. Table 6: ablations; Table 7: token distribution.'
setup_where:
  datasets: 'https://arxiv.org/html/2405.16871v1#S4.SS1.SSS1.p2 ; #S4.SS1.SSS1.p3 ; #S4.SS1.SSS1.p4 ; #S4.SS1.SSS3.p1'
  split: https://arxiv.org/html/2405.16871v1#S4.SS1.SSS3.p1
  candidates: https://arxiv.org/html/2405.16871v1#S4.SS1.SSS3.p1
  visibility: 'https://arxiv.org/html/2405.16871v1#S4.SS1.SSS1.p4 ; #S4.SS1.SSS4.p2'
  sid: 'https://arxiv.org/html/2405.16871v1#S3.SS2.p3 ; #S3.SS2.p4 ; #S3.SS2.p5 ; #S4.SS1.SSS4.p2'
  inference_budget: 'https://arxiv.org/html/2405.16871v1#S4.SS1.SSS3.p1 ; #S4.SS1.SSS4'
  results_from: 'https://arxiv.org/html/2405.16871v1#S4.T3 ; #S4.T4 ; #S4.T5 ; #S4.T6 ; #S4.T7 ; #S4.SS1.SSS4.p1'
related:
- id: tiger
  relation: competitor
  note: TIGER is a reproduced generative baseline; MBGen balances item tokens and jointly predicts behavior types and items.
  where: 'MBGen v1, Sections 3.2/4.1.2 and Table 3: https://arxiv.org/html/2405.16871v1#S3.SS2.p1; https://arxiv.org/html/2405.16871v1#S4.SS1.SSS2.p2;
    https://arxiv.org/html/2405.16871v1#S4.T3.'
- id: mmgrec
  relation: alternative
  note: MBGen cites MMGRec among RQ-VAE tokenizers whose code imbalance motivates its bucket-specific residual quantization.
  where: 'MBGen v1, Section 3.2, citing Liu et al. (2024): https://arxiv.org/html/2405.16871v1#S3.SS2.p1; https://arxiv.org/html/2405.16871v1#S3.SS2.p2.'
- id: lmindexer
  relation: alternative
  note: LMIndexer learns language-model semantic indices; MBGen instead uses pretrained collaborative embeddings for balanced
    item tokens.
  where: 'MBGen v1, Sections 2/4.1.4, citing Jin et al. (2023): https://arxiv.org/html/2405.16871v1#S2.p2; https://arxiv.org/html/2405.16871v1#S4.SS1.SSS4.p2.'
