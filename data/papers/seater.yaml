id: seater
name: SEATER
title: Generative retrieval with semantic tree-structured identifiers and contrastive learning
authors: Si et al.
year: 2024
venue: SIGIR-AP’24
links:
  arxiv: https://arxiv.org/abs/2309.13375
  code: https://github.com/Ethan00Si/SEATER_Generative_Retrieval
problem: V
stage: Tokenization
representation: CF
tokenization: Tree-Clus.
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Ctr.
inference: C-Beam
poi: false
summary: 'Abstract: "these methods fall short in efficiency and effectiveness for large-scale recommendations". Candidates:
  V / III (rule: judged by the abstract''s complaint first).'
tldr: SEATER builds item identifiers on a balanced k-ary tree and trains an encoder-decoder with generation, infoNCE, and
  triplet losses, to learn token hierarchy with equal inference cost for all items.
evidence:
- field: problem
  where: https://arxiv.org/abs/2309.13375v2 (Abstract on the versioned abstract page)
  quote: these methods fall short in efficiency and effectiveness for large-scale recommendations
  reason: The organizer retains V over candidate III by prioritizing the abstract complaint about efficiency and effectiveness.
setup:
  datasets: 'Yelp 2018 (31,668 users / 38,048 items), Amazon Books (459,133 / 313,966), MIND-small News (50,000 / 39,865),
    and an industrial Micro-Video dataset of 0.75 million randomly selected users over two weeks in 2023 (6.1 million items,
    85 million interactions, unfiltered). Public-dataset filtering: not reported.'
  split: Users are partitioned 8:1:1 into training, validation, and test; for each evaluated user the first 80% of behaviors
    are context and the remaining 20% are ground truth (ComiRec protocol).
  candidates: full catalog (top-n items from the entire candidate set via constrained beam search); NDCG uses all positive
    items for the ideal DCG.
  visibility: warm; no unseen-item protocol is defined. Test users are held out from training (user-level split); the SASRec
    embeddings used to build identifiers are trained on interaction data whose user split is not restated.
  sid: 'Balanced k-ary tree identifiers from recursive constrained k-means over trained SASRec item embeddings; leaf-layer
    tokens correspond one-to-one with items and share the item''s embedding. The branch count k is searched over 2, 4, 8,
    16, and 32, and the paper states that k is set to 8 or 16 in the experiments; the value per dataset: not reported.'
  inference_budget: 'Constrained beam search over the prefix tree with beam size 50 (also for TDM and RecForest); Table 1
    gives asymptotic inference cost. Main SEATER uses a single encoder-decoder layer. Hardware, inference batch size, and
    latency: not reported.'
  results_from: Table 3 (Yelp, News, Books, Micro-Video versus dual-encoder, tree-based, and generative baselines including
    GPTRec and TIGER); Table 1 (time and space complexity); Section 5.5 (more encoder-decoder layers).
setup_where:
  datasets: 'Datasets: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS1.p1 and https://arxiv.org/html/2309.13375v2#S5.SS1.SSS1.p2;
    statistics: https://arxiv.org/html/2309.13375v2#S5.T2.'
  split: 'User-level 8:1:1 split with 80/20 context/target: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS2.p1.'
  candidates: 'Top-n from the entire candidate set: https://arxiv.org/html/2309.13375v2#S3.SS4.p1; NDCG computed against all
    positives: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS2.p2.'
  visibility: 'Test users disjoint from training users; items shared: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS2.p1.'
  sid: 'Balanced k-ary tree from constrained k-means over SASRec embeddings; https://arxiv.org/html/2309.13375v2#algorithm1.6;
    leaf tokens one-to-one with items: https://arxiv.org/html/2309.13375v2#S3.SS2.SSS2.p3; k search range: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS3.p4;
    k set to 8 or 16: https://arxiv.org/html/2309.13375v2#S4.SS2.p2.'
  inference_budget: 'Beam size 50 for tree-based and generative methods: https://arxiv.org/html/2309.13375v2#S5.SS1.SSS3.p4;
    complexity: https://arxiv.org/html/2309.13375v2#S3.T1.'
  results_from: 'Main: https://arxiv.org/html/2309.13375v2#S5.T3; complexity: https://arxiv.org/html/2309.13375v2#S3.T1.'
related:
- id: tiger
  relation: competitor
  note: TIGER builds identifiers by RQ-VAE over text embeddings; SEATER builds balanced tree identifiers from collaborative
    SASRec embeddings and adds alignment and ranking losses over the tree.
  where: 'SEATER v2, Section 4.1 related work: https://arxiv.org/html/2309.13375v2#S4.SS1.p2; Table 3 generative baseline:
    https://arxiv.org/html/2309.13375v2#S5.T3.'
- id: cid
  relation: alternative
  note: P5 with collaborative indexing uses spectral clustering of interactions for IDs; SEATER uses a balanced k-ary tree
    from constrained k-means.
  where: 'SEATER v2, Section 4.1 cites Hua et al. (2023b): https://arxiv.org/html/2309.13375v2#S4.SS1.p2.'
- id: eager
  relation: alternative
  note: EAGER, a later paper that cites SEATER among generative recommenders, builds two tree-structured codes (behavior and
    semantic) with hierarchical k-means instead of one collaborative tree.
  where: 'Evidence is from the later EAGER paper, Section 1: https://arxiv.org/html/2406.14017v2#S1.p2.'
