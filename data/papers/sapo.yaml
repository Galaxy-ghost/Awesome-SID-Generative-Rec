id: sapo
name: SAPO
title: 'SAPO: Step-Aligned Policy Optimization for Reasoning-Based Generative Recommendation'
authors: Zheng et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.17648
  code: https://github.com/zhengzaiyi/SAPO
problem: IV
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → RL
inference: CoT+C-Beam
poi: false
summary: 把推理块与SID码位配对分配组内奖励，避免整条结果奖励同时惩罚匹配和不匹配的码位。
tldr: SAPO computes a separate group-relative advantage for each reasoning step, one thinking block plus one Semantic ID token,
  instead of broadcasting one exact-match advantage to the whole response.
setup:
  datasets: Amazon Reviews Office Products, Video Games, Industrial & Scientific; October 2016-November 2018; 5-core users/items.
    Further history truncation not reported.
  split: 'Per-user chronological leave-one-out: last item test, second last validation, remaining prefix training; all valid
    sliding-window history/target pairs used for training.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer fitting exposure to test items not explicitly separated.
  sid: 'RQ-VAE: 3 x 256 over title/category/brand/description embeddings. Paper reports training until every item has a unique
    tuple, with no extra collision suffix; a separate collision-assignment rule is not reported.'
  inference_budget: Qwen3-1.7B generates three thinking blocks followed by three contiguous SID tokens, enabling trie-constrained
    beam decoding and KV reuse; Recall/NDCG@5/10. Test beam width, reasoning cap, hardware allocation, batch size and latency
    not reported. The 16 rollouts/prompt, 1024-token cap and 4 H100s are training settings.
  results_from: 'Original Table 1: main comparison; SIDReasoner uses author checkpoints evaluated by this paper, all other
    baselines reimplemented. Table 2: SAPO component ablations; Table 7: training overhead, not inference latency.'
setup_where:
  datasets: 'https://arxiv.org/html/2605.17648v1#S5.SS1.p1 ; #A8.p1'
  split: https://arxiv.org/html/2605.17648v1#A8.p1
  candidates: 'https://arxiv.org/html/2605.17648v1#S5.SS1 ; #S5.SS2.p1 ; #A8'
  visibility: 'https://arxiv.org/html/2605.17648v1#A8.p1 ; #A8.p3'
  sid: https://arxiv.org/html/2605.17648v1#A8.p3
  inference_budget: 'https://arxiv.org/html/2605.17648v1#A6.p2 ; #A9.SS2.p1 ; #A10.p1 ; #A11.p2'
  results_from: 'https://arxiv.org/html/2605.17648v1#S5.T1 ; #S5.T2 ; #S5.SS1.p2 ; #A12.T7'
related:
- id: sidreasoner
  relation: predecessor
  note: SAPO shares SIDReasoner Stage 1/2 checkpoints but replaces rollout-level Stage 3 credit with rewards and advantages
    for thinking-block/SID-token pairs.
  where: 'SAPO v1, Appendix G and Section 5.2: https://arxiv.org/html/2605.17648v1#A7.p3; https://arxiv.org/html/2605.17648v1#S5.SS2.p2.'
- id: onerec-think
  relation: competitor
  note: OneRec-Think is a reasoning-based generative baseline with outcome-level feedback; SAPO localizes RL credit to individual
    SID reasoning steps.
  where: 'SAPO v1, Appendix G and Table 1: https://arxiv.org/html/2605.17648v1#A7.p3; https://arxiv.org/html/2605.17648v1#S5.T1.'
- id: tiger
  relation: competitor
  note: TIGER is the non-reasoning residual-SID generation baseline; SAPO adds structured reasoning and step-aligned policy
    optimization.
  where: 'SAPO v1, Appendix G and Table 1: https://arxiv.org/html/2605.17648v1#A7.p2; https://arxiv.org/html/2605.17648v1#S5.T1.'
