id: sst
name: SST
title: 'Rethinking Item Tokenization in Generative Recommenders: From Fixed Atoms to Semantic Subwords'
authors: Miao et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2608.22734
  code: https://github.com/mxrcandy/Semantic-Subword-Tokenization
problem: III
stage: Tokenization
representation: Text
tokenization: RQ+IST
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: Sentence-T5抽取物品文字语义向量用于四层基础RQ；BCA在推荐样本侧注入行为，不自动把基础SID输入记CF。
setup:
  datasets: Amazon Beauty/Instruments and Yelp; user/item 5-core filtering, chronological histories capped at 20.
  split: Per-user last interaction test, penultimate validation, earlier interactions training.
  candidates: full catalog; no sampled negatives.
  visibility: warm; no unseen-item protocol is defined. Tokenizer/collaborative encoder exposure to test items not reported.
  sid: Sentence-T5 text embeddings; TIGER-VAE, TIGER-KM or LETTER targets retain 4 levels x 256 codes. History-side IST adds
    semantic subwords (merge budget tuned 64-512). Collision handling not reported.
  inference_budget: Full-trie beam 20; Recall/NDCG@5/10. Hardware, inference batch size and standalone latency not reported;
    Table 3 wall time combines training, checkpoint loading and test evaluation.
  results_from: 'Original Table 1: SST on three backbones; SARQ/VSID re-adapted to history-only variable lengths while preserving
    fixed target decoding. Table 6 reports all tokenizer-criterion variants.'
