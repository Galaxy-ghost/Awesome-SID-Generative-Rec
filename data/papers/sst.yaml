  datasets: 'Section 3.1.1: https://arxiv.org/html/2608.22734v1#S3.SS1.SSS1.p1'
  split: 'Section 3.1.3: https://arxiv.org/html/2608.22734v1#S3.SS1.SSS3.p1'
  candidates: 'Section 3.1.3: https://arxiv.org/html/2608.22734v1#S3.SS1.SSS3.p1'
  visibility: 'Section 3.1 defines no unseen-item holdout: https://arxiv.org/html/2608.22734v1#S3.SS1'
  sid: 'Section 3.1.4: https://arxiv.org/html/2608.22734v1#S3.SS1.SSS4.p2'
  inference_budget: 'Sections 3.1.4/3.5: https://arxiv.org/html/2608.22734v1#S3.SS1.SSS4.p3 and https://arxiv.org/html/2608.22734v1#S3.SS5.p1'
  results_from: 'Table 1 and Section 3.1.2: https://arxiv.org/html/2608.22734v1#S3.T1 and https://arxiv.org/html/2608.22734v1#S3.SS1.SSS2.p5
    and https://arxiv.org/html/2608.22734v1#A1.T6'
