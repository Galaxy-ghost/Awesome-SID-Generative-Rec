id: capsid
name: CapsID
title: 'CapsID: Soft-Routed Variable-Length Semantic IDs for Generative Recommendation'
authors: Cheng et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.05096
  code: null
problem: I
stage: Tokenization
representation: Text+CF
tokenization: Soft-RQ
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'Abstract: "collapses multi-faceted item semantics at cluster boundaries".'
evidence:
- field: problem
  where: https://arxiv.org/html/2605.05096v1#abstract1
  quote: collapses multi-faceted item semantics at cluster boundaries
setup:
  datasets: 'Amazon Beauty, Sports, and Toys with 5-core filtering (users / items: 22,363 / 12,101; 35,598 / 18,357; 19,412
    / 11,924). Industrial: a proprietary 35M-item catalog from a large social media platform with text, image, and behavior
    embeddings (331.1M interactions); filtering not reported.'
  split: 'Leave-one-out with 5-core filtering on the Amazon datasets; the exact validation/test position allocation is not
    restated. Histories are truncated to the most recent 50 interactions. Industrial split: not reported.'
  candidates: full catalog (full-corpus ranking); decoding is constrained by a trie over item SIDs. Recall and NDCG at K=5
    and 10 on Amazon, K=50 and 100 on the 35M-item catalog.
  visibility: 'Main: warm; no unseen-item protocol is defined. Appendix B.2 isolates Beauty cold items, defined as items with
    fewer than 5 interactions in the training split (about 12% of items); these are low-frequency, not strictly unseen, and
    tokenizer exposure is not separately reported. The industrial cold-start tier is not defined.'
  sid: 'Variable-length SIDs: K=256 capsules per depth, up to L_max=6 levels, stopping on confidence (tau=0.82) or residual
    norm (epsilon=0.08); SemanticBPE then merges frequent code pairs (industrial: K=1024, mean length 3.3 after merging).
    Collision rates are reported: 13.4% on Beauty for CapsID and 19.4% for CapsID+SemanticBPE on the industrial catalog; a
    resolution rule for items sharing a SID is not reported.'
  inference_budget: 'Beam size 50 with trie-based invalid-ID filtering and an end-of-item token. The industrial run uses 4
    x A100-80GB; public benchmarks run on a single commodity GPU. CapsID+SemanticBPE runs at 51% of COBRA''s per-query latency
    on the same ANN infrastructure; Table 4 reports cost normalized to TIGER beam search (B=50). Inference batch size and
    absolute latency: not reported.'
  results_from: Table 3 (Beauty, Sports, Toys; mean over three seeds); Table 4 (patching versus tokenizer-centric design,
    with normalized cost); Table 5 (ablations); Table 6 (35M-item industrial catalog, single run); Figure 3 (collision, purity,
    predictability); Table 10 (Beauty cold-item subset).
