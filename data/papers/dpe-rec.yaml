poi: false
summary: 'Generative bundle construction completes a partially observed bundle by generating its missing items from a large
  product catalog. Compared to autoregressive LLMs, diffusion LLM emerges as a natural fit for this unordered generation task.
  Their bidirectional attention provides an inductive bias better aligned with unordered bundle construction. Iterative denoising
  can reveal multiple tokens per step, potentially reducing inference latency. However, directly applying DLMs to this task
  presents two key challenges: 1 Despite its flexible reveal order, confidence-guided decoding tends to postpone semantic-fork
  decisions until refinement tokens constrain their choices, reducing bundle diversity. 2 Revealing more tokens per step can
  compromise recommendation quality, stifling the potential for faster inference. We introduce DPE-Rec, a diffusion framework
  for diversity preservation and efficient recommendation. DPE-Rec preserves diversity by introducing semantic-fork-aware
  GRPO, which prioritizes semantic-fork decisions via autoregressive rollouts. It improves efficiency through pseudo-trajectory
  distillation, which concentrates learning from the vast random corruption space onto the compact trajectory-induced subspace
  visited by high-quality decoding, unlocking reliable multi-token decoding. Together, these components enable diverse and
  accurate bundle construction with substantially fewer denoise steps. Experiments on multiple bundle construction benchmarks
  show that DPE-Rec improves recommendation performance by 63% on average, and its fast variant achieves 25.6$times$ faster
  inference on average than existing generative recommendation arts, with minimal loss in recommendation quality.'
tldr: DPE-Rec completes bundles with a diffusion language model, adding semantic-fork-aware GRPO to keep bundles diverse and
  pseudo-trajectory distillation to reveal more tokens per denoising step.
tldr_zh: DPE-Rec 用扩散语言模型做捆绑包补全，加入语义分叉感知的 GRPO 保持组合多样性，并用伪轨迹蒸馏在每步去噪中揭示更多 token。
setup:
  datasets: Spotify playlists (K=30/60/90), POG outfits (K=4), IQON3000 outfits (K=8). Remove bundles shorter than K, truncate
    longer bundles; IQON3000 also drops outfits with missing images. User/item-frequency filtering not reported.
  split: 'Disjoint bundles: released Spotify/POG partitions (ratios not reported); IQON3000 shuffled outfits split 7:1:2.
    Each evaluation bundle exposes its first K/2 items and predicts the remainder. Training-only adjacent-swap/random contiguous-K
    augmentation uses r=0.4 for Spotify, 0.8 for POG/IQON3000.'
  candidates: 'sampled: 100N total, where N=K/2 targets: Spotify K=30/60/90 uses 1,500/3,000/4,500; POG 200; IQON3000 400.
    Shared sets contain all N targets plus uniformly sampled non-target items; observed-bundle/user-history exclusion not
    reported.'
  visibility: warm; no unseen-item protocol is defined. Partitions are bundle-disjoint; CLHE representation fitting and SID-quantizer
    exposure to validation/test items are not separately reported.
  sid: Fixed 64D CLHE features (released Spotify/POG; IQON3000 trained on text/image features); 3 residual-VQ tokens with
    C=256 for Spotify/IQON3000, 128 for POG. A fourth catalog-order token disambiguates collisions (max 74/53/171 for Spotify/POG/IQON3000).
    Separate level vocabularies plus boundary/MASK tokens; generated SIDs undergo exact-match or reconstructed-embedding cosine
    legalization, removing selected candidates for distinct outputs.
  inference_budget: 'Sequential AO teacher reveals one SID token/step; Fast reveals confidence-qualified positions in parallel
    plus a quota meeting budget F. Numeric default F/threshold, model size and inference batch size not reported. All experiments
    use one A100-80GB. Per-bundle DPE/Fast latency (ms): Spotify K=30 443.59/62.34, K=60 903.41/65.79, K=90 1340.05/66.72;
    POG 59.38/46.49; IQON3000 112.51/58.32.'
  results_from: Own training/evaluation of all methods with 5 seeds, reporting mean/std quality and measured latency. Spotify/POG
    backbone pretraining is from scratch with the DDBC recipe; fixed CLHE representations are shared. Compared generators
    are UniGRec, DiffGRM and DDBC; no imported recommendation-score source is identified.
