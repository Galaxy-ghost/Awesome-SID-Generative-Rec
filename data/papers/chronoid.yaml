id: chronoid
name: ChronoID
title: 'ChronoID: Infusing Explicit Temporal Signals into Semantic IDs for Generative Recommendation'
authors: Nian et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2606.14260
  code: null
problem: I
stage: Tokenization
representation: Text+Time
tokenization: RQ-VAE / Par. VQ
backbone: Dec-Only†
tokenizer: Fixed
objective: NTP
inference: Beam†
poi: false
tldr: ChronoID benchmarks time-aware Semantic ID construction across temporal encoding, fusion, and quantization choices,
  replacing static time-agnostic IDs.
tldr_zh: ChronoID 系统评测显式时间编码、融合与量化方式对时间感知 SID 的影响，替代忽略时间动态的静态 SID。
setup:
  datasets: Amazon Industrial and Office; Mercari. Item text plus interaction timestamps; interaction-count filtering not
    reported.
  split: 'Global temporal cutoff: codebook/SFT training before cutoff, test targets on/after cutoff; Appendix B uses 2018
    for Amazon. Exact Mercari cutoff and validation allocation not reported. Section 4 inconsistently prints 2028 and 2018.'
  candidates: not reported
  visibility: Unseen by tokenizer too for future items, as claimed in Appendix B.6; codebook fitting uses only pre-2018 interacted
    items and SFT training uses pre-cutoff targets. Test-item overlap/new-item fraction not reported. Users first appearing
    after cutoff can be test-only.
  sid: 'Frozen text/time quantizer: residual early/late fusion or parallel quantization; default 3 codebooks x 256 entries,
    code dimension 42. Absolute/relative time encodings; text/time input dimensions 2560/768. Collision resolution not reported.'
  inference_budget: HR/NDCG@3/5/10. Decoding algorithm, beam, constraints, inference hardware/batch and latency not reported;
    batch 1024 per GPU is SFT training.
  results_from: Original Table 1 compares five baselines and six ChronoID designs on three datasets; Tables 2/6-8/10-11 give
    fusion, temporal/capacity and hyperparameter analyses. Baseline implementation/result provenance not reported.
