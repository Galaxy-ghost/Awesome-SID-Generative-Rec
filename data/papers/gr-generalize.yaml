related:
- id: tiger
  relation: predecessor
  note: TIGER is the semantic-ID model under study; the paper explains its generalization advantage over SASRec as token-level
    prefix memorization.
  where: 'GR-Generalize v1, Section 1 and Section 3.1 benchmark TIGER: https://arxiv.org/html/2603.19809v1#S1.p6 and https://arxiv.org/html/2603.19809v1#S3.SS1.p2;
    Table 1: https://arxiv.org/html/2603.19809v1#S2.T1.'
- id: liger
  relation: alternative
  note: LIGER treats cold-start items as the out-of-distribution case for generative recommendation; this paper defines generalization
    by history-to-target transitions instead of target-item rarity.
  where: 'GR-Generalize v1, Section 1 cites Yang et al. (2025): https://arxiv.org/html/2603.19809v1#S1.p3.'
- id: specgr
  relation: alternative
  note: SpecGR also studies cold-start items as the generalization case; this paper argues that a popular target can still
    require generalization.
  where: 'GR-Generalize v1, Section 1 cites Ding et al. (2026): https://arxiv.org/html/2603.19809v1#S1.p3.'
- id: etegrec
  relation: predecessor
  note: The paper follows ETEGRec in training SASRec with full cross-entropy for a fair comparison and uses its datasets.
  where: 'GR-Generalize v1, Section 3.1: https://arxiv.org/html/2603.19809v1#S3.SS1.p1 and https://arxiv.org/html/2603.19809v1#S3.SS1.p2.'
