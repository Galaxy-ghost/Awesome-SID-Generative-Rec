  split: 'Leave-last-out: https://arxiv.org/html/2603.19809v1#S3.SS1.p1; categorization of test instances: https://arxiv.org/html/2603.19809v1#S3.SS1.p4.'
  candidates: 'SASRec trained against all items, evaluation set not stated: https://arxiv.org/html/2603.19809v1#S3.SS1.p2.'
  visibility: 'No unseen-item protocol; uncategorized instances may include unseen items: https://arxiv.org/html/2603.19809v1#S2.SS5.p1.'
  sid: 'SID length and codebook variations: https://arxiv.org/html/2603.19809v1#S4.SS4.p2 and https://arxiv.org/html/2603.19809v1#S4.T3;
