poi: false
summary: 'Abstract: "there is few systematic way to verify this hypothesis".'
tldr: 'GR-Generalize is an analysis, not a new recommender: it labels test instances as memorization or generalization, compares
  generative and item ID models on each, and combines both per instance.'
tldr_zh: GR-Generalize 是分析性研究而非新推荐模型：将测试样本标为记忆型或泛化型，分别对比生成式模型与物品 ID 模型，并按样本组合二者。
evidence:
- field: problem
  where: https://arxiv.org/html/2603.19809v1#abstract1
  quote: there is few systematic way to verify this hypothesis
- field: tokenizer
  where: p5; p7
  reason: Analysis paper; both values inferred from TIGER.
setup:
  datasets: 'Seven public datasets: Amazon 2014 Sports and Beauty; Amazon 2023 Industrial and Scientific, Musical Instruments,
    Office Products; Steam; Yelp. Sizes (users / items): Sports 35,599 / 18,358; Beauty 22,364 / 12,102; Science 50,986 /
    25,849; Music 57,440 / 24,588; Office 223,309 / 77,552; Steam 47,762 / 10,972; Yelp 30,432 / 20,034. Filtering rules:
    not reported.'
  split: 'Standard leave-last-out: last item for test, second-to-last for validation. Test instances are then partitioned
    into memorization, generalization (with hop counts up to 4), and uncategorized subsets.'
  candidates: not reported (full catalog versus sampled evaluation candidates). SASRec is trained with cross-entropy over
    all items rather than one sampled negative.
  visibility: warm; no unseen-item protocol is defined. The uncategorized subset may include items unseen during training,
    but they are not separated.
  sid: 'Analysis of TIGER SIDs: the mechanism study varies SID length L in {2, 3, 4, 5} (including identifier tokens) with
    two codebook sizes V per length (e.g. L=2 with V=1,024 or 4,096; L=3 with V=256 and a second size), at matched training
    compute. The default configuration for Table 1 and collision handling: not reported.'
  inference_budget: 'Decoding method and beam width: not reported. Table 3 gives matched training compute per SID length (e.g.
    5.00e15 FLOPs for L=2); hardware, inference batch size, and latency: not reported. NDCG@10 is the main metric.'
  results_from: Table 1 (NDCG@10 of TIGER and SASRec on memorization and generalization subsets); Figures 4-7 and Table 3
    (token-level memorization analysis and codebook-size study); Table 4 (memorization-aware adaptive ensemble).
