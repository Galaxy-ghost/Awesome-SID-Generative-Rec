id: align3gr
name: Align3GR
title: 'Align$^3$GR: Unified Multi-Level Alignment for LLM-based Generative Recommendation'
authors: Ye et al.
year: 2026
venue: AAAI’26
links:
  arxiv: https://arxiv.org/abs/2511.11255
  code: null
