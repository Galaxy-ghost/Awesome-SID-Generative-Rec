poi: false
tldr: Align3GR aligns an LLM recommender at three levels, with dual semantic and collaborative tokenization, bidirectional
  semantic alignment in behavior modeling, and progressive DPO from self-play and real-world feedback.
tldr_zh: Align3GR 从双语义-协同编号、行为建模中的双向语义对齐，以及结合自博弈与真实反馈的渐进式 DPO 三个层面，对齐 LLM 推荐模型。
evidence:
- field: problem
  where: https://arxiv.org/html/2511.11255v2#abstract1
  quote: fundamental challenges arise when transforming LLMs into real-world recommender systems due to semantic and behavioral
    misalignment
  reason: 'Candidates: III / I (rule: judged by the abstract''s complaint first).'
- field: inference
  where: Implementation Details and Evaluation Metrics, p5
  reason: Beam width 20; no prefix constraint reported.
setup:
  datasets: 'Amazon Instruments, Amazon Beauty, and Yelp; users and items with fewer than 5 interactions are filtered. Retained
    corpus sizes: not reported in the body. Industrial: internal data from a large-scale advertising recommendation platform;
    filtering not reported.'
  split: 'Leave-one-out into training, validation, and test; histories capped at the 20 most recent items. The exact position
    allocation is not reported beyond the leave-one-out label. Online: 10% of traffic (about 40+ million users) over multiple
    weeks.'
  candidates: not reported (full catalog versus sampled evaluation candidates); industrial retrieval reports Recall@100.
  visibility: warm; no unseen-item protocol is defined.
  sid: 'Item SCID: 3-level RQ-VAE x 256 codewords (dimension 32) over concatenated semantic (T5) and collaborative (DIN) embeddings;
    users receive their own SCIDs from a separate user RQ-VAE. Both are added to the LLM vocabulary. Collision handling: not
    reported.'
  inference_budget: 'Beam search with beam width 20 for generative methods (following EAGER-LLM); Recall and NDCG at K=5 and
    10. All experiments use 4 NVIDIA GPUs (model not stated); inference batch size and latency: not reported. Backbone: Llama2-7B
    with LoRA.'
  results_from: Table 1 (Instruments, Beauty, Yelp; averages over five seeds); Table 2 (industrial Recall@100 and online revenue
    versus a two-tower baseline and TIGER); Tables 3-5 and Figure 4 (tokenization, SFT-task, and DPO ablations).
