  where: 'Align3GR v2, baselines (11): https://arxiv.org/html/2511.11255v2#Sx4.SSx1.p2; Table 1: https://arxiv.org/html/2511.11255v2#Sx3.T1.'
- id: letter
  relation: competitor
  note: LETTER learns a regularized item tokenizer; Align3GR fuses semantic and collaborative features for both users and
    items through a U2I loss.
  where: 'Align3GR v2, baselines (12): https://arxiv.org/html/2511.11255v2#Sx4.SSx1.p2; Table 1: https://arxiv.org/html/2511.11255v2#Sx3.T1.'
- id: tiger
  relation: competitor
  note: TIGER uses content-only RQ-VAE item codes with a small Transformer; Align3GR uses an LLM backbone with dual SCIDs
    and DPO.
  where: 'Align3GR v2, baselines (10): https://arxiv.org/html/2511.11255v2#Sx4.SSx1.p2; Table 1: https://arxiv.org/html/2511.11255v2#Sx3.T1;
    industrial Table 2: https://arxiv.org/html/2511.11255v2#Sx4.T2.'
