id: sahl
name: SAHL
title: Structure-Aligned History Learning with Subspace-Structured Semantic IDs for Generative Recommendation
authors: Wei et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.25093
  code: https://github.com/CQU-MM-Intelligent-Lab/SAHL
problem: IV
stage: Training
representation: Text
tokenization: SRBQ
backbone: Non-AR
tokenizer: Fixed
objective: (MTP + Masked Rec.) → MTP
inference: Graph
poi: false
tldr: SAHL quantizes items with SRBQ into a balanced token-subspace-item hierarchy and reconstructs user history at those
  granularities, moving by curriculum to next-item prediction, instead of next-item prediction alone.
tldr_zh: SAHL 用 SRBQ 将物品量化为均衡的“token-子空间-物品”层级结构，按课程学习从多粒度历史重构过渡到下一物品预测，替代单纯下一物品预测。
setup:
  datasets: Amazon Reviews 2014 Beauty, Toys and Games, Sports and Outdoors, CDs and Vinyl, in this order; user/item 5-core.
  split: 'Per-user chronological leave-one-out: last interaction test, penultimate validation, earlier interactions train.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Low-frequency analysis is explicitly near-cold, not zero-interaction.
  sid: 'SRBQ: 4/8/8/16 subspaces x 4 residual levels x 256 codes, producing 16/32/32/64 tokens in dataset order. Colliding
    items remain separate, equal-scored candidates; fixed catalog indices break ties.'
  inference_budget: 'Dataset order: beam 100/200/100/50, graph neighbors 100/100/200/500, propagation depths 3/5/2/4; temperature
    0.03; Recall/NDCG@5/10. Inference hardware, batch size and latency not reported; A6000 timings concern training.'
  results_from: 'Table 2: overall comparison. RPG*, MHL and SAHL use matched controlled experiments; Tlow follows its published
    matched protocol. Other baseline score provenance not reported.'
setup_where:
  datasets: 'Section 5.1: https://arxiv.org/html/2610.25093v1#S5.SS1.p1'
  split: 'Section 5.2: https://arxiv.org/html/2610.25093v1#S5.SS2.p1'
  candidates: 'Sections 5.2/5.4 specify graph-constrained decoding but not full-catalog versus sampled-negative evaluation:
    https://arxiv.org/html/2610.25093v1#S5.SS2 and https://arxiv.org/html/2610.25093v1#S5.SS4.p2'
  visibility: 'Section 6.11.4: https://arxiv.org/html/2610.25093v1#S6.SS11.SSS4.p1'
  sid: 'Sections 4.2.2/5.4: https://arxiv.org/html/2610.25093v1#S4.SS2.SSS2.p1 and https://arxiv.org/html/2610.25093v1#S5.SS4.p1
    and https://arxiv.org/html/2610.25093v1#S5.SS4.p2'
  inference_budget: 'Section 5.4 and Section 6.11.2: https://arxiv.org/html/2610.25093v1#S5.SS4.p1 and https://arxiv.org/html/2610.25093v1#S6.SS11.SSS2.p1
    and https://arxiv.org/html/2610.25093v1#S6.SS11.SSS2.p3'
  results_from: 'Sections 5.3/6.1 and Table 2: https://arxiv.org/html/2610.25093v1#S5.SS3.p2 and https://arxiv.org/html/2610.25093v1#S6.SS1.p1
    and https://arxiv.org/html/2610.25093v1#S5.T2'
