id: onemall
name: OneMall
title: 'OneMall: One Architecture, More Scenarios -- End-to-End Generative Recommender Family at Kuaishou E-Commerce'
authors: Zhang et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2601.21770
  code: null
problem: psb
stage: n/a
representation: Text+Img+CF
tokenization: R-KM+FSQ
backbone: Enc-Dec
tokenizer: Fixed
objective: (NTP + Ctr.) → RL
inference: Beam
poi: false
tldr: OneMall unifies product-card, short-video, and live-streaming e-commerce in one generator, with a business-aware tokenizer,
  Query-Former and sparse MoE layers, and a ranking model as reinforcement learning reward.
tldr_zh: OneMall 用业务感知编号器、Query-Former、稀疏 MoE 层以及作为强化学习奖励的排序模型，在单一生成器中统一商品卡、短视频与直播电商。
setup:
  datasets: 'Kuaishou product-card, short-video, and live-streaming logs; dates/sample counts not reported. Tokenizer: 70M
    product-product pairs (<=40 occurrences/item), 12M video-product pairs from long views 1-5 minutes before product clicks,
    excluding News/Comedy/Dance/Film-TV/Selfie videos and downsampling frequent products/same-user pairs.'
  split: Offline train/validation/test allocation not reported; simulation replays online requests. Online A/B duration and
    traffic allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Frozen codebooks can tokenize new uploads; encoder/tokenizer exposure
    to test items not reported.
  sid: Two Res-Kmeans levels plus a 4096-code FSQ final level; residual-only baseline uses 3x4096. Final variant's residual
    codebook sizes not separately stated. FSQ reduces collisions; residual collision resolution not reported.
  inference_budget: Deployed 0.5B-total/0.1B-active model; HR@50/100/500. Serving beam width, hardware, inference batch size,
    latency not reported; beam 768 is RL training candidate generation.
  results_from: 'Original Table 1: scaling; Table 2: replay versus equally sized SASRec/TIGER with identical input features;
    Table 3: online A/B; Tables 4/5: RL/tokenizer ablations.'
setup_where:
  datasets: 'Sections 3.1.1 and 4: https://arxiv.org/html/2601.21770v1#S3.SS1.SSS1.p1 and https://arxiv.org/html/2601.21770v1#S4.p1'
  split: 'Sections 4.2/4.3 describe replay and online tests, not a data split: https://arxiv.org/html/2601.21770v1#S4.SS2.p1
    and https://arxiv.org/html/2601.21770v1#S4.SS3.p1'
  candidates: 'Section 4 evaluates generated top-K retrieval, without full-catalog/sampled-negative specification: https://arxiv.org/html/2601.21770v1#S4.p1'
  visibility: 'Sections 2.2/4 define no unseen-item evaluation protocol: https://arxiv.org/html/2601.21770v1#S2.SS2.p1 and
    https://arxiv.org/html/2601.21770v1#S4'
  sid: 'Sections 3.1.3/4.5: https://arxiv.org/html/2601.21770v1#S3.SS1.SSS3.p1 and https://arxiv.org/html/2601.21770v1#S4.SS5.p1
    and https://arxiv.org/html/2601.21770v1#S4.SS5.p2'
  inference_budget: 'Sections 4/4.2/4.4: https://arxiv.org/html/2601.21770v1#S4.p1 and https://arxiv.org/html/2601.21770v1#S4.SS2.p1
    and https://arxiv.org/html/2601.21770v1#S4.SS4.p1'
  results_from: 'Sections 4.2/4.3 and Tables 1-5: https://arxiv.org/html/2601.21770v1#S4.SS2.p1 and https://arxiv.org/html/2601.21770v1#S4.T2
    and https://arxiv.org/html/2601.21770v1#S4.T3 and https://arxiv.org/html/2601.21770v1#S3.T1 and https://arxiv.org/html/2601.21770v1#S4.T4
    and https://arxiv.org/html/2601.21770v1#S4.T5'
related:
- id: tiger
  relation: competitor
  note: TIGER is the equally sized encoder-decoder replay baseline.
  where: 'OneMall v1, Section 4.2 and Table 2: https://arxiv.org/html/2601.21770v1#S4.SS2.p1; https://arxiv.org/html/2601.21770v1#S4.T2.'
- id: onerec
  relation: predecessor
  note: OneMall adapts OneRec's end-to-end short-video paradigm to e-commerce scenarios.
  where: 'OneMall v1, Section 1 (Deng et al., 2025, arXiv:2502.18965; distinct from Zhou et al., 2025 Technical Report): https://arxiv.org/html/2601.21770v1#S1.p5.'
changes:
  representation:
    value: other
    quote: Based on the filtered Commercial (product-card ID, product-card ID) and Watching (short-video ID, product-card
      ID) Item2Item corpus, we next utilize them as alignment supervision signal to fine-tune an LLM to adapt e-commerce business.
    where: arXiv:2601.21770v2 https://arxiv.org/html/2601.21770v2#S3.SS1.SSS2.p1
  tokenization:
    value: other
    quote: 'To transform them as Semantic IDs, we devise an elaborate pipeline for the Product-card, Short-Video and Live-streaming
      inference, which includes two quantization techniques: Res-Kmeans and FSQ (Mentzer et al., 2023).'
    where: arXiv:2601.21770v2 https://arxiv.org/html/2601.21770v2#S3.SS1.SSS3.p1；三类业务映射不同；在 residual k-means 两层后增 FSQ 末层。
  backbone:
    value: other
    quote: To avoid the higher computation cost by long sequence, we introduce the Q-former for early sequence compression.
    where: arXiv:2601.21770v2 https://arxiv.org/html/2601.21770v2#S4.SS5.p2
  tokenizer: none
  objective:
    value: other
    quote: Specifically, we feed important item attributes (e.g., product category, price, shop information) into an item
      tower and apply in-batch contrastive learning as an auxiliary objective.
    where: arXiv:2601.21770v2 https://arxiv.org/html/2601.21770v2#S4.SS5.p2
  inference: none
