id: varlenrec-tiger
name: VarLenRec (TIGER)
title: Learning Variable-Length Tokenization for Generative Recommendation
authors: Wang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.17779
  code: null
problem: I
stage: Tokenization
representation: Text
tokenization: HARQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Aux.
inference: C-Beam
poi: false
summary: 提出可变长度离散 SID 并接入生成推荐器。
setup:
  datasets: Amazon Beauty, Sports and Outdoors, Toys and Games, and Yelp; exclude users/items with fewer than five interactions.
    Maximum history length not reported.
  split: 'Per-user leave-one-out: most recent item test, second most recent validation, all remaining items training.'
  candidates: full catalog; full ranking without negative sampling.
  visibility: warm; no unseen-item protocol is defined. Cold-start maximum-length assignment is discussed for deployment,
    not evaluated as a held-out-item protocol; tokenizer exposure to test items not reported.
  sid: 'HARQ on Sentence-T5 embeddings: variable semantic length up to 10 levels x 256 codes, in hyperbolic space with curvature
    1. Colliding IDs receive unique appended tokens from a disjoint 256-entry auxiliary vocabulary.'
  inference_budget: 'VarLenRec-TIGER uses T5, a user-side target-length predictor and trie-constrained beam 30, decoding exactly
    the predicted length; Recall/NDCG@5/10. Table III test seconds/epoch on Beauty/Sports/Toys/Yelp: 63.7/81.2/70.0/83.3.
    Experiments use A800 GPUs; count, inference batch size and per-request latency not reported.'
  results_from: 'Original v2 Table I: VarLenRec-TIGER and VarLenRec-LCRec comparisons; Table II: VarLenRec-TIGER ablations;
    Table III: timing. Baseline-result reuse not stated. This record covers the TIGER generative branch; SASRec is only a
    baseline in v2.'
