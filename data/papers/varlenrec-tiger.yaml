related:
- id: tiger
  relation: predecessor
  note: VarLenRec-TIGER replaces uniform-length RQ tokenization with hyperbolic variable-length IDs and adds user-conditioned
    length prediction before constrained generation.
  where: 'VarLenRec v2, Sections III-D/IV-B: https://arxiv.org/html/2605.17779v2#S3.SS4.p3; https://arxiv.org/html/2605.17779v2#S4.SS2.p1.'
- id: etegrec
  relation: competitor
  note: ETEGRec is a fixed-length generative baseline with joint-training optimization; VarLenRec changes the per-item encoding
    budget and target decoding length.
  where: 'VarLenRec v2, Sections IV-A/IV-B: https://arxiv.org/html/2605.17779v2#S4.SS1.SSS2.p1; https://arxiv.org/html/2605.17779v2#S4.SS2.p2.'
- id: letter
  relation: competitor
  note: LETTER improves codebook learning on TIGER/LCRec backbones; VarLenRec instead allocates variable ID lengths and compares
    against LETTER-TIGER.
  where: 'VarLenRec v2, Sections IV-A/IV-B: https://arxiv.org/html/2605.17779v2#S4.SS1.SSS2.p1; https://arxiv.org/html/2605.17779v2#S4.SS2.p2.'
