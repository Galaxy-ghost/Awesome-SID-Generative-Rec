related:
- id: grid
  relation: predecessor
  note: STAMP is implemented inside the GRID framework and keeps its tokenizer and T5 backbone, adding training-time token
    pruning and multi-step auxiliary prediction.
  where: 'STAMP v3, Section 5.1.4 GRID setup: https://arxiv.org/html/2604.05329v3#S5.SS1.SSS4.p2; Table 2: https://arxiv.org/html/2604.05329v3#S5.T2.'
- id: forge
  relation: predecessor
  note: STAMP uses FORGE's AL-GR-Tiny data and Qwen backbone as its second testbed.
  where: 'STAMP v3, Section 5.1.1 and 5.1.4: https://arxiv.org/html/2604.05329v3#S5.I2.i2.p1 and https://arxiv.org/html/2604.05329v3#S5.SS1.SSS4.p3;
    Table 3: https://arxiv.org/html/2604.05329v3#S5.T3.'
- id: atspeed
  relation: alternative
  note: AtSpeed accelerates inference by speculative decoding; STAMP targets training-time cost instead.
  where: 'STAMP v3, Section 2 acceleration paragraph: https://arxiv.org/html/2604.05329v3#S2.p3.'
