  where: 'Gryphon v1, Sections 1/3.2, citing Hu et al. (2026): https://arxiv.org/html/2606.08604v1#S1.SS0.SSS0.Px2.p2; https://arxiv.org/html/2606.08604v1#S3.SS2.p2.'
- id: promise
  relation: alternative
  note: Cited for autoregressive prefix errors; Gryphon addresses candidate ordering with jointly trained item-level scoring.
