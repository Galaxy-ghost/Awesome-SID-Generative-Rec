id: gryphon
name: Gryphon
title: 'Gryphon: A Unified Architecture for Semantic-ID Generation and Item-Level Scoring in Industrial Recommendations'
authors: Tikhonovich et al.
year: 2026
venue: CIKM’26 Short
links:
  arxiv: https://arxiv.org/abs/2606.08604
  code: null
problem: IV
stage: Backbone
representation: –
tokenization: R-KM
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Rank
inference: Hybrid
poi: false
summary: 有完整 SID 生成和 item-level scoring 新架构；放弃唯一 SID 并不使其成为非 SID。
tldr: Gryphon adds a jointly trained item-level scoring component to an encoder-decoder generator, resolving each generated
  Semantic ID to its items and re-scoring them, instead of ranking by token likelihood.
tldr_zh: Gryphon 在编码器-解码器生成器中加入联合训练的物品级打分模块，将生成的 SID 解析为具体物品并重新打分，替代按 token 似然排序。
setup:
  datasets: One week of industrial music-platform logs; tens of millions of active users and items. Filtering not reported.
  split: not reported
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. All items are quantized into SIDs; tokenizer fitting exposure not
    reported.
  sid: 'Residual K-Means: 3 x 32000; collisions retained, generated SIDs expanded to all matching items and rescored by ILSM.'
  inference_budget: Beam 2048; Recall@10/1000; online outputs 1000 items. Hardware, inference batch size, absolute latency
    not reported; parameter count and inference time differ from vanilla GR by <1%.
  results_from: 'Original Table 1: offline comparison; Table 2: same-pool scoring ablation; Table 3: seven-day online A/B
    test.'
