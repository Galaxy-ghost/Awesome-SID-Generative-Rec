poi: false
summary: 'Abstract: "each step introduces potential information loss".'
evidence:
- field: problem
  where: https://arxiv.org/html/2310.07815v3#abstract1
  quote: each step introduces potential information loss
setup:
  datasets: 'Amazon Beauty/Sports/Toys: recommendation and product search, user/item >=5 interactions. Document retrieval:
    NQ, MS MARCO-1M, merged TREC-DL 2019/2020 restricted to that corpus.'
  split: 'Recommendation: per-user last/penultimate test/validation. Product search: original train/test, 1/8 training queries
    validation. NQ keeps original labels; MARCO uses original train/dev labels.'
  candidates: not reported
  visibility: 'Recommendation: warm; no unseen-item protocol is defined. Zero-shot Beauty product search: unseen by tokenizer
    too, excluded from both SID self-supervision and downstream finetuning; holdout construction not reported.'
  sid: Reported ID length 3; codebook sizes 512 (Amazon), 5120 (NQ), 51200 (MARCO-1M). A final ID position distinguishes collisions;
    its assignment rule not reported.
  inference_budget: Prefix-tree constrained beam 20; recommendation Recall/NDCG@5; experiments on 8 A100-40G. Inference batch
    size not reported. Product-search whole-Beauty-test latency 12.21s, not per request.
  results_from: 'Original Tables 3/4/6: recommendation/product search/document retrieval; Table 15: zero-shot product search.
    Generative indexer baselines use matched T5-base finetuning.'
setup_where:
  datasets: 'Sections 5.1-5.3 and Appendix A.1: https://arxiv.org/html/2310.07815v3#S5.SS1.p2 and https://arxiv.org/html/2310.07815v3#S5.SS2.p2
    and https://arxiv.org/html/2310.07815v3#A1.SS1.p3'
  split: 'Appendix A.1: https://arxiv.org/html/2310.07815v3#A1.SS1.p1 and https://arxiv.org/html/2310.07815v3#A1.SS1.p3'
  candidates: 'Downstream protocols in Sections 5.1-5.3 do not specify negative sampling or complete-catalog enumeration:
