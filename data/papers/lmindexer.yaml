  visibility: 'Sections 4.1/5.1 and Appendix A.10: https://arxiv.org/html/2310.07815v3#S4.SS1.p1 and https://arxiv.org/html/2310.07815v3#S5.SS1.p2
    and https://arxiv.org/html/2310.07815v3#A1.SS10.p1'
