id: lmindexer
name: LMIndexer
title: Language Models As Semantic Indexers
authors: Jin et al.
year: 2024
venue: ICML’24
links:
  arxiv: https://arxiv.org/abs/2310.07815
  code: https://github.com/PeterGriffinJin/LMIndexer
problem: I
stage: Tokenization
representation: Text
tokenization: Self-Sup. ID
backbone: Enc-Dec
