tldr: OneRec-V2 replaces the OneRec encoder-decoder with a lazy decoder-only architecture that cuts sequence-encoding compute,
  and aligns with real user feedback through duration-aware reward shaping and adaptive ratio clipping.
tldr_zh: OneRec-V2 用懒惰仅解码器架构替代 OneRec 的编码器-解码器以削减序列编码计算，并通过时长感知奖励塑形与自适应比率裁剪对齐真实反馈。
evidence:
- field: problem
  where: 'OneRec-V2 Technical Report v4, Abstract: https://arxiv.org/html/2508.20900v4#abstract1'
  quote: limitations in reinforcement learning that relies solely on reward models
  reason: Organizer judgment compares V with IV and selects V by the first new design, the Lazy Decoder-Only architecture.
    The abstract identifies 97.66% of resources going to sequence/context encoding as well as reward-model limitations.
- field: representation
  where: 'OneRec-V2 v4, Section 2.2.2, tokenizer: https://arxiv.org/html/2508.20900v4#S2.SS2.SSS2.Px1.p1 ; inherited source,
    OneRec Technical Report v4 (2506.13695), Section 2.1.1: https://arxiv.org/html/2506.13695v4#S2.SS1.SSS1.p2'
  reason: Text+Img+CF remains inferred through OneRec-V2's explicit reuse of the OneRec-V1 tokenizer and the separate technical
    report's multimodal and collaborative-pair pipeline. These input modalities are not restated in OneRec-V2's tokenizer
    paragraph.
- field: tokenization
  where: 'OneRec-V2 v4, Section 2.2.2, tokenizer: https://arxiv.org/html/2508.20900v4#S2.SS2.SSS2.Px1.p1 ; inherited source,
    OneRec Technical Report v4 (2506.13695), Section 2.1.2: https://arxiv.org/html/2506.13695v4#S2.SS1.SSS2.p1'
  reason: 'R-KM remains an inherited organizer inference: OneRec-V2 reuses the OneRec-V1 semantic tokenizer, while the separate
    technical report explicitly specifies RQ-Kmeans. It is not a directly named quantization algorithm in the OneRec-V2 tokenizer
    paragraph.'
setup:
  datasets: Kuaishou impressions, August 10-14 2025, for streaming architecture experiments; Kuaishou and Kuaishou Lite feeds
    for online evaluation. Filtering and dataset sizes not reported.
  split: 'Offline holdout allocation not reported. Online: one week, 5% experimental traffic; V2 serves 25% of degraded traffic
    within that group (Appendix D wording). Separate 1% group disables caching and serves V2 for every request.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Cold-start video-view metrics are reported, but subset criteria and
    tokenizer exposure are not reported.
  sid: 3 semantic tokens using the OneRec-V1 tokenizer; codebook sizes and collision handling not reported here.
  inference_budget: Online 1B model, context 3000, beam 512, L20 GPUs, latency 36ms, MFU 62%; inference batch size not reported.
  results_from: 'Original Tables 2-5: architecture/scaling; Tables 6-8: online alignment/deployment comparisons; Table 9:
    caching disabled. Online improvements are relative to OneRec-V1.'
