objective: NTP + Aux.
inference: C-Beam
poi: false
tldr: DREAM refines cold-start item Semantic IDs after the initial assignment, with an intent-aware tokenizer proposing candidates,
  the frozen generator selecting one, and a dynamic beam keeping weighted ID hypotheses.
tldr_zh: DREAM 在冷启动物品初始分配 SID 后，由意图感知编号器提议候选、冻结生成器择优，并用动态束保留加权 ID 假设，逐步修正冷启动 SID。
setup:
  datasets: Amazon Beauty, Sports and Outdoors, Toys and Games; iterative user-core-5 and item-core-3 filtering.
  split: 'Per-user leave-one-out: last interaction test, penultimate validation, earlier interactions training.'
  candidates: full catalog
  visibility: 'warm; no unseen-item protocol is defined. The cold subset means at most five interactions, not exclusively
    unseen items; Section 3.1 counts training frequency whereas Section 4.1 says total frequency. Strict item-level generator/tokenizer
    holdouts: not reported.'
  sid: 'Frozen Llama-3-8B text embeddings initialize shared RQ-VAE SIDs (4 positions x 256 codes). CART refines assignments
    with collaborative residuals, Gumbel-Softmax/STE, diversity regularization and a static-index anchor, exporting top-8
    candidates per cold item. UC3 produces a refined single-path index; CPDE preserves alternative SIDs for multi-path inference
    (B=4). Collision disambiguation: not reported.'
  inference_budget: 'Beam-Aware multi-path inference is primary: B=4 retained SID paths per cold item and one per warm item
    in a union trie; Compat-Top1 retains one path per item for ablations. LoRA is merged into the backbone at deployment.
    Evaluation K=5/10/50; numerical autoregressive decoding beam width, inference hardware, batch size and latency: not reported.'
  results_from: 'This paper''s experiments: Tables 2/3/4 report cold/overall/warm comparisons with DREAM''s primary Beam-Aware
    view; Table 5 reports stage ablations and Compat-Top1; Figures 2-4 report Sports mechanism diagnostics.'
