id: atspeed
name: AtSpeed
title: Efficient Inference for Large Language Model-based Generative Recommendation
authors: Lin et al.
year: 2025
venue: ICLR’25
links:
  arxiv: https://arxiv.org/abs/2410.05165
  code: https://github.com/Linxyhaha/AtSpeed
problem: V
stage: Inference
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Spec. Dec.
poi: false
tldr: AtSpeed aligns a draft model with the target LLM on top-K sequences and relaxes speculative-decoding verification, to
  speed up beam-search generation of top-K items in LLM-based generative recommendation.
tldr_zh: AtSpeed 在 top-K 序列上对齐草稿模型与目标 LLM，并放宽投机解码的验证条件，以加速 LLM 生成式推荐中 top-K 物品的束搜索解码。
evidence:
- field: problem
  where: https://arxiv.org/html/2410.05165v3#abstract1
  quote: excessive inference latency caused by autoregressive decoding
- field: representation
  where: §4.1 Implementation Details, p7; Appendix A.3.1, p21
  reason: Taken from the LC-Rec row of Table 1.
setup:
  datasets: 'Amazon Beauty and Games (main), plus MovieLens-1M and Goodreads in Appendix Table 6. Filtering rules: not restated;
    statistics in Appendix Table 2.'
  split: All interactions sorted by global timestamp and split 8:1:1 into training, validation, and test.
  candidates: not reported (full catalog versus sampled); top-K (K = 1, 3, 5, 10, 20) from beam search of the target LLM,
    evaluated by Recall and NDCG plus walltime speedup.
  visibility: warm; no unseen-item protocol is defined (global temporal split, so test items may include items not seen in
    training, but this is not analyzed).
  sid: 'RQ-VAE item identifiers following LC-Rec, length L=4; codebook size and collision handling: not reported.'
  inference_budget: 'Speculative beam decoding: LLaMA-68M draft model with draft length 4 and draft beam size N=40 verifying
    top-K beams (K up to 20) of a LLaMA-7B LC-Rec target with tree-based attention. Figure 1 measures LC-Rec inference time
    on one NVIDIA A5000; draft training on 4 A5000 GPUs; speedup reported as walltime ratio (WS@K).'
  results_from: Table 1 (walltime speedup and accepted steps versus SFT, WordKD, SeqKD, TVDKD, DARE drafts); Appendix Table
    5 (Recall and NDCG on Beauty and Games for the target LLM, the baselines, and AtSpeed instantiated on LC-Rec with LLaMA-7B);
    Appendix Tables 6-7 (MovieLens-1M, Goodreads, alignment-data cost).
setup_where:
  datasets: 'Datasets: https://arxiv.org/html/2410.05165v3#S4.SS1.p1; split and identifier length: https://arxiv.org/html/2410.05165v3#A1.SS3.SSS1.p1.'
  split: 'Global-timestamp 8:1:1 split: https://arxiv.org/html/2410.05165v3#A1.SS3.SSS1.p1.'
  candidates: 'Metrics: https://arxiv.org/html/2410.05165v3#S4.SS1.p3.'
  visibility: 'Global temporal split with no unseen-item protocol: https://arxiv.org/html/2410.05165v3#A1.SS3.SSS1.p1.'
  sid: 'RQ-VAE identifiers following LC-Rec, length 4: https://arxiv.org/html/2410.05165v3#S4.SS1.p1 and https://arxiv.org/html/2410.05165v3#A1.SS3.SSS1.p1.'
  inference_budget: 'Draft settings and hardware: https://arxiv.org/html/2410.05165v3#S4.SS1.p4 and https://arxiv.org/html/2410.05165v3#A1.SS3.SSS1.p2;
    target inference cost figure: https://arxiv.org/html/2410.05165v3#S1.F1.'
  results_from: 'Main: https://arxiv.org/html/2410.05165v3#S4.T1; ranking results: https://arxiv.org/html/2410.05165v3#A1.T5;
    appendix datasets and cost: https://arxiv.org/html/2410.05165v3#A1.T6 and https://arxiv.org/html/2410.05165v3#A1.T7.'
related:
- id: lc-rec
  relation: predecessor
  note: 'AtSpeed accelerates an LC-Rec target model: it trains a small draft model aligned to LC-Rec''s top-K beams and verifies
    drafted beams in parallel.'
  where: 'AtSpeed v3, instantiated on LC-Rec: https://arxiv.org/html/2410.05165v3#S4.SS1.p1 and https://arxiv.org/html/2410.05165v3#S4.SS1.p4;
    Figure 1 inference cost of LC-Rec: https://arxiv.org/html/2410.05165v3#S1.F1.'
- id: specgr
  relation: alternative
  note: SpecGR uses speculative drafting to recommend new items inductively, whereas AtSpeed uses it only to speed up decoding
    while keeping the target model's top-K.
  where: 'AtSpeed v3, Section 5 related work cites SpecGR: https://arxiv.org/html/2410.05165v3#S5.p1.'
- id: pad-rec
  relation: alternative
  note: PAD-Rec later also applies speculative decoding to LLM generative recommendation, targeting list-wise generation with
    position-aware drafts.
  where: 'Evidence is from the later PAD-Rec paper, Sections 1 and 2.3: https://arxiv.org/html/2604.27747v1#S1.p2 and https://arxiv.org/html/2604.27747v1#S2.SS3.p1.'
