setup:
  datasets: 'Yelp, Amazon Beauty, and Amazon Instruments, preprocessed following LETTER (filter thresholds not restated);
    30,431 / 20,032, 22,362 / 12,101, and 24,772 / 9,922 users / items. Production: Taobao search advertising data with hundreds
    of millions of daily requests; filtering not reported.'
  split: 'Per-user leave-one-out: last item for test, second-to-last for validation, the rest for training. Three random seeds.
    Online: 15-day A/B test on 10% of traffic (50/50).'
  candidates: not reported (full catalog versus sampled evaluation candidates); top-5 and top-10 lists. Training negatives
    for the flow objective come from a collaborative-model sampler or beam search, which is a training choice, not the evaluation
    candidate set.
  visibility: warm; no unseen-item protocol is defined. Online, newly listed items gain 4.0% revenue, but their tokenizer
    and generator visibility is not reported.
  sid: 'Uses the TIGER and LETTER tokenizers as backbones; layer count and codebook size for the experiments: not reported
    (Figure 1 illustrates L=3). Collision handling: not reported; the paper notes that intermediate states do not uniquely
    identify items.'
  inference_budget: 'Decoding method and beam width for evaluation: not reported. All experiments run on the same GPU (model
    not stated). Table 7 reports training cost on production data (GFlowGR 2.1x SFT with 80x samples); inference latency and
    batch size: not reported.'
  results_from: Table 2 (Beauty, Instruments, Yelp; SFT, GRPO, DPO-family baselines on TIGER and LETTER backbones); Tables
    3-6 (rewards, combination, sample selection, LLM reward); Figures 3-4 (parameter study); Table 7 and Section 5 (production
    offline and 15-day online A/B).
