related:
- id: tiger
  relation: predecessor
  note: TIGER is one of the two generative backbones; GFlowGR updates the LLM with the sum of the SFT loss and a GFlowNets
    loss over augmented generation trajectories.
  where: 'GFlowGR v3, Section 4.1 installs GFlowGR on TIGER: https://arxiv.org/html/2506.16114v3#S4.SS1.p2; Table 2: https://arxiv.org/html/2506.16114v3#S4.T2;
    training objective: https://arxiv.org/html/2506.16114v3#S3.SS4.p1.'
- id: letter
  relation: predecessor
  note: LETTER supplies the second backbone and the data preprocessing; GFlowGR changes only the fine-tuning objective.
  where: 'GFlowGR v3, Section 4.1 follows LETTER preprocessing and uses it as a backbone: https://arxiv.org/html/2506.16114v3#S4.SS1.p1
    and https://arxiv.org/html/2506.16114v3#S4.SS1.p2; Table 2: https://arxiv.org/html/2506.16114v3#S4.T2.'
- id: onerec
  relation: competitor
  note: OneRec's IPA aligns the model by iterative SFT and DPO with reward-selected rejected samples; GFlowGR learns probabilities
    proportional to rewards over many trajectories.
  where: 'GFlowGR v3, IPA baseline from OneRec, reimplemented with the same reward model: https://arxiv.org/html/2506.16114v3#S4.I2.i6.p1
    and https://arxiv.org/html/2506.16114v3#S4.SS1.p3; Table 2: https://arxiv.org/html/2506.16114v3#S4.T2.'
