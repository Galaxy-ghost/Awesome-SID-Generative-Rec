id: merge-and-branch
name: Merge-and-Branch
title: 'Merge and Branch: Efficient Tree-Structured Supervised Fine-Tuning of LLMs for Recommendation'
authors: Zhu et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.37973
  code: null
problem: V
stage: Backbone
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'LLM-based generative recommendation reads long, text-rich interaction histories but generates only short semantic
  identifiers (SIDs). This asymmetry makes supervised fine-tuning inefficient: encoding the history is expensive, yet each
  history usually provides supervision for only one target. We present Merge and Branch (M&B) to reduce input cost and learn
  more from each encoded history. Merge compresses each historical item''s SID and text into a small number of learned tokens.
  Branch uses the compressed history to predict multiple target SIDs. To share history computation while keeping these targets
  independent, M&B organizes each example as a shallow, wide tree. We develop tree FlashAttention to execute this layout efficiently,
  processing the shared history once and propagating gradients from every branch for end-to-end training. A tree-structured
  key/value cache extends history sharing to constrained decoding. Experiments on public benchmarks show that M&B outperforms
  strong recommendation baselines while substantially improving training and decoding efficiency.'
tldr: Merge-and-Branch compresses each history item's Semantic ID and text into few learned tokens and predicts several target
  IDs from one shared history in a tree layout, reducing fine-tuning cost.
setup:
  datasets: Amazon 2014 5-core Beauty, Sports and Outdoors, Toys and Games.
  split: Per-user chronological last/penultimate interactions test/validation; earlier interactions training. Main M&B result
    selects the best of five seeds by validation NDCG@10.
  candidates: full catalog; invalid or unresolved predictions count as misses.
  visibility: 'warm; no unseen-item protocol is defined. Held-out items do not fill missing future branches; tokenizer/CF-teacher
    item exposure: not reported.'
  sid: 'Sentence-T5-XXL plus 3-level RQ-VAE, 256 codes/level, deterministic collision suffix: four-token SID.'
  inference_budget: 'Main: beam 50, Recall/NDCG@5/10; inference batch/hardware not reported. Efficiency: H200, batch 1, beam
    100, synthetic contexts 64-2048, four merged tokens/item; Tree latency 76.33-83.85 ms/request including prefill/search.'
  results_from: Table 3 mixes authors' runs with original-paper scores (TIGER, LETTER-Beauty, EAGER, EAGER-LLM-Beauty/Sports,
    GRAM) and GRAM reproductions (P5-CID, LC-Rec). M&B and Table 4 decoding measurements are this paper's experiments.
