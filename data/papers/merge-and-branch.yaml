  sid: 'Appendix B.2: https://arxiv.org/html/2610.37973v1#A2.SS2.p1'
  inference_budget: 'Section 4.1, Appendix B.3 and Table 4: https://arxiv.org/html/2610.37973v1#S4.SS1.SSS0.Px3.p1 and https://arxiv.org/html/2610.37973v1#A2.SS3.p2
