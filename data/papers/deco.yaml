poi: false
summary: 'Generative recommenders retrieve items by writing their semantic IDs (SIDs) code by code under trie-constrained
  beam search, an approach now deployed on large web platforms. Standard autoregressive interfaces pay for the SID length
  K twice: a history of T items enters the backbone as TK code tokens, and every beam-search step runs through the backbone,
  so returning B candidates costs O(BK) backbone decode tokens per user. The second cost often dominates, and it grows with
  the backbone, the SID depth and the candidate budget. We introduce Deco (decoding from concepts), which separates reading
  the history from writing the identifier. The backbone reads each history item as one fused token and condenses the history
  once into a compact next-item concept; a light KV-cached decoder conditioned on the concept and the generated prefix runs
  the entire beam search, while the identifiers, the trie and the autoregressive factorization stay unchanged. The decoder
  approaches full-backbone accuracy with cross-entropy alone, and distillation improves it further. On seven datasets from
  e-commerce, movies and music streaming, Deco achieves comparable or better accuracy than both a standard generative recommender
  and the full-backbone teacher with fused inputs, while delivering 3.2-8.6$\times$ their throughput under a 50 ms p95 latency
  budget in a production-style serving pipeline. Delegating beam search makes larger candidate pools and models practical:
  Deco generates 1000 candidates faster than its teacher generates 100, and with a 1.5B-parameter LLM backbone, it matches
  the 69M-parameter teacher''s throughput while achieving higher accuracy.'
tldr: Deco reads each history item as one fused token, condenses the history into a next-item concept, and runs beam search
  in a light KV-cached decoder instead of the full backbone.
tldr_zh: Deco 将每个历史物品读作单个融合 token，把交互历史浓缩为下一物品概念，并在带 KV 缓存的轻量解码器而非完整骨干网络中执行束搜索。
setup:
  datasets: Amazon-2014 Beauty/Sports/Toys and Amazon-2023 BPC-23/Books-23, published 5-core subsets; MovieLens-25M subset
    (filtering rules not reported); Yambda-500M last30 days, exact deduplication, consecutive track-repeat collapse and user/item
    thresholds5/20.
  split: 'Global temporal: latest10% interactions test, latest10% of the remainder validation; Yambda uses last day test and
    preceding day validation. Each user''s last event per held-out period is target; earlier within-period events enter history.
    History cap20 Amazon,100 MovieLens/Yambda. Separate Beauty leave-one-out comparison also reported.'
  candidates: 'full catalog: the training item catalog; history items are not excluded because repeats are legitimate targets.
    Main beam100; larger candidate budgets up to1000 are separately tested.'
  visibility: 'warm; no unseen-item protocol is defined. Yambda new targets mean absent from the last100 history items, not
    globally unseen items. Tokenizer-fitting exposure to test items/interactions: not reported.'
  sid: Fixed RQ-KMeans,4 levels x2048 codes, from multilingual E5-large metadata embeddings or provided128-dimensional Yambda
    item embeddings. Popularity-based collision resolution is stated; detailed rule not reported. Depth study uses2-8 nested
    levels x256 codes.
  inference_budget: Testbeam100 (validationbeam10), NDCG/Recall@10/50/100; copy pointer on Yambda. One H10080GB, bf16; main
    serving pipeline compiled with CUDA graphs and beam-shared history cache. Report batch128, peak sweep and50ms p95 budget;3.2-7.3x
    FusedGR throughput under that budget. GPU batch latency includes concept prefill/full beam/trie masking, excludes data
    loading/SID-item mapping and compilation/capture/warm-up. Each point repeats3 times,100 timed batches after10 warm-ups
    (50/5 above batch64). Table3 instead uses common eager PyTorch, batch128.
  results_from: 'Table2: paper''s six matched-family models, shared SIDs/training budgets, mean+SD over3 seeds. Table3 external
    baselines are tuned/retrained from scratch under this protocol; eager native-path timing, RPG graph construction excluded.
    Separate Table4 Beauty leave-one-out baseline scores come from literature. Main throughput includes prefill; decoder-only
    comparisons excluding prefill are separate.'
