id: cid
name: CID
title: How to Index Item IDs for Recommendation Foundation Models
authors: Hua et al.
year: 2023
venue: SIGIR-AP’23
links:
  arxiv: https://arxiv.org/abs/2305.06569
  code: https://github.com/Wenyueh/LLM-RecSys-ID
problem: II
stage: Tokenization
representation: CF
tokenization: Spectral Clus.
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: C-Beam
poi: false
summary: 'Abstract: "To avoid generating excessively long text and hallucinated recommendations"; "creating LLM-compatible
  item IDs to uniquely identify each item is essential". Candidates: II / I (rule: judged by the abstract''s complaint first).'
tldr: CID studies item indexing for the P5 foundation model and proposes sequential, collaborative, semantic, and hybrid indexing,
  replacing random, title, and independent IDs that cause long outputs or hallucinated items.
tldr_zh: CID 研究 P5 基础模型的物品编号方式，提出顺序、协同、语义与混合索引，替代容易产生长输出或虚构物品的随机、标题和独立 ID。
evidence:
- field: problem
  where: https://arxiv.org/html/2305.06569v6#abstract1
  quote: To avoid generating excessively long text and hallucinated recommendations … creating LLM-compatible item IDs to
    uniquely identify each item is essential
  reason: 'Candidates: II / I (rule: judged by the abstract''s complaint first).'
setup:
  datasets: Amazon Sports & Outdoors, Amazon Beauty, Yelp; paper states a Jan-Dec 2019 transaction window. Interaction-count
    filtering not reported.
  split: 'Per-user leave-one-out: last interaction test, penultimate validation, earlier interactions training. Test history
    includes the validation interaction.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. CID co-occurrence edges/weights use training sequences only; graph
    nodes represent all items. Separate tokenizer/item holdouts not reported.
  sid: 'CID only: recursive N-way spectral clustering until clusters contain at most k items; k shared OOV tokens encode cluster
    paths plus a unique-within-cluster leaf token. Variable-length fixed IDs; recommended mean length 3-4. Table 6 sweeps
    N=10/20 and k=200/500/1000; Table 4 default N/k not reported.'
  inference_budget: Trie-constrained generation; HR/NDCG@5/10. Beam width, inference hardware/batch and latency not reported.
    Two RTX A5000 GPUs and batch 64 describe 20-epoch P5 training.
  results_from: Original Table 4 CID row; Figures 4/5 and Tables 6/7 analyze CID clustering parameters and ID lengths. CID+IID
    is a separate hybrid variant, not CID. Baselines use the S3-Rec implementation; copied-versus-rerun provenance not stated.
