id: tcbsa
name: TCBSA
title: 'From Item Scores to Semantic Tokens: Test-Time Collaborative Adaptation for Generative Recommendation'
authors: Shan et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.32098
  code: null
problem: IV
stage: Inference
representation: Text
tokenization: R-KM
backbone: Enc-Dec† / Dec-Only†
tokenizer: Fixed
objective: NTP† / NTP → RL
inference: CF-Guided C-Beam
poi: false
tldr: TCBSA converts a discriminative recommender's score margins into potentials on shared Semantic ID prefixes and adds
  them, gated by confidence, to path scores before beam pruning, without retraining.
tldr_zh: TCBSA 将判别式推荐器的分数间隔转化为共享 SID 前缀上的势函数，经置信度门控后在束剪枝前加到路径分数上，无需重新训练。
setup:
  datasets: 'Amazon Reviews 2023 Industrial and Scientific, Musical Instruments, Office Products: official 5-core, no extra
    rating thresholds/deduplication. Yelp Kaggle v2, 2019 window, all ratings implicit, iterative 5-core.'
  split: Per-user chronological last/penultimate interactions are test/validation; earlier interactions train. Input histories
    capped at 20.
  candidates: full catalog; previously interacted items remain eligible, padding masked
  visibility: warm; no unseen-item protocol is defined. Generator and discriminative checkpoints remain frozen during adaptation.
  sid: Sentence-T5 text embeddings; 3 RQ-K-means levels plus fourth collision-resolution token for unique IDs. Codebook sizes
    not reported. Shared mapping across semantic-ID models.
  inference_budget: Default beam 20, retrieval width 500; beam sweep 10/20/30/40/50. RTX 5880 Ada, inference batch 32. Synchronized
    per-user latency includes discriminative scoring/adaptation; default TCBSA costs 1.43-1.63x same-beam TIGER.
  results_from: 'Original Table 1: full-catalog comparisons; Figure 5: accuracy/latency. Baselines instantiated using specified
    implementations; MiniOneRec evaluated at its final RL checkpoint.'
setup_where:
  datasets: 'Section 5.1 and Appendix B.1: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2610.32098v1#A2.SS1.p1'
  split: 'Section 5.1: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px1.p1'
  candidates: 'Section 5.1: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px2.p1'
  visibility: 'Section 5.1 defines no unseen-item holdout: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px4.p1'
  sid: 'Section 5.1: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px4.p1'
  inference_budget: 'Sections 5.1/5.6 and Appendix B.2: https://arxiv.org/html/2610.32098v1#S5.SS1.SSS0.Px4.p1 and https://arxiv.org/html/2610.32098v1#S5.SS6.p1
    and https://arxiv.org/html/2610.32098v1#S5.SS6.p3 and https://arxiv.org/html/2610.32098v1#A2.SS2.p1'
