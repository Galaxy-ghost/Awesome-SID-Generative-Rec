id: onechord
name: OneChord
title: 'OneChord: Distill What You Rank, Recommend in One Pass'
authors: Li et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.25805
  code: https://anonymous.4open.science/r/OneChord-D1A2/
problem: IV
stage: Training
representation: –
tokenization: Par. OPQ
backbone: Non-AR
tokenizer: Fixed
objective: Next-item CE + Cons. KD + Rank KD
inference: Scoring
poi: false
tldr: OneChord uses one catalog-normalized fusion of Semantic ID evidence and item-matching scores for supervision, distillation,
  and inference in a parallel decoder, so training targets the ranking used in serving.
tldr_zh: OneChord 在并行解码器中用经全库归一化的 SID 证据与物品匹配分数融合形式统一监督、蒸馏与推理，使训练目标与线上排序一致。
setup:
  datasets: Amazon 2014 5-core Sports/Beauty/Toys; Amazon 2023 5core/last_out_w_his Scientific/Instruments/Games, reconstructing
    each user's longest chronological sequence.
  split: Last two interactions validation/test; sliding training windows over earlier interactions, history cap 20; one validation/test
    target per user.
  candidates: full catalog of distinct legal SIDs; identical SIDs share one entry; exact four-code match determines hits.
  visibility: warm; no unseen-item protocol is defined. Fixed OPQ mapping covers every processed item.
  sid: Four-code OPQ, 256 codes/position; collisions remain merged as one catalog entry.
  inference_budget: 'One encoder/parallel-decoder pass plus catalog scoring; no beam. Recall/NDCG@5; full-test Top-10 generation
    0.23-1.24 s; test batch 256. Hardware and per-request latency: not reported.'
  results_from: 'Reported Tables 1/2/3/4: accuracy, full-test cost, ablations, sparsity groups. OneChord accuracy is five-run
    mean/SD; baselines use common splits, but borrowed-versus-rerun provenance is not reported.'
setup_where:
  datasets: 'Section 4.1 and Appendix B.1: https://arxiv.org/html/2610.25805v1#S4.SS1.SSS0.Px1.p1 and https://arxiv.org/html/2610.25805v1#A2.SS1.p1'
  split: 'Appendix B.1: https://arxiv.org/html/2610.25805v1#A2.SS1.p1'
  candidates: 'Appendix B.1: https://arxiv.org/html/2610.25805v1#A2.SS1.p2'
  visibility: 'Appendix B.1: https://arxiv.org/html/2610.25805v1#A2.SS1.p1 and https://arxiv.org/html/2610.25805v1#A2.SS1.p2'
  sid: 'Appendix A.5: https://arxiv.org/html/2610.25805v1#A1.SS5.SSS0.Px1.p1'
  inference_budget: 'Section 3.6, Section 4.2 and Appendix B.3: https://arxiv.org/html/2610.25805v1#S3.SS6.SSS0.Px3.p1 and
