id: spar-youku
name: SPAR-Youku
title: 'SPAR: Stepwise Personalized Autoregressive Recommendation with Prefix-Balanced Semantic IDs'
authors: Zhang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.27898
  code: null
problem: I
stage: Backbone
representation: –
tokenization: RQ-PIB
backbone: Dec-Only
tokenizer: Fixed
objective: NTP → DPO
inference: C-Beam
poi: false
tldr: SPAR-Youku guides each Semantic ID decoding step with prefix-relevant evidence from compressed user memory and balances
  interaction loads among sibling branches with RQ-PIB, to reduce branch errors and popularity bias.
tldr_zh: SPAR-Youku 从压缩用户记忆中提取前缀相关证据引导每步 SID 解码，并用 RQ-PIB 均衡兄弟分支间的交互负载，减少分支错误与流行度偏差。
setup:
  datasets: Youku homepage production playback logs spanning several months; daily DPO uses recent request contexts. Dataset
    size, dates and filtering not reported.
  split: 'User-disjoint train/validation/test split 90:5:5; randomization method not reported. Seven-day online A/B: control
    and treatment each approximately 10% of traffic.'
  candidates: not reported; trie validity and HR cutoffs do not specify the evaluation universe.
  visibility: warm; no unseen-item protocol is defined. RQ-PIB branch weights use training-set interaction counts; tokenizer
    content-fitting exposure to test items not reported.
  sid: 'Three-level RQ-PIB: residual K-means centers followed by prefix-local interaction-load balancing with frozen centers.
    Codebook sizes and collision handling not reported.'
  inference_budget: Qwen3-0.6B with trie-constrained beam search. Main HR@10/20/50/100; ablations also HR@1/5. Beam width,
    inference hardware, batch size and latency not reported.
  results_from: 'Original Table 1: Youku retrieval comparisons; Table 2: backbone scaling; Table 3: module/SID/DPO ablations;
    Table 4: online A/B. Table 3 parts (a)-(c) use SFT only; part (d) adds DPO. Baseline-result reuse not stated.'
setup_where:
  datasets: https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px1.p1
  split: 'https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px1.p1 ; #S3.SS6.p1 ; #S4.p2'
  candidates: 'https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px2.p1 ; #S3.SS5.SSS1.Px3.p1'
