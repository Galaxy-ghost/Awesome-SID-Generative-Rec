  sid: 'https://arxiv.org/html/2610.27898v1#S3.SS3.p3 ; #S3.SS3.SSS0.Px2.p1 ; #S3.SS5.SSS1.Px3.p1'
  inference_budget: 'https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px3.p1 ; #S3.T1 ; #S3.T3'
