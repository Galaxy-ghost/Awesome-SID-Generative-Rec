related:
- id: tiger
  relation: competitor
  note: TIGER is a residual-SID retrieval baseline; SPAR jointly changes prefix-local branch balance and prefix-conditioned
    user evidence.
  where: 'SPAR-Youku v1, Section 3.5.1 and Table 1: https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px4.p1; https://arxiv.org/html/2610.27898v1#S3.T1.'
- id: onerec
  relation: competitor
  note: OneRec is the strongest measured generative baseline; SPAR adds stepwise memory retrieval and prefix-balanced SID
    construction.
  where: 'SPAR-Youku v1, Sections 3.5.1/3.5.2 and Table 1: https://arxiv.org/html/2610.27898v1#S3.SS5.SSS1.Px4.p1; https://arxiv.org/html/2610.27898v1#S3.SS5.SSS2.p1;
    https://arxiv.org/html/2610.27898v1#S3.T1.'
- id: unirec
  relation: alternative
  note: UniRec is cited for load-regulated SID assignment; SPAR regulates sibling-branch loads conditioned on parent prefixes
    and couples this with stepwise personalization.
  where: 'SPAR-Youku v1, Introduction and Section 2.1; cited alternative, not an evaluated baseline: https://arxiv.org/html/2610.27898v1#S1.p2;
    https://arxiv.org/html/2610.27898v1#S2.SS1.p2.'
