tldr: LoopGR adds recurrent depth by alternating a shared generative decoder with a lightweight context updater and distills
  a low-budget student, to scale computation without proportionally growing model size.
tldr_zh: LoopGR 交替运行共享生成解码器与轻量上下文更新器以增加循环深度，并蒸馏出低开销学生模型，在不按比例扩大参数量的前提下扩展计算。
setup:
  datasets: Amazon Reviews 2014 Beauty, Sports and Outdoors, CDs and Vinyl; Tencent industrial data. Filtering and industrial
    dataset statistics not reported.
  split: Interactions ordered chronologically; sliding-window next-item training. Train/validation/test allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined.
  sid: Sentence-T5 embeddings; 3 RQ-VAE digits plus fourth anti-collision digit for unique SIDs. Codebook sizes not reported.
  inference_budget: 'Experiments on 4 NVIDIA H20 GPUs; beam width not reported. Public Recall/NDCG@5/10; industrial Recall@5/10/20/50/100.
    Table 6, batch 1: 16/8/4 cycles, 211.08/104.01/49.82ms, 17.408/8.415/3.918 GFLOPs.'
  results_from: 'Tables 1/2: public/industrial comparisons; Table 6: trajectory compression. Industrial baselines adapted
    by authors; public-baseline reproduction versus copied scores not reported.'
