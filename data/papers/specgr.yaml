id: specgr
name: SpecGR
title: Inductive Generative Recommendation via Retrieval-based Speculation
authors: Ding et al.
year: 2026
venue: AAAI’26
links:
  arxiv: https://arxiv.org/abs/2410.02939
  code: https://github.com/Jamesding000/SpecGR
problem: VI
stage: Inference
representation: Text+SID
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Rank
inference: Hybrid
poi: false
summary: 'Abstract: "struggle to recommend unseen items".'
tldr: SpecGR uses an inductive drafter to propose existing and new items and the generative recommender as verifier, so the
  model can recommend items unseen in training.
tldr_zh: SpecGR 用归纳式草稿模型提议已有物品与新物品，由生成式推荐器负责验证，使模型能够推荐训练中未见过的冷启动物品。
evidence:
- field: problem
  where: https://arxiv.org/html/2410.02939v2#abstract1 (Abstract; excerpt)
  quote: struggle to recommend unseen items
setup:
  datasets: Amazon Reviews 2023 Video Games, Office Products, Cell Phones and Accessories; timestamp_w_his 5-core benchmark
    excludes users/items with fewer than five interactions; maximum input history 20 items.
  split: Global predefined timestamp cutoffs create train/validation/test sets; exact dates not reported in paper. Test divided
    into In-Sample and Unseen according to target-item occurrence in training.
  candidates: not reported; full-catalog and subset-ranking capabilities are discussed, but the main evaluation universe and
    negative-sampling protocol are not explicitly specified.
  visibility: Unseen targets have no training interactions and are unseen by the generator. New items are assigned SIDs for
    inference; tokenizer fitting exposure is not reported, so whether they are unseen by tokenizer too is not established.
  sid: TIGER RQ-VAE tokenization; standard experiments use four-digit SIDs, including a final collision-identification token.
    Codebook sizes and suffix-assignment rule not reported. Verification excludes the identification token for unseen items.
  inference_budget: 'Beam beta and draft size delta are 50 or output K (10/50); verification threshold tuned -1.1 to -1.8.
    Draft/verify with guided redrafting and early exit, then beam fallback if needed. Table A6 at draft size 50: SpecGR++
    drafting/verifying 0.0003/0.0249 s versus TIGER 0.0403 s. Inference hardware, batch size and timing aggregation not reported.'
  results_from: 'Original Table 1: overall comparison; Table 2: seen/unseen breakdown; Table 3: ablations; Table A6: latency.
    Baselines reproduced/tuned; Recformer starts from a third-party reproduction checkpoint and is fine-tuned on these datasets.'
