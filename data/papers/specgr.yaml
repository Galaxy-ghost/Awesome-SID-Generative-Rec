related:
- id: tiger
  relation: predecessor
  note: SpecGR uses TIGER as its generative verifier and adds inductive drafting; SpecGR++ reuses the same encoder for self-drafting.
  where: 'SpecGR v2, Implementation Details and Drafting Strategies: https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx4.p1;
    https://arxiv.org/html/2410.02939v2#Sx3.SSx3.SSSx2.p1.'
- id: liger
  relation: competitor
  note: LIGER blends dense-retrieved candidates with generated items; SpecGR filters and orders inductive drafts using generative
    target-aware likelihoods.
  where: 'SpecGR v2, Performance Analysis and Table 2: https://arxiv.org/html/2410.02939v2#Sx4.SSx2.p2.'
- id: atspeed
  relation: alternative
  note: AtSpeed adapts speculative decoding to accelerate top-K generative recommendation; SpecGR uses draft-and-verify to
    introduce unseen-item recommendation capability.
  where: 'SpecGR v2, Related Work, citing Lin et al. (2024), arXiv:2410.05165: https://arxiv.org/html/2410.02939v2#Sx2.p3.'
