id: specgr
name: SpecGR
title: Inductive Generative Recommendation via Retrieval-based Speculation
authors: Ding et al.
year: 2026
venue: AAAI’26
links:
  arxiv: https://arxiv.org/abs/2410.02939
  code: https://github.com/Jamesding000/SpecGR
problem: VI
stage: Inference
representation: Text+SID
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Rank
inference: Hybrid
poi: false
tldr: SpecGR uses an inductive drafter to propose existing and new items and the generative recommender as verifier, so the
  model can recommend items unseen in training.
tldr_zh: SpecGR 用归纳式草稿模型提议已有物品与新物品，由生成式推荐器负责验证，使模型能够推荐训练中未见过的冷启动物品。
evidence:
- field: problem
  where: https://arxiv.org/html/2410.02939v2#abstract1 (Abstract; excerpt)
  quote: struggle to recommend unseen items
setup:
  datasets: Amazon Reviews 2023 Video Games, Office Products, Cell Phones and Accessories; timestamp_w_his 5-core benchmark
    excludes users/items with fewer than five interactions; maximum input history 20 items.
  split: Global predefined timestamp cutoffs create train/validation/test sets; exact dates not reported in paper. Test divided
    into In-Sample and Unseen according to target-item occurrence in training.
  candidates: not reported; full-catalog and subset-ranking capabilities are discussed, but the main evaluation universe and
    negative-sampling protocol are not explicitly specified.
  visibility: Unseen targets have no training interactions and are unseen by the generator. New items are assigned SIDs for
    inference; tokenizer fitting exposure is not reported, so whether they are unseen by tokenizer too is not established.
  sid: TIGER RQ-VAE tokenization; standard experiments use four-digit SIDs, including a final collision-identification token.
    Codebook sizes and suffix-assignment rule not reported. Verification excludes the identification token for unseen items.
  inference_budget: 'Beam beta and draft size delta are 50 or output K (10/50); verification threshold tuned -1.1 to -1.8.
    Draft/verify with guided redrafting and early exit, then beam fallback if needed. Table A6 at draft size 50: SpecGR++
    drafting/verifying 0.0003/0.0249 s versus TIGER 0.0403 s. Inference hardware, batch size and timing aggregation not reported.'
  results_from: 'Original Table 1: overall comparison; Table 2: seen/unseen breakdown; Table 3: ablations; Table A6: latency.
    Baselines reproduced/tuned; Recformer starts from a third-party reproduction checkpoint and is fine-tuned on these datasets.'
setup_where:
  datasets: 'https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx1.p1 ; #Sx4.SSx1.SSSx4.p1'
  split: 'https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx1.p1 ; #Sx4.SSx1.SSSx3.p1'
  candidates: 'https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx3.p1 ; #A6.SSx1.p1'
  visibility: 'https://arxiv.org/html/2410.02939v2#Sx3.SSx1.p1 ; #Sx3.SSx1.p2 ; #Sx4.SSx1.SSSx3.p1'
  sid: 'https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx4.p1 ; #Sx3.SSx2.SSSx2.p3 ; #A5.SSx2.p1'
  inference_budget: 'https://arxiv.org/html/2410.02939v2#A2.SSx1.p1 ; #Sx3.SSx2.SSSx4.p1 ; #A5.T6'
  results_from: 'https://arxiv.org/html/2410.02939v2#Sx4.SSx2.p1 ; #Sx4.SSx2.p2 ; #Sx4.T3 ; #A2.SSx3.p1 ; #A5.T6'
related:
- id: tiger
  relation: predecessor
  note: SpecGR uses TIGER as its generative verifier and adds inductive drafting; SpecGR++ reuses the same encoder for self-drafting.
  where: 'SpecGR v2, Implementation Details and Drafting Strategies: https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx4.p1;
    https://arxiv.org/html/2410.02939v2#Sx3.SSx3.SSSx2.p1.'
- id: liger
  relation: competitor
  note: LIGER blends dense-retrieved candidates with generated items; SpecGR filters and orders inductive drafts using generative
    target-aware likelihoods.
  where: 'SpecGR v2, Performance Analysis and Table 2: https://arxiv.org/html/2410.02939v2#Sx4.SSx2.p2.'
- id: atspeed
  relation: alternative
  note: AtSpeed adapts speculative decoding to accelerate top-K generative recommendation; SpecGR uses draft-and-verify to
    introduce unseen-item recommendation capability.
  where: 'SpecGR v2, Related Work, citing Lin et al. (2024), arXiv:2410.05165: https://arxiv.org/html/2410.02939v2#Sx2.p3.'
changes:
  representation: none
  tokenization: none
  backbone: none
  tokenizer: none
  objective:
    value: other
    quote: To obtain strong inductive embeddings, we jointly train the GR encoder with a contrastive objective following (
      Chen et al. 2020 ; Hou et al. 2022 ) .
    where: arXiv:2410.02939v2 https://arxiv.org/html/2410.02939v2#Sx3.SSx3.SSSx2.p3；SpecGR++ 自草稿的新增表征训练，另有 learning-to-rank
      微调；不更新 SID 编号器。
  inference: primary
modality:
- Text
modality_where:
  quote: We use UniSRec ( Hou et al. 2022 ) as the auxiliary drafter model for SpecGR Aux and TIGER ( Rajput et al. 2024 )
    as the GR backbone for both SpecGR variants.
  where: arXiv:2410.02939v2 https://arxiv.org/html/2410.02939v2#Sx4.SSx1.SSSx4.p1；TIGER 文本 RQ-VAE；Table 1 的 SID 是额外输入给推荐器的编码，不是构码源模态。
domain:
- E-commerce
settings:
- value: cold-start
  scope: item
  quote: Note that in the inductive setting, the target item may not appear in the training set, called new or unseen items
