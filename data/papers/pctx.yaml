id: pctx
name: Pctx
title: 'Pctx: Tokenizing Personalized Context for Generative Recommendation'
authors: Zhong et al.
year: 2026
venue: CIKM’26
links:
  arxiv: https://arxiv.org/abs/2510.21276
  code: https://github.com/YoungZ365/Pctx
problem: I
stage: Tokenization
representation: Text+CF
tokenization: RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Beam+Agg.
poi: false
tldr: Pctx tokenizes each item with the user's interaction history as context, so the same item can receive different Semantic
  IDs for different users, instead of one static item-only mapping.
tldr_zh: Pctx 将用户交互历史作为上下文对物品编号，使同一物品面向不同用户可获得不同 SID，替代静态的纯物品映射。
setup:
  datasets: 'Amazon Reviews 2023: Musical Instruments, Industrial & Scientific, Video Games; exclude users/items with fewer
    than five interactions; chronological histories capped at 20 items.'
  split: 'Per-user chronological leave-one-out: most recent item test, penultimate validation, remaining interactions training.'
  candidates: full catalog; full-ranking evaluation rather than negative sampling.
  visibility: warm; no unseen-item protocol is defined. Auxiliary DuoRec is pretrained on the same training data, and representative
    contexts come from training interactions; textual-tokenizer fitting exposure to test items not reported.
  sid: 3 x 256 residual semantic codes plus an auxiliary collision token of unreported vocabulary size; multiple context-conditioned
    SIDs/item. Same-item IDs differing only in collision token are merged; collision tokens distinguish different items. Main
    text names RQ-VAE; appendix specifies FAISS quantization.
  inference_budget: Beam decoding with aggregation of generated SID probabilities per item; Recall/NDCG@5/10. GR baseline
    beam 50; Pctx-specific beam width not separately reported. Inference hardware, batch size and latency not reported.
  results_from: 'Table 1: Pctx experiments with most baseline rows (including TIGER/LETTER) copied from Zheng et al. (2025);
    other baselines reconstructed. Table 2: ablations; Table 3: ensemble comparisons; Table 6: explainability.'
setup_where:
  datasets: 'https://arxiv.org/html/2510.21276v1#S3.SS1.SSS0.Px1.p1 ; #A3.SS1.p1'
  split: https://arxiv.org/html/2510.21276v1#A3.SS3.p1
  candidates: https://arxiv.org/html/2510.21276v1#A3.SS3.p1
  visibility: 'https://arxiv.org/html/2510.21276v1#S2.SS2.p1 ; #S2.SS2.SSS1.Px1.p1 ; #S2.SS2.SSS2.p1 ; #A3.SS3.p1'
  sid: 'https://arxiv.org/html/2510.21276v1#S2.SS2.SSS2.Px1.p1 ; #S2.SS2.SSS2.Px2.p2 ; #A3.SS4.p1'
  inference_budget: 'https://arxiv.org/html/2510.21276v1#S2.SS3.SSS0.Px2.p1 ; #A3.SS3.p1 ; #S3.SS1.SSS0.Px3.p1'
  results_from: 'https://arxiv.org/html/2510.21276v1#S3.T1 ; #S3.T2 ; #S3.T3 ; #A3.SS4.p1 ; #A4.T6'
related:
- id: tiger
  relation: competitor
  note: TIGER assigns static semantic IDs; Pctx conditions item tokenization on user context and aggregates probabilities
    across personalized IDs.
  where: 'Pctx v1, Section 2.4 and Table 1; TIGER results are reused from prior work per Appendix C.4: https://arxiv.org/html/2510.21276v1#S2.SS4.SSS0.Px1.p1;
    https://arxiv.org/html/2510.21276v1#S3.T1; https://arxiv.org/html/2510.21276v1#A3.SS4.p1.'
- id: letter
  relation: competitor
  note: LETTER injects collaborative information and diversity constraints into item quantization; Pctx adds history-conditioned
    user interpretations.
  where: 'Pctx v1, Appendix C.2 and Table 1; LETTER results are reused per Appendix C.4: https://arxiv.org/html/2510.21276v1#A3.SS2.p1;
    https://arxiv.org/html/2510.21276v1#S3.T1; https://arxiv.org/html/2510.21276v1#A3.SS4.p1.'
- id: actionpiece
  relation: competitor
  note: ActionPiece uses adjacent action context; Pctx extends tokenization context to the full user interaction history.
  where: 'Pctx v1, Section 2.4 and Table 1: https://arxiv.org/html/2510.21276v1#S2.SS4.SSS0.Px3.p1; https://arxiv.org/html/2510.21276v1#S3.T1.'
- id: lc-rec
  relation: alternative
  note: LC-Rec is discussed as static tokenization under a universal item-similarity assumption; Pctx maps an item to personalized
    IDs under different user contexts.
  where: 'Pctx v1, Section 2.4: https://arxiv.org/html/2510.21276v1#S2.SS4.SSS0.Px1.p1.'
changes:
