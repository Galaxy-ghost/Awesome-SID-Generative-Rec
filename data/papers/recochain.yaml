    quote: 'Instead of treating generation and ranking as separate stages with independent models, our framework jointly performs
      both tasks within a unified architecture: once a candidate item (or a set of candidates) has been generated by the GR
      backbone, the same Transformer can be re-invoked in a target-aware mode to perform searched sequence modeling against
      the generated target, thereby unifying retrieval and ranking within one backbone without introducing an additional ranking
      component .'
    where: '2604.25787v1 #S1.p5.1；Stage II 在 SID 生成损失上加候选重排损失'
  inference:
