id: recochain
name: RecoChain
title: Harmonizing Generative Retrieval and Ranking in Chain-of-Recommendation
authors: Liu and Cao
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.25787
  code: null
problem: IV
stage: Backbone
