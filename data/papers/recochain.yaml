poi: false
tldr: RecoChain generates candidates by hierarchical Semantic ID prediction and then ranks them with SIM-based click estimation
  in the same Transformer, to close the gap between generation and ranking.
tldr_zh: RecoChain 在同一 Transformer 中先通过层级 SID 预测生成候选，再用基于 SIM 的点击率估计做排序，弥合生成与排序之间的差距。
evidence:
- field: problem
  where: https://arxiv.org/html/2604.25787v1#abstract1 (Abstract); https://arxiv.org/html/2604.25787v1#S2.SS3.SSS2.p1 (§2.3.2);
    https://arxiv.org/html/2604.25787v1#S2.SS3.SSS3.p3 (§2.3.3)
  quote: leading to a gap between generation and ranking performance
  reason: 'The organizer retains IV over candidate III under the rule that an inadequate training objective qualifies: SID-only
    optimization is extended with a candidate-ranking objective.'
setup:
  datasets: 'TAOBAO-MM: 8.79M users, 35.4M items, 99M interactions, histories up to 1,000 interactions, with 128-dimensional
    multimodal item embeddings; adapted from CTR to sequential recommendation by keeping interaction histories and discarding
    exposure labels. Further filtering: not reported.'
  split: The official TAOBAO-MM train/validation/test split, without further sequence-level partitioning.
  candidates: not reported (full catalog versus sampled); top-K comes from C beam candidates (beam size 20 by default) that
    are re-ranked by a click-probability head.
  visibility: warm; no unseen-item protocol is defined.
  sid: '3-level RQ-Kmeans over the pretrained multimodal embeddings, plus a random fourth token s4 that makes the item-SID
    mapping one-to-one; codebook size per level: not reported.'
  inference_budget: 'Hierarchical beam search (default beam 20; 10 to 40 in Table 1) with KV cache, then for each candidate
    the top-10 most similar history items are appended and a rank head scores the candidate by continuing decoding. 2-layer
    decoder (hidden 1,024). Hardware, inference batch size, and latency: not reported.'
  results_from: Tables 1-3 (Recall and NDCG at 5 and 10 before and after re-ranking, varying beam size, input sequence length,
    and retrieval length on TAOBAO-MM).
