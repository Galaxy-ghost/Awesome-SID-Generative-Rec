id: recochain
name: RecoChain
title: Harmonizing Generative Retrieval and Ranking in Chain-of-Recommendation
authors: Liu and Cao
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2604.25787
  code: null
problem: IV
stage: Backbone
representation: Text+Img
tokenization: RQ
backbone: Dec-Only
tokenizer: Fixed
objective: NTP + Rank
inference: Hybrid
poi: false
summary: 'Abstract: "leading to a gap between generation and ranking performance". Candidates: IV / III (rule: IV threshold:
  a flawed training objective counts).'
tldr: RecoChain generates candidates by hierarchical Semantic ID prediction and then ranks them with SIM-based click estimation
  in the same Transformer, to close the gap between generation and ranking.
evidence:
- field: problem
  where: https://arxiv.org/html/2604.25787v1#abstract1 (Abstract); https://arxiv.org/html/2604.25787v1#S2.SS3.SSS2.p1 (§2.3.2);
    https://arxiv.org/html/2604.25787v1#S2.SS3.SSS3.p3 (§2.3.3)
  quote: leading to a gap between generation and ranking performance
  reason: 'The organizer retains IV over candidate III under the rule that an inadequate training objective qualifies: SID-only
    optimization is extended with a candidate-ranking objective.'
setup:
  datasets: 'TAOBAO-MM: 8.79M users, 35.4M items, 99M interactions, histories up to 1,000 interactions, with 128-dimensional
    multimodal item embeddings; adapted from CTR to sequential recommendation by keeping interaction histories and discarding
    exposure labels. Further filtering: not reported.'
  split: The official TAOBAO-MM train/validation/test split, without further sequence-level partitioning.
  candidates: not reported (full catalog versus sampled); top-K comes from C beam candidates (beam size 20 by default) that
    are re-ranked by a click-probability head.
  visibility: warm; no unseen-item protocol is defined.
  sid: '3-level RQ-Kmeans over the pretrained multimodal embeddings, plus a random fourth token s4 that makes the item-SID
    mapping one-to-one; codebook size per level: not reported.'
  inference_budget: 'Hierarchical beam search (default beam 20; 10 to 40 in Table 1) with KV cache, then for each candidate
    the top-10 most similar history items are appended and a rank head scores the candidate by continuing decoding. 2-layer
    decoder (hidden 1,024). Hardware, inference batch size, and latency: not reported.'
  results_from: Tables 1-3 (Recall and NDCG at 5 and 10 before and after re-ranking, varying beam size, input sequence length,
    and retrieval length on TAOBAO-MM).
setup_where:
  datasets: 'TAOBAO-MM and adaptation: https://arxiv.org/html/2604.25787v1#S3.p1.'
  split: 'Official split: https://arxiv.org/html/2604.25787v1#S3.p1.'
  candidates: 'Beam candidates re-ranked; metrics: https://arxiv.org/html/2604.25787v1#S3.p4 and https://arxiv.org/html/2604.25787v1#S2.SS4.p1.'
  visibility: 'Official split with no unseen-item protocol: https://arxiv.org/html/2604.25787v1#S3.p1.'
  sid: '3-level RQ-Kmeans plus a random fourth token: https://arxiv.org/html/2604.25787v1#S2.SS2.p1.'
  inference_budget: 'Generate-retrieve-rerank with KV reuse: https://arxiv.org/html/2604.25787v1#S2.SS3.SSS2.p2, https://arxiv.org/html/2604.25787v1#S2.SS3.SSS2.p4,
    https://arxiv.org/html/2604.25787v1#S2.SS4.p2; defaults: https://arxiv.org/html/2604.25787v1#S3.p4; model: https://arxiv.org/html/2604.25787v1#S3.p2.'
  results_from: 'Results: https://arxiv.org/html/2604.25787v1#S2.T1, https://arxiv.org/html/2604.25787v1#S2.T2, https://arxiv.org/html/2604.25787v1#S2.T3.'
related:
- id: tiger
  relation: alternative
  note: TIGER stops at beam-search retrieval; RecoChain appends retrieved history items to each beam candidate and re-ranks
    them in the same decoder.
  where: 'RecoChain v1, Section 1 cites TIGER and OneRec as beam-search retrievers: https://arxiv.org/html/2604.25787v1#S1.p4.'
- id: onerec
  relation: alternative
  note: OneRec unifies retrieval and ranking with preference alignment over sessions; RecoChain chains generation and a click-probability
    re-rank head with KV-cache reuse.
  where: 'RecoChain v1, Section 1: https://arxiv.org/html/2604.25787v1#S1.p2 and https://arxiv.org/html/2604.25787v1#S1.p4.'
