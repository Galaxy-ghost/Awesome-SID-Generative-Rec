related:
- id: tiger
  relation: alternative
  note: TIGER stops at beam-search retrieval; RecoChain appends retrieved history items to each beam candidate and re-ranks
    them in the same decoder.
  where: 'RecoChain v1, Section 1 cites TIGER and OneRec as beam-search retrievers: https://arxiv.org/html/2604.25787v1#S1.p4.'
- id: onerec
  relation: alternative
  note: OneRec unifies retrieval and ranking with preference alignment over sessions; RecoChain chains generation and a click-probability
    re-rank head with KV-cache reuse.
  where: 'RecoChain v1, Section 1: https://arxiv.org/html/2604.25787v1#S1.p2 and https://arxiv.org/html/2604.25787v1#S1.p4.'
