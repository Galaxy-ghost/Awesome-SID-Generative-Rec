id: isd
name: ISD
title: 'Understanding Semantic IDs: From Item Representation to Item Selection in Generative Recommendation'
authors: Wang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2607.24995
  code: https://anonymous.4open.science/r/ISD-CF7C
problem: IV
stage: Inference
representation: Text†
tokenization: RQ-VAE†
backbone: Enc-Dec†
tokenizer: Fixed
objective: NTP†
inference: ISD Beam
poi: false
tldr: ISD lets a user-specific item ranking support Semantic ID prefixes before beam search discards them, at inference time
  and without retraining, after showing that Semantic IDs lose local item structure.
tldr_zh: ISD 在指出 SID 丢失局部物品结构后，于推理阶段无需重训地用用户特定物品排序支撑 SID 前缀，避免它们在束搜索中被过早剪枝。
setup:
  datasets: 'Amazon Reviews: Baby, Office, Scientific; filtering rules not reported.'
  split: 'Per-user chronological leave-one-out: final interaction test, preceding interaction validation, remainder training.'
  candidates: full catalog of eligible items, with the same consumed-item mask for all methods.
  visibility: warm; no unseen-item protocol is defined. Separate item scorer and transition/co-consumption statistics use
    training interactions; tokenizer exposure to test items not reported.
  sid: 'TIGER/LIGER assignments remain fixed: three semantic positions plus a collision-resolution suffix. Codebook sizes
    and suffix-assignment rule not reported; primary filtering diagnostic uses RQ-VAE.'
  inference_budget: Beam 50; one decoder pass; top-50 item-support ranking constructed once per history; reciprocal-rank fusion
    kappa=60; at most 50 output items, evaluated at K=10/20. Ranker construction is excluded from decoding complexity. Hardware,
    inference batch size and latency not reported.
  results_from: 'Original Table 3: matched recommendation comparisons, means across three seeds; Table 4: SID reassignment;
    Table 5: filtering/ordering ablations. Tables 1-2: encoder/SID representation diagnostics.'
