setup:
  datasets: 'Diagnostic resource with nine named exports from seven tokenizer families: Amazon Musical, Video Games, Beauty
    (P5), and Instruments, plus Yelp Business; eight exports enter the executable diagnostic matrix. A separate DACT Tools
    case studies mapping refresh. For the compact D3 graph, duplicate user-item pairs are removed and only users with 2-50
    distinct mapped items are included; users above 50 are excluded, not truncated. Upstream dataset filtering is not reported
    uniformly across routes.'
  split: Protocol-dependent. Mapping profiles use declared training splits or supplied reference interactions when split labels
    are absent. Fixed-budget Beauty studies use explicit training/validation splits; ReSOT Instruments uses earlier events
    as history, the penultimate event for validation, and the final event as unused future holdout, with hashed users separating
    diagnostics from 2,000 validation users. GRID beam studies train outside each of two evaluation folds; DIGER uses a last-event
    case. DACT refresh uses the same 5,364 held-out users/targets across states, with test targets excluded from training
    and checkpoint selection.
  candidates: 'Protocol-dependent: fixed-budget prefix retrieval uses exactly 100 candidate items per user, with sensitivity
    budgets of 50 and 200; sampled-ranking tests use the target plus 100 catalog negatives after excluding history items,
    using popular or uniformly sampled negatives; frozen-beam resolver comparisons use the same top-50 generated paths, with
    top-20 sensitivity and no candidate-budget expansion.'
  visibility: No single warm/cold regime. Fixed-budget studies separate diagnostic and validation users, not the upstream
    tokenizer's training population. The DACT refresh case includes 584 new-item targets and compares the released checkpoint
    with adapted checkpoints; whether these items were unseen during tokenizer fitting is not reported.
  sid: Named exports have 3 or 4 SID levels; a single layers-by-codebook-size configuration is n/a, and nominal per-level
    codebook capacities are not reported uniformly across routes. Table 3's D1 counts are occupied first-level symbols, not
    nominal capacities. Shared full codes are measured explicitly; frozen-beam comparisons use singleton credit, uniform within-leaf
    expected credit, or deterministic training-popularity resolution with item-ID tie-breaking.
  inference_budget: 'DACT TIGER/T5 constraint comparison: beam width 50 on 500 fixed targets. Controlled GRID/P5 GRU runs:
    beam width 50 on 500 targets per evaluation fold, with a DIGER portability case under the same accounting. Three GRU exports
    each contain 25,000 beam rows for 500 targets. Generator inference hardware, inference batch size, and latency not reported;
    the stated batch size 512 is for GRU training.'
  results_from: 'Table 3: eight-route D1-D5 profiles. Table 4: D3 calibration checks. Table 5: fixed-budget prefix retrieval.
    Section 5.4: released TIGER/T5 constrained versus unconstrained decoding. Table 6: controlled beam accounting. Table 7:
    resolution policies on identical beams. Table 8: DACT mapping refresh and generator handoff. Appendix B, Tables 11-12:
    measurement checks and candidate-budget sensitivity.'
setup_where:
  datasets: Table 2 defines named route coverage, Section 3.2 defines bounded-graph filtering, and Section 6 adds a separate
    Tools lifecycle case; https://arxiv.org/html/2608.18779v2#S3.T2, https://arxiv.org/html/2608.18779v2#S3.SS2.SSS0.Px2.p1,
    https://arxiv.org/html/2608.18779v2#S3.SS2.SSS0.Px2.p2, and https://arxiv.org/html/2608.18779v2#S6.SS1.p1.
  split: Profile, fixed-budget, beam, and lifecycle studies use distinct splits, so none is promoted to a resource-wide train/test
    protocol; https://arxiv.org/html/2608.18779v2#S3.SS2.SSS0.Px2.p2, https://arxiv.org/html/2608.18779v2#S5.SS2.p1, https://arxiv.org/html/2608.18779v2#S5.SS5.p1,
    and https://arxiv.org/html/2608.18779v2#S6.SS1.p2.
  candidates: Fixed-budget retrieval, sampled ranking, and beam accounting have different candidate meanings; https://arxiv.org/html/2608.18779v2#S5.SS2.p1,
    https://arxiv.org/html/2608.18779v2#A1.SS1.SSS0.Px1.p1, https://arxiv.org/html/2608.18779v2#A2.SS3.p1, and https://arxiv.org/html/2608.18779v2#A2.SS4.p2.
  visibility: Disjoint diagnostic users do not establish tokenizer-unseen items, and the DACT new-item handoff is not a declared
    tokenizer-cold-start protocol; https://arxiv.org/html/2608.18779v2#S5.SS2.p1 and https://arxiv.org/html/2608.18779v2#S6.SS1.p2.
  sid: Table 2 gives SID depths, Table 3 reports occupied symbols rather than codebook capacity, and Section 5.6 defines the
    collision-accounting/resolution alternatives; https://arxiv.org/html/2608.18779v2#S3.T2, https://arxiv.org/html/2608.18779v2#S4.T3,
    https://arxiv.org/html/2608.18779v2#S5.SS6.p1, and https://arxiv.org/html/2608.18779v2#S5.SS6.p2.
  inference_budget: Sections 5.4-5.5 state the actual beam budgets, Appendix B.4's batch 512 is a training setting, and Section
    3.2 distinguishes topology from runtime; https://arxiv.org/html/2608.18779v2#S5.SS4.p1, https://arxiv.org/html/2608.18779v2#S5.SS5.p1,
    https://arxiv.org/html/2608.18779v2#A2.SS4.p1, https://arxiv.org/html/2608.18779v2#A2.SS4.p2, and https://arxiv.org/html/2608.18779v2#S3.SS2.SSS0.Px3.p2.
  results_from: The cited tables separate mapping diagnostics, candidate exposure, beam accounting, resolver outcomes, and
    lifecycle handoff; https://arxiv.org/html/2608.18779v2#S4.T3, https://arxiv.org/html/2608.18779v2#S5.T4, https://arxiv.org/html/2608.18779v2#S5.T5,
    https://arxiv.org/html/2608.18779v2#S5.T6, https://arxiv.org/html/2608.18779v2#S5.T7, https://arxiv.org/html/2608.18779v2#S6.T8,
    https://arxiv.org/html/2608.18779v2#S5.SS4.p1, https://arxiv.org/html/2608.18779v2#A2.T11, and https://arxiv.org/html/2608.18779v2#A2.T12.
