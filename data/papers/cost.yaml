id: cost
name: CoST
title: 'Cost: Contrastive quantization based semantic tokenization for generative recommendation'
authors: Zhu et al.
year: 2024
venue: RecSys’24
links:
  arxiv: https://arxiv.org/abs/2404.14774
  code: null
problem: I
stage: Tokenization
representation: Text
tokenization: C-RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Beam
poi: false
summary: 'Abstract: "fails to capture the essential neighborhood relationships".'
tldr: CoST trains the item tokenizer with a contrastive quantization objective that captures neighborhood relationships between
  items, instead of the reconstruction loss used by RQ-VAE.
tldr_zh: CoST 用刻画物品邻域关系的对比量化目标训练物品编号器，替代 RQ-VAE 使用的重构损失。
evidence:
- field: problem
  where: https://arxiv.org/html/2404.14774v2#abstract1
  quote: fails to capture the essential neighborhood relationships
setup:
  datasets: 'MIND news (preprocessing following Feng et al. 2022: interactions with at least 15 users kept, sequences capped
    at 70; 29,207 users / 12,251 items) and Amazon Office (users with fewer than 5 interactions removed), split by item count
    into Office (S) (2,868 users / 14,618 items) and Office (L) (16,696 users / 37,347 items).'
  split: 'Leave-one-out: last item for test, penultimate for validation, the remaining items for training.'
  candidates: not reported (full catalog versus sampled evaluation candidates).
  visibility: warm; no unseen-item protocol is defined.
  sid: 3 residual-quantization levels with a codebook of size 64 shared across levels, 96-dimensional latent; Sentence-T5
    768-dimensional input. The paper states each item receives a unique 3-tuple, but the mechanism that guarantees uniqueness
    is not reported.
  inference_budget: 'TIGER-style encoder-decoder; decoding method and beam width not reported. Recall and NDCG at K=5, 10,
    20, 40 (MIND) and 10, 20 (Office). Hardware, inference batch size, and latency: not reported.'
  results_from: Table 2 (MIND) and Table 3 (Office (S) and Office (L)), comparing random hashing, reconstruction-only RQ-VAE,
    contrastive-only, and combined losses; Figures 3-4 (temperature, epochs, codebook size, number of codebooks, embedding
    dimension).
setup_where:
  datasets: 'Datasets and filters: https://arxiv.org/html/2404.14774v2#S4.SS1.p1; statistics: https://arxiv.org/html/2404.14774v2#S3.T1.'
  split: 'Leave-one-out allocation: https://arxiv.org/html/2404.14774v2#S4.SS1.p3.'
  candidates: 'Metrics only: https://arxiv.org/html/2404.14774v2#S4.SS1.p3.'
  visibility: 'Standard leave-one-out with no cold-start experiment: https://arxiv.org/html/2404.14774v2#S4.SS1.p3.'
  sid: '3 shared codebooks of size 64, 96-dimensional latent, unique 3-tuples: https://arxiv.org/html/2404.14774v2#S4.SS1.p2;
    sensitivity: https://arxiv.org/html/2404.14774v2#S4.F4.'
  inference_budget: 'Generator follows TIGER''s structure, no decoding settings: https://arxiv.org/html/2404.14774v2#S4.SS1.p2
    and https://arxiv.org/html/2404.14774v2#S3.SS2.p1.'
  results_from: 'MIND: https://arxiv.org/html/2404.14774v2#S4.T2; Office: https://arxiv.org/html/2404.14774v2#S4.T3; sensitivity:
    https://arxiv.org/html/2404.14774v2#S4.F3 and https://arxiv.org/html/2404.14774v2#S4.F4.'
related:
- id: tiger
  relation: predecessor
  note: TIGER's RQ-VAE is trained only with reconstruction loss; CoST keeps TIGER's generator and adds a contrastive loss
    so that neighboring items get distinguishable codes.
  where: 'CoST v2, Section 1 identifies RQ-VAE from TIGER as the starting point: https://arxiv.org/html/2404.14774v2#S1.p3;
    Section 3.2 follows TIGER''s architecture: https://arxiv.org/html/2404.14774v2#S3.SS2.p1; the reconstruction-only row
    in Tables 2-3 is the TIGER-style tokenizer: https://arxiv.org/html/2404.14774v2#S4.T2 and https://arxiv.org/html/2404.14774v2#S4.T3.'
- id: eager
  relation: alternative
  note: EAGER tokenizes items by hierarchical k-means and also integrates collaborative information, whereas CoST trains a
    residual quantizer with a contrastive objective over item neighborhoods.
  where: 'CoST v2, Section 1 and Section 2 cite Wang et al. (2024b), EAGER, for hierarchical k-means and semantic-collaborative
    tokenization: https://arxiv.org/html/2404.14774v2#S1.p3 and https://arxiv.org/html/2404.14774v2#S2.p2; not compared in
    Tables 2-3.'
- id: letter
  relation: alternative
  note: LETTER integrates collaborative signals into the RQ-VAE tokenizer, while CoST uses contrastive quantization on semantic
    embeddings.
  where: 'CoST v2, Section 2 cites LETTER among semantic-collaborative tokenizers: https://arxiv.org/html/2404.14774v2#S2.p2;
    not compared in Tables 2-3.'
- id: tokenrec
  relation: alternative
  note: TokenRec also combines semantic and collaborative information when tokenizing items; CoST relies on contrastive learning
    over semantic embeddings.
  where: 'CoST v2, Section 2 cites Qu et al. (2024), TokenRec: https://arxiv.org/html/2404.14774v2#S2.p2; not compared in
    Tables 2-3.'
