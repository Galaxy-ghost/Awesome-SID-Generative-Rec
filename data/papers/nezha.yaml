related:
- id: atspeed
  relation: alternative
  note: AtSpeed uses a separate draft model and target-model verification; NEZHA uses an internal autoregressive draft head
    and hash-set validation. AtSpeed is omitted from public comparisons.
  where: 'NEZHA v1, Sections 2.2/4.1: https://arxiv.org/html/2511.18793v1#S2.SS2.p2; https://arxiv.org/html/2511.18793v1#S4.SS1.p2.'
- id: specgr
  relation: alternative
  note: SpecGR supports out-of-vocabulary recommendation with speculative inference; NEZHA removes separate drafting and costly
    target-model verification for fast catalog-valid generation.
  where: 'NEZHA v1, Sections 1/6, citing Ding et al. (2024): https://arxiv.org/html/2511.18793v1#S1.p4; https://arxiv.org/html/2511.18793v1#S6.p2;
    https://arxiv.org/html/2511.18793v1#S6.p6.'
- id: rpg
  relation: alternative
  note: RPG uses long semantic IDs and graph-based parallel decoding; NEZHA retains sequential dependencies through a lightweight
    autoregressive draft head.
  where: 'NEZHA v1, Sections 3.2/6: https://arxiv.org/html/2511.18793v1#S3.SS2.p7; https://arxiv.org/html/2511.18793v1#S6.p2.'
