id: nezha
name: NEZHA
title: 'NEZHA: A Zero-sacrifice and Hyperspeed Decoding Architecture for Generative Recommendations'
authors: Wang et al.
year: 2026
venue: WWW’26 Industry
links:
  arxiv: https://arxiv.org/abs/2511.18793
  code: null
problem: V
stage: Inference
representation: Text
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Self-Draft+Hash
poi: false
summary: 'Abstract: "severely hindered by high inference latency".'
tldr: NEZHA adds an autoregressive draft head inside the main model for self-drafting and checks drafts against a hash set
  of valid IDs, instead of separate draft models and model-based verifiers.
evidence:
- field: problem
  where: 'Abstract, inference-latency complaint (fragment), arXiv v2: https://arxiv.org/html/2511.18793v2#abstract1.1'
  quote: severely hindered by high inference latency
setup:
  datasets: Yelp, Amazon Beauty, Amazon Games; filtering rules not reported. Deployment uses Taobao Search Advertising production
    data; size, dates and filtering not reported.
  split: 'Public per-user leave-one-out: last interaction test, penultimate validation, remainder training. Production offline
    split not reported; online A/B lasts seven days, traffic allocation not reported.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Tokenizer fitting exposure to test items not reported.
  sid: 'Public RQ-VAE: 3 x 512, using embeddings of textual item attributes. Production uses three levels with different,
    unreported codebook sizes. Collision handling not reported; hash-set verification filters invalid generated SIDs.'
  inference_budget: 'Public beam 10, HR/NDCG@5/10; mean prefill+decode latency on Beauty/Games/Yelp: Llama 7.00/7.52/7.41
    ms, Qwen 4.41/4.80/4.46 ms. Production benchmark beam 512; 2.6x algorithm speedup, deployed total latency <30 ms including
    queue savings. GPU model/count and inference batch size not reported.'
  results_from: 'Original Table 3: public beam/MTP/NEZHA comparison, means over seeds 42/43/44; Table 4: Yelp ablations. Section
    5: production offline hit-rate gains and seven-day online revenue test. No imported baseline results identified.'
setup_where:
  datasets: 'https://arxiv.org/html/2511.18793v1#S4.SS1.p1 ; #S5.p1'
  split: 'https://arxiv.org/html/2511.18793v1#S4.SS1.p1 ; #S5.p3'
