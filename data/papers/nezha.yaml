  sid: 'https://arxiv.org/html/2511.18793v1#S4.SS1.p4 ; #S3.SS3.p6'
  inference_budget: 'https://arxiv.org/html/2511.18793v1#S4.SS1.p4 ; #S3.T3 ; #S1.T1 ; #S1.p3 ; #S5.p2'
