name: CITE
title: 'CITE: Contextual Item Transition Embeddings for Generative Recommendation with Parallel Semantic Identifiers'
authors: Ma et al.
year: 2026
venue: Electronics’26
links:
  arxiv: https://doi.org/10.3390/electronics15204749
  code: null
problem: I
stage: Inference
representation: Text
tokenization: Par. OPQ
backbone: Non-AR
tokenizer: Fixed
objective: Discrim.
inference: Scoring
poi: false
summary: 'CITE (Electronics’26): Inference-stage method using Par. OPQ tokenization and Non-AR backbone.'
tldr: CITE adds an item-level transition score with separate source and destination embeddings to a fixed parallel Semantic
  ID generator, modeling the directed relation between the latest item and each candidate.
setup:
  datasets: 'Amazon Reviews 2014 Sports and Outdoors, Beauty, Toys and Games, CDs and Vinyl; RPG preprocessing, filtering
    threshold not reported. Additional Yelp 2019 review subset: iterative user/item 5-core, 30,431 users, 20,033 businesses,
    316,354 interactions.'
  split: 'Per-user chronological: final item test, penultimate validation, earlier prefixes/next-item pairs training; histories
    capped at 50. Validation NDCG@10 selects CITE checkpoint and fusion weight; locked test evaluation. Yelp uses the same
    protocol.'
  candidates: full catalog; identical full-sort item set for RPG and CITE; graph search is not used for reported ranking metrics;
    history exclusion not reported.
  visibility: Strict item-cold cohort has zero training-split occurrences (Sports/Beauty/Toys/CDs target counts 317/138/279/298);
    low-frequency means 1–5 occurrences. Tokenizer fitting exposure is not reported, so unseen by generator only versus unseen
    by tokenizer too is not established; CITE training scores every catalog destination.
  sid: Fixed OPQ identifiers over text embeddings; 256 codes/position, lengths Sports 16, Beauty 32, Toys 16, CDs 64; collision
    handling and Yelp ID length not reported. Yelp text uses text-embedding-3-large. Default CITE freezes the reproduced RPG
    generator and learns only the transition module.
  inference_budget: Parallel semantic scoring plus full-catalog transition matrix scoring, Recall/NDCG@5/10; no autoregressive
    beam or graph search in evaluation. Evaluation batch 512 (Sports/Beauty/Toys), 256 (CDs), NVIDIA A100 80GB/Intel Xeon
    Gold 5218. Inference latency not reported; Table 12 wall-clock includes loading, training, validation and testing.
  results_from: 'Own matched RPG reproductions and CITE experiments: main comparison/ablations and Yelp use means and sample
    SD over seeds 2024–2028; cold-start, learned-gating and joint-fine-tuning analyses use seed 2024. Table 3 also includes
    published reference baseline scores. RPG checkpoints are trained from scratch and frozen before default CITE fitting;
    Yelp separately tunes RPG by validation.'
