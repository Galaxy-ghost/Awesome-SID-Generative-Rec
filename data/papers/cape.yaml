summary: 'Generative recommenders replace the retrieve-then-rank cascade with a single model: beam search over semantic item
  identifiers performs retrieval, and the same likelihood performs ranking. We show that this shared score makes them forget
  long-tail items twice. In retrieval, beam search keeps identifier prefixes by the probability mass of their subtrees, so
  tail items are pruned early, and a wider beam admits few more of them. In ranking, the likelihood places tail items below
  head items even when they are admitted, so expanding retrieval alone brings little or no gain. Both failures reflect missing
  item-level memorization (i.e., direct recall of which items co-occur), which collaborative filtering provides and shared-prefix
  generation lacks. To this end, we propose CAPE (Co-occurrence-Aware Pool Expansion), a training-free plug-in that restores
  memorization at both stages: (i) a memorization channel retrieves co-occurrence-supported tail items outside the beam and
  scores them with the frozen generator, and (ii) memorization-calibrated ranking fuses the generator likelihood with co-occurrence
  evidence while keeping the generator''s first item. Experiments with two generative backbones on product and music domains
  show that CAPE significantly improves long-tail accuracy over the backbones and over re-ranking baselines that share its
  candidates, preserves or improves overall accuracy, and adds a small fraction of the latency.'
tldr: CAPE is a training-free plug-in that retrieves co-occurrence-supported tail items outside the beam and fuses co-occurrence
  evidence into ranking, restoring item-level memorization that shared-prefix generation lacks.
tldr_zh: CAPE 是免训练插件，在束搜索范围外召回有共现支撑的长尾物品并将共现证据融入排序，补足共享前缀生成缺失的物品级记忆能力。
setup:
  datasets: 'Amazon Industrial & Scientific, Office Products and Beauty (5-core), plus LastFM-1K (987 users, 40429 tracks).
    LastFM filtering thresholds: not reported. Histories contain the latest ten items.'
  split: 'I&S/Office: chronological 80/10/10; per-user versus global allocation not reported. LastFM/Beauty: last user interaction
    test, penultimate validation, earlier interactions training.'
  candidates: 'Reported ranking pool: 75 retrieved items, comprising 50 beam outputs plus the 25 highest-co-occurrence tail
    items outside the beam; not a sampled-negative pool. Full-catalog versus sampled-negative evaluation label and history-item
    exclusion: not reported. Tail metrics count all tail test cases, including unretrieved targets.'
  visibility: 'warm; no unseen-item protocol is defined. Tail is the bottom 80% by training frequency. Frequency, tail partition
    and user/event co-occurrence matrices use training data only; tokenizer exposure to test items: not reported.'
  sid: 'Inherited frozen backbone identifiers: three tokens/item, with a fourth collision-resolution token for a small number
    of LastFM items. TIGER uses residual-quantized identifiers. Numerical codebook sizes and MiniOneRec tokenizer construction:
    not reported. CAPE leaves tokenization unchanged.'
  inference_budget: 'Beam50 +25 co-occurrence tail candidates, one batched teacher-forcing pass, calibrated ranking with fixed
    top1; HR/NDCG@5/10. Validation-selected lambda=0.5 on I&S/Office and 5 on LastFM. FP32 on one A40; full-request means
    over first128 test users: 1.20s I&S, 1.22s Office, 1.55s LastFM-MiniOneRec, 0.19s LastFM-TIGER. Timing includes input
    preparation, beam, retrieval, teacher forcing, evidence and ranking after two-user warm-up; one-time loading takes 5-16s
    separately. Request batch size: not reported.'
  results_from: Paper's frozen-checkpoint inference comparisons/ablations. Released Amazon MiniOneRec checkpoints; LastFM
    continues SFT from that checkpoint; TIGER is trained from scratch with seeds42/43/44. Table2 main comparisons; Table3
    Amazon TIGER evaluated after CAPE was frozen. Re-rankers share the 75-item pool/top1 and validation rule; 10000 user-bootstrap
    replicates quantify paired differences. No borrowed baseline scores are identified.
