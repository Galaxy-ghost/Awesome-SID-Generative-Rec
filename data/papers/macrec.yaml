id: macrec
name: MACRec
title: Multi-aspect cross-modal quantization for generative recommendation
authors: Zhang et al.
year: 2026
venue: AAAI’26
links:
  arxiv: https://arxiv.org/abs/2511.15122
  code: https://github.com/zhangfw123/MACRec
problem: I
stage: Tokenization
representation: Text+Img
tokenization: Cross RQ
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Ctr.
inference: C-Beam
poi: false
tldr: MACRec applies cross-modal quantization over text and image features to build Semantic IDs with fewer conflicts, and
  adds implicit and explicit cross-modal alignment to generator training.
tldr_zh: MACRec 对文本与图像特征做跨模态量化以构建低冲突 SID，并在生成器训练中加入隐式与显式跨模态对齐。
evidence:
- field: problem
  where: https://arxiv.org/html/2511.15122v2#abstract1
  quote: remain limited in their ability to harness multimodal information
setup:
  datasets: 'Amazon Product Reviews (May 1996-October 2018): Musical Instruments (17,112 users / 6,250 items), Arts Crafts
    and Sewing (22,171 / 9,416), Video Games (42,259 / 13,839), with text and image features. Filtering rules: not reported.'
  split: Leave-one-out (following P5 and Hua et al. 2023); the exact validation/test allocation is not reported beyond the
    label.
  candidates: full catalog (full ranking across the entire item collection rather than sampling).
  visibility: warm; no unseen-item protocol is defined.
  sid: Separate text (LLaMA) and image (ViT-L/14) semantic IDs from RQ-VAEs with 4 levels x 256 codewords, aligned by layer-wise
    cross-modal contrastive and alignment losses. Conflicting IDs are resolved as in MQL4GRec by reassigning codewords according
    to item-codebook distances. Pre-resolution collision rates, e.g. Instruments text 2.38% and image 3.23%.
  inference_budget: 'Constrained beam search generates candidates in each modality, and the two modalities'' scores are averaged;
    beam width not reported. T5 backbone with 4-layer encoder and decoder. Hardware, inference batch size, and latency: not
    reported.'
  results_from: Table 2 (Instruments, Arts, Games; MQL4GRec run without its extra-category pre-training); Table 3 (ablations);
    Table 4 (item collision rates); Figures 3-4 (hyperparameters and code assignment).
setup_where:
  datasets: 'Datasets and date range: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p1; statistics: https://arxiv.org/html/2511.15122v2#Sx4.T1.'
  split: 'Leave-one-out named only: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p3.'
  candidates: 'Full ranking across the entire collection: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p3.'
  visibility: 'Standard split with no unseen-item protocol: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p3.'
  sid: 'Per-modality RQ-VAE, 4 levels x 256, conflict reassignment following MQL4GRec: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p4,
    https://arxiv.org/html/2511.15122v2#Sx3.SSx1.SSSx2.p2, https://arxiv.org/html/2511.15122v2#Sx3.SSx1.SSSx3.p5; collision
    rates: https://arxiv.org/html/2511.15122v2#Sx4.T4.'
  inference_budget: 'Constrained beam search per modality and score averaging: https://arxiv.org/html/2511.15122v2#Sx3.SSx2.SSSx3.p3;
    T5 backbone: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p4.'
  results_from: 'Main: https://arxiv.org/html/2511.15122v2#Sx4.T2; ablation: https://arxiv.org/html/2511.15122v2#Sx4.T3; collisions:
    https://arxiv.org/html/2511.15122v2#Sx4.T4; code distribution: https://arxiv.org/html/2511.15122v2#Sx4.F4; hyperparameters:
    https://arxiv.org/html/2511.15122v2#Sx4.F3.'
related:
- id: mql4grec
  relation: competitor
  note: MQL4GRec quantizes each modality into its own SIDs with cross-modal translation; MACRec adds layer-wise cross-modal
    contrastive learning in quantization and implicit and explicit alignment in generation, and reuses MQL4GRec's conflict
    resolution and ensemble.
  where: 'MACRec v2, baselines without pre-training: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p2 and https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p4;
    Table 2 and Table 4: https://arxiv.org/html/2511.15122v2#Sx4.T2 and https://arxiv.org/html/2511.15122v2#Sx4.T4; reused
    conflict resolution: https://arxiv.org/html/2511.15122v2#Sx3.SSx1.SSSx3.p5.'
- id: tiger
  relation: competitor
  note: TIGER quantizes a single text embedding; MACRec quantizes text and image separately and aligns them, while keeping
    TIGER's T5 backbone and constrained beam search.
  where: 'MACRec v2, baselines and backbone: https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p2 and https://arxiv.org/html/2511.15122v2#Sx4.SSx1.p4;
    Table 2: https://arxiv.org/html/2511.15122v2#Sx4.T2.'
- id: cid
  relation: competitor
  note: P5-CID uses collaborative clustering IDs for a P5 model; MACRec builds multimodal semantic IDs.
  where: 'MACRec v2, Table 2 baseline P5-CID: https://arxiv.org/html/2511.15122v2#Sx4.T2.'
- id: card
  relation: alternative
  note: CARD later renders image, title, and neighbors into one visual card and quantizes it with a non-uniform RQ-VAE, comparing
    against MACRec.
  where: 'Evidence is from the later CARD paper: baselines and Table 2: https://arxiv.org/html/2604.26427v1#S4.I1.i9.p1 and
    https://arxiv.org/html/2604.26427v1#S4.T2.'
changes:
  representation: none
  tokenization: primary
  backbone: none
  tokenizer: none
  objective:
    value: other
    quote: To enable the model to learn common features from different modalities, we employ multi-aspect alignment strategies,
      including both implicit alignment in the latent space and explicit alignment in the generative task.
    where: '2511.15122v2 #Sx1.I1.i2.p1.1；生成任务里的显式对齐'
  inference: none
modality:
