evidence:
- field: problem
  where: https://arxiv.org/html/2504.05730v2#abstract1
  quote: integrating both semantic and collaborative signals into item representations
  reason: 区分搜索和推荐的需求
setup:
  datasets: 'Semi-synthetic Amazon Electronics search/recommendation data; Commercial Chinese-app data, 10,000 users over
    two weeks. Filtering rules: not reported in paper.'
  split: not reported in paper; data-processing and train/validation/test details are delegated to code.
  candidates: 'Recommendation sampled: 99 random negatives excluding user-interacted items, plus the target. Search sampled:
    99 BM25-retrieved hard negatives, plus the target; search history exclusion: not reported.'
  visibility: 'warm; no unseen-item protocol is defined. Collaborative-encoder exposure to test items: not reported.'
  sid: 'Shared/task-specific RQ-VAE; sensitivity favors 2 shared + 2 task-specific codes. Numerical codebook size and collision
    handling: not reported; semantic/collaborative collision rates 0.18%/0.39%.'
  inference_budget: 'Constrained beam search; HR/NDCG@1/5/10. Beam width, hardware, inference batch size, latency: not reported
    in paper.'
  results_from: 'Original Tables 3/4: recommendation/search; Table 5: task ablations; Figures 4-7: identifier analyses.'
