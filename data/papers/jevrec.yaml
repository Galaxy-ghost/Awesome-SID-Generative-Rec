summary: Generative recommendation (GR) represents items as semantic identifiers (SIDs) and autoregressively generates the
  next item's SID from interaction history. However, most methods assign the same SID length to all items despite highly unequal
  interaction frequencies. This uniform design repeatedly incurs the cost of fine-grained codes for popular items, while shortening
  codes to reduce this cost also compresses the semantic representations of long-tail items. Inspired by the compact forms
  of frequent expressions in natural language, we propose JevRec to encode items as variable-length words and generate the
  next item from interaction context. Linguistic encoding retains frequency-dependent semantic prefixes from shared codebooks,
  producing shorter SIDs for popular items and richer descriptions for long-tail items. Yet predicting a sequence-level length
  and generating token-level content impose different optimization requirements that may conflict under a shared output head.
  Our Jev-like decision modeling component therefore predicts a length distribution with a dedicated head and generates content
  conditioned on length through a separate head while sharing the interaction-history representation. Experiments on three
  public datasets show that JevRec outperforms all compared baselines across the evaluated recommendation metrics. Further
  analyses show lower training and inference time than TIGER and reduced gradient conflict between length and content prediction.
tldr: JevRec gives frequent items shorter Semantic IDs and long-tail items longer ones, and predicts length and content with
  separate heads, instead of one ID length for all items.
setup:
  datasets: 'Amazon Reviews 2023: Musical Instruments, Industrial & Scientific, Video Games; exclude users/items with fewer
    than five interactions; maximum history 20 items.'
  split: 'Per-user chronological leave-one-out: latest interaction test, penultimate validation, earlier interactions training.'
  candidates: full catalog; no negative sampling.
  visibility: warm; no unseen-item protocol is defined. Frequency-based length assignment uses training interactions only;
    tokenizer fitting exposure to test items not reported.
  sid: 'Shared residual quantizer: 4 x 256; retain 2/3/4 semantic codes by training-frequency group and append one collision
    token, giving complete SID lengths 3/4/5. Within each group/prefix bucket collision tokens distinguish items; collision
    vocabulary capacity not reported.'
  inference_budget: Beam 10 per length branch; total recommendation budget 10, with K=5 from the same ranked list; length-probability
    quotas and joint-score merging, without a catalog-prefix trie. Baseline beam 50. Figure 4 reports total test-set inference
    speedups over TIGER of 1.05x/1.16x/1.04x on Instrument/Scientific/Game. Inference hardware, batch size and per-request
    latency not reported.
  results_from: 'Table 2: main three-dataset comparison; most baseline results adopted from Zhong et al. (2025a), as stated
    in Appendix C. Table 3: JevRec ablations; Figure 4: runtime/convergence.'
