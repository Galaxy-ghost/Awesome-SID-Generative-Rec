id: jevrec
name: JevRec
title: 'JevRec: Linguistic Encoding with Jev-like Decision Modeling for LLM-based Generative Recommendation'
authors: Zhong et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2610.36937
  code: null
problem: V
stage: Tokenization
representation: Text
tokenization: Freq. R-KM
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP + Aux.
inference: Length-Quota Beam
poi: false
tldr: JevRec gives frequent items shorter Semantic IDs and long-tail items longer ones, and predicts length and content with
  separate heads, instead of one ID length for all items.
tldr_zh: JevRec 为高频物品分配较短 SID、为长尾物品分配较长 SID，并用独立预测头分别预测长度与内容，替代固定长度编码。
setup:
  datasets: 'Amazon Reviews 2023: Musical Instruments, Industrial & Scientific, Video Games; exclude users/items with fewer
    than five interactions; maximum history 20 items.'
  split: 'Per-user chronological leave-one-out: latest interaction test, penultimate validation, earlier interactions training.'
  candidates: full catalog; no negative sampling.
  visibility: warm; no unseen-item protocol is defined. Frequency-based length assignment uses training interactions only;
    tokenizer fitting exposure to test items not reported.
  sid: 'Shared residual quantizer: 4 x 256; retain 2/3/4 semantic codes by training-frequency group and append one collision
    token, giving complete SID lengths 3/4/5. Within each group/prefix bucket collision tokens distinguish items; collision
    vocabulary capacity not reported.'
  inference_budget: Beam 10 per length branch; total recommendation budget 10, with K=5 from the same ranked list; length-probability
    quotas and joint-score merging, without a catalog-prefix trie. Baseline beam 50. Figure 4 reports total test-set inference
    speedups over TIGER of 1.05x/1.16x/1.04x on Instrument/Scientific/Game. Inference hardware, batch size and per-request
    latency not reported.
  results_from: 'Table 2: main three-dataset comparison; most baseline results adopted from Zhong et al. (2025a), as stated
    in Appendix C. Table 3: JevRec ablations; Figure 4: runtime/convergence.'
setup_where:
  datasets: https://arxiv.org/html/2610.36937v1#S4.SS1.p1
  split: https://arxiv.org/html/2610.36937v1#S4.SS1.p2
  candidates: https://arxiv.org/html/2610.36937v1#S4.SS1.p2
  visibility: 'https://arxiv.org/html/2610.36937v1#S4.SS1.p1 ; #A2.p1 ; #S3.SS3.p2'
  sid: 'https://arxiv.org/html/2610.36937v1#S3.SS3.p2 ; #S3.SS3.p3 ; #S3.SS3.p4 ; #A3.SS1.p1'
  inference_budget: 'https://arxiv.org/html/2610.36937v1#S3.SS6 ; #A3.SS1.p1 ; #S4.F4 ; #S4.SS5.p1'
  results_from: 'https://arxiv.org/html/2610.36937v1#S4.T2 ; #S4.T3 ; #S4.F4 ; #A3.p1'
related:
- id: tiger
  relation: competitor
  note: TIGER uses fixed-length RQ-VAE SIDs; JevRec truncates shared residual-quantizer prefixes by item frequency and explicitly
    predicts target length.
  where: 'JevRec v1, Sections 3.3/4.1 and Table 2: https://arxiv.org/html/2610.36937v1#S3.SS3; https://arxiv.org/html/2610.36937v1#S4.SS1.p4;
    https://arxiv.org/html/2610.36937v1#S4.T2.'
- id: letter
  relation: competitor
  note: LETTER adds collaborative information and diversity constraints to learned tokenization; JevRec allocates SID length
    by interaction frequency.
  where: 'JevRec v1, Sections 3.3/4.1 and Table 2: https://arxiv.org/html/2610.36937v1#S3.SS3; https://arxiv.org/html/2610.36937v1#S4.SS1.p4;
    https://arxiv.org/html/2610.36937v1#S4.T2.'
- id: actionpiece
  relation: competitor
  note: ActionPiece merges contextually co-occurring action features; JevRec uses shared semantic codebooks with frequency-dependent
    prefix lengths.
  where: 'JevRec v1, Sections 3.3/4.1 and Table 2: https://arxiv.org/html/2610.36937v1#S3.SS3; https://arxiv.org/html/2610.36937v1#S4.SS1.p4;
    https://arxiv.org/html/2610.36937v1#S4.T2.'
- id: pctx
  relation: alternative
  note: Pctx personalizes tokenization using user history; JevRec assigns context-invariant SID lengths from global training
    frequencies.
  where: 'JevRec v1, Sections 2/3.2/3.3: https://arxiv.org/html/2610.36937v1#S2.p1; https://arxiv.org/html/2610.36937v1#S3.SS2.p1;
    https://arxiv.org/html/2610.36937v1#S3.SS3.p1.'
