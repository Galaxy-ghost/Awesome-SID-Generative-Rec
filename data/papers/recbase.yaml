id: recbase
name: RecBase
title: 'Recbase: Generative foundation model pretraining for zero-shot recommendation'
authors: Zhou et al.
year: 2025
venue: EMNLP’25
links:
  arxiv: https://arxiv.org/abs/2509.03131
  code: https://github.com/reczoo/RecBase
problem: VI
stage: Training
representation: Text
tokenization: Curr. RQ
backbone: Dec-Only
tokenizer: Fixed
objective: NTP
inference: Beam
poi: false
summary: 'Abstract: "cross-domain generalization is hindered by a fundamental mismatch between language-centric pretraining
  and the recommendation task".'
evidence:
- field: problem
  where: https://arxiv.org/html/2509.03131v1#abstract1 (Abstract)
  quote: cross-domain generalization is hindered by a fundamental mismatch between language-centric pretraining and the recommendation
    task
setup:
  datasets: 'Pre-training on 15 datasets and testing on 8 unseen datasets from RecBench (MIND, MovieLens, MicroLens, Goodreads,
    Yelp, Steam, H&M, HotelRec as test sets). Totals: training 4,595,003 items / 35,047,682 users; fine-tuning 1,005,745 /
    5,098,084; test 623,615 / 145,975. Length-based filtering: users with fewer than 15 interactions are removed (e.g. AmazonToys)
    and histories over 2,500 interactions are truncated (e.g. LastFM, PixelRec); thresholds for the other datasets: not reported.'
  split: 'Dataset-level: pre-train on training datasets and evaluate zero-shot on held-out datasets; a fine-tuning study adds
    in-domain data for five test datasets. Within-dataset split rules: not reported.'
  candidates: 'n/a for ranking candidates: user-item pairs are scored and evaluated by AUC (RecBench protocol); how negative
    pairs are formed is not restated.'
  visibility: 'Zero-shot: test datasets and their items are unseen by the generator; whether the CL-VAE tokenizer was trained
    on test-dataset items: not reported. Fine-tuned setting: warm.'
  sid: Concept IDs from a curriculum-learning RQ-VAE (CL-VAE) with 4 levels x 2,048 codes over NV-Embed-v2 text embeddings,
    with codebook reinitialization against collapse. Collisions are measured as a conflict rate (Figure 2) but a resolution
    rule is not reported.
  inference_budget: 'Scores items from the logits over concept IDs (no beam search described); Qwen2-style decoder (Base:
    24 layers, hidden 1,024; Large: 28 layers, hidden 1,536; vocabulary 20,000). Hardware, inference batch size, and latency:
    not reported.'
  results_from: Table 1 (zero-shot AUC on 8 datasets versus P5, RecGPT, and LLM baselines); Table 3 (zero-shot versus fine-tuned);
    Table 4 (ablations of CL-VAE components); Figure 2 (codebook size and levels).
setup_where:
  datasets: 'RecBench and dataset roles: https://arxiv.org/html/2509.03131v1#S4.p1 and https://arxiv.org/html/2509.03131v1#S4.SS1.p1;
    statistics: https://arxiv.org/html/2509.03131v1#S4.T2; length filtering: https://arxiv.org/html/2509.03131v1#A2.SS2.SSS0.Px2.p1.'
  split: 'Dataset-level split between pre-training and zero-shot test: https://arxiv.org/html/2509.03131v1#S4.p1; fine-tuning
    study: https://arxiv.org/html/2509.03131v1#S4.T3.'
  candidates: 'User-item pair scoring with AUC: https://arxiv.org/html/2509.03131v1#S4.SS1.p1 and https://arxiv.org/html/2509.03131v1#S4.SS1.p3.'
  visibility: 'Test datasets are unseen in pre-training: https://arxiv.org/html/2509.03131v1#S4.p1 and https://arxiv.org/html/2509.03131v1#S4.SS1.p3.'
  sid: 'CL-VAE with 4 levels x 2048 over NV-Embed-v2: https://arxiv.org/html/2509.03131v1#S4.SS2.p1; curriculum and reinitialization:
    https://arxiv.org/html/2509.03131v1#S3.SS2.p2; conflict rate study: https://arxiv.org/html/2509.03131v1#S5.SS2.p1.'
  inference_budget: 'Logit-based ranking of concept IDs: https://arxiv.org/html/2509.03131v1#S4.SS1.p2; model sizes: https://arxiv.org/html/2509.03131v1#S4.SS2.p2.'
  results_from: 'Zero-shot: https://arxiv.org/html/2509.03131v1#S3.T1; fine-tuning: https://arxiv.org/html/2509.03131v1#S4.T3;
    ablation: https://arxiv.org/html/2509.03131v1#S5.T4; codebook study: https://arxiv.org/html/2509.03131v1#S5.SS2.p1.'
related:
- id: tiger
  relation: alternative
  note: TIGER builds RQ-VAE semantic IDs per dataset for next-item generation; RecBase pre-trains a recommendation foundation
    model over concept IDs shared across many domains.
  where: 'RecBase v1, Section 2.2 cites Rajput et al. (2023): https://arxiv.org/html/2509.03131v1#S2.SS2.p1.'
- id: lc-rec
  relation: alternative
  note: LC-Rec adapts an existing LLM to one domain's item indices; RecBase pre-trains from scratch on recommendation corpora
    for zero-shot transfer.
  where: 'RecBase v1, Section 2.2: https://arxiv.org/html/2509.03131v1#S2.SS2.p1.'
