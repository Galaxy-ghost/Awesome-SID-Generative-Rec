related:
- id: das
  relation: competitor
  note: DAS aligns SIDs with collaborative signals by multi-view contrastive learning; ADC-SID adds adaptive alignment strength
    and dynamic weighting to denoise behavior signals for long-tail items.
  where: 'ADC-SID v3, Section 4.1.2 baselines: https://arxiv.org/html/2510.25622v3#S4.I3.i4.p1; Table 2: https://arxiv.org/html/2510.25622v3#S4.T2.'
- id: letter
  relation: competitor
  note: LETTER fuses semantic and collaborative signals in one RQ-VAE tokenizer with fixed regularization; ADC-SID uses mixture-of-quantization
    experts with popularity-aware alignment.
  where: 'ADC-SID v3, Section 4.1.2 baselines: https://arxiv.org/html/2510.25622v3#S4.I3.i5.p1; Table 2: https://arxiv.org/html/2510.25622v3#S4.T2.'
- id: mme-sid
  relation: competitor
  note: MM-RQ-VAE produces separate collaborative, textual, and visual SIDs with contrastive alignment; ADC-SID adds shared
    and specific experts and a learned per-token weighting of behavioral SIDs.
  where: 'ADC-SID v3, Section 4.1.2 baselines: https://arxiv.org/html/2510.25622v3#S4.I3.i6.p1; Table 2: https://arxiv.org/html/2510.25622v3#S4.T2.'
- id: tiger
  relation: competitor
  note: The RQ-VAE baseline is attributed to TIGER's content-only semantic IDs; ADC-SID injects denoised collaborative information.
  where: 'ADC-SID v3, Section 4.1.2 describes the RQ-VAE baseline as TIGER: https://arxiv.org/html/2510.25622v3#S4.I3.i1.p1;
    Table 2 row RQ-VAE: https://arxiv.org/html/2510.25622v3#S4.T2.'
- id: rpg
  relation: competitor
  note: The OPQ baseline is attributed to RPG's unordered content codes; ADC-SID builds hierarchical behavior-content codes
    instead.
  where: 'ADC-SID v3, Section 4.1.2 describes the OPQ baseline as RPG: https://arxiv.org/html/2510.25622v3#S4.I3.i2.p1; Table
    2 row OPQ: https://arxiv.org/html/2510.25622v3#S4.T2.'
