setup:
  datasets: 'Industrial: Southeast Asian e-commerce advertising platform, October 2024 to May 2025, about 30 million users
    and 40 million ads (Table 1: 35,154,135 users, 48,106,880 items), average sequence length 128; filtering rules not reported.
    Public: Amazon Product Reviews Beauty (May 1996-September 2014); generative retrieval uses 5-core filtering of users and
    items, 22,363 users and 12,101 items; ranking uses the rating data with ratings above 3 as positives.'
  split: 'Beauty generative retrieval: chronological sequences capped at 20 items; the train/validation/test allocation is
    not reported. Beauty ranking: chronological 90%/10% train/test split. Industrial offline split: not reported. Online:
    5-day A/B test with 10% random user traffic.'
  candidates: not reported (full catalog versus sampled evaluation candidates); retrieval uses Recall and NDCG at N=50 and
    100.
  visibility: warm; no unseen-item protocol is defined. The long-tail analysis stratifies items by 30-day impression counts
    (top 25% versus bottom 25%).
  sid: 'Industrial: SID length 10 with codebook size printed as "3,00" (shared 2, text 2, visual 2, behavioral 4 codes for
    ADC-SID). Public: SID length 6 with codebook size 100 (shared 1, text 1, visual 1, behavioral 3). The online system uses
    an 8-token SID. Collision handling: not reported.'
  inference_budget: 'Generative retrieval uses the REG4REC encoder-decoder; ranking uses PPNet. Beam width, hardware, inference
    batch size, and latency: not reported.'
  results_from: Table 2 (generative retrieval and discriminative ranking on industrial data and Beauty, with quantization
    metrics); Table 3 (industrial ablation); Table 4 and Figure 5 (hyperparameters); Figure 6 (popular versus long-tail AUC);
    Table 5 (5-day online A/B test).
