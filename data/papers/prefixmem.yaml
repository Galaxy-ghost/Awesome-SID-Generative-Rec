id: prefixmem
name: PrefixMem
title: LLMs Need Encoders for Semantic IDs Too
authors: Chen et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2606.00324
  code: null
problem: III
stage: Backbone
representation: MM
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: Beam
poi: false
tldr: PrefixMem gives an LLM a pre-trainable Semantic ID encoder built from prefix n-gram memory tables, so each token gets
  a prefix-conditioned representation instead of a plain vocabulary embedding.
tldr_zh: PrefixMem 用前缀 n-gram 记忆表为 LLM 构建可预训练的 SID 编码器，使每个 token 获得以前缀为条件的表示，替代普通词表嵌入。
setup:
  datasets: 'Pinterest: about 10M engagement subsequences (<=32 events), 240M item occurrences, tens of millions of unique
    items. Filtering rules not reported.'
  split: Evaluation uses later dates and disjoint users; exact dates/fractions not reported. On 100K held-out examples, a
    random engagement position is the target and preceding events are history.
  candidates: not reported; retrieval evaluates exact ground-truth SID membership in generated beams.
  visibility: warm; no unseen-item protocol is defined. RQ-VAE codebook trained on the full billion-item catalog; evaluation
    users are disjoint, not explicitly evaluation items.
  sid: 'RQ-VAE on PinCLIP multimodal embeddings: 5 levels x 2048 codes. Collisions acknowledged; full-SID recall matches codes
    without resolving item collisions.'
  inference_budget: 'Qwen3-1.7B default; five-step SID beam search with K=20/30/50/100; TIGER extension uses beam 10. PrefixMem:
    4 hash heads, 2M rows, dimension 256, active at levels 4/5. Hardware, inference batch size, measured latency not reported.'
  results_from: 'Original Tables 2/3: teacher-forcing/initialization; Table 4: full-SID recall; Tables 9/10: LLM/TIGER transfer;
    Table 11: SID-Transformer comparison. Same-corpus with/without-encoder experiments.'
setup_where:
  datasets: 'Section 4.1: https://arxiv.org/html/2606.00324v1#S4.SS1.p1'
  split: 'Sections 4.1/4.3: https://arxiv.org/html/2606.00324v1#S4.SS1.p2 and https://arxiv.org/html/2606.00324v1#S4.SS3.p1'
  candidates: 'Section 4.3 defines beam SID matching, not sampled item negatives: https://arxiv.org/html/2606.00324v1#S4.SS3.SSS0.Px2.p1'
  visibility: 'Section 4.1 has user/time holdout but no unseen-item holdout: https://arxiv.org/html/2606.00324v1#S4.SS1.p1
    and https://arxiv.org/html/2606.00324v1#S4.SS1.p2'
  sid: 'Sections 4.1/4.3: https://arxiv.org/html/2606.00324v1#S4.SS1.p1 and https://arxiv.org/html/2606.00324v1#S4.SS3.p2'
  inference_budget: 'Sections 4.2/4.3 and Table 10: https://arxiv.org/html/2606.00324v1#S4.SS2.p1 and https://arxiv.org/html/2606.00324v1#S4.SS2.p2
    and https://arxiv.org/html/2606.00324v1#S4.SS3.SSS0.Px2.p1 and https://arxiv.org/html/2606.00324v1#S5.T10'
