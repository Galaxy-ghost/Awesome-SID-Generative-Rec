  sid: 'Sections II-A and IV-A: https://arxiv.org/html/2607.12425v1#S2.SS1.p2 and https://arxiv.org/html/2607.12425v1#S4.SS1.SSS1.p1
    and https://arxiv.org/html/2607.12425v1#S4.SS1.SSS4.p1'
