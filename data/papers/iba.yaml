id: iba
name: IBA
title: 'Where Reasoning Matters: Rethinking Latent Reasoning in Semantic ID-based Generative Recommendation'
authors: Yang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2607.12425
  code: null
problem: V
stage: Backbone
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP → (NTP + Aux.)
inference: C-Beam
poi: false
tldr: IBA allocates latent reasoning steps across Semantic ID positions by information gain, giving more refinement to the
  informative early positions, instead of a fixed number of steps per token.
tldr_zh: IBA 按信息增益在各 SID 位置之间分配隐式推理步数，将更多计算分给信息量更大的前序位置，替代每个位置固定步数的做法。
setup:
  datasets: Amazon Instruments and Beauty; MicroLens. Users with fewer than 5 interactions removed; training histories capped
    at 20 items.
  split: Leave-one-out, one test target per user; exact validation/test allocation not reported.
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Information-gain prior estimated from training interactions only;
    tokenizer exposure to test items not reported.
  sid: 'RQ-VAE on Sentence-T5 text embeddings: 4 tokens; codebook sizes and collision handling not reported.'
  inference_budget: Trie-constrained beam 20, maximum 10 generated tokens; 6 latent refinement steps with prior (3,2,1,0).
    NVIDIA RTX 4090 24GB; Instruments generation time 24.61 ms/user (TIGER 20.99, uniform 8-step refinement 25.78). Inference
    batch size not reported.
  results_from: 'Original Table II: TIGER/LETTER plus IBA and baselines; Tables III/IV: schedules/ablations; Table V: generation
    efficiency.'
