id: forge
name: FORGE
title: 'Forge: Forming semantic identifiers for generative retrieval in industrial datasets'
authors: Fu et al.
year: 2025
venue: KDD’26
links:
  arxiv: https://arxiv.org/abs/2509.20904
  code: https://github.com/selous123/al_sid
problem: psb
stage: n/a
representation: Text+Img+CF
tokenization: RQ-VAE
backbone: Dec-Only / Enc-Dec
tokenizer: Fixed
objective: NTP
inference: Dyn. Beam
poi: false
summary: 'Abstract: "their SID assessment typically relies on costly GR training".'
tldr: 'FORGE is a benchmark and industrial dataset, not a new recommender: it compares Semantic ID construction strategies,
  adds metrics that assess IDs without generator training, and releases Taobao data.'
tldr_zh: FORGE 是基准与工业数据集而非新推荐模型：对比不同 SID 构建策略，提出无需训练生成器即可评估 ID 的指标，并开源淘宝数据集。
evidence:
- field: problem
  where: https://arxiv.org/html/2509.20904v3#abstract1
  quote: their SID assessment typically relies on costly GR training
setup:
  datasets: 'Amazon 2023 Clothing (2,524,981 users / 714,957 items / 12,530,806 interactions; filtering not reported) and
    AL-GR, released from Taobao (131M users / 251M items / 14B interactions): 40 million behavior records sampled per day
    over ten consecutive days, sequences truncated to 100 items, with multimodal item embeddings and i2i relations.'
  split: 'AL-GR: temporal stages S1 (4 days), S2 (3 days), S3 (3 days); 100,000 samples from the day after each stage are
    used for evaluation; training uses the first clicked item as target, evaluation uses all interacted items on the page
    view. Amazon split: not reported.'
  candidates: Beam search generates 1,200 candidate SIDs (3 x 8192 example), mapped back to items; top-K items by score are
    checked against the page-view targets (HR@20 to HR@1000). Full catalog versus sampled candidates is not otherwise stated.
  visibility: warm; no unseen-item protocol is defined. Evaluation uses the next day after each training stage.
  sid: 'Benchmark of configurations: main 3 levels x 8,192 codewords (also 2 x 32,768), RQ-VAE with 64-dimensional codebook
    over CN-CLIP multimodal features. Collisions are handled by optional post-processing that caps items per SID: KNN-based
    reassignment (thresholds 25, 10, 5) or Random-5 random assignment of the last codeword; a no-collision-handling variant
    (noco) is also tested.'
  inference_budget: 'Beam search producing 1,200 candidate SIDs; generators T5-Base (0.2B), Qwen2.5-0.5B, and Qwen2.5-3B.
    Training uses 16 (T5) or 32 (Qwen2.5-0.5B) PPU-ZW810E GPUs; inference hardware, batch size, and latency: not reported.'
  results_from: Table 3 (AL-GR SID configurations across stages S1-S3); Table 4 (Amazon); Table 5 (relation sources); Table
    9 (encoding methods including RQ-Kmeans); Table 11 (generative search); Table 12 (architectures and model sizes); Figures
    3-4 (Embedding HitRate, Gini, and other SID metrics).
setup_where:
  datasets: 'Datasets: https://arxiv.org/html/2509.20904v3#S3.SS3.p1 and https://arxiv.org/html/2509.20904v3#S3.T1; AL-GR
    construction and truncation: https://arxiv.org/html/2509.20904v3#S3.SS3.SSS1.p2 and https://arxiv.org/html/2509.20904v3#S3.SS3.SSS1.p3.'
  split: 'Stage split and next-day evaluation: https://arxiv.org/html/2509.20904v3#S3.SS3.SSS1.p2; targets: https://arxiv.org/html/2509.20904v3#S3.SS3.SSS1.p3;
    Amazon split not found in Sections 3-4.'
  candidates: '1,200 candidate SIDs from beam search mapped back to items: https://arxiv.org/html/2509.20904v3#S3.SS4.p1.'
  visibility: 'Next-day temporal evaluation; unseen-item generalization is cited, not tested: https://arxiv.org/html/2509.20904v3#S3.SS3.SSS1.p2
    and https://arxiv.org/html/2509.20904v3#S2.SS2.p1.'
  sid: 'Main 3 x 8192 and 2 x 32768: https://arxiv.org/html/2509.20904v3#S4.SS1.SSS1.p1 and https://arxiv.org/html/2509.20904v3#S4.T11;
    collision post-processing: https://arxiv.org/html/2509.20904v3#S3.SS1.SSS3.p1 and https://arxiv.org/html/2509.20904v3#S4.SS1.SSS4.p3;
    RQ-VAE config: https://arxiv.org/html/2509.20904v3#A1.T15.'
  inference_budget: 'Beam candidates: https://arxiv.org/html/2509.20904v3#S3.SS4.p1; models and GPUs (training): https://arxiv.org/html/2509.20904v3#A1.SS2.p1
    and https://arxiv.org/html/2509.20904v3#A1.T14.'
  results_from: 'Results: https://arxiv.org/html/2509.20904v3#S4.T3, https://arxiv.org/html/2509.20904v3#S4.T4, https://arxiv.org/html/2509.20904v3#S4.T5,
    https://arxiv.org/html/2509.20904v3#S4.T11, https://arxiv.org/html/2509.20904v3#S4.T12; encoding comparison: https://arxiv.org/html/2509.20904v3#S4.SS1.SSS6.p1.'
related:
- id: tiger
  relation: predecessor
  note: TIGER introduced RQ-VAE semantic IDs for recommendation; FORGE benchmarks how modality, encoding, and collision post-processing
    choices for such SIDs affect retrieval at industrial scale.
  where: 'FORGE v3, Section 2.2 cites Rajput et al. (2023) as the SID adopted in recommendation: https://arxiv.org/html/2509.20904v3#S2.SS2.p1;
    Section 3.1.2 RQ-VAE encoding: https://arxiv.org/html/2509.20904v3#S3.SS1.SSS2.p1.'
- id: onerec
  relation: alternative
  note: OneRec encodes items with RQ-Kmeans; FORGE compares this encoding against its RQ-VAE base and Final configurations.
  where: 'FORGE v3, Section 4.1.6 cites Deng et al. (2025) for RQ-Kmeans and compares it in Table 9: https://arxiv.org/html/2509.20904v3#S4.SS1.SSS6.p1.'
- id: onerec-v2
  relation: alternative
  note: OneRec-V2 is cited for the same RQ-Kmeans encoding route evaluated in FORGE's encoding comparison.
  where: 'FORGE v3, Section 4.1.6 cites Zhou et al. (2025): https://arxiv.org/html/2509.20904v3#S4.SS1.SSS6.p1.'
