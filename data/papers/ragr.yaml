id: ragr
name: RAGR
title: 'RAGR: Review-Augmented Generative Recommendation'
authors: Zhang et al.
year: 2026
venue: arXiv’26
links:
  arxiv: https://arxiv.org/abs/2605.17267
  code: https://github.com/Zhang-Yingyi/TKDE_RAGR
problem: I
stage: Training
representation: Text
tokenization: RQ-VAE
backbone: Enc-Dec
tokenizer: Fixed
objective: NTP → DPO
inference: Beam† / –
poi: false
tldr: RAGR interleaves item Semantic IDs and review Semantic IDs chronologically in the user sequence and uses DPO to favor
  item tokens at prediction positions, instead of modeling item-only sequences.
tldr_zh: RAGR 在用户序列中按时间交错排列物品 SID 与评论 SID，并用 DPO 在预测位置偏好物品 token，替代仅建模物品序列的做法。
setup:
  datasets: Amazon Beauty, Sports and Outdoors, Toys and Games, with historical review text; remove users/items with fewer
    than five interactions; maximum history 20, truncating oldest interactions.
  split: 'Per-user chronological leave-one-out: last interaction test, second last validation, remaining interactions training.'
  candidates: not reported
  visibility: warm; no unseen-item protocol is defined. Historical reviews are retained; tokenizer fitting exposure to test
    items not reported.
  sid: 'RQ-VAE: 4 x 256, 32-dimensional codewords, shared item/review token space. Default tokenizer fits item text only;
    collision handling not reported.'
  inference_budget: 'Autoregressive item-SID prediction; HIT/NDCG@5/10/20. Decoding algorithm/beam width, inference batch
    size and latency not reported. General experiment server: 8 RTX PRO 6000 96GB GPUs; inference-specific allocation not
    reported.'
  results_from: 'Original Table II: TIGER/LETTER with and without RAGR, means over seeds 42/43/44; all baselines trained/evaluated
    with the common split/protocol. Table III: ablations; Tables IV-V: tokenizer efficiency/collisions. No baseline-result
    reuse stated.'
