id: qt-mob
name: QT-Mob
title: Enhancing Large Language Models for Mobility Analytics with Semantic Location Tokenization
authors: Chen et al.
year: 2025
venue: KDD’25
links:
  arxiv: https://arxiv.org/abs/2506.11109
  code: https://github.com/shadowfall09/QT-Mob
problem: I
stage: Tokenization
representation: Text+Geo
tokenization: RQ-VAE
backbone: Dec-Only
tokenizer: Fixed
objective: Multi-task NTP
inference: C-Beam
poi: true
summary: 四 token 位置编号是 next-location 生成目标，语义构码与文本双向对齐有明确全文证据。
setup:
  datasets: Foursquare NYC/SG, April 2012-February 2013; Singapore cellular trajectories, November 2022, using 400m grids.
    Remove locations with <5 visits; group records into 24h trajectories and discard trajectories with <3 records.
  split: 'Per-user chronological trajectories: first 70% train, next 10% validation, last 20% test.'
  candidates: not reported; the unseen-location experiment follows LLM-Move's zero-shot ranking setting without detailing
    its candidate pool.
  visibility: 'Unseen-location probe: sample 100 test locations and remove all training trajectories containing them. Unseen
    by generator; whether unseen by tokenizer too: not reported.'
  sid: 4 RQ-VAE levels x 256 codes, code dimension 32; collision handling not reported.
  inference_budget: Constrained beam 15; Hit/NDCG@1/5/10. Inference hardware, batch size and latency not reported; four V100
    GPUs are specified for training.
  results_from: 'Original Tables 2/3: next-location prediction/mobility recovery; Table 10: unseen locations. Five-run averages;
    compared baselines use their papers'' default parameter settings.'
setup_where:
  datasets: 'Section 5.1.1: https://arxiv.org/html/2506.11109v1#S5.SS1.SSS1.p1'
  split: 'Section 5.1.1: https://arxiv.org/html/2506.11109v1#S5.SS1.SSS1.p1'
  candidates: 'Section 5.1 and Appendix D.4 do not specify catalog enumeration or candidate sampling: https://arxiv.org/html/2506.11109v1#S5.SS1
    and https://arxiv.org/html/2506.11109v1#A4.SS4.p1'
  visibility: 'Appendix D.4: https://arxiv.org/html/2506.11109v1#A4.SS4.p1'
  sid: 'Section 5.1.4: https://arxiv.org/html/2506.11109v1#S5.SS1.SSS4.p1'
  inference_budget: 'Sections 5.1.3/5.1.4: https://arxiv.org/html/2506.11109v1#S5.SS1.SSS3.p1 and https://arxiv.org/html/2506.11109v1#S5.SS1.SSS4.p1'
  results_from: 'Section 5.1.3/5.1.4 and Tables 2/3/10: https://arxiv.org/html/2506.11109v1#S5.SS1.SSS3.p1 and https://arxiv.org/html/2506.11109v1#S5.SS1.SSS4.p1
    and https://arxiv.org/html/2506.11109v1#S5.T2 and https://arxiv.org/html/2506.11109v1#S5.T3 and https://arxiv.org/html/2506.11109v1#A4.T10'
related:
- id: lc-rec
  relation: predecessor
  note: Its cited RQ-VAE tokenization approach informs QT-Mob's hierarchical location tokens.
  where: 'QT-Mob v1, Section 4.2, citing Zheng et al. (2024): https://arxiv.org/html/2506.11109v1#S4.SS2.p1; https://arxiv.org/html/2506.11109v1#S4.SS2.p4.'
