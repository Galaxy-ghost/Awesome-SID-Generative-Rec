  split: 'Beauty ranking: chronological 90% train/10% test; ratings >3 positive, <=3 negative. Retrieval and industrial offline
    splits not reported. Online A/B: July 6-August 6, 2025; treatment 10% random user traffic.'
  candidates: 'Retrieval: not reported; ranking evaluates labeled ratings, candidate retrieval n/a.'
  visibility: warm; no unseen-item protocol is defined.
  sid: '6 positions: 2 shared, 2 text-specific, 2 visual-specific; codebook size 100 (Beauty), 3000 (industrial). Collision
    handling not reported.'
  inference_budget: Retrieval K=5/10 using HeterRec; ranking uses PPNet. Decoding budget, hardware, inference batch size,
    and latency not reported.
  results_from: 'Original Table 1: tokenizer comparisons under HeterRec retrieval/PPNet ranking; Section 5: online A/B versus
    deployed ItemID system.'
