  description_zh: 类目等结构化属性、地理空间特征与协同过滤信号融合（POI 场景）。
- value: Attr+Geo+CF†
  description: Structured item attributes, geographic information, and collaborative signals (inferred).
  description_zh: 结构化属性、地理信息与协同信号融合（由配置推断）。
- value: CF
  description: Collaborative filtering signal.
  description_zh: 纯协同过滤交互信号。
- value: Cross-Dom
