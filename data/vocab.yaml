  description_zh: 递归 DMoN 图划分，或基于图重构损失的图自编码残差量化。
- value: Ref.-RQ
  description: Reference-vector RQ variant.
  description_zh: 引入参考锚点向量的残差量化。
- value: SRBQ
  description: Semantic Residual Balanced Quantization
  description_zh: 语义残差均衡量化（Semantic Residual Balanced Quantization）。
- value: Self-Imp.
  description: Self-improving tokenization refined iteratively from the generator's learned representations.
  description_zh: 训练过程中根据生成模型内部表征周期性自优化的编号。
- value: Self-Sup. ID
  description: Semantic identifiers learned through self-supervision.
  description_zh: 通过自监督任务直接学习的离散语义标识符。
- value: Shared/Spec. RQ
  description: Residual quantization using shared and task-specific codebooks.
  description_zh: 由跨域共享码本与领域专有码本组成的残差量化。
- value: SimHash
  description: Locality-sensitive hashing with random hyperplanes.
  description_zh: 基于随机超平面的局部敏感哈希（SimHash）编码。
- value: Skeleton R-KM
  description: Residual k-means organized around a shared semantic skeleton.
  description_zh: 围绕共享语义骨架组织的残差 k-means。
- value: Soft Reassign. RQ
  description: Residual quantization with differentiable soft code reassignment.
  description_zh: 带可微软重分配机制的残差量化。
- value: Soft-RQ
  description: Soft-routed RQ variant.
  description_zh: 软路由残差量化变体。
- value: Spectral Clus.
  description: Spectral clustering-based tokenization.
  description_zh: 基于谱聚类的层级编号。
- value: Subspace RQ
  description: Residual quantization applied separately within embedding subspaces.
  description_zh: 在嵌入子空间内分别执行的残差量化。
- value: Term-ID
  description: Standardized textual keyword identifiers generated from item metadata.
  description_zh: 由物品元数据提炼的标准化文本关键词标识符。
- value: TokenMoE
  description: Mixture-of-experts tokenizer with shared and domain-specific experts.
  description_zh: 包含共享专家与领域专家的混合专家编号器。
- value: Tree
  description: Tree-structured hierarchical codebook tokenization.
  description_zh: 树状层级码本编号。
- value: Tree-Clus.
  description: Balanced k-ary tree clustering tokenization.
  description_zh: 均衡 k 叉树聚类编号。
- value: Unified RQ
  description: Domain-unified residual quantization.
  description_zh: 多领域共享空间的统一残差量化。
- value: n/a
  description: Not applicable to this method.
  description_zh: 不适用于该方法。
- value: –
  description: Not reported in the paper.
  description_zh: 论文未报告。
backbone:
- value: Dec-Only
  description: Decoder-only.
  description_zh: 仅解码器（Decoder-only）自回归架构。
- value: Dec-Only / Enc-Dec
  description: Decoder-only and encoder–decoder backbone variants.
  description_zh: 涵盖仅解码器与编码器-解码器两种骨干变体。
- value: Dec-Only / Non-AR
  description: Decoder-only autoregressive and non-autoregressive prediction variants.
  description_zh: 涵盖仅解码器自回归与非自回归并行预测两种变体。
- value: Dec-Only†
  description: Decoder-only autoregressive backbone (inferred).
  description_zh: 仅解码器自回归架构（由配置推断）。
- value: Disc.
  description: A discriminative recommendation model that scores candidates.
  description_zh: 对候选物品打分的判别式推荐骨干。
- value: Disc. / Enc-Dec
  description: Discriminative scoring and encoder–decoder generation variants.
  description_zh: 涵盖判别式打分与编码器-解码器生成两种变体。
- value: Dual Enc-Dec
  description: Shared encoder paired with two parallel decoders for dual token streams.
  description_zh: 共享编码器配合双并行解码器的双流架构。
- value: Enc-Dec
  description: Encoder-decoder.
  description_zh: 编码器-解码器（Encoder-decoder）架构。
- value: Enc-Dec / Dec-Only
  description: Evaluated on both Encoder-Decoder and Decoder-Only backbones.
  description_zh: 同时在编码器-解码器与仅解码器两种骨干上验证。
- value: Enc-Dec / Dec-Only (AR); Non-AR (PR)
  description: Encoder–decoder or decoder-only autoregressive variants, and parallel non-autoregressive variants.
  description_zh: 自回归分支采用编码器-解码器或仅解码器，并行分支采用非自回归骨干。
- value: Enc-Dec / Lazy Dec-Only
  description: Encoder–decoder and lazy decoder-only backbone variants.
  description_zh: 涵盖编码器-解码器与延迟解码（Lazy Decoder-only）两种变体。
- value: Enc-Dec†
  description: Encoder–decoder backbone (inferred).
  description_zh: 编码器-解码器架构（由配置推断）。
- value: Enc-Dec† / Dec-Only
  description: Evaluated on both Encoder-Decoder and Decoder-Only backbones.
  description_zh: 同时在推断的编码器-解码器与仅解码器骨干上验证。
- value: Enc-Dec† / Dec-Only†
  description: Evaluated on both Encoder-Decoder and Decoder-Only backbones.
  description_zh: 同时在编码器-解码器与仅解码器骨干上验证（由配置推断）。
- value: Enc-MLP
  description: A history encoder followed by MLP-based prediction heads.
  description_zh: 序列历史编码器后接多层感知机（MLP）预测头。
- value: Encoder
  description: Bidirectional encoder backbone without autoregressive token generation.
  description_zh: 双向编码器骨干，不进行逐位自回归解码。
- value: Encoder (Non-AR)
  description: Bidirectional encoder trained for non-autoregressive parallel prediction.
  description_zh: 面向非自回归并行预测训练的双向编码器。
- value: HeterRec
  description: HeterRec, the named recommendation backbone used in the paper.
  description_zh: 论文命名的异构推荐骨干网络 HeterRec。
- value: Lazy Dec-Only
  description: A lazy decoder-only architecture that concentrates decoder computation on target generation.
  description_zh: 将计算集中在目标生成阶段的延迟仅解码器架构。
- value: Lazy Dec-Only†
  description: A lazy decoder-only backbone inferred from the adopted model.
  description_zh: 由所沿用基座推断的延迟仅解码器架构。
- value: Non-AR
  description: Non-autoregressive.
  description_zh: 非自回归（Non-autoregressive）并行预测架构。
- value: Non-AR / Enc-Dec
  description: Non-autoregressive and encoder–decoder backbone variants.
  description_zh: 涵盖非自回归与编码器-解码器两种骨干变体。
- value: n/a
  description: Not applicable to this method.
  description_zh: 不适用于该方法。
- value: –
  description: Not reported in the paper.
  description_zh: 论文未报告。
tokenizer:
- value: Altern.
  description: Tokenizer and generator are updated in turns.
  description_zh: 编号器与生成器在训练过程中交替迭代更新。
- value: Altern.†
  description: Tokenizer and generator updated in alternation (inferred).
  description_zh: 编号器与生成器交替迭代更新（由配置推断）。
- value: Fixed
  description: SIDs are built first and not changed while the generator trains.
  description_zh: 先独立训练并冻结编号器，生成器训练期间 SID 保持不变。
- value: Fixed†
  description: Tokenizer frozen before generator training (inferred).
  description_zh: 生成器训练期间冻结编号器（由配置推断）。
- value: Joint
  description: The generator loss updates the tokenizer directly.
  description_zh: 推荐生成损失通过可微路径直接反传更新编号器。
- value: n/a
  description: Not applicable to this method.
  description_zh: 不适用于该方法。
- value: –
  description: Not reported in the paper.
  description_zh: 论文未报告。
objective:
- value: (MTP + Masked Rec.) → MTP
  description: Joint multi-token prediction and masked reconstruction, followed by multi-token prediction alone.
  description_zh: 先联合训练多 token 预测与掩码重构，再单独微调多 token 预测。
- value: (NTP + Ctr.) → RL
  description: Joint next-token and contrastive training, followed by a reinforcement-learning stage; retained losses are
    specified per paper.
  description_zh: 先联合训练下一 token 预测与对比损失，再执行强化学习后训练。
- value: (NTP† / (NTP + Aux.)†) → KL-weighted OPD
  description: Inferred next-token-based initialization variants followed by KL-weighted on-policy distillation.
  description_zh: 先进行下一 token 预训练初始化，再执行 KL 加权的同策略蒸馏（OPD）。
- value: Discrim.
  description: Scores items; does not generate SIDs.
  description_zh: 判别式候选物品打分损失，不直接生成 SID。
- value: Discrim. / NTP
  description: Discriminative scoring or next-token prediction in different configurations.
  description_zh: 不同配置下分别采用判别式打分损失或下一 token 预测损失。
- value: Dual-level Flow Ctr.
  description: Contrastive training at token and complete-identifier levels in a flow-based model.
  description_zh: 流模型中在 token 级与完整标识符级同时施加的双层对比损失。
- value: MTP
  description: Predicts several codes in parallel at once.
  description_zh: 多 token 并行预测损失（Multi-Token Prediction），一次前向同时预测多个码位。
- value: MTP + Aux.
  description: Multi-token prediction jointly optimized with auxiliary objectives.
  description_zh: 多 token 预测与辅助损失联合优化。
- value: MTP + Ctr.
  description: MTP plus a contrastive loss.
  description_zh: 多 token 预测结合对比学习损失。
- value: MTP + Ctr. + Aux.
  description: Multi-token prediction jointly optimized with contrastive and auxiliary objectives.
  description_zh: 多 token 预测、对比损失与辅助目标联合优化。
- value: MTP + Rel.MSE
  description: Multi-token prediction jointly optimized with a mean-squared-error objective on relations.
  description_zh: 多 token 预测结合关系均方误差（MSE）损失。
- value: Masked
  description: Masks part of the codes and reconstructs them (includes masked diffusion).
  description_zh: 掩码部分码位并重构（含离散掩码扩散目标）。
- value: Masked → RL (→ Masked KD for Fast)
  description: Masked-prediction pretraining, followed by reinforcement learning and optional masked-prediction distillation
    for a faster variant.
  description_zh: 先做掩码预测预训练，再接强化学习对齐，快速变体进一步做掩码蒸馏。
- value: Multi-task NTP
  description: The same NTP loss over several tasks.
  description_zh: 在多个对齐或推荐子任务上联合优化下一 token 预测损失。
- value: Multi-task NTP / (Text NTP + MTP + Rank); Lang. RL after SFT
  description: Multi-task next-token prediction, or text next-token prediction with multi-token and ranking objectives; language-task
    reinforcement learning follows supervised fine-tuning.
  description_zh: 多任务下一 token 预测，或文本 NTP 加多 token 预测与排序损失；SFT 后接语言任务强化学习。
- value: Multi-task NTP†
  description: Multi-task next-token prediction (inferred).
  description_zh: 多任务下一 token 预测（由配置推断）。
- value: Multi-task NTP† / NTP
  description: Inferred multi-task next-token prediction or standard next-token prediction across variants.
  description_zh: 不同变体下采用推断的多任务下一 token 预测或标准下一 token 预测。
- value: Multi-task NTP† / NTP†
  description: Inferred multi-task or single-task next-token-prediction initialization in different backbones.
  description_zh: 不同骨干下采用推断的多任务或单任务下一 token 预测初始化。
- value: NTP
  description: Next-token prediction loss only; continuing from a pretrained LLM (SFT) also counts as NTP.
  description_zh: 标准下一 token 预测（Next-Token Prediction）交叉熵损失；基于预训练 LLM 的指令微调（SFT）亦归入此类。
- value: NTP + Aux.
  description: NTP plus another auxiliary loss.
  description_zh: 下一 token 预测结合辅助正则或对齐损失。
- value: NTP + Ctr.
  description: NTP plus a contrastive loss.
  description_zh: 下一 token 预测结合对比学习损失。
- value: NTP + Dense
  description: NTP plus dense-vector prediction.
  description_zh: 离散 SID 的下一 token 预测结合稠密向量回归/对比损失。
- value: NTP + PV-RSPO + Rank + Aux.
  description: Next-token prediction jointly optimized with prefix-value RSPO, ranking, and auxiliary objectives.
  description_zh: 下一 token 预测联合前缀价值 RSPO、排序损失与辅助损失。
- value: NTP + RL
  description: Next-token prediction jointly optimized with reinforcement learning.
  description_zh: 下一 token 预测与强化学习目标联合训练。
- value: NTP + Rank
  description: NTP plus a ranking loss.
  description_zh: 下一 token 预测结合显式排序损失。
- value: NTP + Rank + Aux. / MTP + Rank + Aux.
  description: Autoregressive or parallel token prediction jointly optimized with ranking and auxiliary objectives.
  description_zh: 自回归或并行 token 预测联合排序损失与辅助损失。
- value: NTP / NTP + Aux.
  description: Next-token prediction alone or jointly optimized with auxiliary objectives.
  description_zh: 单独使用下一 token 预测，或与辅助损失联合优化。
- value: NTP → (NTP + Aux.)
  description: Next-token prediction, followed by joint optimization of next-token prediction and auxiliary objectives.
  description_zh: 先进行下一 token 预测预训练，再联合优化下一 token 预测与辅助目标。
- value: NTP → (NTP + DPO)
  description: Next-token prediction, followed by joint next-token prediction and direct preference optimization.
  description_zh: 先进行下一 token 预测微调，再联合优化下一 token 预测与直接偏好优化（DPO）。
- value: NTP → (RL + Rank)
  description: Next-token prediction, followed by joint reinforcement-learning and ranking objectives.
  description_zh: 先进行下一 token 预测微调，再联合优化强化学习与排序目标。
- value: NTP → DPO
  description: NTP, then preference optimization.
  description_zh: 先进行下一 token 预测微调，再执行直接偏好优化（DPO）。
- value: NTP → RL
  description: NTP, then reinforcement learning (GRPO, GBPO, etc.).
  description_zh: 先进行下一 token 预测微调，再执行强化学习（如 GRPO、GBPO 等）。
- value: NTP → RL†
  description: Next-token prediction followed by reinforcement learning (inferred).
  description_zh: 先进行下一 token 预测微调，再执行强化学习（由配置推断）。
- value: NTP†
  description: Next-token prediction loss (inferred).
  description_zh: 下一 token 预测损失（由配置推断）。
- value: NTP† / NTP → RL
  description: Inferred next-token training in one configuration, or next-token training followed by reinforcement learning
    in another.
  description_zh: 一种配置采用下一 token 预测，另一种配置后接强化学习微调。
- value: Next-item CE + Cons. KD + Rank KD
  description: Next-item cross-entropy jointly optimized with consistency and ranking distillation.
  description_zh: 下一物品交叉熵联合一致性知识蒸馏与排序蒸馏。
- value: n/a
  description: Not applicable to this method.
  description_zh: 不适用于该方法。
- value: –
  description: Not reported in the paper.
  description_zh: 论文未报告。
inference:
- value: Beam
  description: Autoregressive beam search over Semantic ID tokens.
  description_zh: 在 SID token 上执行自回归束搜索（Beam search）。
- value: Beam+Agg.
  description: Beam search followed by aggregation of predictions that refer to the same item.
  description_zh: 束搜索后对指向同一物品的多条标识符预测聚合得分。
- value: Beam+Geo-Filter
  description: Beam search with geographically restricted candidates.
  description_zh: 结合地理位置范围过滤候选的束搜索。
- value: BeamFusion
  description: Joint decoding combining autoregressive SID beam search with dense nearest-neighbor scoring.
  description_zh: 融合自回归 SID 束搜索得分与稠密最近邻检索得分的联合解码。
- value: Beam†
  description: Autoregressive beam search (inferred).
  description_zh: 自回归束搜索（由配置推断）。
- value: Beam† / C-Beam
  description: Inherited beam search or prefix-constrained beam search across configurations.
  description_zh: 不同配置下采用自回归束搜索或前缀约束束搜索。
- value: Beam† / C-Beam†
  description: Beam search or constrained beam search in the respective inherited configurations.
  description_zh: 所沿用基座中的束搜索或约束束搜索。
- value: Beam† / –
  description: Inherited beam search in one configuration; decoding not reported in the other.
  description_zh: 一种配置沿用束搜索，另一种配置未报告解码方式。
- value: Bid-Aware Beam
  description: Beam search whose scores incorporate bid information.
  description_zh: 在束搜索打分中融合广告出价（Bid）信息的解码。
- value: C-Beam
  description: Constrained beam search.
  description_zh: 受合法物品集合约束的束搜索（Constrained beam search）。
- value: C-Beam / Scoring
  description: Constrained beam search or direct item scoring, depending on the configuration.
  description_zh: 依配置采用约束束搜索或直接候选打分。
- value: CF-Guided C-Beam
  description: Constrained beam search guided by collaborative signals.
  description_zh: 由协同过滤信号引导剪枝与打分的约束束搜索。
- value: CoT
  description: Chain-of-thought before the SID.
  description_zh: 先生成思维链（Chain-of-Thought）推理文本，再输出目标 SID。
- value: CoT+Beam
  description: Reasoning followed by beam-search decoding.
  description_zh: 显式推理后接束搜索解码。
- value: CoT+C-Beam
  description: Reasoning followed by constrained beam-search decoding.
  description_zh: 显式推理后接合法前缀约束束搜索。
- value: CoT+Fuzzy Match
  description: Reasoning-guided identifier generation followed by fuzzy matching to available items.
  description_zh: 推理引导生成标识符后通过模糊匹配映射至真实物品。
- value: CoT+Greedy
  description: Reasoning with greedy decoding.
  description_zh: 显式推理配合贪心解码。
- value: Diff.
  description: Diffusion decoding.
  description_zh: 迭代去噪扩散解码。
- value: Diff.+Beam
  description: Diffusion-based decoding combined with beam search.
  description_zh: 离散扩散解码结合束搜索。
- value: Diff.+Legalize
  description: Diffusion-based decoding followed by mapping generated codes to valid items.
  description_zh: 扩散生成码序列后映射合法化为目录中的真实物品。
- value: Div. Beam
  description: Beam search with an explicit diversity mechanism.
  description_zh: 引入显式多样性重排或惩罚项的束搜索。
- value: Div. C-Beam
  description: Constrained beam search with an explicit diversity mechanism.
  description_zh: 引入显式多样性机制的约束束搜索。
- value: Dual Beam
  description: Beam-search decoding in two branches with merged candidates.
  description_zh: 在双分支上分别束搜索并融合候选结果。
- value: Dyn. Beam
  description: Dynamic beam search.
  description_zh: 按步或按样本动态调整束宽的束搜索。
- value: Ensemble
  description: Score aggregation across multiple randomized token segmentations or decoding paths.
  description_zh: 对同一历史的多种随机切分或多路径解码结果聚合排序。
- value: FM-Index+Agg.
  description: FM-index-constrained generation followed by identifier-to-item score aggregation.
  description_zh: 基于 FM-index 约束生成并聚合指向同一物品的多标识符得分。
- value: FP8+RecoGEM
  description: FP8 inference with the RecoGEM execution framework.
  description_zh: 采用 FP8 低精度量化与 RecoGEM 推理引擎部署解码。
- value: Fusion
  description: Fusion of candidate scores decoded from parallel token branches.
  description_zh: 融合并行双解码分支输出的候选得分。
- value: GRC+Beam
  description: Generation, reflection and correction combined with beam search.
  description_zh: 生成-反思-修正（GRC）配合束搜索解码。
- value: Graph
  description: Iterative decoding over a proximity graph of valid item Semantic IDs.
  description_zh: 在合法物品 SID 近邻图上做迭代图搜索解码。
- value: Greedy
  description: Select the highest-scoring next token at each decoding step.
  description_zh: 每步直接选取概率最高 token 的贪心解码。
- value: Hybrid
  description: Hybrid retrieval combining generative SID decoding with dense or co-occurrence retrieval.
  description_zh: 结合生成式 SID 解码与稠密/共现检索的混合召回。
- value: ISD Beam
  description: Item-supported beam search.
  description_zh: 由用户侧物品打分支撑前缀保留的束搜索（Item-Supported Beam）。
- value: Length-Quota Beam
  description: Beam search with recommendation quotas allocated across output lengths.
  description_zh: 按可变 SID 长度分配候选配额的束搜索。
- value: Non-AR
  description: Single-pass non-autoregressive parallel decoding.
  description_zh: 单次前向非自回归并行解码。
- value: PRM-Beam
  description: Process-reward-model guided beam search.
  description_zh: 由过程奖励模型（PRM）逐步引导的束搜索。
- value: PV-Beam+Rerank
  description: Prefix-value-guided beam search followed by reranking.
  description_zh: 前缀价值引导束搜索后接候选重排。
- value: Scoring
  description: Direct candidate scoring without step-by-step SID generation.
  description_zh: 直接计算候选物品得分，不逐位生成 SID。
- value: Scoring / Beam
  description: Direct candidate scoring or autoregressive beam search across configurations.
  description_zh: 不同配置下采用候选直接打分或自回归束搜索。
- value: Scoring / Beam†
  description: Discriminative candidate scoring vs. generative beam search.
  description_zh: 判别式候选打分与生成式束搜索对比。
- value: Scoring+Rerank
  description: Score candidate items and then rerank a selected subset.
  description_zh: 先对候选集打分筛选，再对头部子集精细重排。
- value: Self-Draft+Hash
  description: Self-drafted candidate generation with hash-set validity checking.
  description_zh: 自草稿投机生成配合哈希集合合法性校验。
- value: Sess. Beam
  description: Session-wise beam search generating a multi-item slate in one pass.
  description_zh: 单次生成包含多个物品的整段会话列表（Session-wise beam search）。
- value: Spec. Dec.
  description: Speculative decoding.
  description_zh: 草稿模型与目标模型协同的投机解码（Speculative decoding）。
- value: Trie/C-Beam
  description: Prefix-tree (trie) constrained beam search restricted to valid catalog SIDs.
  description_zh: 基于前缀树（Trie）约束的束搜索，仅允许解码真实存在的物品前缀。
- value: Vec. C-Beam
  description: Vectorized constrained beam search.
  description_zh: 向量化并行前缀约束束搜索。
- value: n/a
  description: Not applicable to this method.
  description_zh: 不适用于该方法。
- value: –
  description: Not reported in the paper.
  description_zh: 论文未报告。
modality:
- value: Text
  description: Textual item metadata, titles, descriptions, categories, or text-formatted attributes fed to the tokenizer.
  description_zh: 输入编号器的物品文本元数据、标题、描述、类目或格式化为文本的属性。
  is_content: true
- value: Img
  description: Visual item images or image frames fed to the tokenizer.
  description_zh: 输入编号器的物品图像或视觉帧。
  is_content: true
- value: Audio
  description: Audio tracks or acoustic spectrograms fed to the tokenizer.
  description_zh: 输入编号器的音频曲目或声学频谱特征。
  is_content: true
- value: Video
  description: Video streams or video-level representations fed to the tokenizer.
  description_zh: 输入编号器的视频流或视频级特征。
  is_content: true
- value: MM
  description: Multimodal item representations whose specific constituent modalities are not disaggregated in the paper.
  description_zh: 论文统称为多模态、未拆分具体模态组成的构码输入表征。
  is_content: true
- value: CF
  description: Collaborative filtering or user–item interaction signals fed to the tokenizer.
  description_zh: 输入编号器的协同过滤或用户-物品交互信号。
  is_content: false
- value: Attr
  description: Structured tabular or categorical item attributes fed to the tokenizer without text serialization.
  description_zh: 未拼成自由文本、作为结构化或类别特征输入编号器的物品属性。
  is_content: false
- value: Geo
  description: Geographic coordinates, spatial grids, or location features fed to the tokenizer.
  description_zh: 输入编号器的地理坐标、空间网格或位置特征。
  is_content: false
- value: Time
  description: Interaction timestamps or temporal features fed to the tokenizer.
  description_zh: 输入编号器的交互时间戳或时间特征。
  is_content: false
- value: n/a
  description: No discrete SID tokenizer is built (items are represented as continuous vectors or plain text).
  description_zh: 不构建离散 SID 编号器（物品以连续向量或纯文本表示）。
  is_content: false
- value: Other
  description: Tokenizer input outside the signals above, or not stated in the paper; `modality_other` says what it is.
  description_zh: 不属于以上信号，或论文没有写明的构码输入；具体内容见 `modality_other`。
  is_content: false
modality_groups:
- value: Text
  aspect: Content
  aspect_zh: 内容
  name: Text
  name_zh: 纯文本
  rule: branch_content_exact
  target: Text
  description: At least one tokenizer branch uses `Text` as its only content modality (`Img`, `Audio`, `Video`, `MM` absent
    in that branch).
  description_zh: 至少一个构码分支的内容模态只有 `Text`（该分支不含 `Img`、`Audio`、`Video`、`MM`）。
- value: Single non-text
  aspect: Content
  aspect_zh: 内容
  name: Single non-text
  name_zh: 单一非文本
  rule: branch_content_single_excluding
  exclude:
  - Text
  - MM
  description: At least one tokenizer branch uses exactly one content modality and it is neither `Text` nor composite `MM`
    (`Img`, `Audio`, or `Video`).
  description_zh: 至少一个构码分支的内容模态只有一种，且不是 `Text` 或未细分的 `MM`（即 `Img`、`Audio` 或 `Video`）。
- value: Multimodal
  aspect: Content
  aspect_zh: 内容
  name: Multimodal
  name_zh: 多模态
  rule: branch_content_multi_or_any
  include_any:
  - MM
  description: At least one tokenizer branch combines two or more content modalities, or uses `MM`.
  description_zh: 至少一个构码分支包含两种以上内容模态，或包含 `MM`。
- value: No content
  aspect: Content
  aspect_zh: 内容
  name: No content
  name_zh: 无内容模态
  rule: all_branches_no_content
  exclude:
  - Other
  - n/a
  description: No tokenizer branch uses any content modality (`Text`, `Img`, `Audio`, `Video`, `MM`), and inputs across all
    branches contain no `Other` (nor `n/a`).
  description_zh: 所有构码分支都不含内容模态（`Text`、`Img`、`Audio`、`Video`、`MM`），且所有分支合起来不含 `Other`（及 `n/a`）。
- value: CF only
  aspect: Collaborative
  aspect_zh: 协同
  name: CF only
  name_zh: 仅协同信号
  rule: union_exact
  target: CF
  description: Across all tokenizer branches combined, `CF` is the only input signal.
  description_zh: 所有构码分支合起来只有 `CF`。
- value: With CF
  aspect: Collaborative
  aspect_zh: 协同
  name: With CF
  name_zh: 含协同信号
  rule: union_with_other
  target: CF
  description: Across all tokenizer branches combined, inputs include `CF` together with at least one other modality or signal.
  description_zh: 所有构码分支合起来含 `CF`，且还有其他模态或信号。
- value: Attr
  aspect: Context
  aspect_zh: 上下文
  name: Attr
  name_zh: 结构化属性
  rule: union_contains
  target: Attr
  description: Across all tokenizer branches combined, inputs include structured item attributes (`Attr`).
  description_zh: 所有构码分支合起来含结构化属性（`Attr`）。
- value: Geo
  aspect: Context
  aspect_zh: 上下文
  name: Geo
  name_zh: 地理空间
  rule: union_contains
  target: Geo
  description: Across all tokenizer branches combined, inputs include geographic or spatial features (`Geo`).
  description_zh: 所有构码分支合起来含地理或空间特征（`Geo`）。
- value: Time
  aspect: Context
  aspect_zh: 上下文
  name: Time
  name_zh: 时间特征
  rule: union_contains
  target: Time
  description: Across all tokenizer branches combined, inputs include temporal features (`Time`).
  description_zh: 所有构码分支合起来含时间特征（`Time`）。
- value: Other
  aspect: Other
  aspect_zh: 其他
  name: Other
  name_zh: 其他
  rule: union_contains
  target: Other
  description: At least one branch reads an input outside the signals above, or one the paper does not state; each entry
    says what it is.
  description_zh: 至少一个分支的输入不属于以上信号，或论文没有写明；每篇写出具体内容。
