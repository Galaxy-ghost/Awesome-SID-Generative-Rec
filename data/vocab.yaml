# Allowed vocabulary values for data/papers/<id>.yaml, aligned with Table 1 in the survey paper (main.tex and supplementary.tex).
# Checked by scripts/check.py. Problem names, stage names, modality groups, domains, settings, and bilingual descriptions are defined here only.

problem:
- value: psb
  name: Paradigms, Systems and Benchmarks
  description: Baseline (TIGER), end-to-end multi-stage paradigms, open-source frameworks, benchmarks, and diagnostic resources.
  description_zh: 基线范式（TIGER）、端到端多阶段工业框架、开源代码库、评测基准与诊断工具。
- value: I
  name: Informativeness
  description: Do the SIDs, or the model reading them, carry the collaborative and multimodal signals recommendation needs?
  description_zh: SID 或读取它的模型是否充分携带了推荐所需的协同、多模态与时空信号？
- value: II
  name: Uniqueness and Validity
  description: Does every item get its own SID, every generated SID name a real item, and the codebook get used evenly?
  description_zh: 每个物品是否拥有无冲突的唯一 SID，生成的 SID 是否对应真实物品，码本是否均衡利用？
- value: III
  name: SID–Model Alignment
  description: Can the generator read, write, and reason over SIDs, and do the tokenizer and generator work toward the same
    goal?
  description_zh: 生成模型能否理解并推理离散 SID，编号器与生成器的优化目标是否一致？
- value: IV
  name: Utility
  description: Are training and search aimed at what users and the platform value, rather than at token likelihood?
  description_zh: 训练目标与解码搜索是否面向用户真实偏好与平台业务价值，而非单纯拟合下一 token 似然？
- value: V
  name: Efficiency
  description: Can it be trained and served within latency and cost budgets?
  description_zh: 训练与在线服务能否满足实际的延迟、显存与吞吐预算？
- value: VI
  name: Generalization
  description: Does it still work for new items, new domains, and shifting interests?
  description_zh: 面对冷启动新物品、跨领域迁移与动态兴趣漂移时能否保持泛化？
stage:
- value: Representation
  name: Representation
  description: The primary design change sits in the Representation stage.
  description_zh: 核心改动位于物品表征（Representation）阶段。
- value: Tokenization
  name: Tokenization
  description: The primary design change sits in the Tokenization stage.
  description_zh: 核心改动位于离散编号（Tokenization）阶段。
- value: Backbone
  name: Generative Backbone
  description: The primary design change sits in the Generative Backbone stage.
  description_zh: 核心改动位于生成骨干（Backbone）阶段。
- value: Training
  name: Training
  description: The primary design change sits in the Training stage (Tokenizer update schedule or training Objective).
  description_zh: 核心改动位于训练（Training）阶段（编号器更新策略或训练损失）。
- value: Inference
  name: Inference
  description: The primary design change sits in the Inference stage.
  description_zh: 核心改动位于推理与解码（Inference）阶段。
- value: n/a
  name: Not Applicable
  description: Used for Paradigms, Systems and Benchmarks (psb) rows that are not assigned to a single stage.
  description_zh: 用于范式、系统与基准（psb）类工作，不归入单一流程阶段。
representation:
