  description: Discriminative scoring objective vs. generative next-token prediction objective (LGSID).
- value: Dual-level Flow Ctr.
  description: 平均概率速度参数化的两层item-negative contrastive目标：token概率乘积构成的SID分数与whole-SID表示相似度同时优化。Eq9替代逐码hard-label CE
- value: MTP
  description: Predicts several codes in parallel at once.
