- value: MTP + Rel.MSE
  description: 并行码位NLL联合token embedding空间与quantization codebook空间的pairwise cosine relation MSE
- value: Masked
  description: Masks part of the codes and reconstructs them (includes masked diffusion).
- value: Masked → RL (→ Masked KD for Fast)
