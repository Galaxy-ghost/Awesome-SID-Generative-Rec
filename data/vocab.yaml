# Allowed label values, one list per label field. scripts/validate.py reads this file.
# Add a value here before using it in data/papers/*.yaml. "description" is optional.
# Values are written exactly as in Table 1 (e.g. "NTP → DPO", "–"); the inferred mark (†)
# is stored in the label's "inferred" flag, not in the value.

problem:
- value: I
  name: Informativeness
  name_zh: 信息不足（协同与多模态信号缺失或冲突）
  description: Do the SIDs, or the model reading them, carry the collaborative and multimodal signals recommendation needs?
- value: II
  name: Uniqueness and Validity
  name_zh: 唯一性与合法性（同码碰撞、出词表与码本塌缩）
  description: Does every item get its own SID, every generated SID name a real item, and the codebook get used evenly?
- value: III
  name: SID–Model Alignment
  name_zh: SID 与模型对齐（接口、推理与目标失配）
  description: Can the generator read, write, and reason over SIDs, and do the tokenizer and generator work toward the same goal?
- value: IV
  name: Utility
  name_zh: 效用对齐（排序、多样性与业务收益）
  description: Are training and search aimed at what users and the platform value, rather than at token likelihood?
- value: V
  name: Efficiency
  name_zh: 训练与推理效率（时延、吞吐与计算开销）
  description: Can it be trained and served within latency and cost budgets?
- value: VI
  name: Generalization
  name_zh: 泛化能力（冷启动、动态目录与跨域迁移）
  description: Does it still work for new items, new domains, and shifting interests?
- value: n/a
  description: 'Not labeled by rule: paradigm/system/benchmark records, and records merged into another record.'
- value: pending
  description: Not labeled yet.
