  description: Text representations combined with geographic features and collaborative signals.
  description_zh: 文本表征结合地理空间特征与协同信号。
- value: Text+Img
  description: Text and visual item representations.
  description_zh: 文本与视觉图像表征。
- value: Text+Img+Attr
  description: Text, images, and structured item attributes.
  description_zh: 文本、图像与结构化物品属性。
- value: Text+Img+Audio+CF
  description: Text, visual, and audio content combined with collaborative signals.
  description_zh: 文本、视觉、音频内容结合协同过滤信号。
- value: Text+Img+CF
  description: Text and image representations combined with collaborative signals.
  description_zh: 文本、图像表征结合协同过滤信号。
- value: Text+Img+CF†
  description: Text, image, and collaborative representations (inferred).
  description_zh: 文本、图像与协同信号融合表征（由配置推断）。
- value: Text+Img+Geo
  description: Text, images, and geographic information.
  description_zh: 文本、图像与地理空间信息。
- value: Text+Img+Geo+CF
  description: Text, image, geographic, and collaborative representations.
  description_zh: 文本、图像、地理空间与协同信号融合表征。
- value: Text+Img+Geo†
  description: Text, image, and geographic representations (inferred).
  description_zh: 文本、图像与地理空间表征（由配置推断）。
- value: Text+Img†
