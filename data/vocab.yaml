evidence_grade:
- value: Measured
  description: Directly computed or reproduced under a unified protocol and script.
- value: Reported
  description: Empirically reported in a controlled experiment or ablation table in the cited paper.
- value: Open
  description: Lacks a controlled 2x2 orthogonal experiment under a shared backbone and protocol.
claim_kind:
- value: design-stated
  description: Architectural assumption, problem motivation, or design choice stated by the authors (grade is null).
- value: ablation-finding
  description: Empirical finding from a controlled ablation in the paper (grade in evidence_grade).
- value: boundary-case
  description: Empirical boundary condition or counterexample reported in the paper (grade in evidence_grade).
- value: deduction
  description: Analytical or interface-level deduction from pipeline definitions (grade is null).
- value: selection-rule
  description: Engineering selection rule conditional on pipeline constraints (grade is null).
- value: adjudicated-label
  description: Dual-blind adjudicated taxonomy classification (grade is null).
label_status:
- value: unverified
  description: Not yet checked against primary paper locations, or marked as inferred (†).
- value: migrated
  description: Migrated from the Table 1 / Table 2 source-location appendices prior to dual-blind repo review.
- value: verified
  description: Directly supported by source and verified against the primary paper.
