- value: (NTP + Ctr.) → RL
  description: 先联合 NTP 与 in-batch contrastive，随后加入 RL。RL 阶段仍联合原两损失；箭头右侧只标新增 RL，不重复写保留的 NTP/Ctr.。
- value: (NTP† / (NTP + Aux.)†) → KL-weighted OPD
  description: 初始化A/B=TIGER/REG4Rec：前者NTP、后者NTP+category辅助监督，按点名继承标†
- value: Discrim.
  description: Scores items; does not generate SIDs.
