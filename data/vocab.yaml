tokenization:
- value: Align. RQ
  description: Residual quantization trained with alignment objectives.
  description_zh: 带对齐目标训练的残差量化。
- value: BDQ
  description: Bit-Decomposable Quantizer.
  description_zh: 比特可分解量化器（Bit-Decomposable Quantizer）。
- value: Bal. VQ+KM
  description: Balanced tokenization combining vector quantization and k-means clustering.
  description_zh: 结合向量量化与均衡 k-means 聚类的编号方法。
- value: C-RQ
  description: Contrastive residual quantization.
  description_zh: 对比学习残差量化（Contrastive RQ）。
- value: CART
  description: Collaborative-Aware Refined Tokenization.
  description_zh: 协同感知精化编号（Collaborative-Aware Refined Tokenization）。
- value: CF-Aligned MM RQ
  description: Multimodal residual quantization aligned with collaborative signals.
  description_zh: 与协同信号对齐的多模态残差量化。
- value: Casc. RQ
  description: Cascaded sparse-to-dense residual quantization.
  description_zh: 稀疏到稠密级联残差量化。
- value: CoBa RQ-VAE
  description: Collaborative and Balanced RQ-VAE.
  description_zh: 兼顾协同对齐与码本均衡的 RQ-VAE。
- value: Contr. RQ
  description: Residual quantization trained with contrastive objectives.
  description_zh: 采用对比损失训练的残差量化。
- value: Cross RQ
  description: Cross-modal residual quantization.
  description_zh: 跨模态交互残差量化。
- value: Curr. RQ
  description: Curriculum-trained hierarchical residual quantization.
  description_zh: 课程式训练的层级残差量化。
- value: DSRQ
  description: Dual-stream residual quantization.
  description_zh: 双流残差量化（Dual-Stream Residual Quantization）。
- value: Direct SID Heads
  description: Prediction heads that directly assign semantic-ID codes.
  description_zh: 直接输出语义 ID 码位的预测头。
- value: Dual H-KM
  description: Dual-source hierarchical k-means over behavioral and semantic embeddings.
  description_zh: 分别在行为与语义嵌入上构建的双源层级 k-means。
- value: Dual RQ
  description: Dual residual quantization over two representation streams or entity types.
  description_zh: 面向双表征流或双侧实体的双路残差量化。
- value: Dual RQ-VAE
  description: Two residual-quantized variational autoencoders for separate representation streams.
  description_zh: 面向两条独立表征流的双路 RQ-VAE。
- value: Dyn. KM+Disamb.
  description: Dynamically updated k-means codes combined with disambiguation codes.
  description_zh: 动态更新的 k-means 编码加冲突消歧后缀码。
- value: Flow+PQ
  description: Flow-based representation transformation followed by product quantization.
  description_zh: 归一化流表征变换后接乘积量化（PQ）。
- value: Freq. R-KM
  description: Frequency-aware residual k-means tokenization.
  description_zh: 频率感知的残差 k-means 编号。
- value: GAOQ
  description: Globally Aligned Orthogonal Quantization.
  description_zh: 全局对齐正交量化（Globally Aligned Orthogonal Quantization）。
- value: Geo-Idx
  description: Identifiers constructed from geographic indexing.
  description_zh: 基于地理网格或空间索引构建的标识符。
- value: Geo-Idx+RQ
  description: Geographic indexing combined with residual quantization.
  description_zh: 地理空间索引前缀结合残差量化。
- value: Geo-Prefix+HClus
  description: Geographic prefixes combined with hierarchical clustering codes.
  description_zh: 地理空间前缀结合层级聚类编码。
- value: Geo-Prefix+RQ-VAE
  description: Geographic prefixes combined with residual-quantized variational codes.
  description_zh: 地理空间前缀结合 RQ-VAE 残差码。
- value: Graph RQ-VAE
  description: A graph-informed residual-quantized variational autoencoder.
  description_zh: 融合图结构传播的残差量化变分自编码器。
- value: H-KM
  description: Hierarchical k-means.
  description_zh: 层级 k-means 聚类（Hierarchical k-means）。
- value: HARQ
  description: Hyperbolic Adaptive Residual Quantization.
  description_zh: 双曲空间自适应残差量化（Hyperbolic Adaptive RQ）。
- value: Hier. RQ
  description: Hierarchically supervised residual quantization.
  description_zh: 带多级标签监督的层级残差量化。
- value: KG-RQ
  description: Residual quantization informed by knowledge-graph structure.
  description_zh: 融合知识图谱结构的残差量化。
- value: LLM-Vocab
  description: Item identifiers composed directly from tokens in the language model vocabulary.
  description_zh: 直接从大语言模型原生词表 token 组合出的物品标识符。
- value: Learn. RQ
  description: End-to-end or alternatingly updated learnable residual quantization.
  description_zh: 端到端或交替更新的可学习残差量化。
- value: MM-RQ
  description: Multimodal residual quantization.
  description_zh: 多模态残差量化（Multimodal RQ）。
- value: Masked VQ
  description: Masked vector quantization over collaborative representations.
  description_zh: 面向掩码协同表征的向量量化。
- value: MoE-VQ
  description: Mixture-of-experts vector quantization.
  description_zh: 混合专家向量量化（Mixture-of-Experts VQ）。
- value: Multi-Facet ID
  description: Identifiers representing multiple facets of an item.
  description_zh: 同时刻画物品多个语义切面的多维标识符。
- value: Multi-Path R-KM+Hash
  description: Multiple residual-k-means code paths combined with a hash-based identifier component.
  description_zh: 多路径残差 k-means 结合哈希消歧组件。
- value: NU-RQ
  description: Non-uniform RQ variant.
  description_zh: 带可学习非均匀变换的残差量化（Non-Uniform RQ）。
- value: Nested RQ
  description: Residual quantization across nested representation granularities.
  description_zh: 跨嵌套表征粒度的残差量化。
- value: OPQ
  description: Optimized product quantization.
  description_zh: 优化乘积量化（Optimized Product Quantization）。
- value: Orth. RQ
  description: Orthogonal residual quantization.
  description_zh: 带正交约束的残差量化。
- value: PC-AE
  description: Parallel Codebook Auto-Encoder
  description_zh: 并行码本自编码器（Parallel Codebook Auto-Encoder）。
- value: PID (P-SAE)
  description: Pretrained Interpretable ID (Pretrained Sparse Autoencoder).
  description_zh: 基于预训练稀疏自编码器的可解释标识符（Pretrained Interpretable ID）。
- value: Par. OPQ
  description: Parallel optimized product quantization into unordered sub-codes.
  description_zh: 并行优化乘积量化，生成无序多子空间码。
- value: Par. VQ
  description: Parallel multi-codebook vector quantization without sequential residual dependency.
  description_zh: 无顺序残差依赖的并行多码本向量量化。
- value: Post-hoc RQ
  description: Residual quantization with post-hoc collision-free code assignment.
  description_zh: 残差量化后接无冲突全局/递归重分配。
- value: Prog. RQ
  description: Progressive RQ variant.
  description_zh: 渐进式残差量化变体（Progressive RQ）。
- value: QA-RQ
  description: Qualification-Aware RQ-VAE.
  description_zh: 资质感知残差量化（Qualification-Aware RQ-VAE）。
- value: R-KM
  description: Residual k-means.
  description_zh: 残差 k-means 量化（Residual k-means）。
- value: R-KM+EM
  description: Residual k-means with expectation-maximization-style refinement.
  description_zh: 带期望最大化（EM）精化的残差 k-means。
- value: R-KM+FSQ
  description: Residual k-means combined with finite scalar quantization.
  description_zh: 残差 k-means 结合有限标量量化（FSQ）。
- value: R-KM+Geo-CB
  description: Residual k-means combined with a geographic codebook.
  description_zh: 残差 k-means 结合独立地理码本。
- value: R-KM+Graph
  description: Residual k-means combined with a graph over semantic codes.
  description_zh: 残差 k-means 结合语义码关联图。
- value: R-KM†
  description: Residual k-means tokenization (inferred).
  description_zh: 残差 k-means 编号（由配置推断）。
- value: RQ
  description: Residual quantization.
  description_zh: 残差向量量化（Residual Quantization）。
- value: RQ+IST
  description: Residual quantization combined with item-level subword tokenization.
  description_zh: 残差量化结合序列内子词合并（Item-level Subword Tokenization）。
- value: RQ+LoRA
  description: Residual quantization adapted per domain with LoRA modules.
  description_zh: 带领域自适应 LoRA 模块的残差量化。
- value: RQ-KM
  description: Residual k-means quantization.
  description_zh: 残差 k-means 量化。
- value: RQ-PIB
  description: Residual Quantization with Prefix-aware Interaction Balancing
  description_zh: 前缀交互负载均衡残差量化（RQ with Prefix-aware Interaction Balancing）。
- value: RQ-VAE
  description: Residual-Quantized Variational AutoEncoder.
  description_zh: 残差量化变分自编码器（Residual-Quantized VAE）。
- value: RQ-VAE / Learn. RQ
  description: Residual-quantized variational codes or learnable residual-quantization codes in different configurations.
  description_zh: 不同配置下分别采用固定 RQ-VAE 或可学习残差量化。
- value: RQ-VAE / Par. VQ
  description: Residual-quantized variational codes or parallel vector-quantization codes in different configurations.
  description_zh: 不同配置下分别采用层级 RQ-VAE 或并行向量量化。
- value: RQ-VAE / R-KM / LETTER
  description: RQ-VAE, residual k-means, or LETTER tokenization in different configurations.
  description_zh: 评测涵盖 RQ-VAE、残差 k-means 与 LETTER 等多种编号器配置。
- value: RQ-VAE+DINO
  description: RQ-VAE combined with self-supervised DINO visual quantization.
  description_zh: RQ-VAE 结合自监督 DINO 视觉特征量化。
- value: RQ-VAE+PPR
  description: Residual-quantized variational codes informed by Personalized PageRank signals.
  description_zh: 融合个性化 PageRank 图传播信号的 RQ-VAE。
- value: RQ-VAE†
  description: Residual-Quantized Variational AutoEncoder (inferred).
  description_zh: 残差量化变分自编码器（由配置推断）。
- value: RecDMoN / RQ-GAE
  description: Recursive DMoN graph partitioning, or residual quantization of graph-propagated representations with a graph
