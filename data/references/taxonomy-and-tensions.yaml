top_block:
  name: Paradigms, Systems and Benchmarks
  name_zh: 范式、系统与基准
  description: Baseline (TIGER) and whole-pipeline paradigms, open-source frameworks, benchmarks, or analysis papers without a single problem/stage label.

problems:
  I:
    name: Informativeness
    name_zh: 信息不够
    question: Do the SIDs, or the model reading them, carry the collaborative and multimodal signals recommendation needs?
    origin: DCI-ES (ICLR 2023, §2) following Eastwood & Williams (ICLR 2018).
  II:
    name: Uniqueness and Validity
    name_zh: 编号和物品对不上
    subtitle_zh: 同码多物品、区分性与合法性
    question: Does every item get its own SID, every generated SID name a real item, and the codebook get used evenly?
    origin: TIGER (NeurIPS 2023, arXiv p5 "Handling Collisions", p10 "Invalid IDs") and GENRE (ICLR 2021, p4).
  III:
    name: SID–Model Alignment
    name_zh: 模型读不懂、写不好编号
    question: Can the generator read, write, and reason over SIDs, and do the tokenizer and generator work toward the same goal?
    origin: LC-Rec (ICDE 2024, abstract) and ETEGRec (SIGIR 2025).
  IV:
    name: Utility
    name_zh: 目标没对准
    question: Are training and search aimed at what users and the platform value, rather than at token likelihood?
    origin: Adomavicius & Tuzhilin (TKDE 2005, §2 Eq. 1).
  V:
    name: Efficiency
    name_zh: 太慢太贵
    question: Can it be trained and served within latency and cost budgets?
    origin: Lin et al. (TOIS 2025, §5.1 "Training Efficiency", §5.2 "Inference Latency").
  VI:
    name: Generalization
    name_zh: 环境一变就失灵
    question: Does it still work for new items, new domains, and shifting interests?
    origin: Wang et al. (TKDE 2022, domain generalization survey) and TIGER (NeurIPS 2023, abstract).

