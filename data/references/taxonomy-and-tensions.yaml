tensions:
  constraint-1:
    id: constraint-1
    title_zh: 码位依赖 ↔ 生成因子分解
    title_en: Code Dependence and Generation Factorization
    edges: ["①"]
    claim_zh: 码怎么分配给物品，决定了给定历史后各码位之间还剩多少依赖；依赖强时，逐位独立生成会把两个物品的码位拼成第三个物品。RPG 换成 RQ 码照样能并行，所以“码位无序才适合并行”不成立。
    claim_en: >-
      Independent per-position heads represent a code distribution as q(c|h) = \prod_j q_j(c_j|h).
      If the target conditional distribution does not factorize, this family cannot represent it exactly.
      Products of its marginals can assign excess mass to combinations of tokens from different items,
      analogous to the multimodality problem in non-autoregressive translation (Gu et al., ICLR 2018).
      Catalog constraints cannot remove such combinations when they are valid item codes. Empirically,
      residual-quantized codes remain usable with parallel prediction (RPG, FLASH); these observations
      caution against using an ordered/unordered label alone to select a generator, and they do not
      isolate the effect of conditional code dependence.
    rejected_folklore_zh: “码位无序才适合并行、残差码不能并行”不成立（RPG 换成 RQ 码照样能并行，FLASH 中 RQ-VAE 在并行解码下同样可用）。
    levels:
      - layer: fixed-code-ablation
        title_zh: 各自固定码管线内的条件方式消融
        grade: Reported
        scope_zh: 仅限各自固定码管线内（within their respective fixed-code pipelines），且两项消融方向相反、控制均不完整：SID-MLP 在蒸馏自 TIGER 的固定 4 位 SID 上去掉前缀条件时同时改变了各预测头的输入与参数；FLASH 的 SimHash 预实验缺 RQ+Parallel 对照格且未报告两臂是否共用同一组超平面。
      - layer: allocation-mechanism
        title_zh: 码怎么分配决定条件依赖强度与下游推荐排序
        grade: Open
        scope_zh: 尚无在同一主干、同一物品目录与评测切分下交叉控制“码分配改变条件依赖 × 生成器因子分解”的 2×2 受控实验。
  constraint-2:
    id: constraint-2
    title_zh: 撞号 ↔ 物品解析与评测
    title_en: Code Collisions vs. Item Resolution and Evaluation
    edges: ["②"]
    claim_zh: 多个物品共用一个 SID 时要解析；按 SID 而非物品计分会虚高指标（Faithful Evaluation：最高 103%）。
  constraint-3:
    id: constraint-3
    title_zh: 编号器 ↔ 生成器共同适应
    title_en: Tokenizer–Generator Co-adaptation
    edges: ["③", "⑥"]
    claim_zh: 分开训的 tokenizer 不一定适配生成器（ETEGRec 改为联合训练）；目录变化后重编码会打乱生成器（DACT）。
  constraint-4:
    id: constraint-4
    title_zh: 生成器 ↔ 搜索
    title_en: Generator vs. Search and Decoding
    edges: ["⑤", "⑦"]
    claim_zh: RPG 的并行生成器配 beam search 时 NDCG@10 = 0，要换图搜索；价值目标可训进生成器（DPO、RL），也可在搜索时由奖励施加。
